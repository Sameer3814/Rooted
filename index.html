/* ---------- PRACTICE ----------
   Challenge types are pluggable and data-described (DATA_MODEL.md §3), not a
   hardcoded switch. Each type in CHALLENGE_TYPES implements:
     build(entity, config)  -> state   opaque per-attempt state
     render(state)          -> html    reads state.checked for the graded view
     check(state)           -> { allCorrect, correctCount, total }
                                       reads its own DOM, mutates state
     score(state)           -> 0..1
     interact(state, ds)    optional; handle a tap on an element the type
                            rendered with data-action="practice-interact"
                            (ds = that element's dataset). Mutates state.
                            If it sets state.checked itself (a self-graded
                            type finalizing), the caller does the same
                            session bookkeeping check() would have.
     controls(state)        optional; HTML for the action-button area while
                            !state.checked. Replaces the generic "Check"
                            button — for a type whose finalization isn't a
                            single auto-graded tap (self-graded reveal).
     canCheck(state)        optional; defaults to true. Lets the generic
                            Check button stay disabled until the type's
                            own notion of "ready" is met (e.g. every
                            blank filled).
     autoAdvanceMs          optional number. On a correct check(), advance
                            to the next verse automatically after this
                            many ms (still guarded — a manual "Continue"
                            tap before the timer fires just no-ops it).
     autoAdvanceMsWrong     optional number. Same as autoAdvanceMs but for
                            an *incorrect* finalize — e.g. Reference
                            Match, which reveals the right answer and
                            then moves on by itself once it's had time to
                            be read, rather than waiting on a manual tap
                            the way every earlier type's wrong path did.
   Adding matching / ordering = another entry here, no changes to
   startPractice / renderPractice / checkPractice.
*/
const CHALLENGE_TYPES = {
  challenge_tap_builder: {
    id: 'challenge_tap_builder',
    name: 'Tap Builder',
    appliesToEntityTypes: ['verse'],
    config: { minBlanks: 4, maxBlanks: 6, minWordLength: 4, distractorCount: 3 },
    enabled: true,
    // Distractors are drawn from data.verses (the user's own already-
    // loaded library) rather than the full corpus in data/verses.json —
    // that corpus is lazily fetched only once Browse has been opened
    // (see loadCorpus()), so relying on it here would make this
    // exercise silently distractor-less (or need its own network fetch)
    // for anyone who opens Practice without ever visiting Discover
    // first. data.verses is always in memory and plenty large enough
    // to find real, differently-worded words from.
    build(verse, config){
      const words = verse.text.split(' ');
      const eligible = words.map((_,i)=>i)
        .filter(i => words[i].replace(/[^a-zA-Z]/g,'').length >= config.minWordLength);
      const blankCount = Math.max(1, Math.min(config.maxBlanks, eligible.length,
        config.minBlanks + Math.floor(Math.random() * (config.maxBlanks - config.minBlanks + 1))));
      const pool = [...eligible];
      const blankIndices = [];
      while(blankIndices.length < blankCount && pool.length){
        blankIndices.push(pool.splice(Math.floor(Math.random() * pool.length), 1)[0]);
      }
      blankIndices.sort((a,b)=>a-b);
      const correctWords = blankIndices.map(i => words[i]);
      const distractors = pickTapBuilderDistractors(config.distractorCount, verse.id, correctWords, config.minWordLength);
      const bank = shuffleInPlace([...correctWords, ...distractors]);
      return {
        words, blankIndices, bank,
        slots: blankIndices.map(()=>null),   // parallel to blankIndices: null, or an index into bank[]
        usedBank: bank.map(()=>false),
        checked: false, results: [], allCorrect: false
      };
    },
    interact(state, ds){
      if(state.checked) return;
      if(ds.tapBank !== undefined){
        const bi = +ds.tapBank;
        if(state.usedBank[bi]) return;
        const si = state.slots.indexOf(null);
        if(si === -1) return; // no empty slot left
        state.slots[si] = bi;
        state.usedBank[bi] = true;
      }else if(ds.tapSlot !== undefined){
        const si = +ds.tapSlot;
        const bi = state.slots[si];
        if(bi === null || bi === undefined) return;
        state.slots[si] = null;
        state.usedBank[bi] = false;
      }
    },
    render(state){
      const {words, blankIndices, slots, bank, usedBank, checked, results, allCorrect} = state;
      const sentence = words.map((w, i)=>{
        const si = blankIndices.indexOf(i);
        if(si === -1) return esc(w);
        const bi = slots[si];
        const filled = bi !== null && bi !== undefined;
        const cls = checked ? (results[si] ? 'tap-slot-correct' : 'tap-slot-wrong') : (filled ? 'tap-slot-filled' : '');
        const action = (!checked && filled) ? ` data-action="practice-interact" data-tap-slot="${si}"` : '';
        return `<span class="tap-slot ${cls}"${action}>${filled ? esc(bank[bi]) : ''}</span>`;
      }).join(' ');
      const tiles = bank.map((w, i)=>
        usedBank[i] ? '' : `<button class="tap-tile" data-action="practice-interact" data-tap-bank="${i}">${esc(w)}</button>`
      ).join('');
      return `
        <div class="target-sentence-box${checked && !allCorrect ? ' tap-shake' : ''}">${sentence}</div>
        <div class="word-bank-grid">${tiles || '<span class="practice-hint">every tile placed — tap Check Answer</span>'}</div>
      `;
    },
    canCheck(state){ return state.slots.every(s => s !== null); },
    check(state){
      const norm = s => s.trim().toLowerCase().replace(/[^a-z0-9']/g,'');
      const results = state.blankIndices.map((wi, si)=>{
        const bi = state.slots[si];
        return bi !== null && bi !== undefined && norm(state.bank[bi]) === norm(state.words[wi]);
      });
      const allCorrect = results.every(Boolean);
      state.results = results;
      state.checked = true;
      state.allCorrect = allCorrect;
      return { allCorrect, correctCount: results.filter(Boolean).length, total: results.length };
    },
    score(state){
      if(!state.results.length) return 0;
      return state.results.filter(Boolean).length / state.results.length;
    },
    // A correct answer immediately advances to the next verse (still
    // behind the normal "Continue" button too, in case this fires after
    // the user's already tapped it — see checkPractice()) — the tap-to-
    // fill interaction already feels fast/game-like in a way typing an
    // answer or self-grading doesn't.
    autoAdvanceMs: 600
  },

  challenge_first_letter_sprint: {
    id: 'challenge_first_letter_sprint',
    name: 'First-Letter Sprint',
    appliesToEntityTypes: ['verse'],
    config: {},
    enabled: true,
    // A speed drill, not a recall check like the other types — every
    // word must be typed correctly to advance at all (no wrong-answer
    // path other than "hasn't typed the right letter yet"), so
    // completing it always counts as a correct practice, the same
    // shape as the old self-graded types' "Got it" always being 1.
    build(verse){
      const words = verse.text.split(' ');
      return {
        words,
        letters: words.map(firstLetter),   // null for a token with no A-Z at all (rare) — auto-skipped
        currentIndex: 0,
        startTime: Date.now(),
        elapsedMs: null,
        flashIndex: null, flashType: null, // transient: which word to visually flash, and which way
        checked: false, allCorrect: false, mistakeFlagged: false
      };
    },
    // Called with {letter} from wireFirstLetterSprint()'s hidden <input>
    // listener — not through practiceInteract()/practiceInteractWith()
    // like every other type's interact(), since that path always ends
    // in a full render(), which on a real device closes the mobile
    // keyboard after every keystroke (see wireFirstLetterSprint()'s own
    // comment). This function only ever mutates state; the caller
    // decides how to reflect that in the DOM.
    interact(state, ds){
      if(state.checked || ds.letter === undefined) return;
      // Skip over any word with no actual letter in it before testing —
      // nothing to type for a stray token like "--", so it shouldn't
      // block the sprint.
      while(state.currentIndex < state.words.length && state.letters[state.currentIndex] === null){
        state.currentIndex++;
      }
      if(state.currentIndex >= state.words.length) return;
      const typed = ds.letter.toLowerCase();
      if(typed === state.letters[state.currentIndex]){
        state.flashIndex = state.currentIndex;
        state.flashType = 'correct';
        state.currentIndex++;
        while(state.currentIndex < state.words.length && state.letters[state.currentIndex] === null){
          state.currentIndex++;
        }
        if(state.currentIndex >= state.words.length){
          state.elapsedMs = Date.now() - state.startTime;
          state.checked = true;
          state.allCorrect = true;
        }
      }else{
        state.flashIndex = state.currentIndex;
        state.flashType = 'wrong';
        // Capped at one mistake per exercise attempt (not one per wrong
        // keystroke) — consistent with Tap Builder/Reference Match's own
        // "one wrong finalize = one heart," and so a few fumbled
        // keystrokes can't drain hearts faster than any other exercise.
        if(!state.mistakeFlagged){ state.mistakeFlagged = true; shepherdFlagMistake(); }
      }
    },
    render(state){
      if(state.checked){
        const {words, elapsedMs} = state;
        const seconds = (elapsedMs / 1000).toFixed(1);
        const minutes = elapsedMs / 60000;
        const wpm = Math.max(1, Math.round(words.length / minutes));
        return `
          <div class="sprint-text-box">${esc(words.join(' '))}</div>
          <div class="sprint-toast"><i class="ti ti-bolt"></i> Completed in ${seconds}s! (${wpm} WPM)</div>
        `;
      }
      // The sentence box's own markup lives in sprintTokensHTML() so the
      // fast keystroke path in wireFirstLetterSprint() (which patches
      // just that box's innerHTML, never touching the <input> below it —
      // see that function's own comment for why) renders identically
      // rather than duplicating this logic and risking drift.
      return `
        <div class="sprint-text-box" id="sprint-text-box">${sprintTokensHTML(state)}</div>
        <input type="text" id="sprint-hidden-input" class="sprint-hidden-input" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" inputmode="text" aria-label="Type the first letter of each word">
        <p class="practice-hint" data-action="focus-sprint-input" style="margin-top:10px;cursor:pointer;">Keyboard not showing? Tap here.</p>
      `;
    },
    // No Check button at all — typing IS the interaction. Returning ''
    // here (rather than leaving controls undefined) suppresses the
    // generic Check button specifically while !state.checked; the
    // generic "Continue"/"Finish" button still shows once state.checked
    // flips true, same as every other type (renderPractice() always
    // prefers that over controls()).
    controls(){ return ''; },
    score(state){ return state.allCorrect ? 1 : 0; },
    autoAdvanceMs: 1200
  },

  challenge_progressive_vanish: {
    id: 'challenge_progressive_vanish',
    name: 'Progressive Vanish',
    appliesToEntityTypes: ['verse'],
    config: { totalStages: 5 },
    enabled: true,
    // Self-graded, same shape as First-Letter Sprint's "typing it at all
    // means you got it" — the owner's own spec named the constructor
    // initProgressiveVanish(verse), but this app dispatches every
    // challenge type through CHALLENGE_TYPES[id].build(verse, config)
    // generically (see the interface doc above CHALLENGE_TYPES), same
    // architectural call already made for Tap Builder/First-Letter
    // Sprint's own similarly-named specs — a bespoke top-level init
    // function per type would bypass that pluggability for no benefit.
    build(verse, config){
      const words = verse.text.split(' ').map(text => ({
        text,
        vanished: false,
        isPunctuation: !/[a-zA-Z0-9]/.test(text)
      }));
      // A fixed random order decides which words vanish first and stays
      // fixed for the whole climb (same "stage N's hidden set is always
      // a superset of stage N-1's" guarantee the old verse-ladder type
      // used) — nothing that's already vanished ever reappears just
      // because the stage advanced.
      const order = words.map((w, i) => i).filter(i => !words[i].isPunctuation);
      for(let i = order.length - 1; i > 0; i--){
        const j = Math.floor(Math.random() * (i + 1));
        [order[i], order[j]] = [order[j], order[i]];
      }
      return {
        words, order, totalNonPunct: order.length,
        currentStage: 0, totalStages: config.totalStages,
        peekIndex: null, peekToken: 0,
        checked: false, allCorrect: false
      };
    },
    interact(state, ds){
      if(state.checked) return;
      if(ds.peekWord !== undefined){
        // Reveal exactly one vanished word for 1.5s, then hide it again
        // — a real timed effect, not a CSS-only animation, so it needs
        // an actual timer. peekToken guards against an earlier peek's
        // timeout firing after a newer tap superseded it (e.g. tapping
        // a second blank within the 1.5s window), and against re-
        // rendering into a verse the user has since navigated away
        // from — same "is this timeout still relevant" shape every
        // other guarded setTimeout in this file uses (autoAdvanceMs,
        // family-tree-nav's chained `from`, etc.), just checked by
        // object identity here since interact() only has `state`, not
        // `session`/`item`.
        state.peekIndex = +ds.peekWord;
        const myToken = ++state.peekToken;
        setTimeout(()=>{
          if(state.peekToken !== myToken) return;
          state.peekIndex = null;
          if(session && session.queue[session.index] && session.queue[session.index].state === state) render();
        }, 1500);
      }else if(ds.nextStage !== undefined){
        if(state.currentStage >= state.totalStages) return;
        state.currentStage++;
        const vanishCount = Math.round(state.totalNonPunct * (state.currentStage / state.totalStages));
        const toVanish = new Set(state.order.slice(0, vanishCount));
        state.words.forEach((w, i) => { if(!w.isPunctuation && toVanish.has(i)) w.vanished = true; });
      }else if(ds.complete !== undefined){
        state.checked = true;
        state.allCorrect = true;
      }else if(ds.missed !== undefined){
        // A real "no" option — previously this type could never finalize
        // as wrong at all, so it could never cost a heart no matter what
        // the player actually recited (owner report, 2026-11-10: "only a
        // couple of [the exercise types] are using the hearts").
        state.checked = true;
        state.allCorrect = false;
      }
    },
    render(state){
      if(state.checked){
        return `<div class="vanish-text-box">${state.words.map(w => esc(w.text)).join(' ')}</div>`;
      }
      const tokens = state.words.map((w, i)=>{
        if(w.isPunctuation) return esc(w.text);
        if(!w.vanished || state.peekIndex === i) return `<span class="vanish-word">${esc(w.text)}</span>`;
        return `<span class="vanish-word vanish-blank" data-action="practice-interact" data-peek-word="${i}">${esc(w.text)}</span>`;
      }).join(' ');
      return `<div class="vanish-text-box" id="vanish-text-box">${tokens}</div>`;
    },
    // Bypasses the generic Check button entirely, same as Tap Builder's
    // canCheck-disabled state and First-Letter Sprint's empty controls()
    // — "Hold to Peek" (wired separately in wireProgressiveVanish(), a
    // raw press-and-hold gesture that has no meaningful click/data-action
    // shape) sits alongside the real primary action, which is either
    // "advance a stage" or, once fully vanished, "finish."
    controls(state){
      const isFinal = state.currentStage >= state.totalStages;
      // "Hold to Peek" only makes sense once something's actually
      // vanished — at stage 0 the full verse is already on screen, so
      // showing a button to reveal it is a dead, confusing control
      // (owner report, 2026-11-10).
      const showPeek = state.currentStage > 0;
      return `
        <div class="vanish-controls">
          ${showPeek ? `<button class="btn vanish-peek-btn" id="vanish-peek-btn" type="button"><i class="ti ti-eye"></i> Hold to Peek</button>` : ''}
          ${isFinal ? `
            <div style="display:flex;gap:10px;">
              <button class="btn vanish-missed-btn" style="flex:1;" data-action="practice-interact" data-missed="1">Missed Some</button>
              <button class="btn primary vanish-next-btn" style="flex:1;" data-action="practice-interact" data-complete="1"><i class="ti ti-sparkles"></i> Got It!</button>
            </div>
          ` : `
            <button class="btn primary block vanish-next-btn" data-action="practice-interact" data-next-stage="1">Next Step (Remove 20%) <i class="ti ti-arrow-right"></i></button>
          `}
        </div>
      `;
    },
    score(state){ return state.allCorrect ? 1 : 0; },
    // "...loads the next due verse" per spec — matches the other two
    // new challenge types' auto-advance, timed a bit longer so the
    // "I Recited It Perfectly!" confirmation is actually readable
    // before moving on.
    autoAdvanceMs: 800
  },

  challenge_clause_connect: {
    id: 'challenge_clause_connect',
    name: 'Clause Connect',
    appliesToEntityTypes: ['verse'],
    config: { minClauses: 3, maxClauses: 5 },
    enabled: true,
    // Reordering, not a single auto-graded tap — a wrong "Check Order"
    // shouldn't finalize the attempt the way Tap Builder's one-shot
    // check() does, since the whole point of clause-by-clause feedback
    // (shake + red highlights) is to let the user fix it and try again.
    // So "Check Order" is wired as an interact() action (via controls(),
    // like Progressive Vanish's stage buttons) rather than the generic
    // check()/checkPractice() path — only a *correct* order flips
    // state.checked, which is what triggers practiceInteractWith()'s
    // normal finalize bookkeeping (recordPractice, autoAdvanceMs, etc.).
    // A real check() is still defined (never called by this type itself)
    // purely so nothing elsewhere that assumes every ChallengeType has
    // one breaks.
    build(verse, config){
      const clauses = splitIntoClauses(verse.text, config);
      let order = clauses.map((_, i) => i);
      shuffleInPlace(order);
      // A "scrambled" order that lands back on the correct sequence by
      // chance (common with only 3 clauses) isn't a real exercise —
      // force one swap so there's always something to fix.
      if(order.length > 1 && order.every((v, i) => v === i)){
        [order[0], order[1]] = [order[1], order[0]];
      }
      return {
        clauses, order, selected: null,
        checked: false, allCorrect: false, wrong: [], mistakeFlagged: false
      };
    },
    interact(state, ds){
      if(state.checked) return;
      if(ds.tapClause !== undefined){
        const i = +ds.tapClause;
        if(state.selected === null){
          state.selected = i;
        }else if(state.selected === i){
          state.selected = null;
        }else{
          [state.order[state.selected], state.order[i]] = [state.order[i], state.order[state.selected]];
          state.selected = null;
        }
        state.wrong = []; // clear stale red highlights once the user starts fixing it
      }else if(ds.checkOrder !== undefined){
        const wrong = [];
        state.order.forEach((clauseIdx, i) => { if(clauseIdx !== i) wrong.push(i); });
        if(wrong.length === 0){
          state.checked = true;
          state.allCorrect = true;
          state.wrong = [];
        }else{
          state.wrong = wrong;
          // Capped at one mistake per exercise attempt, same reasoning
          // as First-Letter Sprint's own guard.
          if(!state.mistakeFlagged){ state.mistakeFlagged = true; shepherdFlagMistake(); }
        }
      }
    },
    render(state){
      const {clauses, order, selected, checked, wrong} = state;
      const showWrong = !checked && wrong.length > 0;
      const cards = order.map((clauseIdx, i)=>{
        const cls = checked ? 'clause-correct'
          : showWrong && wrong.includes(i) ? 'clause-wrong'
          : selected === i ? 'clause-selected' : '';
        // The grip handle drags (wireClauseConnect() — pointer-based, not
        // HTML5 native drag-and-drop, which never fires on a touchscreen
        // at all; same reasoning wireTimelineDrag() already established
        // for reordering on mobile), the clause text itself taps
        // (practice-interact, the normal dispatch every other type uses)
        // — kept on separate elements so a drag-start on the grip can't
        // also fire a tap-to-swap click on release.
        const tapAction = checked ? '' : ` data-action="practice-interact" data-tap-clause="${i}"`;
        return `<div class="clause-card ${cls}" id="clause-card-${i}" data-clause-idx="${clauseIdx}">
          <i class="ti ti-grip-vertical clause-grip"></i>
          <span class="clause-text"${tapAction}>${esc(clauses[clauseIdx])}</span>
        </div>`;
      }).join('');
      return `
        <p class="clause-instruction">${checked ? 'Correct order!' : 'Arrange the clauses in chronological order'}</p>
        <div class="clause-list-container${showWrong ? ' clause-shake' : ''}" id="clause-list-container">${cards}</div>
      `;
    },
    controls(){
      return `<button class="btn primary block clause-check-btn" data-action="practice-interact" data-check-order="1">Check Order</button>`;
    },
    check(state){
      const wrong = [];
      state.order.forEach((clauseIdx, i) => { if(clauseIdx !== i) wrong.push(i); });
      const allCorrect = wrong.length === 0;
      state.wrong = wrong;
      state.checked = allCorrect;
      state.allCorrect = allCorrect;
      return { allCorrect, correctCount: state.order.length - wrong.length, total: state.order.length };
    },
    score(state){ return state.allCorrect ? 1 : 0; },
    autoAdvanceMs: 600
  },

  challenge_reference_match: {
    id: 'challenge_reference_match',
    name: 'Reference Match',
    appliesToEntityTypes: ['verse'],
    config: { distractorCount: 3 },
    enabled: true,
    // Distractors are drawn from data.verses (the user's own already-
    // loaded library), the same offline-first call Tap Builder's own
    // build() already made against a near-identical spec ask — the full
    // corpus in data/verses.json is only lazily fetched once Browse has
    // been opened, so this exercise would silently run distractor-short
    // (or need its own network fetch) for anyone practicing before ever
    // visiting Discover.
    build(verse, config){
      const format = Math.random() < 0.5 ? 'quoteToRef' : 'refToQuote';
      const distractors = pickReferenceMatchDistractors(config.distractorCount, verse);
      const options = shuffleInPlace([
        { id: verse.id, reference: verse.reference, text: verse.text, correct: true },
        ...distractors.map(d => ({ id: d.id, reference: d.reference, text: d.text, correct: false }))
      ]);
      return {
        format, options, selectedIndex: null,
        checked: false, allCorrect: false
      };
    },
    // A single tap both answers and finalizes — there's no separate
    // "submit" step to a multiple-choice pick, so this always ends the
    // attempt itself (like Progressive Vanish's "complete" tap), rather
    // than going through the generic check()/checkPractice() path.
    interact(state, ds){
      if(state.checked || ds.tapOption === undefined) return;
      const i = +ds.tapOption;
      state.selectedIndex = i;
      state.checked = true;
      state.allCorrect = !!state.options[i].correct;
    },
    render(state){
      const {format, options, selectedIndex, checked} = state;
      const targetOption = options.find(o => o.correct);
      const promptHtml = format === 'quoteToRef'
        ? `&ldquo;${esc(targetOption.text)}&rdquo;`
        : esc(targetOption.reference);
      const cards = options.map((opt, i)=>{
        const label = format === 'quoteToRef' ? opt.reference : opt.text;
        let cls = '';
        if(checked){
          if(i === selectedIndex) cls = opt.correct ? 'match-correct' : 'match-wrong';
          else if(opt.correct) cls = 'match-reveal-correct';
        }
        const action = checked ? '' : ` data-action="practice-interact" data-tap-option="${i}"`;
        return `<div class="match-option-card ${cls}"${action}>${esc(label)}</div>`;
      }).join('');
      return `
        <div class="match-prompt-card">${promptHtml}</div>
        <div class="match-options-grid${checked ? ' match-locked' : ''}">${cards}</div>
      `;
    },
    // No generic Check button — tapping an option IS the check, same
    // reasoning First-Letter Sprint's empty controls() gives.
    controls(){ return ''; },
    check(state){
      const summary = { allCorrect: !!state.allCorrect, correctCount: state.allCorrect ? 1 : 0, total: 1 };
      return summary;
    },
    score(state){ return state.allCorrect ? 1 : 0; },
    // Correct answers advance fast (600ms, matching every other type's
    // auto-advance); a wrong one waits noticeably longer (1.5s) so the
    // revealed correct card is actually readable before moving on —
    // see autoAdvanceMsWrong in the interface doc above CHALLENGE_TYPES.
    autoAdvanceMs: 600,
    autoAdvanceMsWrong: 1500
  }
};
/* Picks distractor verses for Reference Match, preferring plausible
   near-misses over random ones: same book first, then same testament,
   then anything else in the user's library — so the four options aren't
   trivially distinguishable by book alone every time. Drawn from
   data.verses (see the build() comment above for why, not the full
   corpus). */
const NT_BOOKS = new Set(['Matthew','Mark','Luke','John','Acts','Romans','1 Corinthians',
  '2 Corinthians','Galatians','Ephesians','Philippians','Colossians','1 Thessalonians',
  '2 Thessalonians','1 Timothy','2 Timothy','Titus','Philemon','Hebrews','James',
  '1 Peter','2 Peter','1 John','2 John','3 John','Jude','Revelation']);
function pickReferenceMatchDistractors(count, targetVerse){
  const pool = data.verses.filter(v => v.id !== targetVerse.id);
  const targetIsNT = NT_BOOKS.has(targetVerse.book);
  const sameBook = shuffleInPlace(pool.filter(v => v.book === targetVerse.book));
  const sameTestament = shuffleInPlace(pool.filter(v => v.book !== targetVerse.book && NT_BOOKS.has(v.book) === targetIsNT));
  const rest = shuffleInPlace(pool.filter(v => v.book !== targetVerse.book && NT_BOOKS.has(v.book) !== targetIsNT));
  const picked = [];
  const seenRef = new Set([targetVerse.reference]);
  for(const v of [...sameBook, ...sameTestament, ...rest]){
    if(seenRef.has(v.reference)) continue;
    seenRef.add(v.reference);
    picked.push(v);
    if(picked.length >= count) break;
  }
  return picked;
}
/* Splits a verse's text into 3-5 clause strings for Clause Connect.
   Primary split: punctuation or a small set of connecting words — a
   non-capturing group is deliberate (the spec's own /(and|that|for|who)/
   pattern, run through .split() with a *capturing* group, would leave

    if(v.id === verseId) continue;

   user's own practice library by each verse's first topicId, in order of

   Verses" catch-all unit — a real problem once "Add chapters" (item 174)
   made bulk-adding a whole untagged chapter easy, since every chapter
   added this way would've piled into that same single undifferentiated
   bucket. Fixed by grouping untagged verses per book+chapter instead —
   `chbucket_` is a synthetic key, safe against ever colliding with a
   real topic id (those are all `topic_*`) — so "Genesis 1" and "Psalm

   applies a pure size cap (`SHEPHERD_MAX_SECTION_SIZE`) on top of

/* Small CSS-only confetti burst — spans with a randomized rotation +
   outward translateY, no <canvas> or per-frame JS. See index's design
   notes: a real canvas particle system needs a requestAnimationFrame
   loop, which is a real battery/perf cost on a low-end phone for a
   decorative flourish; this reads the same and costs nothing at rest. */
function renderSparks(n){
  let out = '';
  for(let i=0;i<n;i++){
    const angle = (Math.random()*360).toFixed(1);
    const dist = (36 + Math.random()*46).toFixed(1);
    const size = (4 + Math.random()*4).toFixed(1);
    const delay = (Math.random()*0.15).toFixed(2);
    const color = Math.random() < 0.75 ? 'var(--gold)' : 'var(--gold-deep)';
    out += `<span class="spark" style="--angle:${angle}deg;--dist:${dist}px;--size:${size}px;--spark-color:${color};animation-delay:${delay}s;"></span>`;
  }
  return out;
}

/* Shared between the generic session screen above and Shepherd's Path's
   own session chrome (renderShepherdSession(), item 161) — the actual
   per-ChallengeType exercise markup and its Check/controls button,
   unchanged either way. Keeping this one function is what let Phase 2
   restyle the chrome around the exercise without touching any
   ChallengeType's own build/render/check code. */
function renderChallengeBody(item, type, v, st){
  const isTapBuilder = type.id === 'challenge_tap_builder';
  const isSprint = type.id === 'challenge_first_letter_sprint';
  const isVanish = type.id === 'challenge_progressive_vanish';
  const isClauseConnect = type.id === 'challenge_clause_connect';
  const isReferenceMatch = type.id === 'challenge_reference_match';
  const canCheck = type.canCheck ? type.canCheck(st) : true;
  // Reference Match deliberately never prints the real verse.reference
  // here — one of its two question formats (quote -> pick the matching
  // reference) is literally asking the user to name it, so showing it
  // up top would spoil the answer before they've even seen the options.
  const refLine = isReferenceMatch
    ? `<div class="ref" style="font-size:12px;color:var(--gold-deep);font-weight:600;margin-bottom:10px;">Reference Match</div>`
    : isSprint && !st.checked
    ? `<div class="ref" style="font-size:12px;color:var(--gold-deep);font-weight:600;margin-bottom:10px;">${esc(v.reference)} <span id="sprint-timer" style="color:#F2F2F2;font-weight:600;">0.0s</span></div>`
    : isVanish
    ? `<div class="ref" style="font-size:12px;color:var(--gold-deep);font-weight:600;margin-bottom:10px;">${esc(v.reference)} <span style="color:#F2F2F2;font-weight:600;">Stage ${Math.min(st.currentStage, st.totalStages)} of ${st.totalStages}</span></div>`
    : `<div class="ref" style="font-size:12px;color:var(--gold-deep);font-weight:600;margin-bottom:10px;">${esc(v.reference)} <span style="color:var(--ink-faint);font-weight:500;">· ${esc(type.name)}</span></div>`;
  const bodyHtml = (isTapBuilder || isSprint || isVanish || isClauseConnect || isReferenceMatch)
    ? `${refLine}${type.render(st)}`
    : `<div class="card">${refLine}<div class="practice-verse">${type.render(st)}</div></div>`;
  const footerHtml = type.controls
    ? type.controls(st)
    : `<button class="btn primary block${isTapBuilder ? ' tap-builder-check' : ''}" data-action="check-practice"${canCheck ? '' : ' disabled'}>${isTapBuilder ? 'Check Answer' : 'Check'}</button>`;
  return { isTapBuilder, isSprint, isVanish, isClauseConnect, isReferenceMatch, canCheck, bodyHtml, footerHtml };
}

/* ---------- form save handlers ---------- */
function saveVerse(){
  const ref = document.getElementById('f-ref').value.trim();
  const text = document.getElementById('f-text').value.trim();
  const topicsRaw = document.getElementById('f-topics').value.trim();
  const errEl = document.getElementById('form-err');
  if(!ref || !text){ errEl.textContent = 'Enter a reference and verse text.'; return; }
  const topicIds = [];
  if(topicsRaw){
    topicsRaw.split(',').map(s=>s.trim()).filter(Boolean).forEach(name=>{
      let t = data.topics.find(t=>t.name.toLowerCase()===name.toLowerCase());
      if(!t){
        t = {id:'topic_'+name.toLowerCase().replace(/[^a-z0-9]+/g,'_'), name: name.charAt(0).toUpperCase()+name.slice(1), description:'', relatedTopicIds:[], metadata:{}};
        content.topics.push(t);
        data.topics.push(t);
      }
      topicIds.push(t.id);
    });
  }
  const verse = {id:'verse_'+Date.now(), reference:ref, text, translation:'', topicIds, characterIds:[], metadata:{}};
  content.verses.push(verse);
  data.verses.push(verse);
  content.libraryVerseIds = [...(content.libraryVerseIds || []), verse.id];
  saveContent();
  go('home');
}
function saveCharacter(){
  const name = document.getElementById('c-name').value.trim();
  const rolesRaw = document.getElementById('c-roles').value.trim();
  const era = document.getElementById('c-era').value.trim();

  const roles = rolesRaw ? rolesRaw.split(',').map(s=>s.trim()).filter(Boolean) : [];
  const character = {id:'char_'+Date.now(), name, roles, era, summary, verseIds:[], metadata:{}};

let searchTimer = null;
function bindEvents(root){
  (root || document).querySelectorAll('[data-action]').forEach(el=>{
    el.addEventListener('click', onAction);
  });
  // A partial re-render only needs its own subtree wired up; the rest of the
  // page still has its listeners and would otherwise get duplicates.
  if(root) return;

  const vf = document.getElementById('verse-form');
  if(vf) vf.addEventListener('submit', e=>{ e.preventDefault(); saveVerse(); });
  const cf = document.getElementById('char-form');
  if(cf) cf.addEventListener('submit', e=>{ e.preventDefault(); saveCharacter(); });
  const importInput = document.getElementById('import-file-input');
  if(importInput) importInput.addEventListener('change', ()=>{
    const file = importInput.files && importInput.files[0];
    if(file) importFromFile(file);
    importInput.value = ''; // allow re-selecting the same file (e.g. after a failed import)
  });

  // Search updates only the results container, so the input keeps focus and
  // the caret doesn't jump while typing.
  const search = document.getElementById('browse-search');
  if(search) search.addEventListener('input', ()=>{
    browse.q = search.value;
    browse.book = null;
    browse.chapter = null;
    clearTimeout(searchTimer);
    searchTimer = setTimeout(()=>{
      const results = document.getElementById('browse-results');
      if(!results) return;
      results.innerHTML = renderBrowseResults();
      bindEvents(results);

  });

  const peopleSearch = document.getElementById('people-search');

    searchTimer = setTimeout(refreshTopicsResults, 140);
  });

  const storiesSearch = document.getElementById('stories-search');
  if(storiesSearch) storiesSearch.addEventListener('input', ()=>{
    storiesQuery = storiesSearch.value;
    clearTimeout(searchTimer);
    searchTimer = setTimeout(refreshStoriesResults, 140);
  });

    searchTimer = setTimeout(refreshLexiconResults, 140);

function practiceInteract(el){ practiceInteractWith(el.dataset); }
function practiceInteractWith(ds){
  if(!session) return;
  const item = session.queue[session.index];
  const type = challengeType(item.challengeTypeId);
  if(item.state.checked || !type.interact) return;
  type.interact(item.state, ds);
  // A type may finalize grading itself from inside interact() (e.g. a
  // self-graded type's "Got it"/"Missed it" tap) rather than the generic
  // Check button. If it just flipped checked to true, do the same session
  // bookkeeping checkPractice() would have done — including the same
  // guarded auto-advance checkPractice() supports for a type with
  // autoAdvanceMs. (First-Letter Sprint's own keystrokes bypass this
  // function entirely — see wireFirstLetterSprint()'s own comment for
  // why — but duplicate this exact same finalize sequence at its own
  // completion point, so keep the two in sync if this ever changes.)
  if(item.state.checked){
    if(item.state.allCorrect){ playSfx('correct'); hapticBuzz(30); }
    session.results.push({
      verseId: item.verseId,
      allCorrect: !!item.state.allCorrect,
      score: type.score(item.state)
    });
    recordPractice(item.verseId, !!item.state.allCorrect, item.challengeTypeId);
    const advanceMs = session.shepherd ? null : (item.state.allCorrect ? type.autoAdvanceMs : type.autoAdvanceMsWrong);
    if(advanceMs){
      setTimeout(()=>{
        if(!session || session.queue[session.index] !== item) return;
        advancePractice();
      }, advanceMs);
    }
  } else {
    playSfx('tap'); // a non-finalizing tap — e.g. a Tap Builder tile placement
  }
  render();
}
function checkPractice(){
  if(!session) return;
  const item = session.queue[session.index];
  const type = challengeType(item.challengeTypeId);
  if(item.state.checked) return;
  if(type.canCheck && !type.canCheck(item.state)) return; // e.g. Tap Builder: blanks still empty
  const summary = type.check(item.state);
  if(summary.allCorrect){ playSfx('correct'); hapticBuzz(30); }
  session.results.push({
    verseId: item.verseId,
    allCorrect: summary.allCorrect,
    score: type.score(item.state)
  });
  recordPractice(item.verseId, summary.allCorrect, item.challengeTypeId);
  // Some challenge types auto-advance instead of waiting for the user to
  // tap "Continue" — on a correct answer for most of them, but Reference
  // Match also auto-advances on a *wrong* one (autoAdvanceMsWrong), after
  // giving the user time to actually read the revealed correct answer
  // first. Still guarded so it can't double-advance if they tap Continue
  // themselves before the timer fires, or exit practice entirely.
  // Shepherd sessions suppress this entirely (owner report, 2026-11-10):
  // the feedback sheet's own Continue/Got It button is a deliberate,
  // always-explicit confirmation there, matching the handoff's own
  // design (its prototype has no auto-advance at all, only the sheet's
  // own tap) — firing the generic engine's timer underneath it was
  // advancing mid-tap, which is what was landing taps meant for that
  // button onto the bottom nav instead.
  const advanceMs = session.shepherd ? null : (summary.allCorrect ? type.autoAdvanceMs : type.autoAdvanceMsWrong);
  if(advanceMs){
    setTimeout(()=>{
      if(!session || session.queue[session.index] !== item) return;
      advancePractice();
    }, advanceMs);
  }
  render();
}
function advancePractice(){
  if(!session) return;
  session.index++;
  if(session.index >= session.queue.length){ playSfx('complete'); hapticBuzz([20,40,20]); }
  render();
}

/* ---------- character carousel + swipe-back ----------
   Revised on direct feedback: an earlier version made Character Detail's
   swipe-left mean "next character" instead of "back," which read as
   inconsistent — swiping the same direction meant different things on
   different screens, and there was no visible affordance telling anyone
   a character-to-character swipe existed at all. Replaced with visible
   left/right arrow buttons on the character photo for that navigation
   (discoverable, not a blind gesture), which frees swipe-left to mean
   exactly one thing everywhere, including Character Detail: go back. */
function allCharactersOrdered(){
  const seen = new Set();
  const ordered = [];
  for(const era of lore.eras){
    for(const c of data.characters){
      if(c.eraId === era.id && !seen.has(c.id)){ seen.add(c.id); ordered.push(c); }
    }
  }
  for(const c of data.characters){
    if(!seen.has(c.id)){ seen.add(c.id); ordered.push(c); }
  }
  return ordered;
}
function adjacentCharacter(id, dir){
  const list = allCharactersOrdered();
  const i = list.findIndex(c=>c.id===id);
  if(i===-1) return null;
  return list[i+dir] || null;
}
/* Story Detail's own prev/next carousel (item 128) — same visible-arrow
   pattern as the character one above, ordered to walk the whole Bible
   in sequence, the same idea Timeline (renderTimeline()) already uses.
   Real bug fixed here (2026-09-17, item 132): canonicalOrder is only
   meaningful *within* one era (its own values — e.g. era_jesus_ministry
   running 95, 105, 106... — are unrelated to era_creation's own 110,
   120...), not a single number comparable across the whole Bible, the
   same way Era itself has its own separate `order` field (1-16) for
   that. The original version here sorted every story by raw
   canonicalOrder globally, which happened to interleave, say, Gospel
   healing stories ahead of Genesis creation stories whenever their
   per-era numbers crossed — never caught earlier since it was never
   directly compared against Timeline's own (correct) era-then-
   canonicalOrder logic until this exact request needed a real
   Bible-wide ordering to pick the next batch of stories from. */
function allStoriesOrdered(){
  const eraRank = new Map(lore.eras.map(e=>[e.id, e.order]));
  return [...lore.stories].sort((a,b)=>{
    const eraDiff = (eraRank.get(a.eraId)||0) - (eraRank.get(b.eraId)||0);
    return eraDiff !== 0 ? eraDiff : (a.canonicalOrder||0)-(b.canonicalOrder||0);
  });
}
function adjacentStory(id, dir){
  const list = allStoriesOrdered();
  const i = list.findIndex(s=>s.id===id);
  if(i===-1) return null;
  return list[i+dir] || null;
}
/* Swipe RIGHT, from anywhere in the app, triggers whatever the currently
   rendered screen's own back control does (corrected from an initial
   leftward version to match the standard mobile edge-swipe-back
   convention). Two back-control shapes exist in this app, checked in
   order:
     1. A `.back-btn[data-action]` element — found generically and given
        a real `.click()`, so this reuses each screen's existing
        back-nav logic (verse-back, character-back, back-to-topics,
        etc.) rather than a second implementation of it.
     2. Browse's book/chapter/verse levels, which use a breadcrumb trail
        (`.crumbs`) instead — the last crumb button is always "go up one
        level" there.
   A screen with neither (Home, any bottom-nav tab root, Browse's own
   root book list) correctly does nothing. Pointer Events (not separate
   touch/mouse listeners) so this covers touch and mouse alike, same as
   wireTimelineDrag() above. Only pointerdown/pointerup are tracked — no
   live drag visual — so a short tap or a mostly-vertical scroll never
   gets misread as a swipe. */
(function wireSwipeBack(){
  const app = document.getElementById('app');
  let start = null;
  app.addEventListener('pointerdown', e=>{
    // The rendered Family Tree screen (not its picker/search screen,
    // which has no viewport) owns horizontal drag for panning the tree
    // itself — a rightward pan there would otherwise also fire the
    // app-wide swipe-back and navigate away mid-gesture, fighting
    // wireFamilyTreePanZoom() for the same gesture.
    if(document.getElementById('family-tree-viewport')) return;
    start = {x: e.clientX, y: e.clientY, t: Date.now()};
  });
  app.addEventListener('pointerup', e=>{
    if(!start) return;
    const dx = e.clientX - start.x, dy = e.clientY - start.y, dt = Date.now() - start.t;
    start = null;
    // A real, mostly-horizontal, reasonably quick RIGHTWARD swipe only
    // (matching the standard iOS/Android edge-swipe-back convention,
    // corrected from an initial leftward version) — not a scroll, not a
    // tap, not a diagonal drag, not a leftward swipe.
    if(dx <= 60 || Math.abs(dx) < Math.abs(dy)*1.5 || dt > 800) return;
    // Home's settings gear reuses the .back-btn class for its shared
    // press-feedback styling even though it's not a "back" action
    // (data-action="go-settings") — excluded here so swipe-back on Home
    // does nothing instead of jumping to Settings.
    const backBtn = document.querySelector('.back-btn[data-action]:not(.home-settings-btn)');
    if(backBtn){ backBtn.click(); return; }
    // Browse's book/chapter/verse levels use a breadcrumb trail
    // (.crumbs) instead of a .back-btn — the last crumb button is
    // always "go up one level" (the book button at verse level, "All
    // books" at chapter-grid level), so it doubles as this screen's
    // back target. Browse's root book list has no crumbs at all and
    // correctly does nothing, same as any other bottom-nav tab root.
    const crumbBtns = document.querySelectorAll('.crumbs button');
    if(crumbBtns.length) crumbBtns[crumbBtns.length-1].click();
  });
  app.addEventListener('pointercancel', ()=>{ start = null; });
})();

/* nav bar */
document.querySelectorAll('.navitem').forEach(b=>{
  b.addEventListener('click', ()=>{
    session = null;
    factDrawerOpen = null; // don't let a closed-over-navigation fact drawer silently reappear on return to Home
    go(b.dataset.nav);
  });
});

/* one-time migration from the pre-split single blob (rooted-app-data) */
async function migrateLegacy(seedContent){
  const legacy = await loadStored(LEGACY_KEY);
  if(!legacy || !Array.isArray(legacy.verses)) return null;
  const seedIds = t => new Set((seedContent[t]||[]).map(e=>e.id));
  const vIds = seedIds('verses'), tIds = seedIds('topics'), cIds = seedIds('characters');
  const overlay = {
    verses:     legacy.verses.filter(v=>!vIds.has(v.id)).map(stripProgress),
    topics:     (legacy.topics||[]).filter(t=>!tIds.has(t.id)),
    characters: (legacy.characters||[]).filter(c=>!cIds.has(c.id))
  };
  const prog = {};
  for(const v of legacy.verses){
    const p = v.progress;
    if(p && (p.timesReviewed || p.nextReview || p.status && p.status!=='new')){
      prog[v.id] = normalizeProgress(p);
    }
  }
  try{
    await window.storage.set(CONTENT_KEY, JSON.stringify(overlay), false);
    await window.storage.set(PROGRESS_KEY, JSON.stringify(prog), false);
  }catch(e){ console.error('legacy migration save failed', e); }
  return {overlay, prog};
}

/* ---------- boot ---------- */
(async function boot(){
  document.getElementById('app').innerHTML = `<div class="empty" style="padding-top:80px;"><i class="ti ti-leaf"></i><p>Loading...</p></div>`;
  seed = await loadSeed();
  let storedContent = await loadStored(CONTENT_KEY);
  let storedProgress = await loadStored(PROGRESS_KEY);
  const isFreshInstall = !storedContent && !storedProgress; // before the legacy-migration check below can populate either

  if(!storedContent && !storedProgress){
    const migrated = await migrateLegacy(seed);
    if(migrated){ storedContent = migrated.overlay; storedProgress = migrated.prog; }
  }

  content = Object.assign(emptyOverlay(), storedContent || {});
  progress = {};
  for(const [id, p] of Object.entries(storedProgress || {})) progress[id] = normalizeProgress(p);

  const storedSettings = await loadStored(SETTINGS_KEY);
  settings = Object.assign({challengeTypeId:'challenge_tap_builder', dailyGoal:10, soundEnabled:true, language:'en', hearts:5, gems:0, xp:0, chestsOpened:[], practiceTheme:'dark', homeTheme:'light', lastStreakScreenDate:null, heartsResetDate:null, trophiesClaimed:[]}, storedSettings || {});
  if(!CHALLENGE_TYPES[settings.challengeTypeId] && settings.challengeTypeId !== MIX_MATCH_ID) settings.challengeTypeId = 'challenge_tap_builder';
  if(settings.language === 'te') loadTeVerses(); // don't block first paint — verseText() falls back to English until this resolves

  const storedSyncMeta = await loadStored(SYNC_META_KEY);
  syncMeta = Object.assign({updatedAt: null}, storedSyncMeta || {});

  data = mergeContent(seed, content);
  if(!content.libraryVerseIds){
    // Fresh install: start with just the ten easy verses (item 148). An
    // existing user who never had this field keeps everything they
    // already had. Deliberately checking for the field being *absent*
    // (undefined), not merely empty — a user who's since removed every
    // verse from their library on purpose has a real `[]` here, which
    // must never get silently refilled back to the full curated set on
    // a later boot.
    content.libraryVerseIds = isFreshInstall ? DEFAULT_LIBRARY_IDS.slice() : data.verses.map(v=>v.id);
    saveContent();
  }
  lore = await loadStories();
  connections = await loadConnections();
  motifs = await loadMotifs();
  chapterSections = await loadChapterSections();
  wordsOfTheDay = await loadWordOfTheDayData();
  dailyFacts = await loadDailyFactsData();
  lexicon = await loadLexiconData();
  characterPortraits = await loadCharacterPortraits();
  storyIllustrations = await loadStoryIllustrations();
  render();
  applyNavLabels();

  // Cloud sync is optional and never blocks first paint — the app is fully
  // usable offline the instant the line above runs. This runs after, in the
  // background, and only touches anything if the visitor is signed in.
  account = await loadAccount();
  if(account) await pullAndMerge();
})();

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}
</script>
