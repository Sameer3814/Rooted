<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rooted — Scripture Memory</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#08090B">
<link rel="apple-touch-icon" href="icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Fraunces:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">
<style>
  :root{
    /* v3 visual system (2026-09-10) — modern dark theme, inspired by (not
       copied from) YouVersion: a near-black ground so accent colors and
       card surfaces pop, replacing the v2 warm cream/storybook look
       entirely (full swap, no light/dark toggle — see DATA_MODEL.md for
       the rationale). Same token names as v2 so every component below
       inherited the new look for free; only the values changed. */
    --paper:#08090B;
    --paper-raised:#18191D;
    --surface-sunken:#212227;
    --ink:#F5F4F1;
    --ink-soft:#9CA0AA;
    --ink-faint:#63676F;
    --line:rgba(255,255,255,.09);
    --gold:#F5AC1F;
    --gold-deep:#FFCE5C;
    --gold-wash:rgba(245,172,31,.18);
    --gold-shadow:rgba(245,172,31,.3);
    --sage:#1FE07F;
    --sage-deep:#79F3AE;
    --sage-wash:rgba(31,224,127,.16);
    --tan-deep:#9FB0C3;
    --tan-wash:rgba(159,176,195,.14);
    --danger:#FF5C43;
    --danger-wash:rgba(255,92,67,.16);
    --shadow-card:0 4px 16px rgba(0,0,0,.4);
    --shadow-hero:0 14px 40px rgba(0,0,0,.45);
    --shadow-nav:0 10px 30px rgba(0,0,0,.5);
    --shadow-pop:0 2px 8px rgba(0,0,0,.35);
    --radius-card:20px;
    --radius-ctl:12px;

    /* Type scale (2026-09-14) — a shared set of tokens so "eyebrow"
       labels, titles, body copy, scripture text, headings, and nav/CTA
       text stay consistent across every screen instead of each card
       picking its own one-off size. --text-accent/--text-primary/
       --text-secondary alias the existing --gold-deep/--ink/--ink-soft
       roles rather than introducing new colors — same palette, now also
       reachable by a role name that matches how these tokens get used
       (accent/primary/secondary text) rather than only a color name. */
    --text-xs:12px;
    --text-sm:14px;
    --text-base:16px;
    --text-lg:18px;
    --text-xl:22px;
    --text-2xl:28px;
    --text-primary:var(--ink);
    --text-secondary:var(--ink-soft);
    /* #D49E35 was set explicitly on the VOTD label/ref in the prior CSS
       pass — reused here as the shared accent-text color rather than
       introducing a second, slightly different gold. */
    --text-accent:#D49E35;
    --font-sans:'Inter',sans-serif;
    --font-display:'Fraunces',serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    padding-bottom:120px !important;
  }
  h1,h2,h3,.headline{font-family:var(--font-sans);font-weight:700;color:var(--text-primary);margin:0;letter-spacing:-.01em;}
  /* Screen headings & greetings (h1: "Browse", "Topics", "Study", plus
     .home-greet's "Good afternoon" below) use the same text-2xl/700 pair. */
  h1{font-size:var(--text-2xl);}
  h2{font-size:20px;}
  /* Card & section titles (story/topic/character titles, book names) */
  h3{font-size:var(--text-lg);font-weight:600;line-height:1.3;}
  p{margin:0;line-height:1.55;}
  button{font-family:'Inter',sans-serif;cursor:pointer;}
  /* touch-action:pan-y tells the browser vertical scrolling is its job
     but a horizontal gesture is ours to interpret — without this, mobile
     browsers can decide a swipe belongs to native scrolling and send a
     pointercancel instead of pointerup, silently swallowing the
     swipe-back gesture wired in wireSwipeBack() below before it ever
     fires. Real bug, not theoretical — caught by direct device testing. */
  .app{max-width:480px;margin:0 auto;padding:20px 18px 8px;touch-action:pan-y;}
  .topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;}
  .topbar .brand{display:flex;align-items:center;gap:8px;}
  .topbar .brand i{font-size:22px;color:var(--gold-deep);}
  .stat-row{display:flex;gap:10px;margin-bottom:20px;}
  .stat-card{flex:1;background:var(--paper-raised);border:1px solid rgba(255,255,255,.06);border-radius:var(--radius-card);box-shadow:var(--shadow-card);padding:14px;}
  .stat-card .num{font-family:'Inter',sans-serif;font-size:24px;font-weight:700;letter-spacing:-.01em;}
  .stat-card .label{font-size:12px;color:var(--ink-soft);margin-top:2px;}
  .section-label{font-size:13px;color:var(--ink-soft);margin:22px 0 10px;display:flex;align-items:center;justify-content:space-between;}
  .card{
    background:var(--paper-raised);
    border:1px solid rgba(255,255,255,.06);
    border-radius:var(--radius-card);
    box-shadow:var(--shadow-card);
    padding:16px;
    margin-bottom:12px;
  }
  .card.tap{cursor:pointer;transition:box-shadow .15s ease;}
  .card.tap:active{box-shadow:0 2px 10px rgba(44,34,30,.08);}
  .verse-card{position:relative;}
  /* 4-segment mastery indicator, top-right corner of every verse card —
     replaces the old uppercase status tag inside .tag-row so mastery
     reads at a glance without competing with the topic pills for space. */
  .mastery-bar{position:absolute;top:14px;right:16px;display:flex;gap:3px;}
  .mastery-seg{width:10px;height:4px;border-radius:2px;background:var(--surface-sunken);}
  .mastery-seg.filled{background:var(--sage);}
  .verse-card .ref{font-size:12px;color:var(--gold-deep);font-weight:600;letter-spacing:.02em;margin-bottom:6px;padding-right:52px;}
  /* Scripture text (Home, Verse Details, Practice Cards) — text-base by
     default (compact list/chapter-reading cards); Verse Detail's own
     standalone quote bumps this to text-xl via an inline style, since
     that's the one "hero/standalone quote" context this class renders. */
  .verse-card .text{font-family:var(--font-display);font-weight:500;font-size:var(--text-base);line-height:1.45;color:var(--text-primary);}
  .tag-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;}
  /* Unified badge system (rule 3): gold = primary action / urgency, sage =
     progress / mastery, tan = plain metadata. Replaces the old single
     `.tag` (sage-only) + `.tag.plum` (doing two unrelated jobs — see
     DATA_MODEL.md §29 for why that got split rather than recolored). */
  /* Verse status badges (Mastered/Due today/Seedling etc.) get the
     eyebrow type scale — size, weight, letter-spacing, caps — but keep
     each variant's own color below rather than a single accent color,
     since that gold/sage/tan split is meaningful (rule 3 above) and
     collapsing it to one color would erase the distinction. */
  .tag{font-size:var(--text-xs);font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:4px 11px;border-radius:100px;}
  .tag--gold{background:var(--gold-wash);color:var(--gold-deep);}
  .tag--sage{background:var(--sage-wash);color:var(--sage);}
  .tag--tan{background:var(--tan-wash);color:var(--tan-deep);}
  /* Soft, lowercase hashtag-style topic pills on verse cards — a scoped
     variant, NOT a change to `.tag` itself, which stays the uppercase
     eyebrow badge everywhere else (see the comment above, DATA_MODEL.md
     §85). Lower weight/no caps/no letter-spacing reads as a quieter,
     more casual label than the status badges next to it. */
  .tag--pill{font-size:var(--text-xs);font-weight:500;letter-spacing:0;text-transform:none;padding:4px 10px;border-radius:100px;background:var(--surface-sunken);color:var(--ink-soft);}
  .app-icon{display:inline-flex;vertical-align:middle;flex-shrink:0;}
  .empty{text-align:center;padding:40px 20px;color:var(--ink-soft);}
  .empty i{font-size:34px;color:var(--ink-faint);margin-bottom:10px;display:block;}
  .empty .cta{margin-top:14px;}

  /* Home v6 — greeting + streak header, a media-heavy Verse of the Day
     hero, and a shared "discovery card" row format reused for Unreached
     of the Day and Story of the Day (DATA_MODEL.md §8, item 82). Real
     photos/illustrations aren't wired up everywhere yet (Unsplash needs
     a key; Story illustrations don't exist at all) — placeholderArt() in
     JS generates a small hue-seeded inline-SVG placeholder so the layout
     can be judged now, swapped for real media later without touching
     any markup. */
  .home-greet-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;gap:10px;}
  /* Screen headings & greetings share the h1 scale (text-2xl/700). */
  .home-greet{font-family:var(--font-sans);font-size:var(--text-2xl);font-weight:700;color:var(--text-primary);letter-spacing:-.01em;}
  .home-greet-sub{font-size:var(--text-sm);font-weight:400;color:var(--text-secondary);line-height:1.4;margin-top:2px;}
  .streak-badge{
    display:flex;align-items:center;gap:5px;flex-shrink:0;
    background:linear-gradient(135deg, #FF8A3D 0%, #FF5C43 100%);
    color:#fff;font-size:13px;font-weight:700;
    padding:7px 12px;border-radius:999px;box-shadow:0 2px 10px rgba(255,92,67,.35);
  }
  .streak-badge i{font-size:14px;}

  /* .votd-hero is this card's actual class name (renamed from .votd-card
     in the v6 redesign) — kept as-is rather than renamed again here,
     since it's referenced from renderVerseOfTheDayCard() in JS too. */
  .votd-hero{
    position:relative;overflow:hidden;padding:26px 20px 20px;margin-bottom:14px;
    background-size:cover;background-position:center 35%;min-height:220px;
    display:flex;flex-direction:column;justify-content:flex-end;
    border:none;border-radius:24px;
  }
  .votd-hero::before{
    content:'';position:absolute;inset:0;
    background:linear-gradient(180deg, rgba(20,15,12,.2) 0%, rgba(20,15,12,.85) 100%);
  }
  .votd-hero > *{position:relative;z-index:1;}
  .votd-label{display:flex;align-items:center;gap:6px;font-size:var(--text-xs);font-weight:700;color:var(--text-accent);letter-spacing:.05em;text-transform:uppercase;margin-bottom:12px;}
  .votd-text{font-family:var(--font-display);font-style:italic;font-size:var(--text-xl);font-weight:500;line-height:1.45;color:#FFFFFF;margin-bottom:10px;text-shadow:0 1px 6px rgba(0,0,0,.35);}
  .votd-ref{font-size:13px;font-weight:600;color:var(--text-accent);margin-bottom:14px;}
  /* "Read chapter" CTA — the spec's .btn-read-chapter, kept as the
     existing .votd-action selector (referenced from JS) rather than
     renamed, styled to the requested frosted-glass look. */
  /* Primary CTA button text (also see .practice-nudge below). */
  .votd-action{
    display:inline-flex;align-items:center;gap:6px;align-self:flex-start;
    background:rgba(255,255,255,.15);backdrop-filter:blur(8px);
    border:1px solid rgba(255,255,255,.2);
    color:#FFF;font-size:var(--text-base);font-weight:600;padding:8px 14px;border-radius:999px;
    margin-top:16px;
  }
  .votd-attribution{font-size:10px;color:rgba(255,255,255,.55);margin-top:10px;}
  .votd-attribution a{color:inherit;text-decoration:underline;}

  /* Shared compact row card — text on the left, rectangular thumbnail on
     the right edge. Used for Unreached of the Day and Story of the Day. */
  .discovery-card{margin-bottom:12px;}
  .discovery-card-inner{display:flex;align-items:center;gap:14px;}
  .discovery-text{flex:1;min-width:0;}
  .discovery-label{display:flex;align-items:center;gap:6px;font-size:var(--text-xs);font-weight:700;letter-spacing:.05em;text-transform:uppercase;margin-bottom:6px;color:var(--text-accent);}
  .discovery-card h3{font-size:var(--text-lg);font-weight:600;line-height:1.3;margin-bottom:3px;}
  .discovery-meta,.discovery-sub{font-size:var(--text-sm);font-weight:400;color:var(--text-secondary);line-height:1.4;margin-bottom:2px;}
  .discovery-thumb-box{
    width:88px;height:68px;flex-shrink:0;border-radius:14px;
    background:var(--surface-sunken);overflow:hidden;
    display:flex;align-items:center;justify-content:center;
  }
  .discovery-thumb{display:block;width:88px;height:68px;border-radius:14px;object-fit:cover;flex-shrink:0;}
  .unreached-full-photo{display:block;width:100%;height:auto;border-radius:var(--radius-card);background:var(--surface-sunken);margin-bottom:16px;}

  /* Word of the Day / This Day in Church History (item 89). Both reuse
     the shared .card surface (var(--paper-raised), var(--radius-card) —
     already 20px — same dark card every other Home card sits on) rather
     than a separate literal color, so Home doesn't end up with two
     slightly different shades of "dark card." Padding bumped to 20px on
     these two specifically, per spec. The eyebrow style is the same
     text-xs/700/uppercase/--text-accent pattern .votd-label/.discovery-
     label already use, shared here as .word-eyebrow (also reused by the
     Church History card so the two match). */
  .word-card,.church-history-card{padding:20px;}
  .word-eyebrow{display:flex;align-items:center;gap:6px;font-size:var(--text-xs);font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--text-accent);margin-bottom:12px;}
  .word-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:4px;}
  .word-script{font-family:var(--font-display);font-size:24px;font-weight:600;color:var(--text-primary);}
  .word-translit{font-size:var(--text-base);font-weight:500;color:var(--text-secondary);font-style:italic;}
  .word-strongs{font-size:var(--text-xs);font-weight:600;color:var(--text-accent);margin-bottom:8px;}
  .word-meaning{font-size:var(--text-sm);font-weight:600;color:var(--text-primary);margin-bottom:4px;}
  .word-summary{font-size:var(--text-sm);font-weight:400;color:var(--text-secondary);line-height:1.4;}
  .word-card .tag-row{margin-top:12px;}

  .church-history-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:2px;}
  .church-history-year{font-size:var(--text-xs);font-weight:700;letter-spacing:.03em;color:var(--text-secondary);background:var(--surface-sunken);padding:3px 9px;border-radius:100px;flex-shrink:0;}
  .church-history-card h3{margin-bottom:6px;}
  .church-history-desc{font-size:var(--text-sm);font-weight:400;color:var(--text-secondary);line-height:1.4;}
  .church-history-takeaway{
    display:flex;gap:8px;margin-top:14px;padding-top:14px;border-top:1px solid var(--line);
    font-size:var(--text-sm);color:var(--text-secondary);line-height:1.5;
  }
  .church-history-takeaway i{color:var(--text-accent);flex-shrink:0;margin-top:2px;}

  .practice-nudge{
    display:flex;align-items:center;justify-content:center;gap:6px;
    text-align:center;font-size:var(--text-base);font-weight:600;color:var(--gold-deep);
    background:var(--paper-raised);border:1px solid rgba(255,255,255,.06);
    border-radius:var(--radius-ctl);padding:13px 0;margin-top:4px;cursor:pointer;
  }
  .practice-nudge i{font-size:15px;}

  /* buttons */
  .btn{
    border:none;
    background:var(--surface-sunken);
    color:var(--ink);
    border-radius:var(--radius-ctl);
    padding:11px 16px;
    font-size:14px;
    font-weight:500;
    display:inline-flex;
    align-items:center;
    gap:6px;
  }
  /* Primary CTA buttons get the larger text-base/600 pair (secondary/
     ghost/utility buttons keep the smaller base .btn size above). */
  .btn.primary{background:var(--gold);color:#241900;box-shadow:0 6px 16px var(--gold-shadow);font-size:var(--text-base);font-weight:600;}
  .btn.primary:active{background:var(--gold-deep);}
  .btn.ghost{background:transparent;color:var(--ink-soft);}
  .btn.block{width:100%;justify-content:center;padding:13px;}
  .btn.sage{background:var(--sage);color:#fff;}
  .btn:disabled{opacity:.45;}

  /* forms */
  label{font-size:13px;color:var(--ink-soft);display:block;margin:14px 0 6px;}
  label:first-child{margin-top:0;}
  input[type=text],textarea,select{
    width:100%;
    border:1px solid transparent;
    background:var(--surface-sunken);
    border-radius:var(--radius-ctl);
    padding:11px 12px;
    font-size:15px;
    font-family:'Inter',sans-serif;
    color:var(--ink);
  }
  textarea{min-height:80px;resize:vertical;font-family:'Inter',sans-serif;font-size:15px;line-height:1.5;}
  input:focus,textarea:focus,select:focus{outline:2px solid var(--gold);outline-offset:1px;}

  /* nav — floating frosted overlay, lifted off the edge (rule 6) */
  .navbar{
    position:fixed;left:16px;right:16px;bottom:16px;
    max-width:448px;margin:0 auto;
    background:rgba(20,21,25,.9);
    border:1px solid rgba(255,255,255,.06);
    -webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);
    border-radius:22px;
    box-shadow:var(--shadow-nav);
    display:flex;
    padding:9px 6px calc(9px + env(safe-area-inset-bottom));
    z-index:10;
  }
  .navbar .navitem{
    flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
    background:none;border:none;color:var(--ink-faint);padding:5px 0;
  }
  .navbar .navitem .dot{width:30px;height:30px;border-radius:10px;display:flex;align-items:center;justify-content:center;}
  .navbar .navitem i{font-size:19px;}
  .navbar .navitem span{font-size:var(--text-xs);font-weight:500;}
  /* Filled chip = active, not a font-glyph swap — the pinned Tabler webfont
     doesn't reliably ship true filled/outline pairs for every icon. */
  .navbar .navitem.active{color:var(--gold-deep);}
  .navbar .navitem.active .dot{background:var(--gold-wash);}

  /* avatar */
  .avatar{
    width:46px;height:46px;border-radius:13px;overflow:hidden;
    display:flex;align-items:center;justify-content:center;
    background:var(--tan-wash);color:var(--tan-deep);font-size:22px;flex-shrink:0;
  }
  /* Real portraits (item 91) — an <img> swapped in for the icon by
     charAvatarInner()/charPortraitUrl() wherever a character has one;
     fills the same box the icon used to, whichever avatar class it is. */
  .avatar img,.list-avatar img{display:block;width:100%;height:100%;object-fit:cover;}
  .char-row{display:flex;align-items:center;gap:12px;}
  .char-row .meta{font-size:var(--text-sm);font-weight:400;color:var(--text-secondary);line-height:1.4;margin-top:2px;}

  /* list rows (rule 4) — borderless, hairline-divided, for book/people
     browsers. Cards stay reserved for hero metrics and featured content
     (verse cards, stat cards) per the same rule. */
  .list-row{display:flex;align-items:center;gap:13px;padding:13px 2px;border-bottom:1px solid var(--line);}
  .list-row:last-child{border-bottom:none;}
  .list-row .list-avatar{width:40px;height:40px;border-radius:12px;overflow:hidden;background:var(--tan-wash);color:var(--tan-deep);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:18px;}
  /* Card & section titles — book/character names in list rows. */
  .list-row .name{font-family:var(--font-sans);font-weight:600;font-size:var(--text-lg);line-height:1.3;color:var(--text-primary);}
  .list-row .meta{font-size:var(--text-sm);font-weight:400;color:var(--text-secondary);line-height:1.4;margin-top:1px;}
  .list-row .chev{margin-left:auto;color:var(--ink-faint);flex-shrink:0;}

  /* topics grid — colorful per-topic cards (v3, YouVersion-inspired) */
  .topic-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:8px;}
  .topic-card{
    position:relative;overflow:hidden;border:none;text-align:left;
    border-radius:var(--radius-card);padding:14px;min-height:104px;
    display:flex;flex-direction:column;justify-content:flex-end;color:#fff;
  }
  .topic-card .topic-card-icon{position:absolute;top:10px;right:10px;font-size:38px;opacity:.35;color:#fff;}
  .topic-card .name{font-family:var(--font-sans);font-weight:600;font-size:var(--text-lg);line-height:1.3;position:relative;}
  /* Topic verse counters are categorized as an eyebrow (size/weight/caps/
     letter-spacing), but keep white-on-opacity rather than --text-accent
     (gold) — these cards sit on arbitrary saturated per-topic backgrounds
     (TOPIC_PALETTE), and gold text wouldn't stay legible on all of them. */
  .topic-card .meta{font-size:var(--text-xs);font-weight:700;letter-spacing:.05em;text-transform:uppercase;opacity:.78;margin-top:2px;position:relative;}

  /* hero header (rule 5) — character/story detail, replacing the old
     screen-head + cramped 56px-avatar card. */
  .hero{background:var(--paper-raised);border:1px solid rgba(255,255,255,.06);border-radius:var(--radius-card);box-shadow:var(--shadow-hero);padding:30px 22px 24px;text-align:center;margin-bottom:22px;}
  .hero-avatar{width:76px;height:76px;border-radius:20px;background:var(--tan-wash);color:var(--tan-deep);display:flex;align-items:center;justify-content:center;margin:0 auto;font-size:30px;}
  /* Full profile portrait (item 91) — replaces .hero-avatar entirely when
     a character has a real generated portrait, rendered above the .hero
     card rather than inside its centered-text padding (same "full-bleed
     image above the info card" shape as .unreached-full-photo). */
  .hero-photo{display:block;width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:var(--radius-card);background:var(--surface-sunken);}
  /* Visible prev/next controls for the character carousel (replacing an
     earlier blind-swipe-only version on direct feedback) — overlaid on
     the photo itself rather than a separate row, so no new vertical
     space is spent on them. Hidden individually at either end of
     allCharactersOrdered() (adjacentCharacter() returns null there), so
     there's never a dead-end arrow that does nothing when tapped. */
  .hero-photo-wrap{position:relative;margin-bottom:16px;}
  .hero-nav-btn{
    position:absolute;top:50%;transform:translateY(-50%);
    width:38px;height:38px;border-radius:50%;
    background:rgba(0,0,0,.45);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);
    border:1px solid rgba(255,255,255,.25);color:#fff;font-size:18px;
    display:flex;align-items:center;justify-content:center;
  }
  .hero-nav-prev{left:10px;}
  .hero-nav-next{right:10px;}
  .hero h1{font-size:2rem;font-weight:700;margin:12px 0 8px;}
  .hero .tags{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-bottom:10px;}
  .hero .era{font-size:12.5px;color:var(--ink-soft);display:flex;align-items:center;gap:5px;justify-content:center;margin-bottom:14px;}
  .hero p.summary{font-size:13.5px;color:var(--ink-soft);line-height:1.6;text-align:left;}

  /* topic detail hero — colored in the topic's own card color (v3 follow-up) */
  .topic-detail-hero{
    position:relative;overflow:hidden;border-radius:var(--radius-card);
    padding:20px 20px 24px;margin-bottom:18px;color:#fff;
  }
  .topic-detail-hero .back-btn{margin-bottom:34px;box-shadow:none;}
  .topic-detail-hero-icon{position:absolute;top:18px;right:14px;font-size:64px;opacity:.22;color:#fff;}
  .topic-detail-hero h1{position:relative;color:#fff;margin-bottom:8px;}
  .topic-detail-hero p{position:relative;color:rgba(255,255,255,.85);font-size:13.5px;line-height:1.55;margin:0;}

  /* practice */
  .practice-verse{
    font-family:var(--font-display);font-weight:500;font-size:var(--text-base);line-height:1.45;color:var(--text-primary);
  }
  .blank{
    display:inline-block;
    min-width:64px;
    border-bottom:2px solid var(--gold);
    padding:0 2px;
  }
  .blank input{
    border:none;background:transparent;font-family:'Inter',sans-serif;font-weight:600;font-size:18px;
    width:100%;padding:0;color:var(--gold-deep);text-align:center;outline:none;
  }
  .blank.correct{border-color:var(--sage);}
  .blank.correct input{color:var(--sage-deep);}
  .blank.wrong{border-color:var(--danger);}
  .blank.wrong input{color:var(--danger);}
  .progress-track{height:5px;background:var(--line);border-radius:4px;overflow:hidden;margin-bottom:22px;}
  .progress-fill{height:100%;background:var(--gold);border-radius:4px;transition:width .3s ease;}
  .result-banner{
    display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:var(--radius-ctl);margin-bottom:16px;font-size:14px;
  }
  .result-banner.good{background:var(--sage-wash);color:var(--sage-deep);}
  .result-banner.bad{background:var(--danger-wash);color:var(--danger);}

  /* scramble challenge */
  .chip{
    display:inline-block;font-family:'Inter',sans-serif;font-weight:500;font-size:15px;line-height:1.2;
    padding:7px 13px;border:1px solid transparent;border-radius:100px;
    background:var(--surface-sunken);color:var(--ink);
  }
  .chip.picked{background:var(--gold-wash);border-color:var(--gold);color:var(--gold-deep);}
  .chip.chip-correct{background:var(--sage-wash);border-color:var(--sage);color:var(--sage-deep);}
  .chip.chip-wrong{background:var(--danger-wash);border-color:var(--danger);color:var(--danger);}
  .scramble-build{
    min-height:46px;padding:9px 10px;margin-bottom:12px;
    background:var(--surface-sunken);border-radius:var(--radius-ctl);
    line-height:2.4;
  }
  .scramble-pool{line-height:2.6;}
  .scramble-fixed{color:var(--ink-soft);font-family:'Inter',sans-serif;font-weight:500;font-size:15px;margin:6px 0;}
  .scramble-hint{color:var(--ink-faint);font-size:13px;font-family:'Inter',sans-serif;}

  /* Tap Builder challenge (2026-09-17) — its own dark-obsidian/bronze
     component palette, scoped to these classes only, same reasoning as
     the Family Tree feature's own palette: hex-exact values given for
     one specific component, not a request to relitigate the app's
     shared --gold/--sage/--danger tokens used by every other challenge
     type. */
  .target-sentence-box{
    background:#1C1917;border:1px solid #2E2925;border-radius:16px;
    padding:20px;font-size:18px;line-height:1.6;color:#F5F2ED;
    font-family:var(--font-display);font-weight:500;
  }
  .target-sentence-box.tap-shake{animation:tapShake .3s ease-in-out;}
  @keyframes tapShake{
    0%,100%{transform:translateX(0);} 20%{transform:translateX(-6px);}
    40%{transform:translateX(6px);} 60%{transform:translateX(-4px);} 80%{transform:translateX(4px);}
  }
  .tap-slot{
    display:inline-flex;align-items:center;justify-content:center;
    min-width:60px;min-height:44px;padding:0 6px;margin:2px 0;
    border-bottom:2px dashed #C69255;font-weight:600;color:#C69255;
    vertical-align:middle;
  }
  .tap-slot.tap-slot-filled{cursor:pointer;border-style:solid;color:#F5F2ED;}
  .tap-slot.tap-slot-correct{border-color:#10B981;background:rgba(16,185,129,.15);color:#10B981;border-radius:8px;}
  .tap-slot.tap-slot-wrong{border-color:#EF4444;background:rgba(239,68,68,.12);color:#EF4444;border-radius:8px;}
  .word-bank-grid{display:flex;flex-wrap:wrap;gap:10px;margin:16px 0 20px;}
  .tap-tile{
    background:#26221F;border:1px solid #3A332D;border-radius:12px;
    padding:10px 16px;min-height:44px;font-size:16px;color:#F5F2ED;
    font-family:'Inter',sans-serif;font-weight:500;cursor:pointer;transition:all .15s ease;
  }
  .tap-tile:active{transform:scale(.95);background:#2E2925;}
  .tap-builder-check{background:#C69255 !important;color:#141210 !important;box-shadow:none !important;padding:16px !important;min-height:44px;}

  /* segmented control (practice mode picker) */
  /* overflow-x:auto (rather than a fixed flex:1 grid) since a 5th
     challenge type (Tap Builder) made this too cramped to fit evenly on
     a narrow phone without wrapping "Progressive reveal" mid-word —
     degrades to a horizontally scrollable pill row instead, same
     pattern already used by .practice-filter-tabs. */
  .segmented{display:flex;gap:4px;background:var(--surface-sunken);border-radius:var(--radius-ctl);padding:4px;margin-bottom:12px;overflow-x:auto;}
  .segmented button{
    flex:0 0 auto;white-space:nowrap;border:none;background:transparent;color:var(--ink-soft);
    font-size:13px;font-weight:500;padding:8px 12px;border-radius:9px;
  }
  .segmented button.active{background:var(--gold-wash);color:var(--gold-deep);}

  /* timeline */
  .timeline{position:relative;padding-left:24px;margin-bottom:6px;}
  .timeline::before{content:'';position:absolute;left:5px;top:8px;bottom:8px;width:2px;background:var(--line);border-radius:2px;}
  .tl-item{position:relative;margin-bottom:18px;}
  .tl-item::before{
    content:'';position:absolute;left:-24px;top:4px;width:12px;height:12px;
    border-radius:50%;background:var(--paper);border:2px solid var(--gold);
  }
  .tl-item.tap{cursor:pointer;}
  .tl-item.tap:active .tl-title{color:var(--gold-deep);}
  .tl-title{font-family:'Inter',sans-serif;font-size:15px;font-weight:600;color:var(--ink);line-height:1.35;}
  .tl-ref{font-size:11px;color:var(--gold-deep);font-weight:600;margin-top:2px;letter-spacing:.02em;}
  .tl-age{color:var(--ink-faint);font-weight:400;}
  .tl-desc{font-size:14px;color:var(--ink-soft);line-height:1.5;margin-top:5px;}

  /* family tree (item 110, rendering overhaul v2 2026-09-16) — a
     deliberately distinct warm bronze/dark palette scoped ONLY to this
     feature's own classes (never the shared --gold/--paper-raised
     tokens), per an explicit, hex-exact design spec for this component
     specifically — not a relitigation of the app-wide v3 dark theme
     (see "Visual direction" in CLAUDE.md). */
  .tree-viewport{
    position:relative;overflow:hidden;touch-action:none;
    background:var(--surface-sunken);border-radius:var(--radius-card);
    height:min(60vh, 480px);border:1px solid rgba(255,255,255,.06);
  }
  .tree-canvas{position:relative;transform-origin:0 0;}
  .tree-edges-svg{position:absolute;top:0;left:0;pointer-events:none;overflow:visible;}
  .tree-legend{
    position:absolute;top:10px;left:50%;transform:translateX(-50%);z-index:2;
    display:flex;flex-wrap:wrap;justify-content:center;gap:12px;
    background:rgba(28,25,23,.85);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
    border:1px solid #2E2925;border-radius:100px;padding:6px 16px;
    font-size:12px;color:#A39B92;max-width:calc(100% - 24px);
  }
  .tree-legend span{display:inline-flex;align-items:center;gap:6px;white-space:nowrap;}
  .tree-legend-line{display:inline-block;width:14px;height:2px;border-radius:1px;background:#C69255;}
  .tree-legend-dash{opacity:.65;}
  .tree-node-card{
    position:absolute;
    background:#1C1917;border:1px solid #2E2925;border-radius:16px;
    padding:10px 14px;display:flex;align-items:center;gap:12px;
    cursor:pointer;transition:all .2s ease;
  }
  .tree-node-card:active{transform:scale(.97);}
  .tree-node-card.active{
    border-color:#C69255;background:#26221F;box-shadow:0 0 16px rgba(198,146,85,.25);
  }
  .tree-avatar{
    width:40px;height:40px;border-radius:50%;flex-shrink:0;overflow:hidden;
    border:1.5px solid #C69255;background:#2E2925;
    display:flex;align-items:center;justify-content:center;color:#A39B92;font-size:18px;
  }
  .tree-avatar img{width:100%;height:100%;object-fit:cover;}
  .tree-node-info{min-width:0;flex:1;}
  .tree-node-name{
    font-size:15px;font-weight:600;color:#F5F2ED;line-height:1.2;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .tree-node-sub{
    font-size:12px;color:#A39B92;margin-top:2px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }

  /* timeline drag-order game */
  .tl-drag-track{display:flex;flex-direction:column;gap:8px;margin-bottom:4px;}
  .tl-drag-item{
    display:flex;align-items:center;gap:10px;
    background:var(--paper-raised);border:1px solid rgba(255,255,255,.06);
    border-radius:var(--radius-ctl);padding:12px 14px;
    touch-action:none;-webkit-user-select:none;user-select:none;
    transition:box-shadow .15s ease,border-color .2s ease,background .2s ease;
  }
  .tl-drag-item[data-draggable="1"]{cursor:grab;}
  .tl-drag-item.dragging{position:relative;z-index:5;box-shadow:var(--shadow-hero);cursor:grabbing;transition:none;}
  .tl-drag-handle{color:var(--ink-faint);font-size:18px;flex-shrink:0;}
  .tl-drag-body{flex:1;min-width:0;}
  .tl-drag-check{color:var(--gold-deep);font-size:18px;flex-shrink:0;}
  .tl-drag-item.tl-drag-correct{
    border-color:var(--gold);background:var(--gold-wash);
    box-shadow:0 0 0 1px var(--gold),0 0 16px var(--gold-shadow);
  }
  .tl-drag-item.tl-drag-wrong{border-color:var(--danger);}

  /* browse / search */
  .search-wrap{position:relative;margin-bottom:14px;}
  .search-wrap i{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--ink-faint);font-size:18px;}
  .search-wrap input{padding-left:38px;}
  .crumbs{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:13px;color:var(--ink-soft);margin-bottom:12px;}
  .crumbs button{border:none;background:none;color:var(--gold-deep);font-size:13px;font-weight:500;padding:0;}
  .chapter-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(54px,1fr));gap:8px;}
  .chapter-cell{
    background:var(--surface-sunken);border:1px solid transparent;border-radius:var(--radius-ctl);
    padding:12px 4px;font-family:'Inter',sans-serif;font-weight:600;font-size:15px;color:var(--ink);
  }
  .chapter-cell:active{border-color:var(--gold);}
  .result-count{font-size:12px;color:var(--ink-faint);margin-bottom:10px;}
  .card-actions{display:flex;justify-content:flex-end;margin-top:10px;}
  .in-library{font-size:12px;color:var(--sage-deep);display:inline-flex;align-items:center;gap:4px;}

  /* header w/ back */
  .screen-head{display:flex;align-items:center;gap:10px;margin-bottom:18px;}
  .back-btn{width:36px;height:36px;border-radius:10px;border:1px solid rgba(255,255,255,.06);background:var(--paper-raised);box-shadow:var(--shadow-pop);display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--ink);}
  /* Home header's settings button only — larger, frosted, distinct from
     the plain .back-btn used everywhere else for navigation. */
  .home-settings-btn{
    width:42px;height:42px;border-radius:12px;
    background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.1);
    box-shadow:none;display:flex;align-items:center;justify-content:center;
  }
  .home-settings-btn i{width:22px;height:22px;font-size:22px;line-height:22px;}
  .err{color:var(--danger);font-size:13px;margin-top:6px;}
  .field-hint{font-size:var(--text-sm);font-weight:400;color:var(--text-secondary);line-height:1.4;margin-top:4px;}

  /* ---------- tactile micro-interactions (2026-09-09) ----------
     A springy press-down on every tappable surface — buttons, practice
     chips, nav items, tappable cards/rows, chapter cells. One shared rule
     rather than touching each component's own block. */
  .btn, .chip, .navitem, .card.tap, .list-row.tap, .chapter-cell, .back-btn, .topic-card, .hero-nav-btn{
    transition: transform .15s cubic-bezier(.34,1.56,.64,1);
  }
  .btn:active, .chip:active, .navitem:active, .card.tap:active, .list-row.tap:active, .chapter-cell:active, .back-btn:active, .topic-card:active{
    transform: scale(.96);
  }
  /* .hero-nav-btn already carries translateY(-50%) for vertical centering
     (see .hero-nav-btn above) — its own :active rule combines both
     transforms instead of using the shared rule above, which would
     otherwise wipe out the centering and make the button jump on press. */
  .hero-nav-btn:active{transform:translateY(-50%) scale(.9);}
  /* Scramble chips "pop" in on every render (pick/unpick/re-render) — a
     full FLIP slide-between-containers animation would need per-chip
     position tracking across two separate drop zones; this is the
     lightweight, robust illusion of fluid placement instead. */
  @keyframes chipIn{from{opacity:0;transform:scale(.82);}to{opacity:1;transform:scale(1);}}
  .chip{animation:chipIn .18s cubic-bezier(.34,1.56,.64,1);}

  /* ---------- daily goal ring (Home) ---------- */
  .goal-ring{position:relative;width:104px;height:104px;margin:0 auto 16px;}
  .goal-ring svg{width:100%;height:100%;transform:rotate(-90deg);}
  .goal-ring circle{fill:none;stroke-width:7;}
  .goal-ring .ring-track{stroke:var(--surface-sunken);}
  .goal-ring .ring-fill{stroke:var(--gold);stroke-linecap:round;transition:stroke-dashoffset .6s cubic-bezier(.34,1.56,.64,1);}
  .goal-ring .ring-label{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
  .goal-ring .ring-label .num{font-family:'Inter',sans-serif;font-size:24px;font-weight:700;color:var(--ink);letter-spacing:-.01em;}
  .goal-ring .ring-label .of{font-size:10.5px;color:var(--ink-soft);margin-top:1px;}

  /* ---------- Practice screen: hero card, compact stats strip, filter tabs ---------- */
  .practice-hero-card{background:var(--paper-raised);border:1px solid rgba(255,255,255,.06);border-radius:var(--radius-card);box-shadow:var(--shadow-card);padding:20px 16px 16px;margin-bottom:16px;}
  .practice-hero-card .goal-ring{margin-bottom:10px;}
  .practice-hero-card .segmented{margin-bottom:14px;}
  .practice-stats-strip{display:flex;align-items:center;gap:6px;flex-wrap:wrap;background:var(--surface-sunken);border-radius:var(--radius-ctl);padding:10px 14px;margin-bottom:20px;font-size:var(--text-sm);color:var(--ink-soft);}
  .practice-stats-strip .stat-sep{color:var(--ink-faint);}
  .practice-stats-strip strong{color:var(--ink);font-weight:700;}
  .practice-stats-strip .app-icon{margin-right:2px;}
  .practice-filter-tabs{position:sticky;top:0;z-index:2;display:flex;gap:6px;background:var(--paper);padding:2px 0 12px;margin:-2px 0 6px;overflow-x:auto;}
  .practice-filter-tabs button{flex-shrink:0;font-size:var(--text-sm);font-weight:600;color:var(--ink-soft);background:var(--surface-sunken);border:none;border-radius:100px;padding:7px 14px;cursor:pointer;transition:background .15s ease,color .15s ease;}
  .practice-filter-tabs button.active{background:var(--gold-wash);color:var(--gold-deep);}

  /* ---------- session-complete celebration ---------- */
  @keyframes slideUp{from{opacity:0;transform:translateY(24px);}to{opacity:1;transform:translateY(0);}}
  @keyframes bounceIn{0%{opacity:0;transform:scale(.3);}55%{opacity:1;transform:scale(1.15);}100%{transform:scale(1);}}
  @keyframes statIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
  @keyframes spark{
    0%{opacity:1;transform:translate(-50%,-50%) rotate(var(--angle)) translateY(0) scale(1);}
    100%{opacity:0;transform:translate(-50%,-50%) rotate(var(--angle)) translateY(calc(-1 * var(--dist))) scale(.3);}
  }
  .complete-card{position:relative;text-align:center;padding:32px 16px 28px;overflow:hidden;animation:slideUp .35s cubic-bezier(.34,1.56,.64,1) both;}
  .complete-icon{font-size:40px;color:var(--gold-deep);display:inline-block;animation:bounceIn .5s cubic-bezier(.34,1.56,.64,1) both;}
  .sparks{position:absolute;inset:0;pointer-events:none;}
  .spark{position:absolute;top:50%;left:50%;width:var(--size);height:var(--size);background:var(--spark-color,var(--gold));border-radius:50%;animation:spark .7s ease-out both;}
  .complete-stats{display:flex;gap:10px;justify-content:center;margin-top:18px;}
  .complete-stat{background:var(--surface-sunken);border-radius:var(--radius-ctl);padding:14px 20px;min-width:96px;opacity:0;animation:statIn .4s ease-out both;}
  .complete-stat .num{font-family:'Inter',sans-serif;font-size:22px;font-weight:700;letter-spacing:-.01em;}
  .complete-stat .lbl{font-size:11px;color:var(--ink-soft);margin-top:2px;}

  /* Respect a real accessibility signal over the fun — every animation
     above is decorative, none of it gates functionality, so disabling it
     costs nothing. */
  @media (prefers-reduced-motion: reduce){
    .btn, .chip, .navitem, .card.tap, .list-row.tap, .chapter-cell, .back-btn, .topic-card,
    .complete-card, .complete-icon, .spark, .complete-stat, .goal-ring .ring-fill{
      animation: none !important;
      transition: none !important;
    }
  }
</style>
</head>

<div class="app" id="app"></div>

<nav class="navbar">
  <button class="navitem" data-nav="home"><span class="dot"><i class="ti ti-home-2"></i></span><span>Home</span></button>
  <button class="navitem" data-nav="practice"><span class="dot"><i class="ti ti-swords"></i></span><span>Practice</span></button>
  <button class="navitem" data-nav="discover"><span class="dot"><i class="ti ti-compass"></i></span><span>Discover</span></button>
  <button class="navitem" data-nav="study"><span class="dot"><i class="ti ti-sparkles"></i></span><span>Study</span></button>

<script>
/* ---------- local-dev storage fallback ----------
   The app persists through window.storage, provided by the Claude runtime.
   When the page is opened from a plain web server / browser that API is
   absent, so fall back to localStorage with the same shape (same origin,
   survives reload, per-browser). Inert inside the Claude runtime. */
if(!window.storage){
  console.info('Rooted: window.storage not found — using localStorage (local dev).');
  window.storage = {
    async get(key){
      try{ const v = localStorage.getItem(key); return v === null ? null : {value:v}; }
      catch(e){ return null; }
    },
    async set(key, value){
      try{ localStorage.setItem(key, value); }
      catch(e){ console.warn('Rooted: localStorage set failed', e); }
    }
  };
}

/* ---------- storage ----------
   Content (verses/topics/characters) and user state (practice progress) are
   stored under separate keys so resetting progress can never destroy content.
   See DATA_MODEL.md §5, §7.
   - rooted-content  : user overlay { verses, topics, characters } merged
                       over the seed by id at load. Seed is source of truth
                       for seed ids; the overlay adds new ids and patches
                       existing ones.
   - rooted-progress : map of verseId -> VerseProgress
   - rooted-sync-meta: { updatedAt } — stamped on every local edit, compared
                       against the cloud copy's updatedAt to decide which
                       side wins on sync (whole-bundle last-write-wins, not
                       per-field — see pullAndMerge() below and
                       DATA_MODEL.md §7.1).
*/
const CONTENT_KEY   = 'rooted-content';
const PROGRESS_KEY  = 'rooted-progress';
const SETTINGS_KEY  = 'rooted-settings';   // per-user preferences (DATA_MODEL.md §7)
const SYNC_META_KEY = 'rooted-sync-meta';  // {updatedAt} for cloud sync (DATA_MODEL.md §7.1)
const LEGACY_KEY    = 'rooted-app-data';   // pre-split single blob; migrated once

let contentTimer = null, progressTimer = null, settingsTimer = null;
let syncMeta = {updatedAt: null};    // local edit clock; compared against the cloud copy
let account = null;                  // {userId, userDetails, identityProvider, userRoles} | null — from /.auth/me
let syncStatus = 'idle';             // 'idle' | 'syncing' | 'synced' | 'error' — for the account bar
let cloudPushTimer = null;
let suppressSyncTouch = false;       // true while pullAndMerge() is writing an *adopted* remote state locally, so that adoption doesn't get mistaken for a fresh local edit and immediately pushed back up
function saveContent(){
  touchSyncMeta();
  clearTimeout(contentTimer);
  contentTimer = setTimeout(async ()=>{
    try{ await window.storage.set(CONTENT_KEY, JSON.stringify(content), false); }
    catch(e){ console.error('content save failed', e); }
  }, 250);
}
function saveProgress(){
  touchSyncMeta();
  clearTimeout(progressTimer);
  progressTimer = setTimeout(async ()=>{
    try{ await window.storage.set(PROGRESS_KEY, JSON.stringify(progress), false); }
    catch(e){ console.error('progress save failed', e); }
  }, 250);
}
function saveSettings(){
  touchSyncMeta();
  clearTimeout(settingsTimer);
  settingsTimer = setTimeout(async ()=>{
    try{ await window.storage.set(SETTINGS_KEY, JSON.stringify(settings), false); }
    catch(e){ console.error('settings save failed', e); }
  }, 250);
}

/* ---------- cloud sync (optional — see DATA_MODEL.md §7.1) ----------
   Local storage (above) is always the fast, offline-capable source of
   truth. Signing in additionally mirrors {content, progress, settings} to
   one Cosmos DB document per user via /api/sync, so the same library and
   progress can be picked up on another device. Whole-bundle last-write-wins:
   whichever side's `updatedAt` is newer replaces the other side entirely —
   simple and safe for "one person, a couple of devices," not a per-field
   merge. See api/src/functions/sync.js for the server half. */
function touchSyncMeta(){
  if(suppressSyncTouch) return;
  syncMeta.updatedAt = new Date().toISOString();
  window.storage.set(SYNC_META_KEY, JSON.stringify(syncMeta), false).catch(()=>{});
  scheduleCloudPush();
}
function scheduleCloudPush(){
  if(!account) return;
  clearTimeout(cloudPushTimer);
  cloudPushTimer = setTimeout(pushToCloud, 1500);
}
async function loadAccount(){
  try{
    const res = await fetch('/.auth/me');
    if(!res.ok) return null;
    const body = await res.json();
    return (body && body.clientPrincipal) || null;
  }catch(e){ return null; }
}
async function pushToCloud(){
  if(!account) return;
  syncStatus = 'syncing';
  refreshAccountBar();
  try{
    const res = await fetch('/api/sync', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({content, progress, settings, updatedAt: syncMeta.updatedAt})
    });
    syncStatus = res.ok ? 'synced' : 'error';
  }catch(e){
    console.error('cloud push failed', e);
    syncStatus = 'error';
  }
  refreshAccountBar();
}
async function pullAndMerge(){
  if(!account) return;
  syncStatus = 'syncing';
  refreshAccountBar();
  try{
    const res = await fetch('/api/sync');
    if(res.ok){
      const remote = await res.json();
      if(remote && remote.updatedAt){
        const remoteTime = Date.parse(remote.updatedAt) || 0;
        const localTime = syncMeta.updatedAt ? (Date.parse(syncMeta.updatedAt) || 0) : 0;
        if(remoteTime > localTime){
          suppressSyncTouch = true;
          content = Object.assign(emptyOverlay(), remote.content || {});
          progress = {};
          for(const [id, p] of Object.entries(remote.progress || {})) progress[id] = normalizeProgress(p);
          settings = Object.assign({challengeTypeId:'challenge_fill_blank', dailyGoal:10, soundEnabled:true}, remote.settings || {});
          if(!CHALLENGE_TYPES[settings.challengeTypeId]) settings.challengeTypeId = 'challenge_fill_blank';
          data = mergeContent(seed, content);
          saveContent(); saveProgress(); saveSettings();
          suppressSyncTouch = false;
          syncMeta.updatedAt = remote.updatedAt;
          window.storage.set(SYNC_META_KEY, JSON.stringify(syncMeta), false).catch(()=>{});
        } else if(localTime > remoteTime){
          await pushToCloud();
        }
      } else {
        // Nothing synced yet for this account — this device's copy becomes the first cloud copy.
        await pushToCloud();
      }
      syncStatus = 'synced';
    } else {
      syncStatus = 'error';
    }
  }catch(e){
    console.error('cloud pull failed', e);
    syncStatus = 'error';
  }
  render();
}
function refreshAccountBar(){
  const el = document.getElementById('account-bar');
  if(!el) return;
  el.outerHTML = renderAccountBar();
  bindEvents(document.getElementById('account-bar'));
}

/* ---------- local backup: export / import ----------
   Cloud sync (above) only covers signed-in users. This is the fallback for
   everyone else — and a manual safety net even when signed in, since
   localStorage on a single device is still one browser-clear away from
   gone. Same bundle shape as the cloud sync document, by design, so
   there's exactly one "what does a user's data look like" shape used in
   three places (localStorage keys, Cosmos, and export files). See
   DATA_MODEL.md §7.1 / CLAUDE.md known gaps. */
function exportBundle(){
  return {
    app: 'rooted',
    exportedAt: new Date().toISOString(),
    content, progress, settings
  };
}
function downloadExport(){
  const blob = new Blob([JSON.stringify(exportBundle(), null, 2)], {type: 'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `rooted-backup-${new Date().toISOString().slice(0,10)}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}
function validateImportBundle(obj){
  if(!obj || typeof obj !== 'object') return {ok:false, error:'That file isn\'t a Rooted backup.'};
  const out = {};
  if(obj.content !== undefined){
    if(typeof obj.content !== 'object' || obj.content === null) return {ok:false, error:'Backup file is corrupted (content).'};
    out.content = Object.assign(emptyOverlay(), obj.content);
  }
  if(obj.progress !== undefined){
    if(typeof obj.progress !== 'object' || obj.progress === null) return {ok:false, error:'Backup file is corrupted (progress).'};
    out.progress = obj.progress;
  }
  if(obj.settings !== undefined){
    if(typeof obj.settings !== 'object' || obj.settings === null) return {ok:false, error:'Backup file is corrupted (settings).'};
    out.settings = obj.settings;
  }
  if(!('content' in out) && !('progress' in out) && !('settings' in out)){
    return {ok:false, error:'That file doesn\'t contain any Rooted data.'};
  }
  return {ok:true, bundle:out};
}
async function importFromFile(file){
  let text;
  try{ text = await file.text(); }
  catch(e){ alert('Could not read that file.'); return; }
  let parsed;
  try{ parsed = JSON.parse(text); }
  catch(e){ alert('That file is not valid JSON.'); return; }
  const result = validateImportBundle(parsed);
  if(!result.ok){ alert(result.error); return; }
  if(!confirm('This replaces your current verses, progress, and settings on this device with the backup file. This can\'t be undone. Continue?')) return;

  const {bundle} = result;
  if('content' in bundle){ content = bundle.content; data = mergeContent(seed, content); }
  if('progress' in bundle){
    progress = {};
    for(const [id, p] of Object.entries(bundle.progress)) progress[id] = normalizeProgress(p);
  }
  if('settings' in bundle){
    settings = Object.assign({challengeTypeId:'challenge_fill_blank', dailyGoal:10, soundEnabled:true}, bundle.settings);
    if(!CHALLENGE_TYPES[settings.challengeTypeId]) settings.challengeTypeId = 'challenge_fill_blank';
  }
  saveContent(); saveProgress(); saveSettings();
  render();
  alert('Import complete.');
}

function emptyOverlay(){ return {verses:[], topics:[], characters:[]}; }

/* Link arrays where an empty overlay value must not blank out richer seed data. */
const LINK_FIELDS = ['topicIds', 'characterIds', 'verseIds', 'relatedTopicIds', 'storyIds', 'motifIds'];

/* seed + user overlay -> the in-memory content the app renders */
function mergeContent(seed, overlay){
  const mergeEntity = (base, over)=>{
    const out = {...base, ...over};
    // A verse added from the corpus is stored in the overlay with empty link
    // arrays. When a later starter pack gains that same id — with topics and
    // characters attached — those empty arrays must not win, or the user would
    // silently lose the seed's tags. Seed links fill in; real user links win.
    for(const key of LINK_FIELDS){
      if(Array.isArray(out[key]) && !out[key].length && Array.isArray(base[key]) && base[key].length){
        out[key] = base[key];
      }
    }
    return out;
  };
  const merge = (base, over)=>{
    const byId = new Map((base||[]).map(e=>[e.id, e]));
    for(const e of (over||[])) byId.set(e.id, mergeEntity(byId.get(e.id) || {}, e));
    return [...byId.values()].map(stripProgress);
  };
  return {
    schemaVersion: seed.schemaVersion || 2,
    verses:     merge(seed.verses,     overlay.verses),
    topics:     merge(seed.topics,     overlay.topics),
    characters: merge(seed.characters, overlay.characters)
  };
}
function stripProgress(entity){
  if(entity && 'progress' in entity){ const {progress, ...rest} = entity; return rest; }
  return entity;
}

/* ---------- practice progress ---------- */
function defaultProgress(){
  return {status:'new', timesReviewed:0, lastScore:null, lastPracticedAt:null, nextReview:null, history:[]};
}
function getProgress(verseId){ return progress[verseId] || defaultProgress(); }
function normalizeProgress(p){
  return {
    status: p.status || 'new',
    timesReviewed: p.timesReviewed || 0,
    lastScore: (p.lastScore === undefined ? null : p.lastScore),
    lastPracticedAt: p.lastPracticedAt || null,
    nextReview: p.nextReview || null,
    history: Array.isArray(p.history) ? p.history : []
  };
}
/* Brand-flavored display labels for VerseProgress.status (DATA_MODEL.md §7)
   — the stored value stays `new|learning|review|mastered` (the SRS ladder
   logic keys off it), this is presentation-only. */
const MASTERY_LABELS = {new:'Seedling', learning:'Sprouting', review:'Rooted', mastered:'Flourishing'};
function masteryLabel(status){ return MASTERY_LABELS[status] || status; }
/* Ordered mastery ladder, used by renderMasteryBar() below for the
   4-segment visual indicator on verse cards (replaces the old uppercase
   text tag). */
const MASTERY_STAGES = ['new','learning','review','mastered'];
function renderMasteryBar(status){
  const idx = MASTERY_STAGES.indexOf(status);
  const filled = idx < 0 ? 0 : idx + 1;
  const segs = MASTERY_STAGES.map((s,i)=> `<span class="mastery-seg${i<filled?' filled':''}"></span>`).join('');
  return `<div class="mastery-bar" title="${esc(masteryLabel(status))}">${segs}</div>`;
}

/* ---------- streaks (DATA_MODEL.md §7) ----------
   Derived entirely from VerseProgress.history[], already recorded by
   recordPractice() on every attempt — no new storage, just a new view
   over data that was already being collected. Days are calendar days in
   the viewer's *local* timezone (history timestamps are UTC ISO strings),
   since a streak that resets at UTC midnight rather than the user's own
   midnight would feel broken to them.
   practiceCountsByDay() also used to back a Home activity heatmap, removed
   2026-09-09 on feedback (didn't land well there) — the function stays
   since computeStreak() needs it, and it's the natural data source if a
   heatmap comes back on a future profile screen instead. */
function localDayKey(d){
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function practiceCountsByDay(){
  const counts = {};
  for(const p of Object.values(progress)){
    for(const h of (p.history || [])){
      const d = new Date(h.at);
      if(isNaN(d)) continue;
      const key = localDayKey(d);
      counts[key] = (counts[key] || 0) + 1;
    }
  }
  return counts;
}
function computeStreak(){
  const counts = practiceCountsByDay();
  const cursor = new Date();
  // A day that hasn't happened yet doesn't break the streak — only count
  // back from yesterday if today has no activity yet.
  if(!counts[localDayKey(cursor)]) cursor.setDate(cursor.getDate()-1);
  let streak = 0;
  while(counts[localDayKey(cursor)]){
    streak++;
    cursor.setDate(cursor.getDate()-1);
  }
  return streak;
}
function todaysPracticeCount(){
  return practiceCountsByDay()[localDayKey(new Date())] || 0;
}

/* ---------- sound & haptics (Web Audio API, synthesized — no audio
   files) ----------
   Gated by settings.soundEnabled (default true) — an app for quiet study
   time needs an easy mute, not just an on switch (Settings screen). One
   AudioContext, created lazily on first use: browsers require a user
   gesture before audio can start, and playSfx is only ever called from
   inside a click-handler chain, so that's always satisfied here. */
let audioCtx = null;
const SFX_NOTES = {
  tap:      [{f:520, t:0,   d:.05, g:.05}],
  correct:  [{f:660, t:0,   d:.09, g:.09}, {f:880, t:.07, d:.14, g:.08}],
  complete: [{f:523, t:0,   d:.11, g:.08}, {f:659, t:.09, d:.11, g:.08}, {f:784, t:.18, d:.22, g:.09}],
};
function playSfx(type){
  if(settings.soundEnabled === false) return;
  try{
    if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if(audioCtx.state === 'suspended') audioCtx.resume();
    (SFX_NOTES[type] || SFX_NOTES.tap).forEach(n=>{
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.value = n.f;
      const start = audioCtx.currentTime + n.t;
      gain.gain.setValueAtTime(0, start);
      gain.gain.linearRampToValueAtTime(n.g, start + .01);
      gain.gain.exponentialRampToValueAtTime(.0001, start + n.d);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(start);
      osc.stop(start + n.d + .02);
    });
  }catch(e){ /* Web Audio unsupported/blocked — sound is decorative, fail silently */ }
}
function hapticBuzz(pattern){
  if(settings.soundEnabled === false) return; // one toggle covers sound + haptics
  try{ if(navigator.vibrate) navigator.vibrate(pattern); }catch(e){ /* not supported (e.g. iOS Safari) — fine */ }
}

function isDue(v){
  const nr = getProgress(v.id).nextReview;
  if(!nr) return true;
  return new Date(nr) <= new Date();
}
/* Due verses, most-overdue first, then ones already in progress, then new.
   Finishing what you've started beats piling on more. */
function dueVerses(){
  return data.verses.filter(isDue).sort((a,b)=>{
    const pa = getProgress(a.id), pb = getProgress(b.id);
    if(pa.nextReview && pb.nextReview) return new Date(pa.nextReview) - new Date(pb.nextReview);
    if(pa.nextReview) return -1;
    if(pb.nextReview) return 1;
    return 0;
  });
}

/* class="app-icon" — see the shared CSS rule (display:inline-flex, no

function icon(name, size){

  return `<svg class="app-icon" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">${ICON_PATHS[name]||''}</svg>`;
}
function charIcon(roles){
  const r = (roles||[]).join(' ').toLowerCase();
  if(/king|crown/.test(r)) return 'ti-crown';
  if(/prophet/.test(r)) return 'ti-feather';
  if(/apostle|missionary/.test(r)) return 'ti-map-2';
  if(/shepherd|keeper of sheep|flock/.test(r)) return 'ti-mountain';
  if(/ark|builder/.test(r)) return 'ti-ship';
  if(/hunter|archer/.test(r)) return 'ti-bow';
  if(/dream/.test(r)) return 'ti-moon-stars';
  if(/governor|ruler|second in/.test(r)) return 'ti-building-castle';
  if(/garden|tiller|ground|farm/.test(r)) return 'ti-plant-2';
  if(/mother|matriarch|sister|wife/.test(r)) return 'ti-flower';
  if(/father|nations|tribes|firstborn|son/.test(r)) return 'ti-tent';
  if(/first man|first woman/.test(r)) return 'ti-seeding';
  if(/servant|unloved/.test(r)) return 'ti-jug';

}
/* Real portrait path for a character, or null if they don't have one yet

function charPortraitUrl(charId){

}
/* Small avatar content (list rows, Family rows, People-in-verse rows) —
   an <img> when a real portrait exists, the existing icon otherwise.

function charAvatarInner(c){

/* ---------- eras / stories / life events ---------- */
function findEra(id){ return lore.eras.find(e=>e.id===id); }
function findStory(id){ return lore.stories.find(s=>s.id===id); }
function eraName(id){ const e = findEra(id); return e ? e.name : ''; }
/* Events where this person is the subject — their own timeline. */
function characterTimeline(charId){
  return lore.lifeEvents
    .filter(e=>e.characterId===charId)
    .sort((a,b)=>(a.sequenceInLife||0)-(b.sequenceInLife||0));
}
/* Events they show up in but aren't the subject of. */
function appearsIn(charId){
  return lore.lifeEvents.filter(e=>e.characterId!==charId && (e.participantIds||[]).includes(charId));
}
function characterStories(charId){
  return lore.stories.filter(s=>(s.characterIds||[]).includes(charId));
}
/* Which curated characters belong to this book, in the order they first
   appear (by chapter:verse) — derived from existing curation, no new
   Character.book field, since one character routinely spans several books
   (Moses across Exodus-Deuteronomy, David across Samuel/Kings/Chronicles) —
   a field would force a false single-book choice.
   Two signals, not one: a verse's own characterIds catches most people, but
   15 real, fully-curated characters (Cain, Abel, Lot, Hagar, Rachel, Leah,
   Cornelius, and others) have zero verses individually tagged to them —
   their scene's verse ended up tagged to a co-star instead (Genesis 4:7 is
   in story_cain_and_abel's own verseIds but carries no characterIds at
   all). So also walk every Story's own verseIds for a book match and credit
   everyone in that Story's characterIds, not just whoever the verse itself
   named — otherwise a real character with a real Story silently never
   appears on their own book's list. */
function charactersInBook(bookName){
  const firstAppearance = {};
  const consider = (id, key) => {
    if(firstAppearance[id] === undefined || key < firstAppearance[id]) firstAppearance[id] = key;
  };
  data.verses.forEach(v=>{
    if(v.book !== bookName) return;
    const key = v.chapter*1000 + v.verse;
    (v.characterIds||[]).forEach(id=>consider(id, key));
  });
  lore.stories.forEach(s=>{
    const storyVersesInBook = (s.verseIds||[]).map(findVerse).filter(v=>v && v.book===bookName);
    if(!storyVersesInBook.length) return;
    const key = Math.min(...storyVersesInBook.map(v=>v.chapter*1000+v.verse));
    (s.characterIds||[]).forEach(id=>consider(id, key));
  });
  return Object.keys(firstAppearance)
    .map(findChar).filter(Boolean)
    .sort((a,b)=>firstAppearance[a.id]-firstAppearance[b.id]);
}

/* ---------- connections (DATA_MODEL.md §2) ----------
   Each edge is stored once, directed; the reverse view is derived here from
   `inverse` (a different label) or `symmetric` (the same label both ways) —
   curation never writes the same fact twice. */
function connectionsFor(type, id){
  const out = [];
  for(const c of connections){
    if(c.fromType===type && c.fromId===id){
      out.push({relationship:c.relationship, otherType:c.toType, otherId:c.toId});
    }else if(c.toType===type && c.toId===id){
      const rel = c.symmetric ? c.relationship : (c.inverse || c.relationship);
      out.push({relationship:rel, otherType:c.fromType, otherId:c.fromId});
    }
  }
  return out;
}
function characterRelationships(charId){
  return connectionsFor('character', charId)
    .filter(x=>x.otherType==='character')
    .map(x=>({type:x.relationship, who:findChar(x.otherId)}))
    .filter(x=>x.who);
}

/* ---------- family tree (DATA_MODEL.md item 110) ----------
   Built entirely from the existing Connection entity — no new data, no
   external source (Wikidata/Bible Project were considered and
   deliberately not used; this app's own hand-curated-from-Scripture
   relationships are the source of truth, same reasoning as rejecting
   the NIV PDF). Scoped to the CORE blood/marriage relationship types
   only (parent, child, spouse, sibling) — `characterRelationships()`
   also returns looser ones (uncle of, kinsman of, raised, servant of,
   mistress of, successor of, worked alongside) that don't have a clean
   generation delta relative to the root, and including them would need
   real multi-hop relationship inference this app's data doesn't
   reliably support yet. A generation naturally still picks up aunts/
   uncles/nephews/nieces/grandparents/grandchildren through the plain
   parent-child chain, without needing those looser types tagged at all.
   `maxGen` bounds how many steps up/down from the root are shown, since
   an ungapped BFS over the whole Connection graph would be unusable on
   a phone screen for well-connected figures. */
const FAMILY_CORE_TYPES = {
  'father of': 1, 'mother of': 1, 'adoptive mother of': 1, 'adoptive father of': 1,
  'son of': -1, 'daughter of': -1, 'adopted son of': -1, 'adopted daughter of': -1,
  'husband of': 0, 'wife of': 0,
  'brother of': 0, 'sister of': 0, 'half-brother of': 0, 'half-sister of': 0,
};
function familyGraph(rootId, maxGen){
  maxGen = maxGen || 2;
  const root = findChar(rootId);
  if(!root) return {nodes: [], edges: []};
  const nodes = new Map();           // id -> {char, gen}
  const edgeKeys = new Set();
  const edges = [];                  // {from, to, kind: 'parent-child'|'spouse'|'sibling'}
  nodes.set(rootId, {char: root, gen: 0});
  const queue = [{id: rootId, gen: 0}];
  while(queue.length){
    const {id, gen} = queue.shift();
    for(const rel of characterRelationships(id)){
      const delta = FAMILY_CORE_TYPES[rel.type];
      if(delta === undefined) continue;
      const otherGen = gen + delta;
      if(Math.abs(otherGen) > maxGen) continue;
      const kind = delta === 1 || delta === -1 ? 'parent-child' : (rel.type.includes('brother') || rel.type.includes('sister') ? 'sibling' : 'spouse');
      // Orient parent-child edges consistently (parent -> child) regardless
      // of which side of the pair this BFS step started from, so the
      // layout pass below can rely on edge direction meaning generation.
      const [a, b] = delta === 1 ? [id, rel.who.id] : (delta === -1 ? [rel.who.id, id] : [id, rel.who.id].sort());
      const key = kind + ':' + a + '>' + b;
      if(!edgeKeys.has(key)){
        edgeKeys.add(key);
        edges.push({from: a, to: b, kind});
      }
      if(!nodes.has(rel.who.id)){
        nodes.set(rel.who.id, {char: rel.who, gen: otherGen});
        queue.push({id: rel.who.id, gen: otherGen});
      }
    }
  }
  return {nodes: [...nodes.values()], edges};
}
/* Rigid generational grid layout (v2, 2026-09-16 overhaul) — strict
   Y-tiering by generation (Y = row * ROW_H) with X positions resolved
   so a child sits directly beneath its parent's center whenever that's
   geometrically possible, rather than a plain per-row insertion order.
   Still hand-written rather than pulling in a graph-layout library (no
   precedent for a third-party JS dependency anywhere in this app, and
   these graphs stay small — a few dozen nodes at most given ~84
   character-character connections project-wide).

   Per row, top to bottom:
     1. Nodes with an already-positioned parent (via a parent-child
        edge from the row above) get a desired X = the average X of
        their parent(s) — this is the literal "child directly beneath
        parent" case (an only child lands exactly on its parent's X).
     2. Nodes with no positioned parent above but a spouse already
        placed in the SAME row (a married-in figure with no blood tie
        upward in this graph) get a desired X = spouse's X + X_GAP, so
        couples still end up adjacent even without a shared parent to
        anchor them.
     3. Anything left over (the topmost row's own roots, or a genuinely
        unconnected node) falls back to appending after the row's
        current rightmost node.
     4. All desired X's are then sorted and walked once, pushing any
        node whose desired X collides with its left neighbor out to
        neighbor.x + X_GAP — this keeps the "directly beneath parent"
        placement exact whenever there's room, and only nudges siblings
        apart when multiple children/spouses would otherwise overlap. */
function layoutFamilyGraph(nodes, edges){
  const NODE_W = 150, NODE_H = 64, X_GAP = 170, ROW_H = 140;
  const byGen = new Map();
  for(const n of nodes){
    if(!byGen.has(n.gen)) byGen.set(n.gen, []);
    byGen.get(n.gen).push(n);
  }
  const gens = [...byGen.keys()].sort((a,b)=>a-b);
  const pos = new Map(); // id -> {x, y}
  const parentsOf = id => edges.filter(e => e.kind === 'parent-child' && e.to === id).map(e => e.from);
  const spouseOf = id => edges.filter(e => e.kind === 'spouse' && (e.from === id || e.to === id)).map(e => e.from === id ? e.to : e.from);

  for(const gen of gens){
    const row = byGen.get(gen);
    const desired = row.map(n => {
      const parentXs = parentsOf(n.char.id).map(pid => pos.get(pid)).filter(Boolean).map(p => p.x);
      if(parentXs.length) return {n, x: parentXs.reduce((s,v)=>s+v,0) / parentXs.length};
      const spouseX = spouseOf(n.char.id).map(sid => pos.get(sid)).filter(Boolean).map(p => p.x)[0];
      if(spouseX !== undefined) return {n, x: spouseX + X_GAP};
      return {n, x: null};
    });
    let rightmost = desired.filter(d => d.x !== null).reduce((m,d)=>Math.max(m,d.x), -Infinity);
    for(const d of desired){ if(d.x === null){ d.x = rightmost === -Infinity ? 0 : rightmost + X_GAP; rightmost = d.x; } }
    desired.sort((a,b) => a.x - b.x);
    let prevX = -Infinity;
    for(const d of desired){
      const x = prevX === -Infinity ? d.x : Math.max(d.x, prevX + X_GAP);
      pos.set(d.n.char.id, {x, y: (gen - gens[0]) * ROW_H});
      prevX = x;
    }
  }
  const minX = Math.min(0, ...[...pos.values()].map(p=>p.x));
  if(minX < 0) for(const p of pos.values()) p.x -= minX; // keep everything on-canvas (>= 0)
  const maxX = Math.max(0, ...[...pos.values()].map(p=>p.x)) + NODE_W;
  const maxY = Math.max(0, ...[...pos.values()].map(p=>p.y)) + NODE_H;
  return {pos, width: maxX, height: maxY, NODE_W, NODE_H};
}
/* The Bezier "elbow" connector between a parent's bottom-center and a
   child's top-center — drops straight down from the parent, curves
   through the gap, and arrives straight into the child, per spec. Only
   parent-child edges use this exact shape (it's only meaningful
   vertically); spouse/sibling edges are same-row and stay a plain
   line between facing edges — see renderFamilyTree(). */
function familyTreeBezier(parent, child, NODE_W, NODE_H){
  const sx = parent.x + NODE_W/2, sy = parent.y + NODE_H;
  const ex = child.x + NODE_W/2, ey = child.y;
  const midY = sy + (ey - sy) * 0.5;
  return `M ${sx} ${sy} C ${sx} ${midY}, ${ex} ${midY}, ${ex} ${ey}`;
}

/* ---------- motifs (DATA_MODEL.md §2) ----------
   A Motif carries no links of its own; every instance is a Connection
   (motif -> story|character|verse, "instance of"), so these fall straight
   out of connectionsFor() like everything else here. */
function findMotif(id){ return motifs.find(m=>m.id===id); }
function motifInstances(motifId){
  return connectionsFor('motif', motifId)
    .map(x=>({entityType:x.otherType, entity: findByType(x.otherType, x.otherId)}))
    .filter(x=>x.entity);
}
function motifsFor(type, id){
  return connectionsFor(type, id)
    .filter(x=>x.otherType==='motif')
    .map(x=>findMotif(x.otherId))
    .filter(Boolean);
}
function findByType(type, id){
  if(type==='story') return findStory(id);
  if(type==='character') return findChar(id);
  if(type==='verse') return findVerse(id);
  if(type==='topic') return findTopic(id);
  if(type==='era') return findEra(id);
  return null;
}
/* Story<->story links other than motif co-membership — "parallels",
   "foreshadows", etc. */
function relatedStories(storyId){
  return connectionsFor('story', storyId)
    .filter(x=>x.otherType==='story')
    .map(x=>({type:x.relationship, story:findStory(x.otherId)}))
    .filter(x=>x.story);
}
/* Who this person actually shares a scene with — real co-occurrence, not a
   guess from a broad era label. */
function sharesScenesWith(charId){
  const ids = new Set();
  for(const e of lore.lifeEvents){
    const people = e.participantIds || [];
    if(people.includes(charId)) people.forEach(p=>{ if(p!==charId) ids.add(p); });
  }
  for(const s of lore.stories){
    const people = s.characterIds || [];
    if(people.includes(charId)) people.forEach(p=>{ if(p!==charId) ids.add(p); });
  }
  return [...ids].map(findChar).filter(Boolean);
}

/* ---------- spaced repetition (simple) ---------- */
function recordPractice(verseId, correct, challengeTypeId){
  const p = progress[verseId] || defaultProgress();
  const now = new Date().toISOString();
  p.timesReviewed += 1;
  p.lastScore = correct;
  p.lastPracticedAt = now;
  let nextDays;
  if(!correct){ p.status='learning'; nextDays=1; }
  else if(p.status==='new'){ p.status='learning'; nextDays=3; }
  else if(p.status==='learning'){ p.status='review'; nextDays=7; }
  else if(p.status==='review'){ p.status='mastered'; nextDays=14; }
  else { nextDays=21; }
  const d = new Date(); d.setDate(d.getDate()+nextDays);
  p.nextReview = d.toISOString();
  p.history.push({at:now, challengeTypeId: challengeTypeId || null, score: correct ? 1 : 0});
  progress[verseId] = p;
  saveProgress();
}

  else if(view.screen==='study') app.innerHTML = renderStudy();

function scrollKey(v){ const k = v.params && (v.params.id || v.params.book); return v.screen + (k ? ':' + k : ''); }
function go(screen, params={}){
  scrollPositions[scrollKey(view)] = window.scrollY;
  view = {screen, params};
  render();
  window.scrollTo(0, scrollPositions[scrollKey(view)] || 0);
}

/* ---------- HOME ----------
   v6 (DATA_MODEL.md §8, item 82) — a greeting + streak header, a
   media-heavy Verse of the Day hero, then a stack of compact "discovery"
   cards (Unreached of the Day, Story of the Day), then a single practice
   link. Memorization itself still lives on its own Practice tab (item
   78) — this is the editorial front door, just redesigned per a
   hand-specified layout after the item 81 version didn't land well. */
function greeting(){
  const h = new Date().getHours();
  if(h < 5) return 'Good night';
  if(h < 12) return 'Good morning';
  if(h < 17) return 'Good afternoon';
  if(h < 21) return 'Good evening';
  return 'Good night';
}
/* A small inline-SVG placeholder, hue-seeded from an id so different
   verses/stories/people get a visually distinct (but still on-brand)
   placeholder instead of one repeated image — stands in for real photos/
   illustrations until those exist, with zero external image dependency.
   Same hash shape as topicColor() elsewhere in this file. */
function placeholderArt(seed, hueBase){
  let h = 0;
  for(let i=0;i<seed.length;i++) h = (h*31 + seed.charCodeAt(i)) >>> 0;
  const hue = hueBase != null ? hueBase : h % 360;
  const hue2 = (hue + 28) % 360;
  // Double-quoted SVG attributes deliberately, not single — encodeURIComponent
  // does NOT escape "'", so a single-quoted SVG would leak literal quote
  // characters into the data URI and break any single-quoted JS string it's
  // later embedded in (e.g. an inline onerror handler).
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300">`
    + `<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1">`
    + `<stop offset="0%" stop-color="hsl(${hue},65%,24%)"/>`
    + `<stop offset="100%" stop-color="hsl(${hue2},55%,11%)"/></linearGradient></defs>`
    + `<rect width="400" height="300" fill="url(#g)"/>`
    + `<circle cx="320" cy="55" r="40" fill="hsl(${hue},80%,62%)" opacity=".5"/>`
    + `<path d="M0 235 L85 150 L155 205 L230 115 L320 215 L400 165 L400 300 L0 300 Z" fill="hsl(${hue2},40%,8%)" opacity=".85"/>`
    + `</svg>`;
  return 'data:image/svg+xml,' + encodeURIComponent(svg);
}
function renderHomeHeader(){
  const streak = computeStreak();
  return `
    <div class="home-greet-row">
      <div>
        <div class="home-greet">${greeting()}</div>
        <div class="home-greet-sub">Let's spend some time in the Word today.</div>
      </div>
      <div style="display:flex;align-items:center;gap:8px;">
        ${streak > 0 ? `<div class="streak-badge">${icon('flame',16)} ${streak} day${streak===1?'':'s'}</div>` : ''}
        <button class="back-btn home-settings-btn" data-action="go-settings"><i class="ti ti-settings"></i></button>
      </div>
    </div>`;
}
function renderHome(){
  loadVotdRemote(); loadVotdImage(); // fire-and-forget; no-op once status leaves 'idle'
  loadUnreachedOfDay();
  return `
    ${renderHomeHeader()}
    ${renderVerseOfTheDayCard()}
    ${renderWordOfTheDayCard()}
    ${renderChurchHistoryCard()}
    ${renderUnreachedCard()}
    ${renderStoryOfTheDayCard()}
    ${renderPracticeNudge()}
  `;
}
/* One verse a day, stable for the whole day and the same for every device
   (no per-user randomness/state) — a simple date-seeded index into the
   user's own library, not the full corpus, so it's always something
   they've actually added or the starter pack shipped. Used as a fallback
   when the YouVersion-backed remote pick (below) isn't available. */
function verseOfTheDay(){
  if(!data.verses.length) return null;
  const d = new Date();
  const dayKey = d.getFullYear()*372 + d.getMonth()*31 + d.getDate();
  return data.verses[dayKey % data.verses.length];
}
/* Verse of the Day, sourced from YouVersion's Platform API when configured
   (item 81) — proxied through api/verse-of-the-day (see that file for the
   full reasoning: server-side app key, unconfirmed CORS). Falls back to
   the local date-seeded pick above when not configured or on any error —
   this is optional editorial content, never worth a broken-looking card. */
let votdRemote = { status: 'idle', data: null };
async function loadVotdRemote(){
  if(votdRemote.status !== 'idle') return;
  votdRemote = { status: 'loading', data: null };
  try{
    const res = await fetch('/api/verse-of-the-day');
    if(res.status === 501){ votdRemote = { status: 'unconfigured', data: null }; return; }
    if(!res.ok) throw new Error('HTTP ' + res.status);
    votdRemote = { status: 'ready', data: await res.json() };
  }catch(e){
    console.error('verse-of-the-day failed', e);
    votdRemote = { status: 'error', data: null };
  }
  if(view.screen === 'home') render();
}
/* Background photo for the Verse of the Day card, sourced separately from
   Unsplash (owner's explicit choice — YouVersion's own API has no images)
   via api/verse-image, date-seeded from a fixed pool of nature keywords
   (not topic-derived — see that file's comment for why). Unsplash's API
   Terms require on-photo attribution to both Unsplash and the
   photographer, linked to their profile — rendered below, not optional. */
let votdImage = { status: 'idle', data: null };
async function loadVotdImage(){
  if(votdImage.status !== 'idle') return;
  votdImage = { status: 'loading', data: null };

/* ---------- BROWSE (full corpus) ---------- */
async function loadCorpus(){
  if(corpusStatus === 'loading' || corpusStatus === 'ready') return;
  corpusStatus = 'loading';
  render();
  try{
    const res = await fetch('./data/verses.json');
    if(!res.ok) throw new Error('HTTP ' + res.status);
    corpus = await res.json();
    corpusIndex = buildCorpusIndex(corpus);
    corpusStatus = 'ready';
  }catch(e){
    console.error('corpus load failed', e);
    corpusStatus = 'error';
  }
  render();
}
function buildCorpusIndex(verses){
  const books = new Map();
  for(const v of verses){
    if(!books.has(v.book)) books.set(v.book, {book:v.book, count:0, chapterMap:new Map()});
    const b = books.get(v.book);
    b.count++;
    b.chapterMap.set(v.chapter, (b.chapterMap.get(v.chapter) || 0) + 1);
  }
  return [...books.values()].map(b => ({
    book: b.book,
    count: b.count,
    chapters: [...b.chapterMap.entries()].sort((a,c)=>a[0]-c[0]).map(([n,count])=>({n, count}))
  }));
}
function searchCorpus(query){
  const needle = query.trim().toLowerCase();
  const hits = [];
  let total = 0;
  for(const v of corpus){
    if(v.text.toLowerCase().includes(needle) || v.reference.toLowerCase().includes(needle)){
      total++;
      if(hits.length < SEARCH_LIMIT) hits.push(v);
    }
  }
  return {hits, total};
}
