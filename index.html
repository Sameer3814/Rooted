  .sp-complete-sub{font:700 16px/1.45 Figtree;color:var(--sp-sub);margin-top:6px;max-width:300px;text-align:center;}
  .sp-stat-grid{width:100%;display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:28px;}
  .sp-stat-card{border-radius:16px;padding:2px;}
  .sp-stat-label{padding:5px 4px 6px;text-align:center;font:900 11px Figtree;letter-spacing:.06em;}
  .sp-stat-value{background:var(--sp-surface);border-radius:14px;padding:14px 4px;display:flex;align-items:center;justify-content:center;gap:5px;font:400 22px 'Young Serif';}
  .sp-complete-cta{width:100%;height:54px;border:0;border-radius:16px;background:var(--sp-cta);color:var(--sp-ctaink);box-shadow:0 5px 0 var(--sp-ctad);font:900 16px Figtree;letter-spacing:.05em;cursor:pointer;margin-top:auto;}
  .sp-complete-cta:active{transform:translateY(4px);}
  /* Confetti burst (Phase 3, item 163) — real color, a scoped Shepherd-
     only exception same as the rest of this screen's palette; not the
     app's own white/gold .spark burst (renderSparks(), the generic
     session-complete card's confetti), which stays monochrome under
     the standing black-and-white rule. */
  .sp-confetti{position:absolute;left:50%;top:50%;width:0;height:0;pointer-events:none;}
  .sp-confetti-piece{position:absolute;left:0;top:0;animation:spBurst ease-out both;}
  @keyframes spBurst{
    0%{opacity:1;transform:translate(0,0) scale(.4);}
    12%{opacity:1;}
    100%{opacity:0;transform:translate(var(--dx),calc(var(--dy) + 80px)) rotate(var(--rot));}
  }
  .sp-streak-flame{margin-top:10px;}
  .sp-streak-num{font:400 72px/1 'Young Serif';color:#f08a00;margin-top:8px;}
  .sp-streak-label{font:400 26px 'Young Serif';color:#f08a00;margin-top:2px;}
  .sp-streak-card{width:100%;margin-top:26px;padding:16px;box-sizing:border-box;border-radius:18px;border:2px solid var(--sp-line);}
  .sp-week-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
  .sp-week-day{display:flex;flex-direction:column;align-items:center;gap:8px;}
  .sp-week-day .sp-day-label{font:900 12px Figtree;color:var(--sp-sub);}
  .sp-week-day.sp-today .sp-day-label{color:#f08a00;}
  .sp-week-day .sp-day-dot{width:32px;height:32px;border-radius:50%;background:#ff9600;display:grid;place-items:center;color:#fff;}
  .sp-streak-footer{margin-top:14px;padding-top:12px;border-top:2px solid var(--sp-line);font:700 14.5px/1.45 Figtree;color:var(--sp-sub);text-align:center;}

  /* ---------- Shepherd's Path: in-progress session chrome (Phase 2,
     item 161) — restyles the surrounding header/mascot/feedback-sheet
     chrome around each exercise; the exercise's own markup
     (renderChallengeBody(), unchanged) still renders in the app's usual
     dark palette regardless of this screen's own light/dark toggle — a
     deliberate, flagged seam, not an oversight (see DATA_MODEL.md §8,
     item 161). ---------- */
  .sp-session-screen{padding-top:18px;box-sizing:border-box;}
  /* Every direct child painted alongside the backdrop needs an explicit
     position+z-index — a plain static in-flow box paints BEFORE a
     position:absolute sibling with z-index:auto in CSS's stacking
     order regardless of DOM order (CSS2.1 §E.2, category 3 vs 6), so
     without this the backdrop silently painted over the header/body/
     footer content despite coming first in the HTML (verified with a
     real headless-browser screenshot, not just reading the code — see
     DATA_MODEL.md §8, item 167). The Path screen's own .shepherd-
     topbar/.shepherd-scroll already had this; the session screen
     never did. */
  .sp-session-header{position:relative;z-index:2;flex:none;display:flex;align-items:center;gap:14px;padding:0 18px;}
  .sp-session-close{width:32px;height:32px;flex:none;border:0;background:none;color:var(--sp-lockic);display:grid;place-items:center;cursor:pointer;padding:0;}
  .sp-session-progress-track{flex:1;height:16px;border-radius:8px;background:var(--sp-line);overflow:hidden;}
  .sp-session-progress-fill{height:100%;border-radius:8px;background:var(--sp-cta);transition:width .5s cubic-bezier(.3,1.4,.5,1);}
  .sp-session-hearts{flex:none;display:flex;align-items:center;gap:5px;font:900 16px Figtree;color:#f0474d;}
  .sp-session-combo-row{position:relative;z-index:2;flex:none;height:24px;padding:6px 18px 0;box-sizing:border-box;}
  .sp-combo-line{display:inline-flex;align-items:center;gap:4px;font:900 12.5px Figtree;letter-spacing:.06em;color:#f08a00;animation:spPop .3s both;}
  /* The only internally-scrolling part of the session screen (item
     165) — header/combo-row above and the Check/controls footer below
     both stay flex:none, always visible, same reasoning as the Path
     screen's topbar. */
  .sp-session-body{position:relative;z-index:2;flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;padding:4px 18px 16px;}
  .sp-new-tag{display:inline-flex;align-items:center;gap:6px;margin-bottom:8px;font:900 12.5px Figtree;letter-spacing:.06em;color:var(--sp-acc);}
  /* max-width keeps a 2-line heading (e.g. "Type the first letter of
     each word") from running under the sun/moon in the backdrop's
     top-right corner — caught visually with a real screenshot, item
     168. */
  .sp-session-heading{font:400 25px/1.15 'Young Serif';color:var(--sp-ink);max-width:calc(100% - 56px);}
  .sp-session-mascot-row{display:flex;align-items:flex-end;gap:10px;margin:16px 0 20px;}
  .sp-session-mascot{flex:none;width:72px;height:72px;}
  .sp-session-bubble{position:relative;flex:1;padding:12px 14px;border-radius:18px;border:2px solid var(--sp-line);background:var(--sp-surface);}
  .sp-bubble-tail{position:absolute;left:-8px;bottom:18px;width:12px;height:12px;background:var(--sp-surface);border-left:2px solid var(--sp-line);border-bottom:2px solid var(--sp-line);transform:rotate(45deg);}
  .sp-bubble-serif{font:400 18px/1.45 Newsreader,Georgia,serif;color:var(--sp-ink);}
  .sp-bubble-plain{font:800 16px/1.35 Figtree;color:var(--sp-ink);}
  /* Bottom padding clears the floating pill nav (.navbar is
     position:fixed;bottom:calc(24px + safe-area);height:68px, so it
     occupies roughly the screen's own bottom ~100px regardless of
     this screen's own layout) — without it the Check/controls buttons
     render right behind the nav (verified with a real screenshot, item
     167). */
  .sp-session-footer{position:relative;z-index:2;flex:none;padding:12px 18px calc(110px + env(safe-area-inset-bottom));}
  /* z-index must clear the floating pill nav (.navbar, z-index:1000) —
     at the old z-index:30 the nav sat on top of this sheet and hid its
     own CONTINUE/GOT IT button entirely (owner screenshot, 2026-11-09).
     Extra bottom padding also clears env(safe-area-inset-bottom), same
     as .navbar's own handling, now that this sheet fully covers it. */
  .sp-feedback-sheet{position:fixed;left:0;right:0;bottom:0;z-index:1001;padding:20px 20px calc(32px + env(safe-area-inset-bottom));animation:spSheetUp .28s cubic-bezier(.2,.8,.2,1) both;}
  @keyframes spSheetUp{from{transform:translateY(100%);}to{transform:translateY(0);}}
  .sp-feedback-sheet.sp-good{background:#dcf3d3;}
  .sp-feedback-sheet.sp-bad{background:#ffe0d9;}
  .sp-feedback-row{display:flex;align-items:center;gap:12px;}
  .sp-feedback-icon{width:44px;height:44px;flex:none;border-radius:50%;display:grid;place-items:center;background:#fff;animation:spPop .35s .08s both;}
  .sp-feedback-sheet.sp-good .sp-feedback-icon{color:#2f7a22;}
  .sp-feedback-sheet.sp-bad .sp-feedback-icon{color:#b8331f;}
  .sp-feedback-title{font:400 23px 'Young Serif';}
  .sp-feedback-sheet.sp-good .sp-feedback-title{color:#2f7a22;}
  .sp-feedback-sheet.sp-bad .sp-feedback-title{color:#b8331f;}
  .sp-feedback-sub{margin-top:8px;font:800 14.5px Figtree;}
  .sp-feedback-sheet.sp-good .sp-feedback-sub{color:#2f7a22;}
  .sp-feedback-sheet.sp-bad .sp-feedback-sub{color:#b8331f;}
  .sp-feedback-btn{margin-top:16px;width:100%;height:54px;border:0;border-radius:16px;font:900 16px Figtree;letter-spacing:.05em;cursor:pointer;}
  .sp-feedback-sheet.sp-good .sp-feedback-btn{background:#58c043;color:#14300d;box-shadow:0 5px 0 #43a033;}
  .sp-feedback-sheet.sp-bad .sp-feedback-btn{background:#ff5a5f;color:#fff;box-shadow:0 5px 0 #d93d42;}
  .sp-feedback-btn:active{transform:translateY(4px);}
  /* Theme every ChallengeType's own exercise markup when it renders
     inside a Shepherd session — none of their own unscoped rules above
     are touched (the legacy, non-Shepherd session screen still looks
     exactly as it did), these are pure additions at `.sp-session-screen
     <selector>` so they only apply here. Fixes the "exercise still
     looks like the old dark app" gap flagged (and deliberately
     deferred) in item 161 — now actually closed, per direct owner
     feedback (2026-11-09) rather than left as a seam. Correct/wrong
     green/red (#10B981/#EF4444) are left exactly as-is everywhere —
     the app's own sanctioned functional colors, not part of this
     theming pass. */
  .sp-session-screen .ref{color:var(--sp-acc) !important;}
  .sp-session-screen .target-sentence-box,
  .sp-session-screen .sprint-text-box,
  .sp-session-screen .vanish-text-box,
  .sp-session-screen .match-prompt-card{
    background:var(--sp-surface) !important;border-color:var(--sp-line) !important;color:var(--sp-ink) !important;
  }
  .sp-session-screen .tap-slot{border-bottom-color:var(--sp-ink);color:var(--sp-ink);}
  .sp-session-screen .tap-slot.tap-slot-filled{color:var(--sp-ink);}
  .sp-session-screen .word-bank-grid .tap-tile,
  .sp-session-screen .match-option-card{
    background:var(--sp-soft) !important;border-color:var(--sp-line) !important;color:var(--sp-ink) !important;
  }
  .sp-session-screen .tap-tile:active{background:var(--sp-line) !important;}
  .sp-session-screen .practice-hint{color:var(--sp-sub);}
  .sp-session-screen .sprint-word.sprint-done{color:var(--sp-ink);}
  .sp-session-screen .sprint-word.sprint-active{color:var(--sp-ink);border-bottom-color:var(--sp-ink);}
  .sp-session-screen .sprint-word.sprint-future{color:var(--sp-sub);}
  .sp-session-screen .sprint-toast{background:var(--sp-tint);border-color:var(--sp-acc);color:var(--sp-ink);}
  .sp-session-screen .vanish-blank{border-bottom-color:var(--sp-ink);}
  .sp-session-screen .vanish-text-box.peek-all .vanish-blank{color:var(--sp-ink) !important;}

<script>
/* ---------- local-dev storage fallback ----------
   The app persists through window.storage, provided by the Claude runtime.
   When the page is opened from a plain web server / browser that API is
   absent, so fall back to localStorage with the same shape (same origin,
   survives reload, per-browser). Inert inside the Claude runtime. */
if(!window.storage){
  console.info('Rooted: window.storage not found — using localStorage (local dev).');
  window.storage = {
    async get(key){
      try{ const v = localStorage.getItem(key); return v === null ? null : {value:v}; }
      catch(e){ return null; }
    },
    async set(key, value){
      try{ localStorage.setItem(key, value); }
      catch(e){ console.warn('Rooted: localStorage set failed', e); }
    }
  };
}

/* ---------- storage ----------
   Content (verses/topics/characters) and user state (practice progress) are
   stored under separate keys so resetting progress can never destroy content.
   See DATA_MODEL.md §5, §7.
   - rooted-content  : user overlay { verses, topics, characters } merged
                       over the seed by id at load. Seed is source of truth
                       for seed ids; the overlay adds new ids and patches
                       existing ones.
   - rooted-progress : map of verseId -> VerseProgress
   - rooted-sync-meta: { updatedAt } — stamped on every local edit, compared
                       against the cloud copy's updatedAt to decide which
                       side wins on sync (whole-bundle last-write-wins, not
                       per-field — see pullAndMerge() below and
                       DATA_MODEL.md §7.1).
*/
const CONTENT_KEY   = 'rooted-content';
const PROGRESS_KEY  = 'rooted-progress';
const SETTINGS_KEY  = 'rooted-settings';   // per-user preferences (DATA_MODEL.md §7)
const SYNC_META_KEY = 'rooted-sync-meta';  // {updatedAt} for cloud sync (DATA_MODEL.md §7.1)
const LEGACY_KEY    = 'rooted-app-data';   // pre-split single blob; migrated once

let contentTimer = null, progressTimer = null, settingsTimer = null;
let syncMeta = {updatedAt: null};    // local edit clock; compared against the cloud copy
let account = null;                  // {userId, userDetails, identityProvider, userRoles} | null — from /.auth/me
let syncStatus = 'idle';             // 'idle' | 'syncing' | 'synced' | 'error' — for the account bar
let cloudPushTimer = null;
let suppressSyncTouch = false;       // true while pullAndMerge() is writing an *adopted* remote state locally, so that adoption doesn't get mistaken for a fresh local edit and immediately pushed back up
function saveContent(){
  touchSyncMeta();
  clearTimeout(contentTimer);
  contentTimer = setTimeout(async ()=>{
    try{ await window.storage.set(CONTENT_KEY, JSON.stringify(content), false); }
    catch(e){ console.error('content save failed', e); }
  }, 250);
}
function saveProgress(){
  touchSyncMeta();
  clearTimeout(progressTimer);
  progressTimer = setTimeout(async ()=>{
    try{ await window.storage.set(PROGRESS_KEY, JSON.stringify(progress), false); }
    catch(e){ console.error('progress save failed', e); }
  }, 250);
}
function saveSettings(){
  touchSyncMeta();
  clearTimeout(settingsTimer);
  settingsTimer = setTimeout(async ()=>{
    try{ await window.storage.set(SETTINGS_KEY, JSON.stringify(settings), false); }
    catch(e){ console.error('settings save failed', e); }
  }, 250);
}

/* ---------- cloud sync (optional — see DATA_MODEL.md §7.1) ----------
   Local storage (above) is always the fast, offline-capable source of
   truth. Signing in additionally mirrors {content, progress, settings} to
   one Cosmos DB document per user via /api/sync, so the same library and
   progress can be picked up on another device. Whole-bundle last-write-wins:
   whichever side's `updatedAt` is newer replaces the other side entirely —
   simple and safe for "one person, a couple of devices," not a per-field
   merge. See api/src/functions/sync.js for the server half. */
function touchSyncMeta(){
  if(suppressSyncTouch) return;
  syncMeta.updatedAt = new Date().toISOString();
  window.storage.set(SYNC_META_KEY, JSON.stringify(syncMeta), false).catch(()=>{});
  scheduleCloudPush();
}
function scheduleCloudPush(){
  if(!account) return;
  clearTimeout(cloudPushTimer);
  cloudPushTimer = setTimeout(pushToCloud, 1500);
}
async function loadAccount(){
  try{
    const res = await fetch('/.auth/me');
    if(!res.ok) return null;
    const body = await res.json();
    return (body && body.clientPrincipal) || null;
  }catch(e){ return null; }
}
async function pushToCloud(){
  if(!account) return;
  syncStatus = 'syncing';
  refreshAccountBar();
  try{
    const res = await fetch('/api/sync', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({content, progress, settings, updatedAt: syncMeta.updatedAt})
    });
    syncStatus = res.ok ? 'synced' : 'error';
  }catch(e){
    console.error('cloud push failed', e);
    syncStatus = 'error';
  }
  refreshAccountBar();
}
async function pullAndMerge(){
  if(!account) return;
  syncStatus = 'syncing';
  refreshAccountBar();
  try{
    const res = await fetch('/api/sync');
    if(res.ok){
      const remote = await res.json();
      if(remote && remote.updatedAt){
        const remoteTime = Date.parse(remote.updatedAt) || 0;
        const localTime = syncMeta.updatedAt ? (Date.parse(syncMeta.updatedAt) || 0) : 0;
        if(remoteTime > localTime){
          suppressSyncTouch = true;
          content = Object.assign(emptyOverlay(), remote.content || {});
          progress = {};
          for(const [id, p] of Object.entries(remote.progress || {})) progress[id] = normalizeProgress(p);
          settings = Object.assign({challengeTypeId:'challenge_tap_builder', dailyGoal:10, soundEnabled:true, language:'en', hearts:5, gems:0, xp:0, chestsOpened:[], practiceTheme:'dark', lastStreakScreenDate:null, heartsResetDate:null}, remote.settings || {});
          if(!CHALLENGE_TYPES[settings.challengeTypeId] && settings.challengeTypeId !== MIX_MATCH_ID) settings.challengeTypeId = 'challenge_tap_builder';
          data = mergeContent(seed, content);
          if(!content.libraryVerseIds) content.libraryVerseIds = data.verses.map(v=>v.id);
          saveContent(); saveProgress(); saveSettings();
          suppressSyncTouch = false;
          syncMeta.updatedAt = remote.updatedAt;
          window.storage.set(SYNC_META_KEY, JSON.stringify(syncMeta), false).catch(()=>{});
        } else if(localTime > remoteTime){
          await pushToCloud();
        }
      } else {
        // Nothing synced yet for this account — this device's copy becomes the first cloud copy.
        await pushToCloud();
      }
      syncStatus = 'synced';
    } else {
      syncStatus = 'error';
    }
  }catch(e){
    console.error('cloud pull failed', e);
    syncStatus = 'error';
  }
  render();
}
function refreshAccountBar(){
  const el = document.getElementById('account-bar');
  if(!el) return;
  el.outerHTML = renderAccountBar();
  bindEvents(document.getElementById('account-bar'));
}

/* ---------- local backup: export / import ----------
   Cloud sync (above) only covers signed-in users. This is the fallback for
   everyone else — and a manual safety net even when signed in, since
   localStorage on a single device is still one browser-clear away from
   gone. Same bundle shape as the cloud sync document, by design, so
   there's exactly one "what does a user's data look like" shape used in
   three places (localStorage keys, Cosmos, and export files). See
   DATA_MODEL.md §7.1 / CLAUDE.md known gaps. */
function exportBundle(){
  return {
    app: 'rooted',
    exportedAt: new Date().toISOString(),
    content, progress, settings
  };
}
function downloadExport(){
  const blob = new Blob([JSON.stringify(exportBundle(), null, 2)], {type: 'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `rooted-backup-${new Date().toISOString().slice(0,10)}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}
function validateImportBundle(obj){
  if(!obj || typeof obj !== 'object') return {ok:false, error:'That file isn\'t a Rooted backup.'};
  const out = {};
  if(obj.content !== undefined){
    if(typeof obj.content !== 'object' || obj.content === null) return {ok:false, error:'Backup file is corrupted (content).'};
    out.content = Object.assign(emptyOverlay(), obj.content);
  }
  if(obj.progress !== undefined){
    if(typeof obj.progress !== 'object' || obj.progress === null) return {ok:false, error:'Backup file is corrupted (progress).'};
    out.progress = obj.progress;
  }
  if(obj.settings !== undefined){
    if(typeof obj.settings !== 'object' || obj.settings === null) return {ok:false, error:'Backup file is corrupted (settings).'};
    out.settings = obj.settings;
  }
  if(!('content' in out) && !('progress' in out) && !('settings' in out)){
    return {ok:false, error:'That file doesn\'t contain any Rooted data.'};
  }
  return {ok:true, bundle:out};
}
async function importFromFile(file){
  let text;
  try{ text = await file.text(); }
  catch(e){ alert('Could not read that file.'); return; }
  let parsed;
  try{ parsed = JSON.parse(text); }
  catch(e){ alert('That file is not valid JSON.'); return; }
  const result = validateImportBundle(parsed);
  if(!result.ok){ alert(result.error); return; }
  if(!confirm('This replaces your current verses, progress, and settings on this device with the backup file. This can\'t be undone. Continue?')) return;

  const {bundle} = result;
  if('content' in bundle){
    content = bundle.content;
    data = mergeContent(seed, content);
    if(!content.libraryVerseIds) content.libraryVerseIds = data.verses.map(v=>v.id);
  }
  if('progress' in bundle){
    progress = {};
    for(const [id, p] of Object.entries(bundle.progress)) progress[id] = normalizeProgress(p);
  }
  if('settings' in bundle){
    settings = Object.assign({challengeTypeId:'challenge_tap_builder', dailyGoal:10, soundEnabled:true, language:'en', hearts:5, gems:0, xp:0, chestsOpened:[], practiceTheme:'dark', lastStreakScreenDate:null, heartsResetDate:null}, bundle.settings);
    if(!CHALLENGE_TYPES[settings.challengeTypeId] && settings.challengeTypeId !== MIX_MATCH_ID) settings.challengeTypeId = 'challenge_tap_builder';
  }
  saveContent(); saveProgress(); saveSettings();
  render();
  alert('Import complete.');
}
async function loadStored(key){
  try{
    const res = await window.storage.get(key, false);
    if(res && res.value) return JSON.parse(res.value);
  }catch(e){ /* not present / no storage API */ }
  return null;
}
async function loadSeed(){
  try{
    const res = await fetch('./data/starter-pack.json');
    if(res.ok) return await res.json();
  }catch(e){ /* fall back to built-in seed */ }
  return seedData();
}
/* Eras, stories, life events and connections. Seed-only for now (nothing here
   is user editable), so they stay outside the content overlay. Small enough to
   load at boot, unlike the corpus. */
async function loadStories(){
  try{
    const res = await fetch('./data/stories.json');
    if(res.ok) return await res.json();
  }catch(e){ /* the app works without them; timeline sections just don't render */ }
  return {eras:[], stories:[], lifeEvents:[]};
}
async function loadConnections(){
  try{
    const res = await fetch('./data/connections.json');
    if(res.ok) return await res.json();
  }catch(e){ /* Family sections just won't render */ }
  return [];
}
async function loadMotifs(){
  try{
    const res = await fetch('./data/motifs.json');
    if(res.ok) return await res.json();
  }catch(e){ /* Motifs screens just won't render */ }
  return [];
}

/* Word of the Day (Hebrew/Greek) and This Day in Church History — small,
   static reference datasets for two new Home cards (DATA_MODEL.md §8,
   item 89). Loaded at boot alongside motifs/connections: small enough
   not to matter, and both are read synchronously on every Home render. */
async function loadWordOfTheDayData(){
  try{
    const res = await fetch('./data/word_of_the_day.json');
    if(res.ok) return await res.json();
  }catch(e){ /* the Word of the Day card just won't render */ }
  return [];
}
/* Biblical Fact of the Day — data/daily_facts.json, same shape/loading
   pattern as Word of the Day. Every fact was hand-checked against this
   app's own already-curated data before being written in — either the
   real WEB verse text in data/verses.json, or an existing Character/
   Story/Motif relationship already curated here — not generated and
   trusted on faith. See DATA_MODEL.md §8 for the verification pass this
   file went through and why "Validated" is an earned label here rather
   than decorative copy. */
async function loadDailyFactsData(){
  try{
    const res = await fetch('./data/daily_facts.json');
    if(res.ok) return await res.json();
  }catch(e){ /* the Fact of the Day card just won't render */ }
  return [];
}
/* Strong's lexicon (item 150) — a standalone, hand-curated 39-word
   Hebrew/Greek dictionary, data/lexicon_seed.json (keyed by Strong's id,
   not read from data.verses). Small enough to load at boot like Word of
   the Day/Facts, above. Deliberately NOT wired to per-word verse text
   yet — that would need a genuinely new source pipeline (a Strong's-
   tagged original-language corpus, not just an English/Telugu parallel
   file) and full lexicon coverage (thousands of entries, not 39) to tag
   every word in the corpus. See DATA_MODEL.md §8, item 150 for the full
   scope call. */
async function loadLexiconData(){
  try{
    const res = await fetch('./data/lexicon_seed.json');
    if(res.ok) return await res.json();
  }catch(e){ /* the Lexicon screen just won't render */ }
  return {};
}
/* The full ~14,200-entry Strong's Hebrew/Greek dictionary
   (data/lexicon_full.json, pipeline/parse_strongs_dictionary.py) —
   lazily fetched the first time the Lexicon screen opens, same
   loadCorpus()/corpusStatus shape as the full English verse corpus
   (never precached by sw.js, for the same reason). lexicon_seed.json's
   39 curated entries stay loaded at boot and are overlaid on top of
   this at lookup time (lexiconEntry()) — richer, hand-picked fields
   win where both exist. */
async function loadLexiconFull(){
  if(lexiconFullStatus === 'loading' || lexiconFullStatus === 'ready') return;
  lexiconFullStatus = 'loading';
  render();
  try{
    const res = await fetch('./data/lexicon_full.json');
    if(!res.ok) throw new Error('HTTP ' + res.status);
    lexiconFull = await res.json();
    lexiconFullStatus = 'ready';
  }catch(e){
    console.error('lexicon load failed', e);
    lexiconFullStatus = 'error';
  }
  render();
}
/* Per-verse interlinear word data (item 151, batch 2) —
   data/interlinear_ot.json (Hebrew, ~11MB) and data/interlinear_nt.json
   (Greek, ~3.9MB), each a verseId -> [[originalText, [strongsIds]], ...]
   map. Split in two and fetched independently — a reader working
   through the Gospels never needs the 11MB Hebrew file, and vice versa
   — rather than one combined file. Loads whichever one a given verse
   actually needs, mirroring loadCorpus()/loadLexiconFull()'s own lazy,
   never-precached shape. */
async function loadInterlinear(testament){
  const already = testament === 'OT' ? interlinearOT : interlinearNT;
  if(already || interlinearStatus === 'loading') return;
  interlinearStatus = 'loading';
  render();
  try{
    const file = testament === 'OT' ? 'interlinear_ot.json' : 'interlinear_nt.json';
    const res = await fetch('./data/' + file);
    if(!res.ok) throw new Error('HTTP ' + res.status);
    const json = await res.json();
    if(testament === 'OT') interlinearOT = json; else interlinearNT = json;
    interlinearStatus = 'ready';
  }catch(e){
    console.error('interlinear load failed', e);
    interlinearStatus = 'error';
  }
  render();
}
function interlinearTokensFor(v){
  const isNT = NT_BOOKS.has(v.book);
  const map = isNT ? interlinearNT : interlinearOT;
  return map ? (map[v.id] || null) : null;
}
/* Real generated character portraits (item 91) — a small, hand-curated
   batch of 25 major characters so far, out of 261 total. data/
   character_portraits.json is just a flat array of character ids that
   have a real photo at media/characters/<id>.jpg; every other character
   still falls back to the existing icon-in-a-box avatar (charIcon()).
   A deliberate shortcut, not the full Media entity from DATA_MODEL.md's
   design philosophy #3 (a separate linked entity, multiple images per
   character, etc.) — that's real future work if/when portraits cover
   most of the cast; for a partial 25-character batch, one manifest file
   plus a fallback check is simpler and does the same job today. */
async function loadCharacterPortraits(){
  try{
    const res = await fetch('./data/character_portraits.json');
    if(res.ok) return new Set(await res.json());
  }catch(e){ /* every character just falls back to its icon avatar */ }
  return new Set();
}
/* Real generated story illustrations (item 125) — same flat-manifest
   shortcut as character_portraits.json above, this time for
   data/story_illustrations.json + media/stories/<id>.jpg
   (pipeline/generate_story_art.py). Starts as a small batch (the six
   scenes already curated in pipeline/curation/story_art_settings.json);
   every other story falls back to the existing generic hero icon /
   static Home placeholder until it gets a real one too. */
async function loadStoryIllustrations(){
  try{
    const res = await fetch('./data/story_illustrations.json');
    if(res.ok) return new Set(await res.json());
  }catch(e){ /* every story just falls back to its existing placeholder */ }
  return new Set();
}
/* Telugu Bible text (item 147) — data/verses_te.json, eBible.org's tel2017
   (Indian Revised Version, CC BY-SA 4.0 — see CLAUDE.md's provenance
   section for the attribution this license requires), parsed by
   pipeline/parse_telugu_bible.py into the same verse ids data/verses.json
   already uses. Loaded lazily — only once the user actually switches to
   Telugu (or on boot if that's already their saved setting) — same
   "don't fetch the ~8MB corpus until it's needed" reasoning the English
   corpus's own lazy Browse-screen fetch already uses; unlike that one,
   the whole Telugu file is fetched at once rather than per-book, since
   there's no per-book browsing UI driving smaller fetches here. */
async function loadTeVerses(){
  if(teVerseById.size) return; // already loaded this session
  try{
    const res = await fetch('./data/verses_te.json');
    if(res.ok){
      const list = await res.json();
      for(const v of list) teVerseById.set(v.id, v);
    }
  }catch(e){ /* stays English — verseText() falls back automatically */ }
}
/* The single point every screen reads a verse's displayed text through —
   Telugu when that's the active language AND this specific verse has a
   Telugu counterpart (versification differs slightly between
   translations, item 147's own pipeline doc: ~99.7% id overlap), English
   otherwise. Never mutates the verse object itself, so switching language
   back to English needs no re-fetch or cache invalidation. */
function verseText(v){
  if(settings.language === 'te'){
    const te = teVerseById.get(v.id);
    if(te) return te.text;
  }
  return v.text;
}
function verseTranslationLabel(v){
  if(settings.language === 'te'){
    const te = teVerseById.get(v.id);
    if(te) return te.translation;
  }
  return v.translation;
}

function emptyOverlay(){ return {verses:[], topics:[], characters:[]}; }

/* Link arrays where an empty overlay value must not blank out richer seed data. */
const LINK_FIELDS = ['topicIds', 'characterIds', 'verseIds', 'relatedTopicIds', 'storyIds', 'motifIds'];

/* ---------- practice library (item 148) ----------
   `data.verses` (the merged starter pack + user overlay, ~1,800 verses)
   stays exactly as it was — every Topic/Story/Character/Motif page that
   cross-references a specific verse still works unchanged, since all of
   that curation lives on these same verse records regardless of whether
   any given verse is "in your library." What changed: Practice no longer
   treats the *entire* merged set as automatically yours to practice.
   `content.libraryVerseIds` is the real, separate list of verse ids the
   user has actually added — a brand-new install starts with just these
   ten well-known, short, easy-to-memorize verses (the owner's own
   examples, Psalm 23:1 and John 3:16, plus eight more of the same
   kind), not the full curated set; a returning user who already had
   verses before this feature shipped keeps everything they had (see the
   boot-time migration in boot() below) rather than losing access to
   verses they were already practicing. */
const DEFAULT_LIBRARY_IDS = [
  'verse_john_3_16', 'verse_psalms_23_1', 'verse_philippians_4_13',
  'verse_romans_8_28', 'verse_jeremiah_29_11', 'verse_proverbs_3_5',
  'verse_joshua_1_9', 'verse_psalms_46_1', 'verse_romans_12_2',

/* Adds a verse to the practice library without duplicating the "copy a
   corpus verse into your personal overlay" logic addFromCorpus() already
   has — a verse can be *in data.verses* (curated seed or previously
   added) without being *in the library* yet, so this only ever needs to
   touch content.libraryVerseIds, plus copy the verse into the overlay
   the one time it isn't part of data.verses at all yet (a fresh corpus
   verse the user has never interacted with before). */
function addToLibrary(verseId){
  if(!findVerse(verseId)){
    // Same shape addFromCorpus() already builds — a fresh corpus verse
    // the user has never touched before needs copying into the overlay
    // (and data.verses directly, same shortcut addFromCorpus() uses
    // rather than a full mergeContent() re-run) before it can be "in"
    // anything at all.
    const src = corpus && corpus.find(v => v.id === verseId);
    if(src){
      const verse = {
        id: src.id, reference: src.reference, book: src.book, chapter: src.chapter,
        verse: src.verse, text: src.text, translation: src.translation,
        topicIds: [], characterIds: [], metadata: {}
      };
      content.verses.push(verse);
      data.verses.push(verse);
    }
  }
  const ids = content.libraryVerseIds || [];
  if(!ids.includes(verseId)) content.libraryVerseIds = [...ids, verseId];
  saveContent();
}

  content.libraryVerseIds = (content.libraryVerseIds || []).filter(id => id !== verseId);

}

/* seed + user overlay -> the in-memory content the app renders */
function mergeContent(seed, overlay){
  const mergeEntity = (base, over)=>{
    const out = {...base, ...over};
    // A verse added from the corpus is stored in the overlay with empty link
    // arrays. When a later starter pack gains that same id — with topics and
    // characters attached — those empty arrays must not win, or the user would
    // silently lose the seed's tags. Seed links fill in; real user links win.
    for(const key of LINK_FIELDS){
      if(Array.isArray(out[key]) && !out[key].length && Array.isArray(base[key]) && base[key].length){
        out[key] = base[key];
      }
    }
    return out;
  };
  const merge = (base, over)=>{
    const byId = new Map((base||[]).map(e=>[e.id, e]));
    for(const e of (over||[])) byId.set(e.id, mergeEntity(byId.get(e.id) || {}, e));
    return [...byId.values()].map(stripProgress);
  };
  return {
    schemaVersion: seed.schemaVersion || 2,
    verses:     merge(seed.verses,     overlay.verses),
    topics:     merge(seed.topics,     overlay.topics),
    characters: merge(seed.characters, overlay.characters)
  };
}
function stripProgress(entity){
  if(entity && 'progress' in entity){ const {progress, ...rest} = entity; return rest; }
  return entity;
}

/* Brand-flavored display labels for VerseProgress.status (DATA_MODEL.md §7)

const MASTERY_LABELS = {new:'Seedling', learning:'Sprouting', review:'Rooted', mastered:'Flourishing'};
function masteryLabel(status){ return MASTERY_LABELS[status] || status; }
/* Ordered mastery ladder, used by renderMasteryBar() below for the
   4-segment visual indicator on verse cards (replaces the old uppercase
   text tag). */
const MASTERY_STAGES = ['new','learning','review','mastered'];
function renderMasteryBar(status){
  const idx = MASTERY_STAGES.indexOf(status);
  const filled = idx < 0 ? 0 : idx + 1;
  const segs = MASTERY_STAGES.map((s,i)=> `<span class="mastery-seg${i<filled?' filled':''}"></span>`).join('');

/* ---------- streaks (DATA_MODEL.md §7) ----------
   Derived entirely from VerseProgress.history[], already recorded by
   recordPractice() on every attempt — no new storage, just a new view
   over data that was already being collected. Days are calendar days in
   the viewer's *local* timezone (history timestamps are UTC ISO strings),
   since a streak that resets at UTC midnight rather than the user's own
   midnight would feel broken to them.
   practiceCountsByDay() also used to back a Home activity heatmap, removed
   2026-09-09 on feedback (didn't land well there) — the function stays
   since computeStreak() needs it, and it's the natural data source if a
   heatmap comes back on a future profile screen instead. */
function localDayKey(d){
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function practiceCountsByDay(){
  const counts = {};
  for(const p of Object.values(progress)){
    for(const h of (p.history || [])){
      const d = new Date(h.at);
      if(isNaN(d)) continue;
      const key = localDayKey(d);
      counts[key] = (counts[key] || 0) + 1;
    }
  }
  return counts;
}
function computeStreak(){
  const counts = practiceCountsByDay();
  const cursor = new Date();
  // A day that hasn't happened yet doesn't break the streak — only count
  // back from yesterday if today has no activity yet.
  if(!counts[localDayKey(cursor)]) cursor.setDate(cursor.getDate()-1);
  let streak = 0;
  while(counts[localDayKey(cursor)]){
    streak++;
    cursor.setDate(cursor.getDate()-1);
  }
  return streak;
}
function todaysPracticeCount(){
  return practiceCountsByDay()[localDayKey(new Date())] || 0;
}

/* ---------- sound & haptics (Web Audio API, synthesized — no audio
   files) ----------
   Gated by settings.soundEnabled (default true) — an app for quiet study
   time needs an easy mute, not just an on switch (Settings screen). One
   AudioContext, created lazily on first use: browsers require a user
   gesture before audio can start, and playSfx is only ever called from
   inside a click-handler chain, so that's always satisfied here. */
let audioCtx = null;
const SFX_NOTES = {
  tap:      [{f:520, t:0,   d:.05, g:.05}],
  correct:  [{f:660, t:0,   d:.09, g:.09}, {f:880, t:.07, d:.14, g:.08}],
  complete: [{f:523, t:0,   d:.11, g:.08}, {f:659, t:.09, d:.11, g:.08}, {f:784, t:.18, d:.22, g:.09}],
};
function playSfx(type){
  if(settings.soundEnabled === false) return;
  try{
    if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if(audioCtx.state === 'suspended') audioCtx.resume();
    (SFX_NOTES[type] || SFX_NOTES.tap).forEach(n=>{
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.value = n.f;
      const start = audioCtx.currentTime + n.t;
      gain.gain.setValueAtTime(0, start);
      gain.gain.linearRampToValueAtTime(n.g, start + .01);
      gain.gain.exponentialRampToValueAtTime(.0001, start + n.d);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(start);
      osc.stop(start + n.d + .02);
    });
  }catch(e){ /* Web Audio unsupported/blocked — sound is decorative, fail silently */ }
}
function hapticBuzz(pattern){
  if(settings.soundEnabled === false) return; // one toggle covers sound + haptics
  try{ if(navigator.vibrate) navigator.vibrate(pattern); }catch(e){ /* not supported (e.g. iOS Safari) — fine */ }
}

/* class="app-icon" — see the shared CSS rule (display:inline-flex, no
   forced color) for why: every call site below sits inside text that
   already sets its own `color` (a badge, a label, a button), and an SVG
   with stroke="currentColor" just follows that naturally rather than
   needing one hardcoded accent color that would fight some of those
   contexts (e.g. the streak badge's white-on-orange-gradient text). */
function icon(name, size){
  size = size || 16;
  return `<svg class="app-icon" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">${ICON_PATHS[name]||''}</svg>`;

/* uiIcon() — a second, separate small-icon system (2026-09-18),
   replacing the last handful of Tabler icon-font glyphs the owner
   wanted swapped for clean line-icon SVGs in specific Home/Discover
   eyebrow and badge contexts: the Story of the Day label ("book"), the
   Biblical Fact of the Day label ("sparkle"), the Verified Source
   badge in both places it appears ("shield"), and a character's
   avatar-box fallback icon for royalty roles ("person", reached only
   when that character has no portrait — effectively unused now that
   all 267 do). Deliberately NOT folded into icon()/ICON_PATHS above —
   that system always reads `currentColor` so it can sit inside
   already-colored text; these instead carry their own fixed color.
   "book"/"person"/"sparkle" were bronze (`#C69255`, item 139's literal
   spec); neutralized to white (2026-09-21) along with every other
   Home/Discover/Practice surface, per the owner's "black & white
   everywhere else" — Family Tree keeps its own bronze identity, but
   these three icons render almost entirely outside it. "shield" stays
   emerald — a functional Verified Source trust signal, not decorative
   theme, the same standing exception as the correct/wrong colors. */
const UI_ICON_PATHS = {
  book: { stroke: '#F2F2F2', d: '<path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>' },
  person: { stroke: '#F2F2F2', d: '<path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>' },
  sparkle: { stroke: '#F2F2F2', d: '<path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>' },
  shield: { stroke: '#10B981', d: '<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><polyline points="9 11 12 14 22 4"/>' }
};
function uiIcon(name, size){
  size = size || 14;
  const spec = UI_ICON_PATHS[name];
  if(!spec) return '';
  return `<svg class="ui-inline-icon" viewBox="0 0 24 24" fill="none" stroke="${spec.stroke}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:${size}px;height:${size}px;">${spec.d}</svg>`;
}
function charIcon(roles){
  const r = (roles||[]).join(' ').toLowerCase();
  if(/king|crown/.test(r)) return 'ui-person';
  if(/prophet/.test(r)) return 'ti-feather';
  if(/apostle|missionary/.test(r)) return 'ti-map-2';
  if(/shepherd|keeper of sheep|flock/.test(r)) return 'ti-mountain';
  if(/ark|builder/.test(r)) return 'ti-ship';
  if(/hunter|archer/.test(r)) return 'ti-bow';
  if(/dream/.test(r)) return 'ti-moon-stars';
  if(/governor|ruler|second in/.test(r)) return 'ti-building-castle';
  if(/garden|tiller|ground|farm/.test(r)) return 'ti-plant-2';
  if(/mother|matriarch|sister|wife/.test(r)) return 'ti-flower';
  if(/father|nations|tribes|firstborn|son/.test(r)) return 'ti-tent';
  if(/first man|first woman/.test(r)) return 'ti-seeding';
  if(/servant|unloved/.test(r)) return 'ti-jug';

/* charIcon() returns either a real Tabler class name or the sentinel

/* ---------- eras / stories / life events ---------- */
function findEra(id){ return lore.eras.find(e=>e.id===id); }
function findStory(id){ return lore.stories.find(s=>s.id===id); }
function eraName(id){ const e = findEra(id); return e ? e.name : ''; }
/* Events where this person is the subject — their own timeline. */
function characterTimeline(charId){
  return lore.lifeEvents
    .filter(e=>e.characterId===charId)
    .sort((a,b)=>(a.sequenceInLife||0)-(b.sequenceInLife||0));
}
/* Events they show up in but aren't the subject of. */
function appearsIn(charId){
  return lore.lifeEvents.filter(e=>e.characterId!==charId && (e.participantIds||[]).includes(charId));
}
function characterStories(charId){
  return lore.stories.filter(s=>(s.characterIds||[]).includes(charId));
}
/* Which curated characters belong to this book, in the order they first
   appear (by chapter:verse) — derived from existing curation, no new
   Character.book field, since one character routinely spans several books
   (Moses across Exodus-Deuteronomy, David across Samuel/Kings/Chronicles) —
   a field would force a false single-book choice.
   Two signals, not one: a verse's own characterIds catches most people, but
   15 real, fully-curated characters (Cain, Abel, Lot, Hagar, Rachel, Leah,
   Cornelius, and others) have zero verses individually tagged to them —
   their scene's verse ended up tagged to a co-star instead (Genesis 4:7 is
   in story_cain_and_abel's own verseIds but carries no characterIds at
   all). So also walk every Story's own verseIds for a book match and credit
   everyone in that Story's characterIds, not just whoever the verse itself
   named — otherwise a real character with a real Story silently never
   appears on their own book's list. */
function charactersInBook(bookName){
  const firstAppearance = {};
  const consider = (id, key) => {
    if(firstAppearance[id] === undefined || key < firstAppearance[id]) firstAppearance[id] = key;
  };
  data.verses.forEach(v=>{
    if(v.book !== bookName) return;
    const key = v.chapter*1000 + v.verse;
    (v.characterIds||[]).forEach(id=>consider(id, key));
  });
  lore.stories.forEach(s=>{
    const storyVersesInBook = (s.verseIds||[]).map(findVerse).filter(v=>v && v.book===bookName);
    if(!storyVersesInBook.length) return;
    const key = Math.min(...storyVersesInBook.map(v=>v.chapter*1000+v.verse));
    (s.characterIds||[]).forEach(id=>consider(id, key));
  });
  return Object.keys(firstAppearance)
    .map(findChar).filter(Boolean)
    .sort((a,b)=>firstAppearance[a.id]-firstAppearance[b.id]);
}

/* ---------- connections (DATA_MODEL.md §2) ----------
   Each edge is stored once, directed; the reverse view is derived here from
   `inverse` (a different label) or `symmetric` (the same label both ways) —
   curation never writes the same fact twice. */
function connectionsFor(type, id){
  const out = [];
  for(const c of connections){
    if(c.fromType===type && c.fromId===id){
      out.push({relationship:c.relationship, otherType:c.toType, otherId:c.toId});
    }else if(c.toType===type && c.toId===id){
      const rel = c.symmetric ? c.relationship : (c.inverse || c.relationship);
      out.push({relationship:rel, otherType:c.fromType, otherId:c.fromId});
    }
  }
  return out;
}
function characterRelationships(charId){
  return connectionsFor('character', charId)
    .filter(x=>x.otherType==='character')
    .map(x=>({type:x.relationship, who:findChar(x.otherId)}))
    .filter(x=>x.who);
}

/* ---------- family tree (DATA_MODEL.md item 110) ----------
   Built entirely from the existing Connection entity — no new data, no
   external source (Wikidata/Bible Project were considered and
   deliberately not used; this app's own hand-curated-from-Scripture
   relationships are the source of truth, same reasoning as rejecting
   the NIV PDF). Scoped to the CORE blood/marriage relationship types
   only (parent, child, spouse, sibling) — `characterRelationships()`
   also returns looser ones (uncle of, kinsman of, raised, servant of,
   mistress of, successor of, worked alongside) that don't have a clean
   generation delta relative to the root, and including them would need
   real multi-hop relationship inference this app's data doesn't
   reliably support yet. A generation naturally still picks up aunts/
   uncles/nephews/nieces/grandparents/grandchildren through the plain
   parent-child chain, without needing those looser types tagged at all.
   `maxGen` bounds how many steps up/down from the root are shown, since
   an ungapped BFS over the whole Connection graph would be unusable on
   a phone screen for well-connected figures. */
const FAMILY_CORE_TYPES = {
  'father of': 1, 'mother of': 1, 'adoptive mother of': 1, 'adoptive father of': 1,
  'son of': -1, 'daughter of': -1, 'adopted son of': -1, 'adopted daughter of': -1,
  'husband of': 0, 'wife of': 0,
  'brother of': 0, 'sister of': 0, 'half-brother of': 0, 'half-sister of': 0,
};
function familyGraph(rootId, maxGen){
  maxGen = maxGen || 2;
  const root = findChar(rootId);
  if(!root) return {nodes: [], edges: []};
  const nodes = new Map();           // id -> {char, gen}
  const edgeKeys = new Set();
  const edges = [];                  // {from, to, kind: 'parent-child'|'spouse'|'sibling'}
  nodes.set(rootId, {char: root, gen: 0});
  const queue = [{id: rootId, gen: 0}];
  while(queue.length){
    const {id, gen} = queue.shift();
    for(const rel of characterRelationships(id)){
      const delta = FAMILY_CORE_TYPES[rel.type];
      if(delta === undefined) continue;
      const otherGen = gen + delta;
      if(Math.abs(otherGen) > maxGen) continue;
      const kind = delta === 1 || delta === -1 ? 'parent-child' : (rel.type.includes('brother') || rel.type.includes('sister') ? 'sibling' : 'spouse');
      // Orient parent-child edges consistently (parent -> child) regardless
      // of which side of the pair this BFS step started from, so the
      // layout pass below can rely on edge direction meaning generation.
      const [a, b] = delta === 1 ? [id, rel.who.id] : (delta === -1 ? [rel.who.id, id] : [id, rel.who.id].sort());
      const key = kind + ':' + a + '>' + b;
      if(!edgeKeys.has(key)){
        edgeKeys.add(key);
        edges.push({from: a, to: b, kind});
      }
      if(!nodes.has(rel.who.id)){
        nodes.set(rel.who.id, {char: rel.who, gen: otherGen});
        queue.push({id: rel.who.id, gen: otherGen});
      }
    }
  }
  return {nodes: [...nodes.values()], edges};
}
/* Rigid generational grid layout (v2, 2026-09-16 overhaul) — strict
   Y-tiering by generation (Y = row * ROW_H) with X positions resolved
   so a child sits directly beneath its parent's center whenever that's
   geometrically possible, rather than a plain per-row insertion order.
   Still hand-written rather than pulling in a graph-layout library (no
   precedent for a third-party JS dependency anywhere in this app, and
   these graphs stay small — a few dozen nodes at most given ~84
   character-character connections project-wide).

   Per row, top to bottom:
     1. Nodes with an already-positioned parent (via a parent-child
        edge from the row above) get a desired X = the average X of
        their parent(s) — this is the literal "child directly beneath
        parent" case (an only child lands exactly on its parent's X).
     2. Nodes with no positioned parent above but a spouse already
        placed in the SAME row (a married-in figure with no blood tie
        upward in this graph) get a desired X = spouse's X + X_GAP, so
        couples still end up adjacent even without a shared parent to
        anchor them.
     3. Anything left over (the topmost row's own roots, or a genuinely
        unconnected node) falls back to appending after the row's
        current rightmost node.
     4. All desired X's are then sorted and walked once, pushing any
        node whose desired X collides with its left neighbor out to
        neighbor.x + X_GAP — this keeps the "directly beneath parent"
        placement exact whenever there's room, and only nudges siblings
        apart when multiple children/spouses would otherwise overlap. */
function layoutFamilyGraph(nodes, edges){
  const NODE_W = 150, NODE_H = 64, X_GAP = 170, ROW_H = 140;
  const byGen = new Map();
  for(const n of nodes){
    if(!byGen.has(n.gen)) byGen.set(n.gen, []);
    byGen.get(n.gen).push(n);
  }
  const gens = [...byGen.keys()].sort((a,b)=>a-b);
  const pos = new Map(); // id -> {x, y}
  const parentsOf = id => edges.filter(e => e.kind === 'parent-child' && e.to === id).map(e => e.from);
  const spouseOf = id => edges.filter(e => e.kind === 'spouse' && (e.from === id || e.to === id)).map(e => e.from === id ? e.to : e.from);

  for(const gen of gens){
    const row = byGen.get(gen);
    const desired = row.map(n => {
      const parentXs = parentsOf(n.char.id).map(pid => pos.get(pid)).filter(Boolean).map(p => p.x);
      if(parentXs.length) return {n, x: parentXs.reduce((s,v)=>s+v,0) / parentXs.length};
      const spouseX = spouseOf(n.char.id).map(sid => pos.get(sid)).filter(Boolean).map(p => p.x)[0];
      if(spouseX !== undefined) return {n, x: spouseX + X_GAP};
      return {n, x: null};
    });
    let rightmost = desired.filter(d => d.x !== null).reduce((m,d)=>Math.max(m,d.x), -Infinity);
    for(const d of desired){ if(d.x === null){ d.x = rightmost === -Infinity ? 0 : rightmost + X_GAP; rightmost = d.x; } }
    desired.sort((a,b) => a.x - b.x);
    let prevX = -Infinity;
    for(const d of desired){
      const x = prevX === -Infinity ? d.x : Math.max(d.x, prevX + X_GAP);
      pos.set(d.n.char.id, {x, y: (gen - gens[0]) * ROW_H});
      prevX = x;
    }
  }
  const minX = Math.min(0, ...[...pos.values()].map(p=>p.x));
  if(minX < 0) for(const p of pos.values()) p.x -= minX; // keep everything on-canvas (>= 0)
  const maxX = Math.max(0, ...[...pos.values()].map(p=>p.x)) + NODE_W;
  const maxY = Math.max(0, ...[...pos.values()].map(p=>p.y)) + NODE_H;
  return {pos, width: maxX, height: maxY, NODE_W, NODE_H};
}
/* The Bezier "elbow" connector between a parent's bottom-center and a
   child's top-center — drops straight down from the parent, curves
   through the gap, and arrives straight into the child, per spec. Only
   parent-child edges use this exact shape (it's only meaningful
   vertically); spouse/sibling edges are same-row and stay a plain
   line between facing edges — see renderFamilyTree(). */
function familyTreeBezier(parent, child, NODE_W, NODE_H){
  const sx = parent.x + NODE_W/2, sy = parent.y + NODE_H;
  const ex = child.x + NODE_W/2, ey = child.y;
  const midY = sy + (ey - sy) * 0.5;
  return `M ${sx} ${sy} C ${sx} ${midY}, ${ex} ${midY}, ${ex} ${ey}`;
}

/* ---------- motifs (DATA_MODEL.md §2) ----------
   A Motif carries no links of its own; every instance is a Connection
   (motif -> story|character|verse, "instance of"), so these fall straight
   out of connectionsFor() like everything else here. */
function findMotif(id){ return motifs.find(m=>m.id===id); }
function motifInstances(motifId){
  return connectionsFor('motif', motifId)
    .map(x=>({entityType:x.otherType, entity: findByType(x.otherType, x.otherId)}))
    .filter(x=>x.entity);
}
function motifsFor(type, id){
  return connectionsFor(type, id)
    .filter(x=>x.otherType==='motif')
    .map(x=>findMotif(x.otherId))
    .filter(Boolean);
}
function findByType(type, id){
  if(type==='story') return findStory(id);
  if(type==='character') return findChar(id);
  if(type==='verse') return findVerse(id);
  if(type==='topic') return findTopic(id);
  if(type==='era') return findEra(id);
  return null;
}
/* Story<->story links other than motif co-membership — "parallels",
   "foreshadows", etc. */
function relatedStories(storyId){
  return connectionsFor('story', storyId)
    .filter(x=>x.otherType==='story')
    .map(x=>({type:x.relationship, story:findStory(x.otherId)}))
    .filter(x=>x.story);
}
/* Who this person actually shares a scene with — real co-occurrence, not a
   guess from a broad era label. */
function sharesScenesWith(charId){
  const ids = new Set();
  for(const e of lore.lifeEvents){
    const people = e.participantIds || [];
    if(people.includes(charId)) people.forEach(p=>{ if(p!==charId) ids.add(p); });
  }
  for(const s of lore.stories){
    const people = s.characterIds || [];
    if(people.includes(charId)) people.forEach(p=>{ if(p!==charId) ids.add(p); });
  }
  return [...ids].map(findChar).filter(Boolean);
}

/* ---------- spaced repetition (simple) ---------- */
function recordPractice(verseId, correct, challengeTypeId){
  const p = progress[verseId] || defaultProgress();
  const now = new Date().toISOString();
  p.timesReviewed += 1;
  p.lastScore = correct;
  p.lastPracticedAt = now;
  let nextDays;
  if(!correct){ p.status='learning'; nextDays=1; }
  else if(p.status==='new'){ p.status='learning'; nextDays=3; }
  else if(p.status==='learning'){ p.status='review'; nextDays=7; }
  else if(p.status==='review'){ p.status='mastered'; nextDays=14; }
  else { nextDays=21; }
  const d = new Date(); d.setDate(d.getDate()+nextDays);
  p.nextReview = d.toISOString();
  p.history.push({at:now, challengeTypeId: challengeTypeId || null, score: correct ? 1 : 0});
  progress[verseId] = p;
  saveProgress();
}

/* ---------- render root ---------- */
/* 4-Pillar navigation (Home/Practice/Discover/Study, 2026-09-16,
   DATA_MODEL.md item 109) — a bottom-nav tab's `data-nav` id doesn't
   always equal the screen it highlights for: Discover is a hub covering
   several existing root screens (Browse/Topics/People/Stories, kept as
   separate screen ids rather than merged/rewritten), and Study's
   `data-nav` is literally "motifs" (Patterns is its only real content
   today — see Known Gaps for the deep-study features still to build)
   rather than introducing a distinct, currently-identical screen id.
   Detail pages (characterDetail, storyDetail, topicDetail, etc.) were
   never highlighted under the old nav either — this preserves that,
   not a new omission. */
const NAV_GROUPS = {
  discover: ['discover', 'browse', 'topics', 'characters', 'stories', 'bookPeople'],
  study: ['study', 'motifs', 'timeline', 'familyTree'],
};
function render(){
  const app = document.getElementById('app');
  document.querySelectorAll('.navitem').forEach(b=>{
    const group = NAV_GROUPS[b.dataset.nav] || [b.dataset.nav];
    b.classList.toggle('active', group.includes(view.screen));
  });
  if(view.screen==='home') app.innerHTML = renderHome();
  else if(view.screen==='unreachedDetail') app.innerHTML = renderUnreachedDetail();
  else if(view.screen==='discover') app.innerHTML = renderDiscover();
  else if(view.screen==='browse') app.innerHTML = renderBrowse();
  else if(view.screen==='bookPeople') app.innerHTML = renderBookPeople(view.params.book);
  else if(view.screen==='verseDetail') app.innerHTML = renderVerseDetail(view.params.id);
  else if(view.screen==='topics') app.innerHTML = renderTopics();
  else if(view.screen==='topicDetail') app.innerHTML = renderTopicDetail(view.params.id);
  else if(view.screen==='characters') app.innerHTML = renderCharacters();
  else if(view.screen==='characterDetail') app.innerHTML = renderCharacterDetail(view.params.id);
  else if(view.screen==='timelineGame') app.innerHTML = renderTimelineGame();
  else if(view.screen==='stories') app.innerHTML = renderStories();

function scrollKey(v){ const k = v.params && (v.params.id || v.params.book); return v.screen + (k ? ':' + k : ''); }
function go(screen, params={}){
  scrollPositions[scrollKey(view)] = window.scrollY;

  // is now a fixed, full-viewport scene with its own internal scroll
  // region (item 165) — the page/window itself no longer scrolls at
  // all while on Practice, so the normal window.scrollTo restore below
  // doesn't apply there. Instead, jump the current stop into view

   v6 (DATA_MODEL.md §8, item 82) — a greeting + streak header, a
   media-heavy Verse of the Day hero, then a stack of compact "discovery"
   cards (Unreached of the Day, Story of the Day), then a single practice
   link. Memorization itself still lives on its own Practice tab (item
   78) — this is the editorial front door, just redesigned per a
   hand-specified layout after the item 81 version didn't land well. */
function greeting(){
  const h = new Date().getHours();
  if(h < 5) return 'Good night';
  if(h < 12) return 'Good morning';
  if(h < 17) return 'Good afternoon';
  if(h < 21) return 'Good evening';
  return 'Good night';
}
/* A small inline-SVG placeholder, hue-seeded from an id so different
   verses/stories/people get a visually distinct (but still on-brand)
   placeholder instead of one repeated image — stands in for real photos/
   illustrations until those exist, with zero external image dependency.
   Same hash shape as topicColor() elsewhere in this file. */
function placeholderArt(seed, hueBase){
  let h = 0;
  for(let i=0;i<seed.length;i++) h = (h*31 + seed.charCodeAt(i)) >>> 0;
  const hue = hueBase != null ? hueBase : h % 360;
  const hue2 = (hue + 28) % 360;
  // Double-quoted SVG attributes deliberately, not single — encodeURIComponent
  // does NOT escape "'", so a single-quoted SVG would leak literal quote
  // characters into the data URI and break any single-quoted JS string it's
  // later embedded in (e.g. an inline onerror handler).
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300">`
    + `<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1">`
    + `<stop offset="0%" stop-color="hsl(${hue},65%,24%)"/>`
    + `<stop offset="100%" stop-color="hsl(${hue2},55%,11%)"/></linearGradient></defs>`
    + `<rect width="400" height="300" fill="url(#g)"/>`
    + `<circle cx="320" cy="55" r="40" fill="hsl(${hue},80%,62%)" opacity=".5"/>`
    + `<path d="M0 235 L85 150 L155 205 L230 115 L320 215 L400 165 L400 300 L0 300 Z" fill="hsl(${hue2},40%,8%)" opacity=".85"/>`
    + `</svg>`;
  return 'data:image/svg+xml,' + encodeURIComponent(svg);
}

async function loadCorpus(){
  if(corpusStatus === 'loading' || corpusStatus === 'ready') return;
  corpusStatus = 'loading';
  render();
  try{
    const res = await fetch('./data/verses.json');
    if(!res.ok) throw new Error('HTTP ' + res.status);
    corpus = await res.json();
    corpusIndex = buildCorpusIndex(corpus);
    corpusStatus = 'ready';
  }catch(e){
    console.error('corpus load failed', e);
    corpusStatus = 'error';
  }
  render();
}
function buildCorpusIndex(verses){
  const books = new Map();
  for(const v of verses){
    if(!books.has(v.book)) books.set(v.book, {book:v.book, count:0, chapterMap:new Map()});
    const b = books.get(v.book);
    b.count++;
    b.chapterMap.set(v.chapter, (b.chapterMap.get(v.chapter) || 0) + 1);
  }
  return [...books.values()].map(b => ({
    book: b.book,
    count: b.count,
    chapters: [...b.chapterMap.entries()].sort((a,c)=>a[0]-c[0]).map(([n,count])=>({n, count}))
  }));
}
function searchCorpus(query){
  const needle = query.trim().toLowerCase();
  const hits = [];
  let total = 0;
  for(const v of corpus){
    if(v.text.toLowerCase().includes(needle) || v.reference.toLowerCase().includes(needle)){
      total++;
      if(hits.length < SEARCH_LIMIT) hits.push(v);
    }
  }
  return {hits, total};
}
/* Chapter-to-chapter and verse-to-verse navigation (item 155) — both
   walk canonical order and roll across a book boundary at either end
   (chapter 1's "previous" is the prior book's last chapter; a book's
   final chapter's "next" is the next book's chapter 1), the same
   "walk the whole Bible in sequence" idea Timeline/the story carousel
   (item 128) already use, just at chapter/verse granularity instead of
   story granularity. Both need `corpusIndex`/`corpus` loaded — true
   whenever Browse's chapter reader is on screen, and Verse Detail now
   triggers loadCorpus() itself for the same reason (see
   renderVerseDetail()). */
function adjacentChapter(book, chapter, dir){
  if(!corpusIndex) return null;
  const bi = corpusIndex.findIndex(b=>b.book===book);
  if(bi===-1) return null;
  const chapters = corpusIndex[bi].chapters.map(c=>c.n);
  const ci = chapters.indexOf(chapter);
  if(ci===-1) return null;
  if(chapters[ci+dir] !== undefined) return {book, chapter: chapters[ci+dir]};
  const nextBook = corpusIndex[bi+dir];
  if(!nextBook) return null;
  const nextChapters = nextBook.chapters.map(c=>c.n);
  return {book: nextBook.book, chapter: dir>0 ? nextChapters[0] : nextChapters[nextChapters.length-1]};
}
function adjacentVerse(v, dir){
  if(!corpus) return null;
  const inChapter = corpus.filter(x=>x.book===v.book && x.chapter===v.chapter).sort((a,b)=>a.verse-b.verse);
  const i = inChapter.findIndex(x=>x.id===v.id);
  if(i===-1) return null;
  if(inChapter[i+dir]) return inChapter[i+dir];
  const nextCh = adjacentChapter(v.book, v.chapter, dir);
  if(!nextCh) return null;
  const target = corpus.filter(x=>x.book===nextCh.book && x.chapter===nextCh.chapter).sort((a,b)=>a.verse-b.verse);
  return dir>0 ? target[0] : target[target.length-1];
}

// dusty, saturated tones assigned deterministically per topic id (a simple

   not a one-off override. Same hash-based assignment (topicColor()
   below is unchanged) so topics are still visually distinguishable
   from their neighbors by hue, same as before item 123. */
const TOPIC_PALETTE = [
  '#0EA5D6', '#F0158A', '#B88E00', '#E0742C', '#78B01A', '#0FC96B',
  '#9C7A1E', '#B8752F', '#3D53F5', '#F04419', '#12AEDA', '#C92BAE',
];
const TOPIC_ICONS = {
  topic_betrayal:'ti-heart-broken', topic_blessing:'ti-gift', topic_calling:'ti-flag',
  topic_covenant:'ti-link', topic_creation:'ti-sun', topic_faith:'ti-anchor',
  topic_faithfulness:'ti-shield-check', topic_fear:'ti-alert-triangle',
  topic_forgiveness:'ti-heart-handshake', topic_guidance:'ti-compass',
  topic_humility:'ti-feather', topic_identity:'ti-fingerprint', topic_justice:'ti-scale',
  topic_peace:'ti-cloud', topic_presence:'ti-map-pin', topic_provision:'ti-basket',
  topic_refuge:'ti-home', topic_repentance:'ti-arrow-back-up', topic_scripture:'ti-book',
  topic_sorrow:'ti-droplet', topic_strength:'ti-bolt', topic_temptation:'ti-apple',
  topic_thanksgiving:'ti-confetti', topic_trust:'ti-shield', topic_waiting:'ti-hourglass',
  topic_wisdom:'ti-bulb', topic_worship:'ti-music', topic_deliverance:'ti-door-exit',

  topic_speech:'ti-message-circle',
};
function topicColor(id){
  let h = 0;
  for(let i=0;i<id.length;i++) h = (h*31 + id.charCodeAt(i)) >>> 0;
  return TOPIC_PALETTE[h % TOPIC_PALETTE.length];
}
function topicIcon(id){ return TOPIC_ICONS[id] || 'ti-sparkles'; }
/* Re-themes a Topic Detail page's --gold/--gold-deep/--gold-wash/
   --gold-shadow to that topic's own hue (item 62-64's original
   per-topic color grid) — restored (2026-09-21) after the black-and-
   white pass (item 123) had made this a no-op and grayscaled
   TOPIC_PALETTE. Topics is now a deliberate, standing exception to
   that pass, not a one-off hex like the badge exceptions elsewhere in
   the file: the owner's own words were "this is one part of the app
   we'll keep the colors." Derives a brighter text-safe tint and
   low-alpha wash from the one base hex via hexToRgb(), the same
   light/wash-pair shape the gold/sage/tan tokens already use, so a
   Topic Detail page can override just the "action/urgency" accent role
   locally without touching sage (mastery) or tan (metadata) — those
   stay their normal color everywhere, same verse card component. */
function hexToRgb(hex){
  const n = parseInt(hex.slice(1), 16);
  return [(n>>16)&255, (n>>8)&255, n&255];
}
function topicAccentVars(id){
  const base = topicColor(id);
  const [r,g,b] = hexToRgb(base);
  const lighten = (amt)=>{
    const mix = (c)=>Math.round(c + (255-c)*amt);
    return `rgb(${mix(r)},${mix(g)},${mix(b)})`;
  };
  return `--gold:${base};--gold-deep:${lighten(.45)};--gold-wash:rgba(${r},${g},${b},.22);--gold-shadow:rgba(${r},${g},${b},.35);`;
}
