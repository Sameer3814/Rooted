<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rooted — Scripture Memory</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#FAF6EC">
<link rel="apple-touch-icon" href="icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">
<style>
  :root{
    --paper:#FAF6EC;
    --paper-raised:#FFFDF7;
    --ink:#3A2E22;
    --ink-soft:#7A6A55;
    --ink-faint:#B4A488;
    --line:#E7D9BC;
    --gold:#D9A02C;
    --gold-deep:#8A5F13;
    --gold-wash:#F6E7C4;
    --sage:#6E8F4E;
    --sage-deep:#3E5A28;
    --sage-wash:#E4EEDA;
    --plum:#6B3F5C;
    --plum-deep:#432840;
    --plum-wash:#EDE1EA;
    --danger:#B3492F;
    --radius-card:18px;
    --radius-ctl:12px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    padding-bottom:78px;
  }
  h1,h2,h3,.headline{font-family:'Fraunces',serif;font-weight:600;color:var(--ink);margin:0;}
  h1{font-size:26px;}
  h2{font-size:20px;}
  h3{font-size:16px;}
  p{margin:0;line-height:1.55;}
  button{font-family:'Inter',sans-serif;cursor:pointer;}
  .app{max-width:480px;margin:0 auto;padding:20px 18px 8px;}
  .topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;}
  .topbar .brand{display:flex;align-items:center;gap:8px;}
  .topbar .brand i{font-size:22px;color:var(--gold-deep);}
  .stat-row{display:flex;gap:10px;margin-bottom:20px;}
  .stat-card{flex:1;background:var(--paper-raised);border:1px solid var(--line);border-radius:var(--radius-card);padding:14px;}
  .stat-card .num{font-family:'Fraunces',serif;font-size:24px;font-weight:600;}
  .stat-card .label{font-size:12px;color:var(--ink-soft);margin-top:2px;}
  .section-label{font-size:13px;color:var(--ink-soft);margin:22px 0 10px;display:flex;align-items:center;justify-content:space-between;}
  .card{
    background:var(--paper-raised);
    border:1px solid var(--line);
    border-radius:var(--radius-card);
    padding:16px;
    margin-bottom:12px;
  }
  .card.tap{cursor:pointer;transition:border-color .15s ease;}
  .card.tap:active{border-color:var(--gold);}
  .verse-card .ref{font-size:12px;color:var(--gold-deep);font-weight:600;letter-spacing:.02em;margin-bottom:6px;}
  .verse-card .text{font-family:'Fraunces',serif;font-size:17px;line-height:1.5;color:var(--ink);}
  .tag-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;}
  .tag{font-size:12px;padding:3px 10px;border-radius:100px;background:var(--sage-wash);color:var(--sage-deep);}
  .tag.plum{background:var(--plum-wash);color:var(--plum-deep);}
  .empty{text-align:center;padding:40px 20px;color:var(--ink-soft);}
  .empty i{font-size:34px;color:var(--ink-faint);margin-bottom:10px;display:block;}
  .empty .cta{margin-top:14px;}

  /* buttons */
  .btn{
    border:1px solid var(--line);
    background:var(--paper-raised);
    color:var(--ink);
    border-radius:var(--radius-ctl);
    padding:11px 16px;
    font-size:14px;
    font-weight:500;
    display:inline-flex;
    align-items:center;
    gap:6px;
  }
  .btn.primary{background:var(--gold);border-color:var(--gold);color:#3A2400;}
  .btn.primary:active{background:var(--gold-deep);}
  .btn.ghost{background:transparent;border-color:transparent;color:var(--ink-soft);}
  .btn.block{width:100%;justify-content:center;padding:13px;}
  .btn.sage{background:var(--sage);border-color:var(--sage);color:#fff;}
  .btn:disabled{opacity:.45;}

  /* forms */
  label{font-size:13px;color:var(--ink-soft);display:block;margin:14px 0 6px;}
  label:first-child{margin-top:0;}
  input[type=text],textarea,select{
    width:100%;
    border:1px solid var(--line);
    background:var(--paper);
    border-radius:var(--radius-ctl);
    padding:11px 12px;
    font-size:15px;
    font-family:'Inter',sans-serif;
    color:var(--ink);
  }
  textarea{min-height:80px;resize:vertical;font-family:'Fraunces',serif;font-size:16px;line-height:1.5;}
  input:focus,textarea:focus,select:focus{outline:2px solid var(--gold);outline-offset:1px;}

  /* nav */
  .navbar{
    position:fixed;bottom:0;left:0;right:0;
    background:var(--paper-raised);
    border-top:1px solid var(--line);
    display:flex;
    padding:8px 6px calc(8px + env(safe-area-inset-bottom));
    z-index:10;
  }
  .navbar .navitem{
    flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;
    background:none;border:none;color:var(--ink-faint);padding:6px 0;border-radius:10px;
  }
  .navbar .navitem i{font-size:21px;}
  .navbar .navitem span{font-size:11px;}
  .navbar .navitem.active{color:var(--gold-deep);}

  /* avatar */
  .avatar{
    width:46px;height:46px;border-radius:13px;
    display:flex;align-items:center;justify-content:center;
    background:var(--plum-wash);color:var(--plum-deep);font-size:22px;flex-shrink:0;
  }
  .char-row{display:flex;align-items:center;gap:12px;}
  .char-row .meta{font-size:12px;color:var(--ink-soft);margin-top:2px;}

  /* practice */
  .practice-verse{
    font-family:'Fraunces',serif;font-size:19px;line-height:1.65;color:var(--ink);
  }
  .blank{
    display:inline-block;
    min-width:64px;
    border-bottom:2px solid var(--gold);
    padding:0 2px;
  }
  .blank input{
    border:none;background:transparent;font-family:'Fraunces',serif;font-size:19px;
    width:100%;padding:0;color:var(--gold-deep);text-align:center;outline:none;
  }
  .blank.correct{border-color:var(--sage);}
  .blank.correct input{color:var(--sage-deep);}
  .blank.wrong{border-color:var(--danger);}
  .blank.wrong input{color:var(--danger);}
  .progress-track{height:5px;background:var(--line);border-radius:4px;overflow:hidden;margin-bottom:22px;}
  .progress-fill{height:100%;background:var(--gold);border-radius:4px;transition:width .3s ease;}
  .result-banner{
    display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:var(--radius-ctl);margin-bottom:16px;font-size:14px;
  }
  .result-banner.good{background:var(--sage-wash);color:var(--sage-deep);}
  .result-banner.bad{background:#F6E4DD;color:var(--danger);}

  /* scramble challenge */
  .chip{
    display:inline-block;font-family:'Fraunces',serif;font-size:16px;line-height:1.2;
    padding:7px 13px;border:1px solid var(--line);border-radius:100px;
    background:var(--paper);color:var(--ink);
  }
  .chip.picked{background:var(--gold-wash);border-color:var(--gold);color:var(--gold-deep);}
  .chip.chip-correct{background:var(--sage-wash);border-color:var(--sage);color:var(--sage-deep);}
  .chip.chip-wrong{background:#F6E4DD;border-color:var(--danger);color:var(--danger);}
  .scramble-build{
    min-height:46px;padding:9px 10px;margin-bottom:12px;
    border:1px dashed var(--line);border-radius:var(--radius-ctl);
    line-height:2.4;
  }
  .scramble-pool{line-height:2.6;}
  .scramble-fixed{color:var(--ink-soft);font-family:'Fraunces',serif;font-size:16px;margin:6px 0;}
  .scramble-hint{color:var(--ink-faint);font-size:13px;font-family:'Inter',sans-serif;}

  /* segmented control (practice mode picker) */
  .segmented{display:flex;gap:4px;background:var(--paper-raised);border:1px solid var(--line);border-radius:var(--radius-ctl);padding:4px;margin-bottom:12px;}
  .segmented button{
    flex:1;border:none;background:transparent;color:var(--ink-soft);
    font-size:13px;font-weight:500;padding:8px 6px;border-radius:9px;
  }
  .segmented button.active{background:var(--gold-wash);color:var(--gold-deep);}

  /* timeline */
  .timeline{position:relative;padding-left:24px;margin-bottom:6px;}
  .timeline::before{content:'';position:absolute;left:5px;top:8px;bottom:8px;width:2px;background:var(--line);border-radius:2px;}
  .tl-item{position:relative;margin-bottom:18px;}
  .tl-item::before{
    content:'';position:absolute;left:-24px;top:4px;width:12px;height:12px;
    border-radius:50%;background:var(--paper);border:2px solid var(--gold);
  }
  .tl-item.tap{cursor:pointer;}
  .tl-item.tap:active .tl-title{color:var(--gold-deep);}
  .tl-title{font-family:'Fraunces',serif;font-size:16px;font-weight:600;color:var(--ink);line-height:1.35;}
  .tl-ref{font-size:11px;color:var(--gold-deep);font-weight:600;margin-top:2px;letter-spacing:.02em;}
  .tl-age{color:var(--ink-faint);font-weight:400;}
  .tl-desc{font-size:14px;color:var(--ink-soft);line-height:1.5;margin-top:5px;}

  /* browse / search */
  .search-wrap{position:relative;margin-bottom:14px;}
  .search-wrap i{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--ink-faint);font-size:18px;}
  .search-wrap input{padding-left:38px;}
  .crumbs{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:13px;color:var(--ink-soft);margin-bottom:12px;}
  .crumbs button{border:none;background:none;color:var(--gold-deep);font-size:13px;font-weight:500;padding:0;}
  .chapter-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(54px,1fr));gap:8px;}
  .chapter-cell{
    background:var(--paper-raised);border:1px solid var(--line);border-radius:var(--radius-ctl);
    padding:12px 4px;font-family:'Fraunces',serif;font-size:16px;color:var(--ink);
  }
  .chapter-cell:active{border-color:var(--gold);}
  .result-count{font-size:12px;color:var(--ink-faint);margin-bottom:10px;}
  .card-actions{display:flex;justify-content:flex-end;margin-top:10px;}
  .in-library{font-size:12px;color:var(--sage-deep);display:inline-flex;align-items:center;gap:4px;}

  /* header w/ back */
  .screen-head{display:flex;align-items:center;gap:10px;margin-bottom:18px;}
  .back-btn{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--paper-raised);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .err{color:var(--danger);font-size:13px;margin-top:6px;}
  .field-hint{font-size:12px;color:var(--ink-faint);margin-top:4px;}
</style>
</head>
<body>
<div class="app" id="app"></div>

<nav class="navbar">
  <button class="navitem" data-nav="home"><i class="ti ti-home-2"></i><span>Home</span></button>
  <button class="navitem" data-nav="browse"><i class="ti ti-search"></i><span>Browse</span></button>
  <button class="navitem" data-nav="topics"><i class="ti ti-tags"></i><span>Topics</span></button>
  <button class="navitem" data-nav="characters"><i class="ti ti-users"></i><span>People</span></button>
  <button class="navitem" data-nav="add"><i class="ti ti-plus"></i><span>Add</span></button>
</nav>

<script>
/* ---------- local-dev storage fallback ----------
   The app persists through window.storage, provided by the Claude runtime.
   When the page is opened from a plain web server / browser that API is
   absent, so fall back to localStorage with the same shape (same origin,
   survives reload, per-browser). Inert inside the Claude runtime. */
if(!window.storage){
  console.info('Rooted: window.storage not found — using localStorage (local dev).');
  window.storage = {
    async get(key){
      try{ const v = localStorage.getItem(key); return v === null ? null : {value:v}; }
      catch(e){ return null; }
    },
    async set(key, value){
      try{ localStorage.setItem(key, value); }
      catch(e){ console.warn('Rooted: localStorage set failed', e); }
    }
  };
}

/* ---------- storage ----------
   Content (verses/topics/characters) and user state (practice progress) are
   stored under separate keys so resetting progress can never destroy content.
   See DATA_MODEL.md §5, §7.
   - rooted-content  : user overlay { verses, topics, characters } merged
                       over the seed by id at load. Seed is source of truth
                       for seed ids; the overlay adds new ids and patches
                       existing ones.
   - rooted-progress : map of verseId -> VerseProgress
   - rooted-sync-meta: { updatedAt } — stamped on every local edit, compared
                       against the cloud copy's updatedAt to decide which
                       side wins on sync (whole-bundle last-write-wins, not
                       per-field — see pullAndMerge() below and
                       DATA_MODEL.md §7.1).
*/
const CONTENT_KEY   = 'rooted-content';
const PROGRESS_KEY  = 'rooted-progress';
const SETTINGS_KEY  = 'rooted-settings';   // per-user preferences (DATA_MODEL.md §7)
const SYNC_META_KEY = 'rooted-sync-meta';  // {updatedAt} for cloud sync (DATA_MODEL.md §7.1)
const LEGACY_KEY    = 'rooted-app-data';   // pre-split single blob; migrated once

let contentTimer = null, progressTimer = null, settingsTimer = null;
let syncMeta = {updatedAt: null};    // local edit clock; compared against the cloud copy
let account = null;                  // {userId, userDetails, identityProvider, userRoles} | null — from /.auth/me
let syncStatus = 'idle';             // 'idle' | 'syncing' | 'synced' | 'error' — for the account bar
let cloudPushTimer = null;
let suppressSyncTouch = false;       // true while pullAndMerge() is writing an *adopted* remote state locally, so that adoption doesn't get mistaken for a fresh local edit and immediately pushed back up
function saveContent(){
  touchSyncMeta();
  clearTimeout(contentTimer);
  contentTimer = setTimeout(async ()=>{
    try{ await window.storage.set(CONTENT_KEY, JSON.stringify(content), false); }
    catch(e){ console.error('content save failed', e); }
  }, 250);
}
function saveProgress(){
  touchSyncMeta();
  clearTimeout(progressTimer);
  progressTimer = setTimeout(async ()=>{
    try{ await window.storage.set(PROGRESS_KEY, JSON.stringify(progress), false); }
    catch(e){ console.error('progress save failed', e); }
  }, 250);
}
function saveSettings(){
  touchSyncMeta();
  clearTimeout(settingsTimer);
  settingsTimer = setTimeout(async ()=>{
    try{ await window.storage.set(SETTINGS_KEY, JSON.stringify(settings), false); }
    catch(e){ console.error('settings save failed', e); }
  }, 250);
}

/* ---------- cloud sync (optional — see DATA_MODEL.md §7.1) ----------
   Local storage (above) is always the fast, offline-capable source of
   truth. Signing in additionally mirrors {content, progress, settings} to
   one Cosmos DB document per user via /api/sync, so the same library and
   progress can be picked up on another device. Whole-bundle last-write-wins:
   whichever side's `updatedAt` is newer replaces the other side entirely —
   simple and safe for "one person, a couple of devices," not a per-field
   merge. See api/src/functions/sync.js for the server half. */
function touchSyncMeta(){
  if(suppressSyncTouch) return;
  syncMeta.updatedAt = new Date().toISOString();
  window.storage.set(SYNC_META_KEY, JSON.stringify(syncMeta), false).catch(()=>{});
  scheduleCloudPush();
}
function scheduleCloudPush(){
  if(!account) return;
  clearTimeout(cloudPushTimer);
  cloudPushTimer = setTimeout(pushToCloud, 1500);
}
async function loadAccount(){
  try{
    const res = await fetch('/.auth/me');
    if(!res.ok) return null;
    const body = await res.json();
    return (body && body.clientPrincipal) || null;
  }catch(e){ return null; }
}
async function pushToCloud(){
  if(!account) return;
  syncStatus = 'syncing';
  refreshAccountBar();
  try{
    const res = await fetch('/api/sync', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({content, progress, settings, updatedAt: syncMeta.updatedAt})
    });
    syncStatus = res.ok ? 'synced' : 'error';
  }catch(e){
    console.error('cloud push failed', e);
    syncStatus = 'error';
  }
  refreshAccountBar();
}
async function pullAndMerge(){
  if(!account) return;
  syncStatus = 'syncing';
  refreshAccountBar();
  try{
    const res = await fetch('/api/sync');
    if(res.ok){
      const remote = await res.json();
      if(remote && remote.updatedAt){
        const remoteTime = Date.parse(remote.updatedAt) || 0;
        const localTime = syncMeta.updatedAt ? (Date.parse(syncMeta.updatedAt) || 0) : 0;
        if(remoteTime > localTime){
          suppressSyncTouch = true;
          content = Object.assign(emptyOverlay(), remote.content || {});
          progress = {};
          for(const [id, p] of Object.entries(remote.progress || {})) progress[id] = normalizeProgress(p);
          settings = Object.assign({challengeTypeId:'challenge_fill_blank', dailyGoal:10}, remote.settings || {});
          if(!CHALLENGE_TYPES[settings.challengeTypeId]) settings.challengeTypeId = 'challenge_fill_blank';
          data = mergeContent(seed, content);
          saveContent(); saveProgress(); saveSettings();
          suppressSyncTouch = false;
          syncMeta.updatedAt = remote.updatedAt;
          window.storage.set(SYNC_META_KEY, JSON.stringify(syncMeta), false).catch(()=>{});
        } else if(localTime > remoteTime){
          await pushToCloud();
        }
      } else {
        // Nothing synced yet for this account — this device's copy becomes the first cloud copy.
        await pushToCloud();
      }
      syncStatus = 'synced';
    } else {
      syncStatus = 'error';
    }
  }catch(e){
    console.error('cloud pull failed', e);
    syncStatus = 'error';
  }
  render();
}
function refreshAccountBar(){
  const el = document.getElementById('account-bar');
  if(!el) return;
  el.outerHTML = renderAccountBar();
  bindEvents(document.getElementById('account-bar'));
}

/* ---------- local backup: export / import ----------
   Cloud sync (above) only covers signed-in users. This is the fallback for
   everyone else — and a manual safety net even when signed in, since
   localStorage on a single device is still one browser-clear away from
   gone. Same bundle shape as the cloud sync document, by design, so
   there's exactly one "what does a user's data look like" shape used in
   three places (localStorage keys, Cosmos, and export files). See
   DATA_MODEL.md §7.1 / CLAUDE.md known gaps. */
function exportBundle(){
  return {
    app: 'rooted',
    exportedAt: new Date().toISOString(),
    content, progress, settings
  };
}
function downloadExport(){
  const blob = new Blob([JSON.stringify(exportBundle(), null, 2)], {type: 'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `rooted-backup-${new Date().toISOString().slice(0,10)}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}
function validateImportBundle(obj){
  if(!obj || typeof obj !== 'object') return {ok:false, error:'That file isn\'t a Rooted backup.'};
  const out = {};
  if(obj.content !== undefined){
    if(typeof obj.content !== 'object' || obj.content === null) return {ok:false, error:'Backup file is corrupted (content).'};
    out.content = Object.assign(emptyOverlay(), obj.content);
  }
  if(obj.progress !== undefined){
    if(typeof obj.progress !== 'object' || obj.progress === null) return {ok:false, error:'Backup file is corrupted (progress).'};
    out.progress = obj.progress;
  }
  if(obj.settings !== undefined){
    if(typeof obj.settings !== 'object' || obj.settings === null) return {ok:false, error:'Backup file is corrupted (settings).'};
    out.settings = obj.settings;
  }
  if(!('content' in out) && !('progress' in out) && !('settings' in out)){
    return {ok:false, error:'That file doesn\'t contain any Rooted data.'};
  }
  return {ok:true, bundle:out};
}
async function importFromFile(file){
  let text;
  try{ text = await file.text(); }
  catch(e){ alert('Could not read that file.'); return; }
  let parsed;
  try{ parsed = JSON.parse(text); }
  catch(e){ alert('That file is not valid JSON.'); return; }
  const result = validateImportBundle(parsed);
  if(!result.ok){ alert(result.error); return; }
  if(!confirm('This replaces your current verses, progress, and settings on this device with the backup file. This can\'t be undone. Continue?')) return;

  const {bundle} = result;
  if('content' in bundle){ content = bundle.content; data = mergeContent(seed, content); }
  if('progress' in bundle){
    progress = {};
    for(const [id, p] of Object.entries(bundle.progress)) progress[id] = normalizeProgress(p);
  }
  if('settings' in bundle){
    settings = Object.assign({challengeTypeId:'challenge_fill_blank', dailyGoal:10}, bundle.settings);
    if(!CHALLENGE_TYPES[settings.challengeTypeId]) settings.challengeTypeId = 'challenge_fill_blank';
  }
  saveContent(); saveProgress(); saveSettings();
  render();
  alert('Import complete.');
}
async function loadStored(key){
  try{
    const res = await window.storage.get(key, false);
    if(res && res.value) return JSON.parse(res.value);
  }catch(e){ /* not present / no storage API */ }
  return null;
}
async function loadSeed(){
  try{
    const res = await fetch('./data/starter-pack.json');
    if(res.ok) return await res.json();
  }catch(e){ /* fall back to built-in seed */ }
  return seedData();
}
/* Eras, stories, life events and connections. Seed-only for now (nothing here
   is user editable), so they stay outside the content overlay. Small enough to
   load at boot, unlike the corpus. */
async function loadStories(){
  try{
    const res = await fetch('./data/stories.json');
    if(res.ok) return await res.json();
  }catch(e){ /* the app works without them; timeline sections just don't render */ }
  return {eras:[], stories:[], lifeEvents:[]};
}
async function loadConnections(){
  try{
    const res = await fetch('./data/connections.json');
    if(res.ok) return await res.json();
  }catch(e){ /* Family sections just won't render */ }
  return [];
}
async function loadMotifs(){
  try{
    const res = await fetch('./data/motifs.json');
    if(res.ok) return await res.json();
  }catch(e){ /* Motifs screens just won't render */ }
  return [];
}

function emptyOverlay(){ return {verses:[], topics:[], characters:[]}; }

/* Link arrays where an empty overlay value must not blank out richer seed data. */
const LINK_FIELDS = ['topicIds', 'characterIds', 'verseIds', 'relatedTopicIds', 'storyIds', 'motifIds'];

/* seed + user overlay -> the in-memory content the app renders */
function mergeContent(seed, overlay){
  const mergeEntity = (base, over)=>{
    const out = {...base, ...over};
    // A verse added from the corpus is stored in the overlay with empty link
    // arrays. When a later starter pack gains that same id — with topics and
    // characters attached — those empty arrays must not win, or the user would
    // silently lose the seed's tags. Seed links fill in; real user links win.
    for(const key of LINK_FIELDS){
      if(Array.isArray(out[key]) && !out[key].length && Array.isArray(base[key]) && base[key].length){
        out[key] = base[key];
      }
    }
    return out;
  };
  const merge = (base, over)=>{
    const byId = new Map((base||[]).map(e=>[e.id, e]));
    for(const e of (over||[])) byId.set(e.id, mergeEntity(byId.get(e.id) || {}, e));
    return [...byId.values()].map(stripProgress);
  };
  return {
    schemaVersion: seed.schemaVersion || 2,
    verses:     merge(seed.verses,     overlay.verses),
    topics:     merge(seed.topics,     overlay.topics),
    characters: merge(seed.characters, overlay.characters)
  };
}
function stripProgress(entity){
  if(entity && 'progress' in entity){ const {progress, ...rest} = entity; return rest; }
  return entity;
}

/* ---------- practice progress ---------- */
function defaultProgress(){
  return {status:'new', timesReviewed:0, lastScore:null, lastPracticedAt:null, nextReview:null, history:[]};
}
function getProgress(verseId){ return progress[verseId] || defaultProgress(); }
function normalizeProgress(p){
  return {
    status: p.status || 'new',
    timesReviewed: p.timesReviewed || 0,
    lastScore: (p.lastScore === undefined ? null : p.lastScore),
    lastPracticedAt: p.lastPracticedAt || null,
    nextReview: p.nextReview || null,
    history: Array.isArray(p.history) ? p.history : []
  };
}
/* Brand-flavored display labels for VerseProgress.status (DATA_MODEL.md §7)
   — the stored value stays `new|learning|review|mastered` (the SRS ladder
   logic keys off it), this is presentation-only. */
const MASTERY_LABELS = {new:'Seedling', learning:'Rooted', review:'Flourishing', mastered:'Mastered'};
function masteryLabel(status){ return MASTERY_LABELS[status] || status; }

/* ---------- streaks (DATA_MODEL.md §7) ----------
   Derived entirely from VerseProgress.history[], already recorded by
   recordPractice() on every attempt — no new storage, just a new view
   over data that was already being collected. Days are calendar days in
   the viewer's *local* timezone (history timestamps are UTC ISO strings),
   since a streak that resets at UTC midnight rather than the user's own
   midnight would feel broken to them.
   practiceCountsByDay() also used to back a Home activity heatmap, removed
   2026-09-09 on feedback (didn't land well there) — the function stays
   since computeStreak() needs it, and it's the natural data source if a
   heatmap comes back on a future profile screen instead. */
function localDayKey(d){
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function practiceCountsByDay(){
  const counts = {};
  for(const p of Object.values(progress)){
    for(const h of (p.history || [])){
      const d = new Date(h.at);
      if(isNaN(d)) continue;
      const key = localDayKey(d);
      counts[key] = (counts[key] || 0) + 1;
    }
  }
  return counts;
}
function computeStreak(){
  const counts = practiceCountsByDay();
  const cursor = new Date();
  // A day that hasn't happened yet doesn't break the streak — only count
  // back from yesterday if today has no activity yet.
  if(!counts[localDayKey(cursor)]) cursor.setDate(cursor.getDate()-1);
  let streak = 0;
  while(counts[localDayKey(cursor)]){
    streak++;
    cursor.setDate(cursor.getDate()-1);
  }
  return streak;
}

/* ---------- helpers ---------- */
function findVerse(id){ return data.verses.find(v=>v.id===id); }
function findTopic(id){ return data.topics.find(t=>t.id===id); }
function findChar(id){ return data.characters.find(c=>c.id===id); }
function topicVerseCount(id){ return data.verses.filter(v=>v.topicIds.includes(id)).length; }
function isDue(v){
  const nr = getProgress(v.id).nextReview;
  if(!nr) return true;
  return new Date(nr) <= new Date();
}
/* Due verses, most-overdue first, then ones already in progress, then new.
   Finishing what you've started beats piling on more. */
function dueVerses(){
  return data.verses.filter(isDue).sort((a,b)=>{
    const pa = getProgress(a.id), pb = getProgress(b.id);
    if(pa.nextReview && pb.nextReview) return new Date(pa.nextReview) - new Date(pb.nextReview);
    if(pa.nextReview) return -1;
    if(pb.nextReview) return 1;
    return 0;
  });
}
/* A day's worth, not the whole backlog — 230 seed verses would otherwise all
   come due at once on a fresh install. */
function practiceQueue(verses){
  const goal = settings.dailyGoal || 10;
  return verses.slice(0, goal).map(v=>v.id);
}
function esc(s){ return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function charIcon(roles){

/* ---------- eras / stories / life events ---------- */
function findEra(id){ return lore.eras.find(e=>e.id===id); }
function findStory(id){ return lore.stories.find(s=>s.id===id); }
function eraName(id){ const e = findEra(id); return e ? e.name : ''; }
/* Events where this person is the subject — their own timeline. */
function characterTimeline(charId){
  return lore.lifeEvents
    .filter(e=>e.characterId===charId)
    .sort((a,b)=>(a.sequenceInLife||0)-(b.sequenceInLife||0));
}
/* Events they show up in but aren't the subject of. */
function appearsIn(charId){
  return lore.lifeEvents.filter(e=>e.characterId!==charId && (e.participantIds||[]).includes(charId));
}
function characterStories(charId){
  return lore.stories.filter(s=>(s.characterIds||[]).includes(charId));
}

/* ---------- connections (DATA_MODEL.md §2) ----------
   Each edge is stored once, directed; the reverse view is derived here from
   `inverse` (a different label) or `symmetric` (the same label both ways) —
   curation never writes the same fact twice. */
function connectionsFor(type, id){
  const out = [];
  for(const c of connections){
    if(c.fromType===type && c.fromId===id){
      out.push({relationship:c.relationship, otherType:c.toType, otherId:c.toId});
    }else if(c.toType===type && c.toId===id){
      const rel = c.symmetric ? c.relationship : (c.inverse || c.relationship);
      out.push({relationship:rel, otherType:c.fromType, otherId:c.fromId});
    }
  }
  return out;
}
function characterRelationships(charId){
  return connectionsFor('character', charId)
    .filter(x=>x.otherType==='character')
    .map(x=>({type:x.relationship, who:findChar(x.otherId)}))
    .filter(x=>x.who);
}

/* ---------- motifs (DATA_MODEL.md §2) ----------
   A Motif carries no links of its own; every instance is a Connection
   (motif -> story|character|verse, "instance of"), so these fall straight
   out of connectionsFor() like everything else here. */
function findMotif(id){ return motifs.find(m=>m.id===id); }
function motifInstances(motifId){
  return connectionsFor('motif', motifId)
    .map(x=>({entityType:x.otherType, entity: findByType(x.otherType, x.otherId)}))
    .filter(x=>x.entity);
}
function motifsFor(type, id){
  return connectionsFor(type, id)
    .filter(x=>x.otherType==='motif')
    .map(x=>findMotif(x.otherId))
    .filter(Boolean);
}
function findByType(type, id){
  if(type==='story') return findStory(id);
  if(type==='character') return findChar(id);
  if(type==='verse') return findVerse(id);
  if(type==='topic') return findTopic(id);
  if(type==='era') return findEra(id);
  return null;
}
/* Story<->story links other than motif co-membership — "parallels",
   "foreshadows", etc. */
function relatedStories(storyId){
  return connectionsFor('story', storyId)
    .filter(x=>x.otherType==='story')
    .map(x=>({type:x.relationship, story:findStory(x.otherId)}))
    .filter(x=>x.story);
}
/* Who this person actually shares a scene with — real co-occurrence, not a
   guess from a broad era label. */
function sharesScenesWith(charId){
  const ids = new Set();
  for(const e of lore.lifeEvents){
    const people = e.participantIds || [];
    if(people.includes(charId)) people.forEach(p=>{ if(p!==charId) ids.add(p); });
  }
  for(const s of lore.stories){
    const people = s.characterIds || [];
    if(people.includes(charId)) people.forEach(p=>{ if(p!==charId) ids.add(p); });
  }
  return [...ids].map(findChar).filter(Boolean);
}

/* ---------- spaced repetition (simple) ---------- */
function recordPractice(verseId, correct, challengeTypeId){
  const p = progress[verseId] || defaultProgress();
  const now = new Date().toISOString();
  p.timesReviewed += 1;
  p.lastScore = correct;
  p.lastPracticedAt = now;
  let nextDays;
  if(!correct){ p.status='learning'; nextDays=1; }
  else if(p.status==='new'){ p.status='learning'; nextDays=3; }
  else if(p.status==='learning'){ p.status='review'; nextDays=7; }
  else if(p.status==='review'){ p.status='mastered'; nextDays=14; }
  else { nextDays=21; }
  const d = new Date(); d.setDate(d.getDate()+nextDays);
  p.nextReview = d.toISOString();
  p.history.push({at:now, challengeTypeId: challengeTypeId || null, score: correct ? 1 : 0});
  progress[verseId] = p;
  saveProgress();
}

/* ---------- BROWSE (full corpus) ---------- */
async function loadCorpus(){
  if(corpusStatus === 'loading' || corpusStatus === 'ready') return;
  corpusStatus = 'loading';
  render();
  try{
    const res = await fetch('./data/verses.json');
    if(!res.ok) throw new Error('HTTP ' + res.status);
    corpus = await res.json();
    corpusIndex = buildCorpusIndex(corpus);
    corpusStatus = 'ready';
  }catch(e){
    console.error('corpus load failed', e);
    corpusStatus = 'error';
  }
  render();
}
function buildCorpusIndex(verses){
  const books = new Map();
  for(const v of verses){
    if(!books.has(v.book)) books.set(v.book, {book:v.book, count:0, chapterMap:new Map()});
    const b = books.get(v.book);
    b.count++;
    b.chapterMap.set(v.chapter, (b.chapterMap.get(v.chapter) || 0) + 1);
  }
  return [...books.values()].map(b => ({
    book: b.book,
    count: b.count,
    chapters: [...b.chapterMap.entries()].sort((a,c)=>a[0]-c[0]).map(([n,count])=>({n, count}))
  }));
}
function searchCorpus(query){
  const needle = query.trim().toLowerCase();
  const hits = [];
  let total = 0;
  for(const v of corpus){
    if(v.text.toLowerCase().includes(needle) || v.reference.toLowerCase().includes(needle)){
      total++;
      if(hits.length < SEARCH_LIMIT) hits.push(v);
    }
  }
  return {hits, total};
}

  return `
    <div class="topbar"><h1>Browse</h1></div>
    <div class="search-wrap">

  `;
}
function renderBrowseResults(){
  if(corpusStatus === 'error') return `<div class="empty"><i class="ti ti-alert-triangle"></i><p>Couldn't load the verse library.</p><button class="btn cta" data-action="retry-corpus">Try again</button></div>`;
  if(corpusStatus !== 'ready') return `<div class="empty"><i class="ti ti-loader"></i><p>Loading the verse library...</p></div>`;

  if(browse.q.trim()){
    const {hits, total} = searchCorpus(browse.q);
    if(!total) return `<div class="empty"><i class="ti ti-mood-empty"></i><p>No verses match "${esc(browse.q)}".</p></div>`;
    return `
      <div class="result-count">${total > hits.length ? `showing ${hits.length} of ${total.toLocaleString()} matches` : `${total} match${total===1?'':'es'}`}</div>
      ${hits.map(renderCorpusVerseCard).join('')}
    `;
  }

  if(browse.book && browse.chapter){
    const verses = corpus.filter(v => v.book===browse.book && v.chapter===browse.chapter);
    return `
      ${renderCrumbs()}
      ${verses.map(renderCorpusVerseCard).join('')}
    `;
  }

  if(browse.book){
    const entry = corpusIndex.find(b => b.book===browse.book);
    return `
      ${renderCrumbs()}
      <div class="chapter-grid">
        ${entry.chapters.map(c=>`<button class="chapter-cell" data-action="browse-chapter" data-n="${c.n}">${c.n}</button>`).join('')}
      </div>
    `;
  }

  return corpusIndex.map(b=>`
    <div class="card tap" data-action="browse-book" data-id="${esc(b.book)}">
      <div class="char-row" style="justify-content:space-between;">
        <div><h3>${esc(b.book)}</h3><div class="meta">${b.chapters.length} chapters</div></div>
        <span class="tag">${b.count.toLocaleString()} verses</span>
      </div>
    </div>`).join('');
}
function renderCrumbs(){
  return `<div class="crumbs">
    <button data-action="browse-root">All books</button>
    ${browse.book ? `<span>›</span>${browse.chapter ? `<button data-action="browse-book" data-id="${esc(browse.book)}">${esc(browse.book)}</button><span>›</span><span>Chapter ${browse.chapter}</span>` : `<span>${esc(browse.book)}</span>`}` : ''}

function renderCorpusVerseCard(v){
  const inLibrary = !!findVerse(v.id);
  return `

      <div class="ref">${esc(v.reference)}</div>
      <div class="text">${esc(v.text)}</div>

  const src = corpus.find(v => v.id===id);

  const verse = {

    verse: src.verse, text: src.text, translation: src.translation,
    topicIds: [], characterIds: [], metadata: {}
  };
  content.verses.push(verse);
  data.verses.push(verse);
  saveContent();

}

/* ---------- PRACTICE ----------
   Challenge types are pluggable and data-described (DATA_MODEL.md §3), not a
   hardcoded switch. Each type in CHALLENGE_TYPES implements:
     build(entity, config)  -> state   opaque per-attempt state
     render(state)          -> html    reads state.checked for the graded view
     check(state)           -> { allCorrect, correctCount, total }
                                       reads its own DOM, mutates state
     score(state)           -> 0..1
     interact(state, ds)    optional; handle a tap on an element the type
                            rendered with data-action="practice-interact"
                            (ds = that element's dataset). Mutates state.
                            If it sets state.checked itself (a self-graded
                            type finalizing), the caller does the same
                            session bookkeeping check() would have.
     controls(state)        optional; HTML for the action-button area while
                            !state.checked. Replaces the generic "Check"
                            button — for a type whose finalization isn't a
                            single auto-graded tap (self-graded reveal).
   Adding matching / ordering = another entry here, no changes to
   startPractice / renderPractice / checkPractice.
*/
const CHALLENGE_TYPES = {
  challenge_fill_blank: {
    id: 'challenge_fill_blank',
    name: 'Fill in the blank',
    appliesToEntityTypes: ['verse'],
    config: { blankRatio: 0.3, maxBlanks: 4, minWordLength: 4 },
    enabled: true,
    build(verse, config){
      const words = verse.text.split(' ');
      const eligible = words.map((w,i)=>i)
        .filter(i => words[i].replace(/[^a-zA-Z]/g,'').length >= config.minWordLength);
      const count = Math.max(1, Math.min(config.maxBlanks, Math.round(eligible.length * config.blankRatio)));
      const pool = [...eligible];
      const blanks = [];
      while(blanks.length < count && pool.length){
        blanks.push(pool.splice(Math.floor(Math.random() * pool.length), 1)[0]);
      }
      blanks.sort((a,b)=>a-b);
      return { words, blanks, checked:false, given:[], results:[], allCorrect:false };
    },
    render(state){
      return state.words.map((w,i)=>{
        const bi = state.blanks.indexOf(i);
        if(bi === -1) return esc(w);
        const cls = state.checked ? (state.results[bi] ? 'correct' : 'wrong') : '';
        const size = Math.max(3, w.replace(/[^a-zA-Z]/g,'').length);
        const val = state.checked ? ` value="${esc(state.given[bi] || '')}"` : '';
        return `<span class="blank ${cls}"><input type="text" data-blank="${i}"${val} ${state.checked?'readonly':''} style="width:${size*13}px" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"></span>`;
      }).join(' ');
    },
    check(state){
      const norm = s => s.trim().toLowerCase().replace(/[^a-z0-9']/g,'');
      let allCorrect = true;
      state.blanks.forEach((wi, bi)=>{
        const input = document.querySelector(`[data-blank="${wi}"]`);
        const raw = input ? (input.value || '') : '';
        const ok = norm(raw) === norm(state.words[wi]);
        state.given[bi] = raw;
        state.results[bi] = ok;
        if(!ok) allCorrect = false;
      });
      state.checked = true;
      state.allCorrect = allCorrect;
      return { allCorrect, correctCount: state.results.filter(Boolean).length, total: state.blanks.length };
    },
    score(state){
      if(!state.results.length) return 0;
      return state.results.filter(Boolean).length / state.results.length;
    }
  },

  challenge_scramble: {
    id: 'challenge_scramble',
    name: 'Unscramble',
    appliesToEntityTypes: ['verse'],
    config: { maxWords: 14 },
    enabled: true,
    build(verse, config){
      const words = verse.text.split(' ');
      // For a long verse, scramble only a contiguous window and keep the rest
      // as fixed context so the task stays doable.
      let start = 0, len = words.length;
      if(words.length > config.maxWords){
        len = config.maxWords;
        start = Math.floor(Math.random() * (words.length - len + 1));
      }
      const pool = [];
      for(let i = start; i < start + len; i++) pool.push(i);
      for(let i = pool.length - 1; i > 0; i--){
        const j = Math.floor(Math.random() * (i + 1));
        [pool[i], pool[j]] = [pool[j], pool[i]];
      }
      // avoid handing back an already-sorted "scramble"
      if(len > 1 && pool.every((wi, k) => wi === start + k)) pool.reverse();
      return { words, start, len, pool, picked:[], checked:false, results:[], allCorrect:false };
    },
    interact(state, ds){
      if(ds.pick !== undefined && ds.pick !== ''){
        const p = +ds.pick;
        state.picked.push(state.pool[p]);
        state.pool.splice(p, 1);
      }else if(ds.unpick !== undefined && ds.unpick !== ''){
        const p = +ds.unpick;
        state.pool.push(state.picked[p]);
        state.picked.splice(p, 1);
      }
    },
    render(state){
      const {words, start, len} = state;
      const prefix = words.slice(0, start).join(' ');
      const suffix = words.slice(start + len).join(' ');
      if(state.checked){
        const seq = [];
        for(let i = 0; i < len; i++){
          const wi = state.picked[i];
          const cls = state.results[i] ? 'chip-correct' : 'chip-wrong';
          seq.push(`<span class="chip ${cls}">${esc(wi === undefined ? '—' : words[wi])}</span>`);
        }
        return `${prefix ? `<span class="scramble-fixed">${esc(prefix)} </span>` : ''}${seq.join(' ')}${suffix ? `<span class="scramble-fixed"> ${esc(suffix)}</span>` : ''}`;
      }
      const built = state.picked
        .map((wi, pi) => `<button class="chip picked" data-action="practice-interact" data-unpick="${pi}">${esc(words[wi])}</button>`)
        .join(' ');
      const pool = state.pool
        .map((wi, pi) => `<button class="chip" data-action="practice-interact" data-pick="${pi}">${esc(words[wi])}</button>`)
        .join(' ');
      return `
        ${prefix ? `<div class="scramble-fixed">${esc(prefix)} …</div>` : ''}
        <div class="scramble-build">${built || '<span class="scramble-hint">tap the words below in order</span>'}</div>
        <div class="scramble-pool">${pool || '<span class="scramble-hint">all words placed — tap Check</span>'}</div>
        ${suffix ? `<div class="scramble-fixed">… ${esc(suffix)}</div>` : ''}
      `;
    },
    check(state){
      const {words, start, len} = state;
      const results = [];
      for(let i = 0; i < len; i++){
        const wi = state.picked[i];
        results[i] = wi !== undefined && words[wi] === words[start + i];
      }
      const allCorrect = state.picked.length === len && results.every(Boolean);
      state.results = results;
      state.checked = true;
      state.allCorrect = allCorrect;
      return { allCorrect, correctCount: results.filter(Boolean).length, total: len };
    },
    score(state){
      if(!state.len) return 0;
      return state.results.filter(Boolean).length / state.len;
    }
  },

  challenge_first_letters: {
    id: 'challenge_first_letters',
    name: 'Progressive reveal',
    appliesToEntityTypes: ['verse'],
    config: {},
    enabled: true,
    // Self-graded: closer to how memorization actually works than an
    // auto-graded type. Shown only the first letter of every word, the user
    // recalls the verse from memory, reveals it, and judges their own recall
    // — there's no DOM input to check a string against.
    build(verse){
      return { words: verse.text.split(' '), revealed:false, checked:false, allCorrect:false };
    },
    render(state){
      if(!state.revealed) return state.words.map(hintWord).join(' ');
      return esc(state.words.join(' '));
    },
    interact(state, ds){
      if(ds.reveal !== undefined){
        state.revealed = true;
      }else if(ds.selfgrade !== undefined){
        state.checked = true;
        state.allCorrect = ds.selfgrade === 'correct';
      }
    },
    controls(state){
      if(!state.revealed){
        return `<button class="btn primary block" data-action="practice-interact" data-reveal="1"><i class="ti ti-eye"></i> Reveal</button>`;
      }
      return `<div style="display:flex;gap:8px;">
        <button class="btn block" style="flex:1;" data-action="practice-interact" data-selfgrade="wrong">Missed it</button>
        <button class="btn primary block" style="flex:1;" data-action="practice-interact" data-selfgrade="correct">Got it</button>
      </div>`;
    },
    score(state){ return state.allCorrect ? 1 : 0; }
  },

  challenge_verse_ladder: {
    id: 'challenge_verse_ladder',
    name: 'Verse ladder',
    appliesToEntityTypes: ['verse'],
    config: { stageRatios: [0, 0.25, 0.5, 0.75, 1] },
    enabled: true,
    // Self-graded, like Progressive reveal — but words disappear in
    // graduated steps (0% / 25% / 50% / 75% / 100% hidden) instead of one
    // reveal/hide toggle. A fixed random word order decides which words go
    // first and stays fixed for the whole climb, so stage N's hidden set is
    // always a superset of stage N-1's — nothing that's already hidden ever
    // reappears. At the last rung (fully hidden, first-letters only, via
    // the same hintWord() used by Progressive reveal) the user recalls the
    // verse from memory and self-grades.
    build(verse, config){
      const words = verse.text.split(' ');
      const order = words.map((_,i)=>i);
      for(let i = order.length - 1; i > 0; i--){
        const j = Math.floor(Math.random() * (i + 1));
        [order[i], order[j]] = [order[j], order[i]];
      }
      return { words, order, stage: 0, stageRatios: config.stageRatios, checked:false, allCorrect:false };
    },
    render(state){
      const {words, order, stage, stageRatios} = state;
      const lastStage = stage >= stageRatios.length - 1;
      const hideCount = Math.round(words.length * stageRatios[stage]);
      const hidden = new Set(order.slice(0, hideCount));
      const label = stage === 0 ? 'Full text' : lastStage ? 'Recall time' : `${Math.round(stageRatios[stage]*100)}% hidden`;
      const body = words.map((w,i)=> hidden.has(i) ? hintWord(w) : esc(w)).join(' ');
      return `<div class="field-hint" style="margin-bottom:8px;">${esc(label)}</div>${body}`;
    },
    interact(state, ds){
      if(ds.advance !== undefined){
        state.stage = Math.min(state.stage + 1, state.stageRatios.length - 1);
      }else if(ds.selfgrade !== undefined){
        state.checked = true;
        state.allCorrect = ds.selfgrade === 'correct';
      }
    },
    controls(state){
      if(state.stage < state.stageRatios.length - 1){
        return `<button class="btn primary block" data-action="practice-interact" data-advance="1"><i class="ti ti-arrow-down"></i> Hide more</button>`;
      }
      return `<div style="display:flex;gap:8px;">
        <button class="btn block" style="flex:1;" data-action="practice-interact" data-selfgrade="wrong">Missed it</button>
        <button class="btn primary block" style="flex:1;" data-action="practice-interact" data-selfgrade="correct">Got it</button>
      </div>`;
    },
    score(state){ return state.allCorrect ? 1 : 0; }
  }
};
/* First letter of each word kept, every other letter blanked to an
   underscore; everything else (spacing within the word, punctuation,
   apostrophes) left exactly as-is. Handles "don't" / "Yahweh's" correctly
   because it walks characters rather than assuming letters are contiguous. */
function hintWord(word){
  let seenFirst = false;
  return esc([...word].map(ch=>{
    if(!/[a-zA-Z]/.test(ch)) return ch;
    if(!seenFirst){ seenFirst = true; return ch; }
    return '_';
  }).join(''));
}
function challengeType(id){ return CHALLENGE_TYPES[id] || CHALLENGE_TYPES.challenge_fill_blank; }
function verseChallengeTypes(){ return Object.values(CHALLENGE_TYPES).filter(t => t.enabled && t.appliesToEntityTypes.includes('verse')); }

function startPractice(verseIds, challengeTypeId){
  const ids = (verseIds || []).filter(id => findVerse(id));
  if(!ids.length) return;
  const type = challengeType(challengeTypeId || settings.challengeTypeId);
  session = {
    challengeTypeId: type.id,
    queue: ids.map(id => ({ verseId: id, state: type.build(findVerse(id), type.config) })),
    index: 0,
    results: []
  };
  go('practice');
}
function renderPractice(){
  if(!session || session.index >= session.queue.length){
    const results = session ? session.results : [];
    const total = results.length;
    const correct = results.filter(r => r.allCorrect).length;
    session = null;
    return `
      <div class="topbar"><h1>Session complete</h1></div>
      <div class="card" style="text-align:center;padding:28px 16px;">
        <i class="ti ti-confetti" style="font-size:36px;color:var(--gold-deep);"></i>
        <h2 style="margin-top:10px;">${correct} / ${total} correct</h2>
        <p style="color:var(--ink-soft);margin-top:6px;">Next review dates have been updated.</p>
        <button class="btn primary" style="margin-top:18px;" data-action="go-home">Done</button>
      </div>
    `;
  }
  const type = challengeType(session.challengeTypeId);
  const item = session.queue[session.index];
  const v = findVerse(item.verseId);
  const st = item.state;
  const progressPct = Math.round((session.index / session.queue.length) * 100);
  const lastOne = session.index + 1 >= session.queue.length;
  return `
    <div class="screen-head">
      <button class="back-btn" data-action="exit-practice"><i class="ti ti-x"></i></button>
      <h2>Practice</h2>
    </div>
    <div class="progress-track"><div class="progress-fill" style="width:${progressPct}%"></div></div>
    ${st.checked ? `<div class="result-banner ${st.allCorrect?'good':'bad'}"><i class="ti ${st.allCorrect?'ti-check':'ti-refresh'}"></i>${st.allCorrect ? 'Nice, got it!' : 'Close — review this one again soon.'}</div>` : ''}
    <div class="card">
      <div class="ref" style="font-size:12px;color:var(--gold-deep);font-weight:600;margin-bottom:10px;">${esc(v.reference)} <span style="color:var(--ink-faint);font-weight:500;">· ${esc(type.name)}</span></div>
      <div class="practice-verse">${type.render(st)}</div>
    </div>
    ${st.checked
      ? `<button class="btn primary block" data-action="next-practice"><i class="ti ti-arrow-right"></i> ${lastOne ? 'Finish' : 'Continue'}</button>`
      : type.controls
      ? type.controls(st)
      : `<button class="btn primary block" data-action="check-practice">Check</button>`}
  `;
}

/* ---------- form save handlers ---------- */
function saveVerse(){
  const ref = document.getElementById('f-ref').value.trim();
  const text = document.getElementById('f-text').value.trim();
  const topicsRaw = document.getElementById('f-topics').value.trim();
  const errEl = document.getElementById('form-err');
  if(!ref || !text){ errEl.textContent = 'Enter a reference and verse text.'; return; }
  const topicIds = [];
  if(topicsRaw){
    topicsRaw.split(',').map(s=>s.trim()).filter(Boolean).forEach(name=>{
      let t = data.topics.find(t=>t.name.toLowerCase()===name.toLowerCase());
      if(!t){
        t = {id:'topic_'+name.toLowerCase().replace(/[^a-z0-9]+/g,'_'), name: name.charAt(0).toUpperCase()+name.slice(1), description:'', relatedTopicIds:[], metadata:{}};
        content.topics.push(t);
        data.topics.push(t);
      }
      topicIds.push(t.id);
    });
  }
  const verse = {id:'verse_'+Date.now(), reference:ref, text, translation:'', topicIds, characterIds:[], metadata:{}};
  content.verses.push(verse);
  data.verses.push(verse);
  saveContent();
  go('home');
}
function saveCharacter(){
  const name = document.getElementById('c-name').value.trim();
  const rolesRaw = document.getElementById('c-roles').value.trim();
  const era = document.getElementById('c-era').value.trim();
  const summary = document.getElementById('c-summary').value.trim();
  const errEl = document.getElementById('cform-err');
  if(!name){ errEl.textContent = 'Enter a name.'; return; }
  const roles = rolesRaw ? rolesRaw.split(',').map(s=>s.trim()).filter(Boolean) : [];
  const character = {id:'char_'+Date.now(), name, roles, era, summary, verseIds:[], metadata:{}};
  content.characters.push(character);
  data.characters.push(character);
  saveContent();
  go('home');
}

/* ---------- events ---------- */
let searchTimer = null;
function bindEvents(root){
  (root || document).querySelectorAll('[data-action]').forEach(el=>{
    el.addEventListener('click', onAction);
  });
  // A partial re-render only needs its own subtree wired up; the rest of the
  // page still has its listeners and would otherwise get duplicates.
  if(root) return;

  const vf = document.getElementById('verse-form');
  if(vf) vf.addEventListener('submit', e=>{ e.preventDefault(); saveVerse(); });
  const cf = document.getElementById('char-form');
  if(cf) cf.addEventListener('submit', e=>{ e.preventDefault(); saveCharacter(); });
  const importInput = document.getElementById('import-file-input');
  if(importInput) importInput.addEventListener('change', ()=>{
    const file = importInput.files && importInput.files[0];
    if(file) importFromFile(file);
    importInput.value = ''; // allow re-selecting the same file (e.g. after a failed import)
  });

  // Search updates only the results container, so the input keeps focus and
  // the caret doesn't jump while typing.
  const search = document.getElementById('browse-search');
  if(search) search.addEventListener('input', ()=>{
    browse.q = search.value;
    browse.book = null;
    browse.chapter = null;
    clearTimeout(searchTimer);
    searchTimer = setTimeout(()=>{
      const results = document.getElementById('browse-results');
      if(!results) return;
      results.innerHTML = renderBrowseResults();
      bindEvents(results);
    }, 140);
  });
}
function refreshBrowseResults(){
  const results = document.getElementById('browse-results');
  if(!results){ render(); return; }
  results.innerHTML = renderBrowseResults();
  bindEvents(results);
}
function onAction(e){
  const el = e.currentTarget;
  const action = el.dataset.action;
  const id = el.dataset.id;
  if(action==='go-home') go('home');
  else if(action==='go-browse'){ go('browse'); loadCorpus(); }
  else if(action==='go-add-verse') go('addVerse');
  else if(action==='go-add-character') go('addCharacter');
  else if(action==='go-settings') go('settings');
  else if(action==='open-verse') go('verseDetail', {id, from: view});
  else if(action==='verse-back'){ const f = view.params.from; if(f && f.screen) go(f.screen, f.params); else go('home'); }
  else if(action==='start-practice-verse') startPractice([id]);
  else if(action==='open-topic') go('topicDetail', {id});
  else if(action==='back-to-topics') go('topics');
  else if(action==='open-character') go('characterDetail', {id});
  else if(action==='back-to-characters') go('characters');
  else if(action==='open-stories') go('stories');
  else if(action==='open-story') go('storyDetail', {id, from: view});
  else if(action==='story-back'){ const f = view.params.from; if(f && f.screen) go(f.screen, f.params); else go('stories'); }
  else if(action==='open-motifs') go('motifs');
  else if(action==='open-motif') go('motifDetail', {id, from: view});
  else if(action==='motif-back'){ const f = view.params.from; if(f && f.screen) go(f.screen, f.params); else go('motifs'); }
  else if(action==='start-practice') startPractice(practiceQueue(dueVerses()));
  else if(action==='start-practice-topic') startPractice(practiceQueue(data.verses.filter(v=>v.topicIds.includes(id))));
  else if(action==='show-all-verses'){ homeLimit = Infinity; render(); }
  else if(action==='exit-practice'){ session=null; go('home'); }
  else if(action==='check-practice') checkPractice();
  else if(action==='next-practice'){ if(session) session.index++; render(); }
  else if(action==='practice-interact') practiceInteract(el);
  else if(action==='set-challenge'){ settings.challengeTypeId = id; saveSettings(); render(); }
  else if(action==='browse-book'){ browse.book = id; browse.chapter = null; refreshBrowseResults(); }
  else if(action==='browse-chapter'){ browse.chapter = +el.dataset.n; refreshBrowseResults(); }
  else if(action==='browse-root'){ browse.book = null; browse.chapter = null; refreshBrowseResults(); }
  else if(action==='add-from-corpus') addFromCorpus(id);
  else if(action==='retry-corpus'){ corpusStatus = 'idle'; loadCorpus(); }
  else if(action==='sync-now'){ if(account) pullAndMerge(); }
  else if(action==='export-data') downloadExport();
  else if(action==='trigger-import'){ const inp = document.getElementById('import-file-input'); if(inp) inp.click(); }
}
function practiceInteract(el){
  if(!session) return;
  const type = challengeType(session.challengeTypeId);
  const item = session.queue[session.index];
  if(item.state.checked || !type.interact) return;
  type.interact(item.state, el.dataset);
  // A type may finalize grading itself from inside interact() (e.g. a
  // self-graded type's "Got it" / "Missed it" tap, rather than the generic
  // Check button). If it just flipped checked to true, do the same session
  // bookkeeping checkPractice() would have done.
  if(item.state.checked){
    session.results.push({
      verseId: item.verseId,
      allCorrect: !!item.state.allCorrect,
      score: type.score(item.state)
    });
    recordPractice(item.verseId, !!item.state.allCorrect, session.challengeTypeId);
  }
  render();
}
function checkPractice(){
  if(!session) return;
  const type = challengeType(session.challengeTypeId);
  const item = session.queue[session.index];
  if(item.state.checked) return;
  const summary = type.check(item.state);
  session.results.push({
    verseId: item.verseId,
    allCorrect: summary.allCorrect,
    score: type.score(item.state)
  });
  recordPractice(item.verseId, summary.allCorrect, session.challengeTypeId);
  render();
}

/* nav bar */
document.querySelectorAll('.navitem').forEach(b=>{
  b.addEventListener('click', ()=>{
    session = null;
    go(b.dataset.nav);
    if(b.dataset.nav === 'browse') loadCorpus();  // no-op once loaded
  });
});

/* one-time migration from the pre-split single blob (rooted-app-data) */
async function migrateLegacy(seedContent){
  const legacy = await loadStored(LEGACY_KEY);
  if(!legacy || !Array.isArray(legacy.verses)) return null;
  const seedIds = t => new Set((seedContent[t]||[]).map(e=>e.id));
  const vIds = seedIds('verses'), tIds = seedIds('topics'), cIds = seedIds('characters');
  const overlay = {
    verses:     legacy.verses.filter(v=>!vIds.has(v.id)).map(stripProgress),
    topics:     (legacy.topics||[]).filter(t=>!tIds.has(t.id)),
    characters: (legacy.characters||[]).filter(c=>!cIds.has(c.id))
  };
  const prog = {};
  for(const v of legacy.verses){
    const p = v.progress;
    if(p && (p.timesReviewed || p.nextReview || p.status && p.status!=='new')){
      prog[v.id] = normalizeProgress(p);
    }
  }
  try{
    await window.storage.set(CONTENT_KEY, JSON.stringify(overlay), false);
    await window.storage.set(PROGRESS_KEY, JSON.stringify(prog), false);
  }catch(e){ console.error('legacy migration save failed', e); }
  return {overlay, prog};
}

/* ---------- boot ---------- */
(async function boot(){
  document.getElementById('app').innerHTML = `<div class="empty" style="padding-top:80px;"><i class="ti ti-leaf"></i><p>Loading...</p></div>`;
  seed = await loadSeed();
  let storedContent = await loadStored(CONTENT_KEY);
  let storedProgress = await loadStored(PROGRESS_KEY);

  if(!storedContent && !storedProgress){
    const migrated = await migrateLegacy(seed);
    if(migrated){ storedContent = migrated.overlay; storedProgress = migrated.prog; }
  }

  content = Object.assign(emptyOverlay(), storedContent || {});
  progress = {};
  for(const [id, p] of Object.entries(storedProgress || {})) progress[id] = normalizeProgress(p);

  const storedSettings = await loadStored(SETTINGS_KEY);
  settings = Object.assign({challengeTypeId:'challenge_fill_blank', dailyGoal:10}, storedSettings || {});
  if(!CHALLENGE_TYPES[settings.challengeTypeId]) settings.challengeTypeId = 'challenge_fill_blank';

  const storedSyncMeta = await loadStored(SYNC_META_KEY);
  syncMeta = Object.assign({updatedAt: null}, storedSyncMeta || {});

  data = mergeContent(seed, content);
  lore = await loadStories();
  connections = await loadConnections();
  motifs = await loadMotifs();
  render();

  // Cloud sync is optional and never blocks first paint — the app is fully
  // usable offline the instant the line above runs. This runs after, in the
  // background, and only touches anything if the visitor is signed in.
  account = await loadAccount();
  if(account) await pullAndMerge();
})();

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}
