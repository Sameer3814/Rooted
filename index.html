  .sp-start-bubble-inner{position:relative;padding:8px 13px;border-radius:12px;background:var(--sp-surface);border:2px solid var(--sp-line);font:900 14px Figtree;letter-spacing:.04em;color:#000;}
  .sp-start-bubble-inner::after{content:'';position:absolute;left:50%;bottom:-7px;width:10px;height:10px;margin-left:-6px;background:var(--sp-surface);border-right:2px solid var(--sp-line);border-bottom:2px solid var(--sp-line);transform:rotate(45deg);}
  @keyframes spBob{0%,100%{transform:translateY(0);}50%{transform:translateY(-6px);}}
  .sp-due-badge{position:absolute;top:-6px;right:-8px;width:26px;height:26px;border-radius:50%;background:var(--sp-cta);border:3px solid var(--sp-ground);display:grid;place-items:center;color:var(--sp-ctaink);pointer-events:none;}
  .sp-chest-btn{width:76px;height:68px;padding:0;border:0;background:none;cursor:pointer;}
  .sp-chest-btn.sp-ready{animation:spWiggle 2.4s ease-in-out infinite;}
  @keyframes spWiggle{0%,80%,100%{transform:rotate(0);}84%{transform:rotate(-8deg);}88%{transform:rotate(8deg);}92%{transform:rotate(-5deg);}96%{transform:rotate(4deg);}}
  .sp-mascot{position:absolute;top:-30px;width:80px;height:80px;pointer-events:none;animation:spBob 2.4s ease-in-out infinite;}
  .sp-popover{position:absolute;left:0;right:0;top:88px;z-index:20;padding:16px;border-radius:18px;box-shadow:0 5px 0 rgba(0,0,0,.18);animation:spPop .22s both;}
  .sp-popover::before{content:'';position:absolute;top:-8px;left:calc(50% - 8px);width:16px;height:16px;transform:rotate(45deg);border-radius:3px;background:inherit;}
  @keyframes spPop{0%{transform:scale(.6);opacity:0;}60%{transform:scale(1.08);opacity:1;}100%{transform:scale(1);}}
  .sp-popover .sp-pop-title{font:600 20px 'Baloo 2';}
  .sp-popover .sp-pop-sub{font:700 14.5px/1.4 Figtree;opacity:.9;margin-top:4px;}
  .sp-popover .sp-pop-btn{position:relative;margin-top:14px;width:100%;height:48px;border:0;border-radius:14px;font:900 15px Figtree;letter-spacing:.04em;cursor:pointer;}
  .sp-popover .sp-pop-btn:active{transform:translateY(3px);}
  .sp-end-node{display:flex;flex-direction:column;align-items:center;gap:12px;padding:30px 20px 0;text-align:center;}
  .sp-end-add{width:70px;height:64px;border-radius:50%;border:3px dashed var(--sp-lockd);background:var(--sp-soft);color:var(--sp-lockic);display:grid;place-items:center;cursor:pointer;}
  /* Replaces the old floating FAB (position:fixed;bottom:104px), which
     always sat on top of whatever path content happened to be scrolled
     underneath it — unit headers, popovers — reported as "awkwardly
     placed" more than once. A non-scrolling banner between the topbar
     and the scroll area can never collide with anything, by
     construction, instead of needing z-index/visibility games to avoid
     it (owner report, 2026-11-10). */
  /* position:relative;z-index:2 — same fix as item 167: a plain static
     flex child paints BEHIND a position:absolute sibling with
     z-index:auto (.shepherd-backdrop) regardless of DOM order, so
     without this the banner existed correctly in the DOM (confirmed
     via getBoundingClientRect) but was invisible in every screenshot. */
  .sp-review-banner{position:relative;z-index:2;flex:none;margin:0 18px 14px;width:calc(100% - 36px);height:48px;padding:0 16px;border:0;border-radius:14px;background:var(--sp-cta);color:var(--sp-ctaink);box-shadow:0 4px 0 var(--sp-ctad);display:flex;align-items:center;gap:8px;font:800 14px Figtree;cursor:pointer;}
  .sp-review-banner:active{transform:translateY(3px);}
  .sp-review-banner .sp-review-badge{margin-left:auto;}
  .sp-review-badge{min-width:22px;height:22px;padding:0 6px;box-sizing:border-box;border-radius:11px;background:#f0474d;color:#fff;font:900 12.5px/22px Figtree;}
  .sp-toast{position:fixed;left:50%;top:70px;z-index:25;transform:translateX(-50%);display:flex;align-items:center;gap:8px;padding:10px 16px;border-radius:14px;background:var(--sp-surface);border:2px solid var(--sp-line);box-shadow:0 4px 0 var(--sp-line);font:900 15px Figtree;color:var(--sp-ink);white-space:nowrap;animation:spPop .3s both;}
  /* ---------- Shepherd's Path: lesson complete / streak screens (item 160) ---------- */
  /* Bottom padding clears the floating pill nav — without it the
     CONTINUE button (pushed to the bottom via margin-top:auto on
     .sp-complete-cta) sits exactly where the nav floats, and the nav
     visually intercepts every tap on it (confirmed with a real
     headless-browser click — Playwright's own click simulation
     reported ".navitem" catching the pointer event, item 167). */
  .sp-complete-screen{background:radial-gradient(130% 55% at 50% 0%,var(--sp-sky1),var(--sp-ground) 75%);padding:48px 22px calc(110px + env(safe-area-inset-bottom));align-items:center;overflow-y:auto;touch-action:pan-y;box-sizing:border-box;}
  /* Every other direct child needs its own stacking position so it
     paints above .shepherd-backdrop (position:absolute, z-index:auto)
     — a plain static box paints BEFORE a position:absolute sibling
     with z-index:auto regardless of DOM order (CSS2.1 §E.2), which is
     why item 167's bug hid the session screen's header/body content;
     same fix here for the complete/streak screens' own direct
     children, generically, instead of listing each one by name. */
  .sp-complete-screen > *:not(.shepherd-backdrop){position:relative;z-index:2;}
  .sp-complete-title{font:600 32px 'Baloo 2';color:var(--sp-ctat);margin-top:20px;text-align:center;}
  .sp-levelup-badge{margin-top:14px;padding:6px 16px;border-radius:999px;background:#c49aff;color:#2a1049;font:800 13px Figtree;letter-spacing:.04em;animation:spPop .4s both;}
  .sp-complete-sub{font:700 16px/1.45 Figtree;color:var(--sp-sub);margin-top:6px;max-width:300px;text-align:center;}
  .sp-stat-grid{width:100%;display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:28px;}
  .sp-stat-card{border-radius:16px;padding:2px;}
  .sp-stat-label{padding:5px 4px 6px;text-align:center;font:900 11px Figtree;letter-spacing:.06em;}
  .sp-stat-value{background:var(--sp-surface);border-radius:14px;padding:14px 4px;display:flex;align-items:center;justify-content:center;gap:5px;font:600 22px 'Baloo 2';}
  .sp-complete-cta{width:100%;height:54px;border:0;border-radius:16px;background:var(--sp-cta);color:var(--sp-ctaink);box-shadow:0 5px 0 var(--sp-ctad);font:900 16px Figtree;letter-spacing:.05em;cursor:pointer;margin-top:auto;}
  .sp-complete-cta:active{transform:translateY(4px);}
  /* Confetti burst (Phase 3, item 163) — real color, a scoped Shepherd-
     only exception same as the rest of this screen's palette; not the
     app's own white/gold .spark burst (renderSparks(), the generic
     session-complete card's confetti), which stays monochrome under
     the standing black-and-white rule. */
  .sp-confetti{position:absolute;left:50%;top:50%;width:0;height:0;pointer-events:none;}
  .sp-confetti-piece{position:absolute;left:0;top:0;animation:spBurst ease-out both;}
  @keyframes spBurst{
    0%{opacity:1;transform:translate(0,0) scale(.4);}
    12%{opacity:1;}
    100%{opacity:0;transform:translate(var(--dx),calc(var(--dy) + 80px)) rotate(var(--rot));}
  }
  .sp-streak-flame{margin-top:10px;}
  .sp-streak-num{font:600 72px/1 'Baloo 2';color:#f08a00;margin-top:8px;}
  .sp-streak-label{font:600 26px 'Baloo 2';color:#f08a00;margin-top:2px;}
  .sp-streak-card{width:100%;margin-top:26px;padding:16px;box-sizing:border-box;border-radius:18px;border:2px solid var(--sp-line);}
  .sp-week-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
  .sp-week-day{display:flex;flex-direction:column;align-items:center;gap:8px;}
  .sp-week-day .sp-day-label{font:900 12px Figtree;color:var(--sp-sub);}
  .sp-week-day.sp-today .sp-day-label{color:#f08a00;}
  .sp-week-day .sp-day-dot{width:32px;height:32px;border-radius:50%;background:#ff9600;display:grid;place-items:center;color:#fff;}
  .sp-streak-footer{margin-top:14px;padding-top:12px;border-top:2px solid var(--sp-line);font:700 14.5px/1.45 Figtree;color:var(--sp-sub);text-align:center;}

  /* ---------- Shepherd's Path: in-progress session chrome (Phase 2,
     item 161) — restyles the surrounding header/mascot/feedback-sheet
     chrome around each exercise; the exercise's own markup
     (renderChallengeBody(), unchanged) still renders in the app's usual
     dark palette regardless of this screen's own light/dark toggle — a
     deliberate, flagged seam, not an oversight (see DATA_MODEL.md §8,
     item 161). ---------- */
  .sp-session-screen{padding-top:18px;box-sizing:border-box;}
  /* Every direct child painted alongside the backdrop needs an explicit
     position+z-index — a plain static in-flow box paints BEFORE a
     position:absolute sibling with z-index:auto in CSS's stacking
     order regardless of DOM order (CSS2.1 §E.2, category 3 vs 6), so
     without this the backdrop silently painted over the header/body/
     footer content despite coming first in the HTML (verified with a
     real headless-browser screenshot, not just reading the code — see
     DATA_MODEL.md §8, item 167). The Path screen's own .shepherd-
     topbar/.shepherd-scroll already had this; the session screen
     never did. */
  .sp-session-header{position:relative;z-index:2;flex:none;display:flex;align-items:center;gap:14px;padding:0 18px;}
  .sp-session-close{width:32px;height:32px;flex:none;border:0;background:none;color:var(--sp-lockic);display:grid;place-items:center;cursor:pointer;padding:0;}
  .sp-session-progress-track{flex:1;height:16px;border-radius:8px;background:var(--sp-line);overflow:hidden;}
  .sp-session-progress-fill{height:100%;border-radius:8px;background:var(--sp-cta);transition:width .5s cubic-bezier(.3,1.4,.5,1);}
  .sp-session-hearts{flex:none;display:flex;align-items:center;gap:5px;font:900 16px Figtree;color:#f0474d;}
  .sp-session-combo-row{position:relative;z-index:2;flex:none;height:24px;padding:6px 18px 0;box-sizing:border-box;}
  .sp-combo-line{display:inline-flex;align-items:center;gap:4px;font:900 12.5px Figtree;letter-spacing:.06em;color:#f08a00;animation:spPop .3s both;}
  /* The only internally-scrolling part of the session screen (item
     165) — header/combo-row above and the Check/controls footer below
     both stay flex:none, always visible, same reasoning as the Path
     screen's topbar. */
  .sp-session-body{position:relative;z-index:2;flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;padding:4px 18px 16px;}
  .sp-new-tag{display:inline-flex;align-items:center;gap:6px;margin-bottom:8px;font:900 12.5px Figtree;letter-spacing:.06em;color:var(--sp-acc);}
  /* max-width keeps a 2-line heading (e.g. "Type the first letter of
     each word") from running under the sun/moon in the backdrop's
     top-right corner — caught visually with a real screenshot, item
     168. */
  .sp-session-heading{font:600 25px/1.15 'Baloo 2';color:var(--sp-ink);max-width:calc(100% - 56px);}
  .sp-session-mascot-row{display:flex;align-items:flex-end;gap:10px;margin:16px 0 20px;}
  .sp-session-mascot{flex:none;width:72px;height:72px;}
  .sp-session-bubble{position:relative;flex:1;padding:12px 14px;border-radius:18px;border:2px solid var(--sp-line);background:var(--sp-surface);}
  .sp-bubble-tail{position:absolute;left:-8px;bottom:18px;width:12px;height:12px;background:var(--sp-surface);border-left:2px solid var(--sp-line);border-bottom:2px solid var(--sp-line);transform:rotate(45deg);}
  .sp-bubble-serif{font:400 18px/1.45 Newsreader,Georgia,serif;color:var(--sp-ink);}
  .sp-bubble-plain{font:800 16px/1.35 Figtree;color:var(--sp-ink);}
  /* Bottom padding clears the floating pill nav (.navbar is
     position:fixed;bottom:calc(24px + safe-area);height:68px, so it
     occupies roughly the screen's own bottom ~100px regardless of
     this screen's own layout) — without it the Check/controls buttons
     render right behind the nav (verified with a real screenshot, item
     167). */
  .sp-session-footer{position:relative;z-index:2;flex:none;padding:12px 18px calc(110px + env(safe-area-inset-bottom));}
  /* z-index must clear the floating pill nav (.navbar, z-index:1000) —
     at the old z-index:30 the nav sat on top of this sheet and hid its
     own CONTINUE/GOT IT button entirely (owner screenshot, 2026-11-09).
     Extra bottom padding also clears env(safe-area-inset-bottom), same
     as .navbar's own handling, now that this sheet fully covers it. */
  .sp-feedback-sheet{position:fixed;left:0;right:0;bottom:0;z-index:1001;padding:20px 20px calc(32px + env(safe-area-inset-bottom));animation:spSheetUp .28s cubic-bezier(.2,.8,.2,1) both;}
  @keyframes spSheetUp{from{transform:translateY(100%);}to{transform:translateY(0);}}
  .sp-feedback-sheet.sp-good{background:#dcf3d3;}
  .sp-feedback-sheet.sp-bad{background:#ffe0d9;}
  .sp-feedback-row{display:flex;align-items:center;gap:12px;}
  .sp-feedback-icon{width:44px;height:44px;flex:none;border-radius:50%;display:grid;place-items:center;background:#fff;animation:spPop .35s .08s both;}
  .sp-feedback-sheet.sp-good .sp-feedback-icon{color:#2f7a22;}
  .sp-feedback-sheet.sp-bad .sp-feedback-icon{color:#b8331f;}
  .sp-feedback-title{font:600 23px 'Baloo 2';}
  .sp-feedback-sheet.sp-good .sp-feedback-title{color:#2f7a22;}
  .sp-feedback-sheet.sp-bad .sp-feedback-title{color:#b8331f;}
  .sp-feedback-sub{margin-top:8px;font:800 14.5px Figtree;}
  .sp-feedback-sheet.sp-good .sp-feedback-sub{color:#2f7a22;}
  .sp-feedback-sheet.sp-bad .sp-feedback-sub{color:#b8331f;}
  .sp-feedback-btn{margin-top:16px;width:100%;height:54px;border:0;border-radius:16px;font:900 16px Figtree;letter-spacing:.05em;cursor:pointer;}
  .sp-feedback-sheet.sp-good .sp-feedback-btn{background:#58c043;color:#14300d;box-shadow:0 5px 0 #43a033;}
  .sp-feedback-sheet.sp-bad .sp-feedback-btn{background:#ff5a5f;color:#fff;box-shadow:0 5px 0 #d93d42;}
  .sp-feedback-btn:active{transform:translateY(4px);}
  /* Theme every ChallengeType's own exercise markup when it renders
     inside a Shepherd session — none of their own unscoped rules above
     are touched (the legacy, non-Shepherd session screen still looks
     exactly as it did), these are pure additions at `.sp-session-screen
     <selector>` so they only apply here. Fixes the "exercise still
     looks like the old dark app" gap flagged (and deliberately
     deferred) in item 161 — now actually closed, per direct owner
     feedback (2026-11-09) rather than left as a seam. Correct/wrong
     green/red (#10B981/#EF4444) are left exactly as-is everywhere —
     the app's own sanctioned functional colors, not part of this
     theming pass. */
  .sp-session-screen .ref{color:var(--sp-acc) !important;}
  .sp-session-screen .target-sentence-box,
  .sp-session-screen .sprint-text-box,
  .sp-session-screen .vanish-text-box,
  .sp-session-screen .match-prompt-card{
    background:var(--sp-surface) !important;border-color:var(--sp-line) !important;color:var(--sp-ink) !important;
  }
  .sp-session-screen .tap-slot{border-bottom-color:var(--sp-ink);color:var(--sp-ink);}
  .sp-session-screen .tap-slot.tap-slot-filled{color:var(--sp-ink);}
  .sp-session-screen .word-bank-grid .tap-tile,
  .sp-session-screen .match-option-card{
    background:var(--sp-soft) !important;border-color:var(--sp-line) !important;color:var(--sp-ink) !important;
  }
  .sp-session-screen .tap-tile:active{background:var(--sp-line) !important;}
  .sp-session-screen .practice-hint{color:var(--sp-sub);}
  .sp-session-screen .sprint-word.sprint-done{color:var(--sp-ink);}
  .sp-session-screen .sprint-word.sprint-active{color:var(--sp-ink);border-bottom-color:var(--sp-ink);}
  .sp-session-screen .sprint-word.sprint-future{color:var(--sp-sub);}
  .sp-session-screen .sprint-toast{background:var(--sp-tint);border-color:var(--sp-acc);color:var(--sp-ink);}
  .sp-session-screen .vanish-blank{border-bottom-color:var(--sp-ink);}
  .sp-session-screen .vanish-text-box.peek-all .vanish-blank{color:var(--sp-ink) !important;}
  .sp-session-screen .vanish-peek-btn,
  .sp-session-screen .vanish-missed-btn{border-color:var(--sp-line);color:var(--sp-ink);background:var(--sp-surface);}
  .sp-session-screen .clause-instruction{color:var(--sp-sub);}
  .sp-session-screen .clause-card{background:var(--sp-surface) !important;border-color:var(--sp-line) !important;}
  .sp-session-screen .clause-grip{color:var(--sp-sub);}
  .sp-session-screen .clause-text{color:var(--sp-ink);}
  .sp-session-screen .clause-card.clause-dragging,
  .sp-session-screen .clause-card.clause-selected{border-color:var(--sp-acc) !important;background:var(--sp-tint) !important;}
  /* Check/continue-style controls (Tap Builder/Vanish/Clause Connect's
     own data-action="check-practice" button, plus the generic Check
     button renderChallengeBody() falls back to for Progressive Vanish/
     Reference Match) get the handoff's own bronze CTA instead of the
     app's white default, matching every other primary action on this
     screen. */
  .sp-session-screen .tap-builder-check,
  .sp-session-screen .vanish-next-btn,
  .sp-session-screen .clause-check-btn,
  .sp-session-screen .btn.primary{
    background:var(--sp-cta) !important;color:var(--sp-ctaink) !important;
    box-shadow:0 5px 0 var(--sp-ctad) !important;
  }

  /* ---------- session-complete celebration ---------- */
  @keyframes slideUp{from{opacity:0;transform:translateY(24px);}to{opacity:1;transform:translateY(0);}}
  @keyframes bounceIn{0%{opacity:0;transform:scale(.3);}55%{opacity:1;transform:scale(1.15);}100%{transform:scale(1);}}
  @keyframes statIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
  @keyframes spark{
    0%{opacity:1;transform:translate(-50%,-50%) rotate(var(--angle)) translateY(0) scale(1);}
    100%{opacity:0;transform:translate(-50%,-50%) rotate(var(--angle)) translateY(calc(-1 * var(--dist))) scale(.3);}
  }
  .complete-card{position:relative;text-align:center;padding:32px 16px 28px;overflow:hidden;animation:slideUp .35s cubic-bezier(.34,1.56,.64,1) both;}
  .complete-icon{font-size:40px;color:var(--gold-deep);display:inline-block;animation:bounceIn .5s cubic-bezier(.34,1.56,.64,1) both;}
  .sparks{position:absolute;inset:0;pointer-events:none;}
  .spark{position:absolute;top:50%;left:50%;width:var(--size);height:var(--size);background:var(--spark-color,var(--gold));border-radius:50%;animation:spark .7s ease-out both;}
  .complete-stats{display:flex;gap:10px;justify-content:center;margin-top:18px;}
  .complete-stat{background:var(--surface-sunken);border-radius:var(--radius-ctl);padding:14px 20px;min-width:96px;opacity:0;animation:statIn .4s ease-out both;}
  .complete-stat .num{font-family:'Inter',sans-serif;font-size:22px;font-weight:700;letter-spacing:-.01em;}
  .complete-stat .lbl{font-size:11px;color:var(--ink-soft);margin-top:2px;}

  /* ---------- "Shepherd theme" for Home/Discover/Study (item 170) ----------
     A second, separate restyle from Practice's own Shepherd's Path
     (--sp-*, items 160-169) — same design family (warm parchment,
     sky-gradient header, chunky "ledge"-shadow storybook cards, a
     per-section color key), different token set (--ht-*) so neither
     screen's tokens can bleed into the other's. Deliberately NOT
     applied to: the shared global `.navbar` (rendered once outside
     #app and shared by every screen including Practice — restyling it
     here would change Practice too, out of scope), Settings, Browse,
     Topic/Character/Story/Verse Detail, or Study's own sub-screens
     (Patterns/Timeline/Family Tree/Lexicon — only Study's hub nav-row
     screen is restyled, not what those rows link to). A real, named
     standing exception to "black and white only" (CLAUDE.md), same
     footing as Topics/Family Tree/Shepherd's Path.
     Light/dark toggled explicitly via settings.homeTheme and a
     data-theme attribute — same precedent as .shepherd-screen's own
     settings.practiceTheme toggle, not a prefers-color-scheme media
     query — so there's one real, visible, tappable toggle button
     rather than following the OS silently. */
  .hds-theme{
    --ht-ground:#f4eedf;--ht-sky1:#ffd6b3;--ht-sky2:#fbe8d2;--ht-surface:#fffdf8;--ht-line:#e7dcc8;
    --ht-ink:#2e2a3d;--ht-sub:#6b6477;--ht-lockic:#a0937c;--ht-tint:#e2f2ed;--ht-acc:#2f9a82;--ht-accl:#8fd0bf;
    --ht-glass:rgba(255,253,248,.78);--ht-glassline:rgba(120,100,70,.16);
    --ht-hill1:#dbe7c6;--ht-hill2:#c9ddb0;--ht-cloud:rgba(255,255,255,.85);--ht-deco1:#a6c78a;--ht-petal:#f5a3b5;
    --ht-sun:#ffe2b8;--ht-sunglow:rgba(255,190,130,.45);
    --ht-terra:#c4502a;--ht-terrad:#a8441f;--ht-plum:#7a5cc4;--ht-plumd:#5a3fa0;
    --ht-terrat:#fbe3d8;--ht-plumt:#ece6fa;--ht-apr:#b85f1e;--ht-aprt:#fde6cf;
    background:var(--ht-ground);color:var(--ht-ink);font-family:'Figtree',sans-serif;
    margin:-20px -18px 0;padding:0 18px 110px;position:relative;
  }
  .hds-theme[data-theme="dark"]{
    --ht-ground:#14112a;--ht-sky1:#1e2554;--ht-sky2:#181638;--ht-surface:#1f1a35;--ht-line:#30294a;
    --ht-ink:#f3eefc;--ht-sub:#aaa2c3;--ht-lockic:#7a72a0;--ht-tint:#15302b;--ht-acc:#56c9ab;--ht-accl:#2c7a68;
    --ht-glass:rgba(26,22,48,.78);--ht-glassline:rgba(255,255,255,.09);
    --ht-hill1:#1c2246;--ht-hill2:#171b3a;--ht-cloud:rgba(255,255,255,.06);--ht-deco1:#2c3c5a;--ht-petal:#6b5aa0;
    --ht-sun:#f6eccb;--ht-sunglow:rgba(246,236,203,.2);
    --ht-terra:#ff9a76;--ht-terrad:#7a2e14;--ht-plum:#b49cff;--ht-plumd:#5a3fa0;
    --ht-terrat:#3a1f24;--ht-plumt:#2a2250;--ht-apr:#ffb97a;--ht-aprt:#3a2a1c;
  }
  .hds-sky{position:absolute;top:0;left:0;right:0;height:300px;z-index:0;pointer-events:none;background:linear-gradient(180deg,var(--ht-sky1),var(--ht-sky2) 55%,var(--ht-ground));}
  .hds-sun{position:absolute;top:30px;right:12px;width:52px;height:52px;border-radius:50%;background:var(--ht-sun);box-shadow:0 0 50px 16px var(--ht-sunglow);z-index:0;pointer-events:none;}
  .hds-theme-toggle{position:relative;z-index:2;width:42px;height:42px;flex:none;border-radius:50%;border:1.5px solid var(--ht-glassline);background:var(--ht-glass);backdrop-filter:blur(10px);display:grid;place-items:center;color:var(--ht-ink);cursor:pointer;}
  .hds-theme-toggle:active{transform:translateY(2px);}
  .hds-content{position:relative;z-index:1;padding-top:20px;display:flex;flex-direction:column;gap:16px;}
  .hds-title{font:600 30px/1.1 'Baloo 2',sans-serif;color:var(--ht-ink);padding:4px 2px 0;}
  .hds-eyebrow{display:flex;align-items:center;gap:6px;font:900 12px 'Figtree',sans-serif;letter-spacing:.06em;text-transform:uppercase;}
  .hds-card{padding:16px;border-radius:22px;background:var(--ht-surface);border:2px solid var(--ht-line);box-shadow:0 4px 0 var(--ht-line);}
  .hds-card-title{font:600 20px/1.2 'Baloo 2',sans-serif;color:var(--ht-ink);}
  .hds-card-body{font:700 14px/1.45 'Figtree',sans-serif;color:var(--ht-sub);}
  .hds-tap{cursor:pointer;transition:transform .08s ease;}
  .hds-tap:active{transform:translateY(2px);}
  .hds-btn-light{align-self:flex-start;height:48px;padding:0 18px 0 14px;border-radius:16px;background:#fffdf8;color:#1f7563;box-shadow:0 4px 0 rgba(0,0,0,.25);display:flex;align-items:center;gap:8px;font:900 15px 'Figtree',sans-serif;cursor:pointer;}
  .hds-btn-light:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.25);}
  .hds-btn-plum{align-self:flex-start;margin-top:4px;height:40px;padding:0 14px;border-radius:13px;border:2px solid var(--ht-plumd);background:var(--ht-plum);color:#fff;box-shadow:0 3px 0 var(--ht-plumd);display:flex;align-items:center;font:900 14px 'Figtree',sans-serif;cursor:pointer;}
  .hds-btn-plum:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ht-plumd);}
  /* VOTD hero (Home) */
  .hds-votd-hero{position:relative;height:380px;border-radius:26px;overflow:hidden;background:#2f9a82;box-shadow:0 6px 0 #1f7563;background-size:cover;background-position:center;}
  .hds-votd-hero:active{transform:translateY(2px);box-shadow:0 4px 0 #1f7563;}
  .hds-votd-overlay{position:absolute;inset:0;background:linear-gradient(180deg,rgba(20,30,28,.55),rgba(20,30,28,.15) 45%,rgba(20,30,28,.7));pointer-events:none;}
  .hds-votd-body{position:absolute;inset:0;padding:20px;display:flex;flex-direction:column;gap:12px;}
  .hds-votd-pill{align-self:flex-start;display:flex;align-items:center;gap:6px;padding:6px 11px;border-radius:999px;background:rgba(255,253,248,.92);font:900 12px 'Figtree',sans-serif;letter-spacing:.06em;color:#1f7563;}
  .hds-votd-text{font:500 25px/1.32 'Newsreader',Georgia,serif;color:#fff;text-shadow:0 1px 12px rgba(0,0,0,.3);}
  .hds-votd-ref{font:800 14px 'Figtree',sans-serif;color:#fff;}
  .hds-votd-attrib{font:600 11px 'Figtree',sans-serif;color:rgba(255,255,255,.75);}
  .hds-votd-attrib a{color:#fff;}
  /* Unreached-of-the-day row card */
  .hds-row-card{display:flex;gap:14px;align-items:center;}
  .hds-row-thumb{position:relative;width:96px;height:96px;flex:none;border-radius:22px;overflow:hidden;box-shadow:0 4px 0 var(--ht-terrad);}
  .hds-row-thumb img{width:100%;height:100%;object-fit:cover;display:block;}
  /* Story-of-the-day / Discover featured-story image heroes */
  .hds-img-hero{position:relative;border-radius:22px;overflow:hidden;background-size:cover;background-position:center;}
  .hds-img-hero-overlay{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 30%,rgba(40,15,5,.75));pointer-events:none;}
  .hds-img-hero-body{position:absolute;left:16px;right:16px;bottom:14px;display:flex;flex-direction:column;gap:4px;pointer-events:none;}
  /* Discover/Study nav rows */
  .hds-nav-row{display:flex;gap:14px;align-items:center;}
  .hds-nav-tile{width:52px;height:52px;flex:none;border-radius:16px;display:grid;place-items:center;color:#fff;}
  .hds-nav-row-title{font:600 19px 'Baloo 2',sans-serif;color:var(--ht-ink);}
  .hds-nav-row-desc{font:700 14px/1.4 'Figtree',sans-serif;color:var(--ht-sub);}
  .hds-chev{flex:none;color:var(--ht-lockic);}
  /* Discover: Person of the Day + drifting cloud */
  .hds-person-card{display:flex;gap:14px;align-items:center;padding:14px;}
  .hds-person-portrait{position:relative;width:64px;height:64px;flex:none;border-radius:50%;overflow:hidden;border:3px solid var(--ht-plum);background:var(--ht-tint);display:grid;place-items:center;color:var(--ht-plum);}
  .hds-person-portrait img{width:100%;height:100%;object-fit:cover;display:block;}
  .hds-cloud-wrap{position:absolute;left:0;top:40px;z-index:0;pointer-events:none;animation:hdsDrift 50s linear infinite;}
  .hds-cloud{position:absolute;border-radius:50%;background:var(--ht-cloud);}
  @keyframes hdsDrift{from{transform:translateX(-160px);}to{transform:translateX(440px);}}
  /* Study: hill/lamb decorative scene — a simplified, in-flow version
     of the handoff's fixed bottom scene (a position:fixed decorative
     layer behind scrollable content would re-risk the exact
     z-index:auto-paints-behind-static-content stacking bug items
     167/169 already hit twice on Practice's own fixed-viewport scene;
     Study is a normal scrolling screen, so this sits in the document
     flow after the nav rows instead — same art, lower structural risk,
     a deliberate fidelity trade-off). */
  .hds-hillscape{position:relative;height:200px;margin:8px -18px -110px;overflow:hidden;}
  .hds-hill1{position:absolute;left:-45%;width:125%;bottom:-200px;height:430px;border-radius:50%;background:var(--ht-hill1);}
  .hds-hill2{position:absolute;right:-55%;width:130%;bottom:-260px;height:450px;border-radius:50%;background:var(--ht-hill2);}
  .hds-hillscape .hds-deco1{position:absolute;left:14%;bottom:110px;}
  .hds-hillscape .hds-deco2{position:absolute;right:16%;bottom:90px;}
  .hds-lamb{position:absolute;left:50%;bottom:40px;margin-left:-55px;animation:hdsBob 2.6s ease-in-out infinite;}
  @keyframes hdsBob{0%,100%{transform:translateY(0);}50%{transform:translateY(-5px);}}
  /* Home: one-shot "Jesus and the lambs" procession, item 170. Recreated
     from scratch on every renderHome() call, which is exactly what
     makes it "replay every time Home is (re)visited" for free — a
     fresh DOM node always restarts its own CSS animation, no extra
     state needed. Lower-fidelity than the handoff's own gradient-
     shaded vector figures (simple flat-color SVG shapes here) —
     intentional, it's one decorative animation, not a core screen
     element. */
  .hds-procession{position:absolute;left:0;right:0;bottom:-16px;height:120px;z-index:0;pointer-events:none;overflow:hidden;}
  .hds-procession-ground{position:absolute;left:0;right:0;bottom:0;height:30px;background:var(--ht-tint);border-radius:50% 50% 0 0/18px 18px 0 0;opacity:.6;}
  .hds-procession-walk{position:absolute;left:0;bottom:10px;width:220px;height:90px;animation:hdsWalk 9s linear 1 both;}
  @keyframes hdsWalk{from{transform:translateX(-240px);}to{transform:translateX(420px);}}
  .hds-procession-lamb{position:absolute;bottom:0;animation:hdsHop .42s ease-in-out infinite;}
  @keyframes hdsHop{0%,100%{transform:translateY(0);}50%{transform:translateY(-6px);}}
  .hds-procession-heart{position:absolute;left:150px;bottom:60px;font:900 16px 'Figtree',sans-serif;color:#e0697a;animation:hdsHeart 1.6s ease-out infinite;}
  @keyframes hdsHeart{0%{opacity:0;transform:translateY(4px) scale(.6);}30%{opacity:1;}100%{opacity:0;transform:translateY(-22px) scale(1);}}

  /* Study sub-pages — Patterns, Timeline, Family Tree, Lexicon — item
     176, design_handoff_practice_tab_v3's "Study sub-pages" spec
     (Timeline Shepherd.dc.html / Study Pages Shepherd.dc.html). Item
     173 only gave these screens the generic `.hds-theme <existing-
     class>` chrome pass (same treatment as every other leftover
     screen); this gives the four list screens their own real scenic
     header (sun/hills/fade/clouds/swaying plants with the title+intro
     living inside the scene, not above it) plus page-specific card
     redesigns. Family Tree's own SVG node-graph (item 111, bronze,
     untouched) and Verse/Lexicon-entry's shared structure get the
     lighter "detail page" treatment (a fixed 260px sky + one cloud)
     instead, per the spec's own split between the two patterns. */
  .hds-scenic-header{position:relative;overflow:hidden;margin:0 -18px;background:linear-gradient(180deg,var(--ht-sky1),var(--ht-sky2) 70%);}
  .hds-scenic-sun{position:absolute;border-radius:50%;background:var(--ht-sun);box-shadow:0 0 50px 16px var(--ht-sunglow);}
  .hds-scenic-hill1{position:absolute;left:-30%;width:110%;height:240px;border-radius:50%;background:var(--ht-hill1);}
  .hds-scenic-hill2{position:absolute;right:-40%;width:120%;height:250px;border-radius:50%;background:var(--ht-hill2);}
  .hds-scenic-fade{position:absolute;left:0;right:0;bottom:-1px;height:40px;background:linear-gradient(180deg,transparent,var(--ht-ground));}
  .hds-scenic-text{position:relative;padding:62px 22px 0;display:flex;flex-direction:column;gap:10px;}
  .hds-scenic-title{font:600 32px/1.1 'Baloo 2',sans-serif;color:var(--ht-ink);}
  .hds-scenic-intro{font:700 15px/1.5 'Figtree',sans-serif;color:var(--ht-sub);max-width:290px;}
  .hds-scenic-plant{position:absolute;transform-origin:50% 100%;animation:hdsSway 4s ease-in-out infinite;pointer-events:none;}
  @keyframes hdsSway{0%,100%{transform:rotate(-3deg);}50%{transform:rotate(3deg);}}

  /* Patterns cards */
  .hds-pattern-card{display:flex;flex-direction:column;gap:8px;}
  .hds-pattern-row{display:flex;align-items:flex-start;gap:12px;}
  .hds-pattern-tile{width:44px;height:44px;flex:none;border-radius:14px;display:grid;place-items:center;color:#fff;}
  .hds-pattern-title{flex:1;min-width:0;font:600 20px/1.2 'Baloo 2',sans-serif;color:var(--ht-ink);padding-top:2px;}
  .hds-pattern-desc{font:700 14px/1.5 'Figtree',sans-serif;color:var(--ht-sub);}
  .hds-pattern-footer{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-top:4px;}
  .hds-pattern-pill{display:flex;align-items:center;gap:8px;padding:5px 11px 5px 7px;border-radius:999px;font:900 12px 'Figtree',sans-serif;letter-spacing:.06em;}
  .hds-pattern-dots{display:flex;gap:3px;}
  .hds-pattern-dots i{width:8px;height:8px;border-radius:50%;display:inline-block;}

  /* Timeline (whole-Bible) — brand-new markup/classes, deliberately NOT
     sharing `.timeline`/`.tl-item` with Character Detail's "Their
     life" section (item 173 themed those as shared), since this
     screen's numbered-node/dotted-trail redesign is specific to this
     page only. */
  .hds-tl-era-card{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:22px;background:#d2603a;box-shadow:0 5px 0 #a8441f;color:#fff;margin-bottom:4px;}
  .hds-tl-era-icon{width:44px;height:44px;flex:none;border-radius:14px;background:rgba(255,255,255,.18);display:grid;place-items:center;}
  .hds-tl-era-eyebrow{font:900 11px 'Figtree',sans-serif;letter-spacing:.08em;color:#ffe2d4;}
  .hds-tl-era-title{font:600 20px/1.2 'Baloo 2',sans-serif;}
  .hds-tl-trail{position:relative;display:flex;flex-direction:column;gap:18px;padding-left:46px;margin:0 0 16px;}
  .hds-tl-trail::before{content:'';position:absolute;left:18px;top:18px;bottom:30px;width:0;border-left:4px dotted var(--ht-line);}
  .hds-tl-row{position:relative;}
  .hds-tl-node{position:absolute;left:-46px;top:12px;width:40px;height:40px;border-radius:50%;border:3px solid var(--ht-ground);box-sizing:border-box;display:grid;place-items:center;font:900 15px 'Figtree',sans-serif;color:#fff;}
  .hds-tl-event-card{display:flex;flex-direction:column;gap:5px;padding:14px 16px 16px;border-radius:22px;background:var(--ht-surface);border:2px solid var(--ht-line);box-shadow:0 4px 0 var(--ht-line);cursor:pointer;}
  .hds-tl-event-card:active{transform:translateY(2px);box-shadow:0 2px 0 var(--ht-line);}
  .hds-tl-event-ref{display:flex;align-items:center;gap:6px;font:900 12px 'Figtree',sans-serif;letter-spacing:.03em;color:var(--ht-terra);}
  .hds-tl-event-title{font:600 20px/1.2 'Baloo 2',sans-serif;color:var(--ht-ink);}
  .hds-tl-event-desc{font:700 14px/1.5 'Figtree',sans-serif;color:var(--ht-sub);}

  /* Family Tree picker — family rows. Only used by renderFamilyCard()
     (the picker/search results); the actual node-graph screen keeps
     its untouched bronze palette, see the big comment above. */
  .hds-family-row{display:flex;align-items:center;gap:14px;padding:12px 14px 12px 12px;border-radius:22px;background:var(--ht-surface);border:2px solid var(--ht-line);box-shadow:0 4px 0 var(--ht-line);}
  .hds-family-portrait{position:relative;width:56px;height:56px;flex:none;border-radius:17px;overflow:hidden;display:grid;place-items:center;color:var(--ht-ink);}
  .hds-family-portrait img{width:100%;height:100%;object-fit:cover;display:block;}
  .hds-family-name{font:600 19px 'Baloo 2',sans-serif;color:var(--ht-ink);}
  .hds-family-sub{font:700 14px 'Figtree',sans-serif;color:var(--ht-sub);}

  /* Lexicon list */
  .hds-lex-highlights-title{font:600 22px 'Baloo 2',sans-serif;color:var(--ht-ink);padding:8px 2px 0;}
  .hds-lex-group-eyebrow{display:flex;align-items:center;justify-content:space-between;padding:0 2px;}
  .hds-lex-group-eyebrow span:first-child{font:900 12px 'Figtree',sans-serif;letter-spacing:.08em;color:var(--ht-sub);}
  .hds-lex-count-pill{padding:3px 9px;border-radius:999px;background:var(--ht-aprt);color:var(--ht-apr);font:900 12px 'Figtree',sans-serif;}
  .hds-lex-group-card{display:flex;flex-direction:column;border-radius:22px;background:var(--ht-surface);border:2px solid var(--ht-line);box-shadow:0 4px 0 var(--ht-line);overflow:hidden;}
  .hds-lex-row{display:flex;align-items:center;gap:12px;padding:12px 14px;cursor:pointer;}
  .hds-lex-row + .hds-lex-row{border-top:1.5px solid var(--ht-line);}
  .hds-lex-row:active{background:var(--ht-tint);}
  .hds-lex-tile{width:48px;height:48px;flex:none;border-radius:15px;background:#ff7a50;box-shadow:0 3px 0 #d9572f;display:grid;place-items:center;font:600 24px 'Noto Serif Hebrew',serif;color:#3a1203;}
  .hds-lex-row-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;}
  .hds-lex-row-head{display:flex;align-items:baseline;gap:8px;}
  .hds-lex-row-name{font:600 18px 'Baloo 2',sans-serif;color:var(--ht-ink);}
  .hds-lex-row-heb{font:500 17px 'Noto Serif Hebrew',serif;color:var(--ht-sub);}
  .hds-lex-row-gloss{font:700 13px 'Figtree',sans-serif;color:var(--ht-sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .hds-lex-row-badge{flex:none;padding:4px 8px;border-radius:8px;background:var(--ht-ground);border:1.5px solid var(--ht-line);font:800 11px 'Figtree',sans-serif;color:var(--ht-sub);}

  /* Lexicon entry + Verse — "detail page" pattern: a fixed 260px sky
     (reuses the existing .hds-sky, just a shorter height) + one cloud,
     a plain back-btn+title header, then page-specific cards below. */
  .hds-lex-hero{position:relative;overflow:hidden;display:flex;flex-direction:column;gap:6px;padding:18px 20px 20px;border-radius:24px;background:#ff7a50;box-shadow:0 6px 0 #d9572f;color:#3a1203;}
  .hds-lex-hero-circle{position:absolute;right:-30px;top:-30px;width:140px;height:140px;border-radius:50%;background:rgba(255,255,255,.14);}
  .hds-lex-hero-tags{position:relative;display:flex;gap:6px;flex-wrap:wrap;}
  .hds-lex-hero-tags span{padding:4px 10px;border-radius:999px;background:rgba(255,253,248,.9);font:900 12px 'Figtree',sans-serif;letter-spacing:.04em;color:#a8441f;}
  .hds-lex-hero-word{position:relative;font:600 54px/1.3 'Noto Serif Hebrew',serif;padding-top:4px;}
  .hds-lex-hero-translit{position:relative;display:flex;align-items:baseline;gap:8px;font:600 24px 'Baloo 2',sans-serif;}
  .hds-lex-hero-pron{font:800 15px 'Figtree',sans-serif;opacity:.8;}
  .hds-lex-def-card{display:flex;flex-direction:column;gap:12px;}
  .hds-lex-def-lead{font:600 20px/1.35 'Baloo 2',sans-serif;color:var(--ht-ink);}
  .hds-lex-occ-row{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:16px;background:var(--ht-tint);}
  .hds-lex-occ-num{font:600 26px 'Baloo 2',sans-serif;color:var(--ht-acc);}
  .hds-lex-occ-label{font:800 14px 'Figtree',sans-serif;color:var(--ht-ink);}
  .hds-lex-def-full{font:700 14px/1.55 'Figtree',sans-serif;color:var(--ht-sub);}
  .hds-lex-def-origin{font:700 13px/1.5 'Figtree',sans-serif;color:var(--ht-sub);font-style:italic;}

  /* Verse Detail's own hero card — scoped additions on top of the
     already-shared `.card.verse-card`/`.text`/`.ref` (item 173's
     generic rule, still used as-is by Browse search results, Lexicon
     Detail's example verse, and Motif Detail's feed). `.hds-verse-hero`
     is an EXTRA class added only by renderVerseDetail() itself, so
     these overrides can't reach any other `.verse-card` call site. */
  /* Four classes (vs. the generic `.hds-theme .verse-card .text` rule's
     three, item 173) so this wins the cascade regardless of which rule
     happens to come later in the stylesheet — this font override must
     not depend on source order. */
  .hds-theme .verse-card.hds-verse-hero .text{font:400 25px/1.4 'Newsreader',Georgia,serif;}
  .hds-verse-topic-pill{align-self:flex-start;padding:5px 11px;border-radius:999px;background:var(--ht-plumt);color:var(--ht-plum);font:900 12px 'Figtree',sans-serif;letter-spacing:.06em;text-transform:uppercase;}
  .hds-sprout-tile{position:relative;width:56px;height:56px;flex:none;border-radius:18px;background:var(--ht-tint);overflow:hidden;}
  .hds-sprout-tile .hds-scenic-plant{position:absolute;left:13px;top:10px;animation-delay:0s;}

  /* Discover sub-pages (Browse, Topics, People, Stories) — item 172,
     design_handoff_shepherd_pages. These reuse items 170/171's --ht-*
     tokens and the same .hds-theme/.hds-sky/.hds-sun/.hds-content/
     .hds-title wrapper shell, but their actual rows/cards (.list-row,
     .chapter-cell, .chapter-reader, .reader-toolbar, .topic-card,
     .people-grid-card, .story-list-card, .section-label, .search-wrap,
     .crumbs, .back-btn, .empty, .result-count, .field-hint) are SHARED
     components also used by screens this pass does NOT restyle
     (Character/Story Detail, Motif Detail, Lexicon, Timeline, etc.) —
     so every rule below is a `.hds-theme <existing-class>` descendant
     override, never a change to the base class itself. It only takes
     effect where a render function actually wraps its own output in
     `.hds-theme` (Browse/Topics/People/Stories/renderBookPeople — see
     each one's own code), so none of this can bleed into an
     out-of-scope screen that reuses the same shared class. */
  .hds-theme .search-wrap{margin-bottom:0;}
  .hds-theme .search-wrap i{color:var(--ht-lockic);left:14px;font-size:20px;}
  .hds-theme .search-wrap input{height:50px;box-sizing:border-box;border-radius:16px;background:var(--ht-surface);border:2px solid var(--ht-line);box-shadow:0 3px 0 var(--ht-line);font:700 15px 'Figtree',sans-serif;color:var(--ht-ink);padding-left:42px;}
  .hds-theme .search-wrap input::placeholder{color:var(--ht-lockic);}
  .hds-theme .crumbs{font:800 14px 'Figtree',sans-serif;color:var(--ht-ink);}
  .hds-theme .crumbs button{color:var(--ht-acc);font:800 14px 'Figtree',sans-serif;}
  .hds-theme .result-count{color:var(--ht-sub);font-family:'Figtree',sans-serif;}
  .hds-theme .empty{color:var(--ht-sub);}
  .hds-theme .empty i{color:var(--ht-lockic);}
  .hds-theme .field-hint{color:var(--ht-sub);font-family:'Figtree',sans-serif;}
  .hds-theme .section-label{color:var(--ht-ink);font:600 19px 'Baloo 2',sans-serif;margin:18px 0 10px;}
  .hds-theme .section-label span{font:800 12px 'Figtree',sans-serif;color:var(--ht-sub);text-transform:none;letter-spacing:0;}
  .hds-theme .back-btn{background:var(--ht-surface);border:2px solid var(--ht-line);box-shadow:0 3px 0 var(--ht-line);color:var(--ht-ink);}
  /* Era header pill — People gets plum, Stories gets terracotta (the
     handoff's own two tint tokens); a dedicated class rather than
     reusing .section-label's own generic span so the two screens can
     each get their own color despite sharing the same base markup
     shape. Full rule set (not just a color swap) since it replaces
     .section-label's generic flex/margin treatment outright. */
  .hds-theme .hds-era-label{display:flex;align-items:center;justify-content:space-between;gap:10px;font:600 19px/1.2 'Baloo 2',sans-serif;color:var(--ht-ink);margin:18px 0 10px;}
  .hds-theme .hds-era-label span{flex:none;padding:5px 10px;border-radius:999px;font:800 12px 'Figtree',sans-serif;text-transform:none;letter-spacing:0;}
  .hds-theme .hds-era-label.hds-era-plum span{background:var(--ht-plumt);color:var(--ht-plum);}
  .hds-theme .hds-era-label.hds-era-terra span{background:var(--ht-terrat);color:var(--ht-terra);}

  /* Browse: grouped book-list card */
  .hds-list-card{background:var(--ht-surface);border:2px solid var(--ht-line);box-shadow:0 4px 0 var(--ht-line);border-radius:22px;overflow:hidden;padding:0 14px;}
  .hds-theme .hds-list-card .list-row{padding:11px 0;margin:0;border-bottom:1.5px solid var(--ht-line);}
  .hds-theme .list-row .list-avatar{background:var(--ht-tint);color:var(--ht-acc);border-radius:13px;}
  .hds-theme .list-row .name{font:600 18px 'Baloo 2',sans-serif;color:var(--ht-ink);}
  .hds-theme .list-row .meta{font:700 13px 'Figtree',sans-serif;color:var(--ht-sub);}
  .hds-theme .list-row .chev{color:var(--ht-lockic);}
  /* Browse: chapter grid */
  .hds-theme .chapter-grid{grid-template-columns:repeat(5,minmax(0,1fr));}
  .hds-theme .chapter-cell{height:52px;padding:0;border-radius:16px;background:var(--ht-surface);border:2px solid var(--ht-line);box-shadow:0 3px 0 var(--ht-line);font:800 17px 'Figtree',sans-serif;color:var(--ht-ink);}
  .hds-theme .chapter-cell:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ht-line);border-color:var(--ht-accl);color:var(--ht-acc);}
  /* "Add chapters" (item 174) — reuses the chapter grid in a toggle-
     select mode rather than a separate picker component. */
  .hds-theme .chapter-cell-selected{background:var(--ht-acc);border-color:var(--ht-accl);color:#fff;box-shadow:0 3px 0 var(--ht-accl);}
  .hds-theme .chapter-cell-added{background:var(--ht-tint);border-color:var(--ht-line);color:var(--ht-lockic);box-shadow:none;cursor:default;}
  /* "Select whole book" (owner request, 2026-11-13) — a small pill next
     to the "TAP A CHAPTER TO ADD IT" label, same role as the bar below
     (confirming the bulk add) but scoped to one book's own chapter grid
     rather than the whole-journey confirm action. */
  .add-journey-whole-book{flex:none;height:30px;padding:0 12px;border-radius:999px;border:2px solid var(--ht-accl);background:var(--ht-tint);color:var(--ht-acc);font:800 12px 'Figtree',sans-serif;cursor:pointer;white-space:nowrap;}
  .add-journey-whole-book:active{transform:translateY(1px);}
  .add-journey-bar{
    position:fixed;left:16px;right:16px;max-width:calc(var(--app-max-width) - 32px);margin:0 auto;
    bottom:calc(100px + env(safe-area-inset-bottom));z-index:1001;
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:14px 16px;border-radius:20px;
    background:var(--ht-surface);border:2px solid var(--ht-line);
    box-shadow:0 4px 0 var(--ht-line),0 12px 30px -10px rgba(40,30,10,.35);
  }
  .add-journey-bar-label{font:700 14px 'Figtree',sans-serif;color:var(--ht-ink);}
  .add-journey-bar button{flex:none;height:42px;padding:0 16px;border-radius:13px;border:2px solid var(--ht-accl);background:var(--ht-acc);color:#fff;font:900 14px 'Figtree',sans-serif;box-shadow:0 3px 0 var(--ht-accl);cursor:pointer;}
  .add-journey-bar button:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ht-accl);}
  /* Browse: reader card (Newsreader body, Baloo 2 header, --ht-terra
     verse numbers, a --ht-tint + dotted --ht-acc underline for a
     selected verse instead of the app's default plain dotted
     text-underline). */
  .hds-reader-card{display:flex;flex-direction:column;gap:12px;padding:20px 18px 22px;border-radius:22px;background:var(--ht-surface);border:2px solid var(--ht-line);box-shadow:0 4px 0 var(--ht-line);}
  .hds-reader-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;}
  .hds-reader-head-title{font:600 24px 'Baloo 2',sans-serif;color:var(--ht-ink);}
  .hds-reader-head-tag{font:900 11px 'Figtree',sans-serif;letter-spacing:.08em;color:var(--ht-terra);}
  .hds-theme .chapter-reader{font-family:'Newsreader',Georgia,serif;font-size:19px;line-height:1.7;color:var(--ht-ink);margin-bottom:0;padding:0;}
  .hds-theme .reader-vnum{color:var(--ht-terra);font-family:'Figtree',sans-serif;}
  .hds-theme .reader-verse.reader-verse-selected{text-decoration:none;background:var(--ht-tint);border-bottom:2px dotted var(--ht-acc);}
  .hds-theme .reader-verse.reader-verse-selected .reader-vnum{color:var(--ht-acc);}
  /* Browse: selection toolbar + floating chapter-nav buttons. The
     handoff's own mockup shows the prev/next chapter buttons flanking
     the toolbar itself, only while a verse is selected — this app's
     existing `.chapter-float-btn`s are deliberately kept always-visible
     and structurally separate instead (a real, documented deviation):
     folding them into the toolbar row would make chapter navigation
     disappear whenever nothing is selected, a real behavior regression
     the handoff's own static mockup wouldn't have surfaced. */
  .hds-theme .reader-toolbar{background:var(--ht-surface);border:2px solid var(--ht-line);border-radius:20px;box-shadow:0 4px 0 var(--ht-line),0 12px 30px -10px rgba(40,30,10,.35);-webkit-backdrop-filter:none;backdrop-filter:none;}
  .hds-theme .reader-toolbar button{color:var(--ht-ink);font-family:'Figtree',sans-serif;}
  .hds-theme .reader-toolbar button:active{background:var(--ht-tint);}
  .hds-theme .reader-toolbar button[data-action="add-to-library-selection"]{color:var(--ht-acc);}
  .hds-theme .reader-toolbar-close{color:var(--ht-lockic) !important;}
  .hds-theme .chapter-float-btn{background:var(--ht-surface);border:2px solid var(--ht-line);box-shadow:0 3px 0 var(--ht-line);color:var(--ht-ink);-webkit-backdrop-filter:none;backdrop-filter:none;}
  .hds-theme .chapter-float-btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ht-line);}

  /* Topics grid — card shape/typography only; the real per-topic color
     (TOPIC_PALETTE/topicColor(), item 144's own standing black-and-
     white exception) stays the actual source of each card's
     background, same as before this pass — not replaced with the
     handoff's own smaller 5-color sample cycle. No per-topic "dark
     ledge" shade exists in the data, so the drop shadow below is a
     flat semi-transparent black rather than a true darker tint of each
     topic's own hue — a deliberate, flagged approximation. */
  .hds-theme .topic-card{border-radius:22px;min-height:118px;box-shadow:0 5px 0 rgba(0,0,0,.3);}
  .hds-theme .topic-card::after{content:'';position:absolute;right:-12px;bottom:-14px;width:80px;height:80px;border-radius:50%;background:rgba(255,255,255,.12);z-index:0;}
  .hds-theme .topic-card .topic-card-icon{opacity:.55;font-size:30px;z-index:1;}
  .hds-theme .topic-card .name{font:600 19px/1.15 'Baloo 2',sans-serif;z-index:1;}
  .hds-theme .topic-card .meta{font:900 11px 'Figtree',sans-serif;letter-spacing:.07em;z-index:1;}

  /* People: photo grid cards */
  .hds-theme .people-grid-card{background:var(--ht-surface);border:2px solid var(--ht-line);box-shadow:0 4px 0 var(--ht-line);border-radius:22px;}
  .hds-theme .people-grid-photo{background:var(--ht-plumt);aspect-ratio:auto;height:168px;}
  .hds-theme .people-grid-name{font:600 18px 'Baloo 2',sans-serif;color:var(--ht-ink);}
  .hds-theme .people-grid-meta{font:700 13px/1.4 'Figtree',sans-serif;color:var(--ht-sub);}

  /* Stories: image-card list. The handoff's reference eyebrow also has
     a small book icon before the text — omitted here since
     renderStoryCard() is a shared function also used by Character
     Detail's "Stories" section (out of scope for this pass); adding an
     icon means editing that shared markup, which would carry into the
     unrestyled screen too, so only colors/type changed instead. */
  .hds-theme .story-list-card{background:var(--ht-surface);border:2px solid var(--ht-line);box-shadow:0 5px 0 var(--ht-line);border-radius:24px;}
  .hds-theme .story-card-cover{height:176px;border-bottom:none;background:var(--ht-terrat);}
  .hds-theme .story-card-body{padding:14px 18px 18px;}
  .hds-theme .story-card-body h3{font:600 22px/1.2 'Baloo 2',sans-serif;color:var(--ht-ink);margin-bottom:5px;}
  .hds-theme .story-card-ref{font:900 12px 'Figtree',sans-serif;letter-spacing:.04em;color:var(--ht-terra);}
  .hds-theme .story-card-excerpt{font:700 14px/1.45 'Figtree',sans-serif;color:var(--ht-sub);}

  /* Shepherd theme, pass 3 (item 173) — extends the same `.hds-theme`
     shell to every remaining screen (Settings, Verse/Character/Story/
     Topic Detail, Lexicon, Timeline, Motifs, Family Tree's own chrome,
     the Add screens). No design handoff exists for any of these — this
     whole block is original work, extending the established tokens/
     conventions rather than inventing a new visual language.
     These components (.card, .btn, .segmented, h1/h2/h3, .stat-card,
     .avatar, .tag variants, form controls, .hero, .timeline/.tl-item,
     .chapter-nav-row) are used EVERYWHERE, including by Shepherd's Path
     and other out-of-scope surfaces, so every rule here is still a
     `.hds-theme <existing-class>` descendant override (item 172's own
     derisking strategy, continued) — none of this can bleed into a
     screen that never wraps its own output in `.hds-theme`. */
  .hds-theme .card{background:var(--ht-surface);border:2px solid var(--ht-line);border-radius:22px;box-shadow:0 4px 0 var(--ht-line);}
  .hds-theme .card.tap:active{transform:translateY(2px);box-shadow:0 2px 0 var(--ht-line);}
  .hds-theme .btn{background:var(--ht-surface);color:var(--ht-ink);border:2px solid var(--ht-line);box-shadow:0 3px 0 var(--ht-line);border-radius:14px;font-family:'Figtree',sans-serif;font-weight:700;}
  .hds-theme .btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ht-line);}
  .hds-theme .btn.primary{background:var(--ht-acc);color:#fff;border-color:transparent;box-shadow:0 4px 0 rgba(0,0,0,.25);}
  .hds-theme .btn.primary:active{box-shadow:0 2px 0 rgba(0,0,0,.25);}
  .hds-theme .btn.ghost{background:transparent;border-color:transparent;box-shadow:none;color:var(--ht-sub);}
  .hds-theme .btn.sage{background:var(--ht-acc);color:#fff;border-color:transparent;}
  .hds-theme .btn:disabled{opacity:.5;}
  .hds-theme .segmented{background:var(--ht-tint);border-radius:14px;}
  .hds-theme .segmented button{color:var(--ht-sub);font-family:'Figtree',sans-serif;font-weight:700;border-radius:11px;}
  .hds-theme .segmented button.active{background:var(--ht-surface);color:var(--ht-acc);box-shadow:0 2px 0 var(--ht-line);}
  .hds-theme h1, .hds-theme h2, .hds-theme h3{font-family:'Baloo 2',sans-serif;font-weight:600;color:var(--ht-ink);}
  .hds-theme p{color:var(--ht-sub);}
  .hds-theme .stat-card{background:var(--ht-surface);border:2px solid var(--ht-line);box-shadow:0 3px 0 var(--ht-line);border-radius:16px;}

<script>
/* ---------- local-dev storage fallback ----------
   The app persists through window.storage, provided by the Claude runtime.
   When the page is opened from a plain web server / browser that API is
   absent, so fall back to localStorage with the same shape (same origin,
   survives reload, per-browser). Inert inside the Claude runtime. */
if(!window.storage){
  console.info('Rooted: window.storage not found — using localStorage (local dev).');
  window.storage = {
    async get(key){
      try{ const v = localStorage.getItem(key); return v === null ? null : {value:v}; }
      catch(e){ return null; }
    },
    async set(key, value){
      try{ localStorage.setItem(key, value); }
      catch(e){ console.warn('Rooted: localStorage set failed', e); }
    }
  };
}

/* ---------- storage ----------
   Content (verses/topics/characters) and user state (practice progress) are
   stored under separate keys so resetting progress can never destroy content.
   See DATA_MODEL.md §5, §7.
   - rooted-content  : user overlay { verses, topics, characters } merged
                       over the seed by id at load. Seed is source of truth
                       for seed ids; the overlay adds new ids and patches
                       existing ones.
   - rooted-progress : map of verseId -> VerseProgress
   - rooted-sync-meta: { updatedAt } — stamped on every local edit, compared
                       against the cloud copy's updatedAt to decide which
                       side wins on sync (whole-bundle last-write-wins, not
                       per-field — see pullAndMerge() below and
                       DATA_MODEL.md §7.1).
*/
const CONTENT_KEY   = 'rooted-content';
const PROGRESS_KEY  = 'rooted-progress';
const SETTINGS_KEY  = 'rooted-settings';   // per-user preferences (DATA_MODEL.md §7)
const SYNC_META_KEY = 'rooted-sync-meta';  // {updatedAt} for cloud sync (DATA_MODEL.md §7.1)
const LEGACY_KEY    = 'rooted-app-data';   // pre-split single blob; migrated once

let contentTimer = null, progressTimer = null, settingsTimer = null;
let syncMeta = {updatedAt: null};    // local edit clock; compared against the cloud copy
let account = null;                  // {userId, userDetails, identityProvider, userRoles} | null — from /.auth/me
let syncStatus = 'idle';             // 'idle' | 'syncing' | 'synced' | 'error' — for the account bar
let cloudPushTimer = null;
let suppressSyncTouch = false;       // true while pullAndMerge() is writing an *adopted* remote state locally, so that adoption doesn't get mistaken for a fresh local edit and immediately pushed back up
function saveContent(){
  touchSyncMeta();
  clearTimeout(contentTimer);
  contentTimer = setTimeout(async ()=>{
    try{ await window.storage.set(CONTENT_KEY, JSON.stringify(content), false); }
    catch(e){ console.error('content save failed', e); }
  }, 250);
}
function saveProgress(){
  touchSyncMeta();
  clearTimeout(progressTimer);
  progressTimer = setTimeout(async ()=>{
    try{ await window.storage.set(PROGRESS_KEY, JSON.stringify(progress), false); }
    catch(e){ console.error('progress save failed', e); }
  }, 250);
}
function saveSettings(){
  touchSyncMeta();
  clearTimeout(settingsTimer);
  settingsTimer = setTimeout(async ()=>{
    try{ await window.storage.set(SETTINGS_KEY, JSON.stringify(settings), false); }
    catch(e){ console.error('settings save failed', e); }
  }, 250);
}

/* ---------- cloud sync (optional — see DATA_MODEL.md §7.1) ----------
   Local storage (above) is always the fast, offline-capable source of
   truth. Signing in additionally mirrors {content, progress, settings} to
   one Cosmos DB document per user via /api/sync, so the same library and
   progress can be picked up on another device. Whole-bundle last-write-wins:
   whichever side's `updatedAt` is newer replaces the other side entirely —
   simple and safe for "one person, a couple of devices," not a per-field
   merge. See api/src/functions/sync.js for the server half. */
function touchSyncMeta(){
  if(suppressSyncTouch) return;
  syncMeta.updatedAt = new Date().toISOString();
  window.storage.set(SYNC_META_KEY, JSON.stringify(syncMeta), false).catch(()=>{});
  scheduleCloudPush();
}
function scheduleCloudPush(){
  if(!account) return;
  clearTimeout(cloudPushTimer);
  cloudPushTimer = setTimeout(pushToCloud, 1500);
}
async function loadAccount(){
  try{
    const res = await fetch('/.auth/me');
    if(!res.ok) return null;
    const body = await res.json();
    return (body && body.clientPrincipal) || null;
  }catch(e){ return null; }
}
async function pushToCloud(){
  if(!account) return;
  syncStatus = 'syncing';
  refreshAccountBar();
  try{
    const res = await fetch('/api/sync', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({content, progress, settings, updatedAt: syncMeta.updatedAt})
    });
    syncStatus = res.ok ? 'synced' : 'error';
  }catch(e){
    console.error('cloud push failed', e);
    syncStatus = 'error';
  }
  refreshAccountBar();
}
async function pullAndMerge(){
  if(!account) return;
  syncStatus = 'syncing';
  refreshAccountBar();
  try{
    const res = await fetch('/api/sync');
    if(res.ok){
      const remote = await res.json();
      if(remote && remote.updatedAt){
        const remoteTime = Date.parse(remote.updatedAt) || 0;
        const localTime = syncMeta.updatedAt ? (Date.parse(syncMeta.updatedAt) || 0) : 0;
        if(remoteTime > localTime){
          suppressSyncTouch = true;
          content = Object.assign(emptyOverlay(), remote.content || {});
          progress = {};
          for(const [id, p] of Object.entries(remote.progress || {})) progress[id] = normalizeProgress(p);
          settings = Object.assign({challengeTypeId:'challenge_tap_builder', dailyGoal:10, soundEnabled:true, language:'en', hearts:5, gems:0, xp:0, chestsOpened:[], practiceTheme:'dark', homeTheme:'light', lastStreakScreenDate:null, heartsResetDate:null, trophiesClaimed:[]}, remote.settings || {});
          if(!CHALLENGE_TYPES[settings.challengeTypeId] && settings.challengeTypeId !== MIX_MATCH_ID) settings.challengeTypeId = 'challenge_tap_builder';
          data = mergeContent(seed, content);
          if(!content.libraryVerseIds) content.libraryVerseIds = data.verses.map(v=>v.id);
          saveContent(); saveProgress(); saveSettings();
          suppressSyncTouch = false;
          syncMeta.updatedAt = remote.updatedAt;
          window.storage.set(SYNC_META_KEY, JSON.stringify(syncMeta), false).catch(()=>{});
        } else if(localTime > remoteTime){
          await pushToCloud();
        }
      } else {
        // Nothing synced yet for this account — this device's copy becomes the first cloud copy.
        await pushToCloud();
      }
      syncStatus = 'synced';
    } else {
      syncStatus = 'error';
    }
  }catch(e){
    console.error('cloud pull failed', e);
    syncStatus = 'error';
  }
  render();
}
function refreshAccountBar(){
  const el = document.getElementById('account-bar');
  if(!el) return;
  el.outerHTML = renderAccountBar();
  bindEvents(document.getElementById('account-bar'));
}

/* ---------- local backup: export / import ----------
   Cloud sync (above) only covers signed-in users. This is the fallback for
   everyone else — and a manual safety net even when signed in, since
   localStorage on a single device is still one browser-clear away from
   gone. Same bundle shape as the cloud sync document, by design, so
   there's exactly one "what does a user's data look like" shape used in
   three places (localStorage keys, Cosmos, and export files). See
   DATA_MODEL.md §7.1 / CLAUDE.md known gaps. */
function exportBundle(){
  return {
    app: 'rooted',
    exportedAt: new Date().toISOString(),
    content, progress, settings
  };
}
function downloadExport(){
  const blob = new Blob([JSON.stringify(exportBundle(), null, 2)], {type: 'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `rooted-backup-${new Date().toISOString().slice(0,10)}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}
function validateImportBundle(obj){
  if(!obj || typeof obj !== 'object') return {ok:false, error:'That file isn\'t a Rooted backup.'};
  const out = {};
  if(obj.content !== undefined){
    if(typeof obj.content !== 'object' || obj.content === null) return {ok:false, error:'Backup file is corrupted (content).'};
    out.content = Object.assign(emptyOverlay(), obj.content);
  }
  if(obj.progress !== undefined){
    if(typeof obj.progress !== 'object' || obj.progress === null) return {ok:false, error:'Backup file is corrupted (progress).'};
    out.progress = obj.progress;
  }
  if(obj.settings !== undefined){
    if(typeof obj.settings !== 'object' || obj.settings === null) return {ok:false, error:'Backup file is corrupted (settings).'};
    out.settings = obj.settings;
  }
  if(!('content' in out) && !('progress' in out) && !('settings' in out)){
    return {ok:false, error:'That file doesn\'t contain any Rooted data.'};
  }
  return {ok:true, bundle:out};
}
async function importFromFile(file){
  let text;
  try{ text = await file.text(); }
  catch(e){ alert('Could not read that file.'); return; }
  let parsed;
  try{ parsed = JSON.parse(text); }
  catch(e){ alert('That file is not valid JSON.'); return; }
  const result = validateImportBundle(parsed);
  if(!result.ok){ alert(result.error); return; }
  if(!confirm('This replaces your current verses, progress, and settings on this device with the backup file. This can\'t be undone. Continue?')) return;

  const {bundle} = result;
  if('content' in bundle){
    content = bundle.content;
    data = mergeContent(seed, content);
    if(!content.libraryVerseIds) content.libraryVerseIds = data.verses.map(v=>v.id);
  }
  if('progress' in bundle){
    progress = {};
    for(const [id, p] of Object.entries(bundle.progress)) progress[id] = normalizeProgress(p);
  }
  if('settings' in bundle){
    settings = Object.assign({challengeTypeId:'challenge_tap_builder', dailyGoal:10, soundEnabled:true, language:'en', hearts:5, gems:0, xp:0, chestsOpened:[], practiceTheme:'dark', homeTheme:'light', lastStreakScreenDate:null, heartsResetDate:null, trophiesClaimed:[]}, bundle.settings);
    if(!CHALLENGE_TYPES[settings.challengeTypeId] && settings.challengeTypeId !== MIX_MATCH_ID) settings.challengeTypeId = 'challenge_tap_builder';
  }
  saveContent(); saveProgress(); saveSettings();
  render();
  alert('Import complete.');
}
async function loadStored(key){
  try{
    const res = await window.storage.get(key, false);
    if(res && res.value) return JSON.parse(res.value);
  }catch(e){ /* not present / no storage API */ }
  return null;
}
async function loadSeed(){
  try{
    const res = await fetch('./data/starter-pack.json');
    if(res.ok) return await res.json();
  }catch(e){ /* fall back to built-in seed */ }
  return seedData();
}
/* Eras, stories, life events and connections. Seed-only for now (nothing here
   is user editable), so they stay outside the content overlay. Small enough to
   load at boot, unlike the corpus. */
async function loadStories(){
  try{
    const res = await fetch('./data/stories.json');
    if(res.ok) return await res.json();
  }catch(e){ /* the app works without them; timeline sections just don't render */ }
  return {eras:[], stories:[], lifeEvents:[]};
}
async function loadConnections(){
  try{
    const res = await fetch('./data/connections.json');
    if(res.ok) return await res.json();
  }catch(e){ /* Family sections just won't render */ }
  return [];
}
async function loadMotifs(){
  try{
    const res = await fetch('./data/motifs.json');
    if(res.ok) return await res.json();
  }catch(e){ /* Motifs screens just won't render */ }
  return [];
}
/* Real paragraph-break boundaries from the WEB source itself (item 180
   follow-up, "I want to break down each unit by sections of a particular
   chapter"), keyed "{book}|{chapter}" -> ascending verse numbers where a
   new paragraph starts (pipeline/parse_chapter_sections.py). Deliberately
   the WEB translation's own real paragraph structure, not an invented or
   guessed heading scheme — this app has no licensed source for a study-
   Bible's own section headings, and the standing "curated, not invented"
   rule applies here too. Falls back to {} (shepherdUnits() then falls
   back to its own pure size-based split) if the fetch fails. */
async function loadChapterSections(){
  try{
    const res = await fetch('./data/chapter_sections.json');
    if(res.ok) return await res.json();
  }catch(e){ /* shepherdUnits() falls back to a pure size-based split */ }
  return {};
}

/* Word of the Day (Hebrew/Greek) and This Day in Church History — small,
   static reference datasets for two new Home cards (DATA_MODEL.md §8,
   item 89). Loaded at boot alongside motifs/connections: small enough
   not to matter, and both are read synchronously on every Home render. */
async function loadWordOfTheDayData(){
  try{
    const res = await fetch('./data/word_of_the_day.json');
    if(res.ok) return await res.json();
  }catch(e){ /* the Word of the Day card just won't render */ }
  return [];
}
/* Biblical Fact of the Day — data/daily_facts.json, same shape/loading
   pattern as Word of the Day. Every fact was hand-checked against this
   app's own already-curated data before being written in — either the
   real WEB verse text in data/verses.json, or an existing Character/
   Story/Motif relationship already curated here — not generated and
   trusted on faith. See DATA_MODEL.md §8 for the verification pass this
   file went through and why "Validated" is an earned label here rather
   than decorative copy. */
async function loadDailyFactsData(){
  try{
    const res = await fetch('./data/daily_facts.json');
    if(res.ok) return await res.json();
  }catch(e){ /* the Fact of the Day card just won't render */ }
  return [];
}
/* Strong's lexicon (item 150) — a standalone, hand-curated 39-word
   Hebrew/Greek dictionary, data/lexicon_seed.json (keyed by Strong's id,
   not read from data.verses). Small enough to load at boot like Word of
   the Day/Facts, above. Deliberately NOT wired to per-word verse text
   yet — that would need a genuinely new source pipeline (a Strong's-
   tagged original-language corpus, not just an English/Telugu parallel
   file) and full lexicon coverage (thousands of entries, not 39) to tag
   every word in the corpus. See DATA_MODEL.md §8, item 150 for the full
   scope call. */
async function loadLexiconData(){
  try{
    const res = await fetch('./data/lexicon_seed.json');
    if(res.ok) return await res.json();
  }catch(e){ /* the Lexicon screen just won't render */ }
  return {};
}
/* The full ~14,200-entry Strong's Hebrew/Greek dictionary
   (data/lexicon_full.json, pipeline/parse_strongs_dictionary.py) —
   lazily fetched the first time the Lexicon screen opens, same
   loadCorpus()/corpusStatus shape as the full English verse corpus
   (never precached by sw.js, for the same reason). lexicon_seed.json's
   39 curated entries stay loaded at boot and are overlaid on top of
   this at lookup time (lexiconEntry()) — richer, hand-picked fields
   win where both exist. */
async function loadLexiconFull(){
  if(lexiconFullStatus === 'loading' || lexiconFullStatus === 'ready') return;
  lexiconFullStatus = 'loading';
  render();
  try{
    const res = await fetch('./data/lexicon_full.json');
    if(!res.ok) throw new Error('HTTP ' + res.status);
    lexiconFull = await res.json();
    lexiconFullStatus = 'ready';
  }catch(e){
    console.error('lexicon load failed', e);
    lexiconFullStatus = 'error';
  }
  render();
}
/* Per-verse interlinear word data (item 151, batch 2) —
   data/interlinear_ot.json (Hebrew, ~11MB) and data/interlinear_nt.json
   (Greek, ~3.9MB), each a verseId -> [[originalText, [strongsIds]], ...]
   map. Split in two and fetched independently — a reader working
   through the Gospels never needs the 11MB Hebrew file, and vice versa
   — rather than one combined file. Loads whichever one a given verse
   actually needs, mirroring loadCorpus()/loadLexiconFull()'s own lazy,
   never-precached shape. */
async function loadInterlinear(testament){
  const already = testament === 'OT' ? interlinearOT : interlinearNT;
  if(already || interlinearStatus === 'loading') return;
  interlinearStatus = 'loading';
  render();
  try{
    const file = testament === 'OT' ? 'interlinear_ot.json' : 'interlinear_nt.json';
    const res = await fetch('./data/' + file);
    if(!res.ok) throw new Error('HTTP ' + res.status);
    const json = await res.json();
    if(testament === 'OT') interlinearOT = json; else interlinearNT = json;
    interlinearStatus = 'ready';
  }catch(e){
    console.error('interlinear load failed', e);
    interlinearStatus = 'error';
  }
  render();
}
function interlinearTokensFor(v){
  const isNT = NT_BOOKS.has(v.book);
  const map = isNT ? interlinearNT : interlinearOT;
  return map ? (map[v.id] || null) : null;
}
/* Real generated character portraits (item 91) — a small, hand-curated
   batch of 25 major characters so far, out of 261 total. data/
   character_portraits.json is just a flat array of character ids that
   have a real photo at media/characters/<id>.jpg; every other character
   still falls back to the existing icon-in-a-box avatar (charIcon()).
   A deliberate shortcut, not the full Media entity from DATA_MODEL.md's
   design philosophy #3 (a separate linked entity, multiple images per
   character, etc.) — that's real future work if/when portraits cover
   most of the cast; for a partial 25-character batch, one manifest file
   plus a fallback check is simpler and does the same job today. */
async function loadCharacterPortraits(){
  try{

   otherwise. Never mutates the verse object itself, so switching language

/* Adds a verse to the practice library without duplicating the "copy a
   corpus verse into your personal overlay" logic addFromCorpus() already
   has — a verse can be *in data.verses* (curated seed or previously
   added) without being *in the library* yet, so this only ever needs to
   touch content.libraryVerseIds, plus copy the verse into the overlay
   the one time it isn't part of data.verses at all yet (a fresh corpus
   verse the user has never interacted with before).
   Real bug fixed here (item 174): this guard used to read `!findVerse
   (verseId)`, but findVerse() was changed in item 153 to also fall back
   to `corpus` — so for ANY verse already present in the lazily-loaded
   full corpus (i.e. nearly every verse in the Bible), findVerse() always
   returned truthy and this branch never ran, silently skipping the copy
   into data.verses/content.verses. The verse id still landed in
   content.libraryVerseIds, so it looked added, but libraryVerses()
   filters data.verses by those ids — so it never actually showed up
   anywhere in Practice. Checking `data.verses` directly (not findVerse)
   is what this comment always described; the implementation had just
   quietly drifted out of sync with it. */
function addToLibrary(verseId){
  if(!data.verses.find(v => v.id === verseId)){
    // Same shape addFromCorpus() already builds — a fresh corpus verse
    // the user has never touched before needs copying into the overlay
    // (and data.verses directly, same shortcut addFromCorpus() uses
    // rather than a full mergeContent() re-run) before it can be "in"
    // anything at all.
    const src = corpus && corpus.find(v => v.id === verseId);
    if(src){
      const verse = {
        id: src.id, reference: src.reference, book: src.book, chapter: src.chapter,
        verse: src.verse, text: src.text, translation: src.translation,
        topicIds: [], characterIds: [], metadata: {}
      };
      content.verses.push(verse);
      data.verses.push(verse);
    }
  }
  const ids = content.libraryVerseIds || [];
  if(!ids.includes(verseId)) content.libraryVerseIds = [...ids, verseId];
  saveContent();
}

  content.libraryVerseIds = (content.libraryVerseIds || []).filter(id => id !== verseId);

}

/* seed + user overlay -> the in-memory content the app renders */
function mergeContent(seed, overlay){
  const mergeEntity = (base, over)=>{
    const out = {...base, ...over};
    // A verse added from the corpus is stored in the overlay with empty link
    // arrays. When a later starter pack gains that same id — with topics and
    // characters attached — those empty arrays must not win, or the user would
    // silently lose the seed's tags. Seed links fill in; real user links win.
    for(const key of LINK_FIELDS){
      if(Array.isArray(out[key]) && !out[key].length && Array.isArray(base[key]) && base[key].length){
        out[key] = base[key];
      }
    }
    return out;
  };
  const merge = (base, over)=>{
    const byId = new Map((base||[]).map(e=>[e.id, e]));
    for(const e of (over||[])) byId.set(e.id, mergeEntity(byId.get(e.id) || {}, e));
    return [...byId.values()].map(stripProgress);
  };
  return {
    schemaVersion: seed.schemaVersion || 2,
    verses:     merge(seed.verses,     overlay.verses),
    topics:     merge(seed.topics,     overlay.topics),
    characters: merge(seed.characters, overlay.characters)
  };
}
function stripProgress(entity){
  if(entity && 'progress' in entity){ const {progress, ...rest} = entity; return rest; }
  return entity;
}

function normalizeProgress(p){

/* Brand-flavored display labels for VerseProgress.status (DATA_MODEL.md §7)
   — the stored value stays `new|learning|review|mastered` (the SRS ladder
   logic keys off it), this is presentation-only. */
const MASTERY_LABELS = {new:'Seedling', learning:'Sprouting', review:'Rooted', mastered:'Flourishing'};
function masteryLabel(status){ return MASTERY_LABELS[status] || status; }
/* Ordered mastery ladder, used by renderMasteryBar() below for the
   4-segment visual indicator on verse cards (replaces the old uppercase
   text tag). */
const MASTERY_STAGES = ['new','learning','review','mastered'];
function renderMasteryBar(status){
  const idx = MASTERY_STAGES.indexOf(status);
  const filled = idx < 0 ? 0 : idx + 1;
  const segs = MASTERY_STAGES.map((s,i)=> `<span class="mastery-seg${i<filled?' filled':''}"></span>`).join('');
  return `<div class="mastery-bar" title="${esc(masteryLabel(status))}">${segs}</div>`;
}

/* ---------- streaks (DATA_MODEL.md §7) ----------
   Derived entirely from VerseProgress.history[], already recorded by
   recordPractice() on every attempt — no new storage, just a new view
   over data that was already being collected. Days are calendar days in
   the viewer's *local* timezone (history timestamps are UTC ISO strings),
   since a streak that resets at UTC midnight rather than the user's own
   midnight would feel broken to them.
   practiceCountsByDay() also used to back a Home activity heatmap, removed
   2026-09-09 on feedback (didn't land well there) — the function stays
   since computeStreak() needs it, and it's the natural data source if a
   heatmap comes back on a future profile screen instead. */
function localDayKey(d){
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function practiceCountsByDay(){
  const counts = {};
  for(const p of Object.values(progress)){
    for(const h of (p.history || [])){
      const d = new Date(h.at);
      if(isNaN(d)) continue;
      const key = localDayKey(d);
      counts[key] = (counts[key] || 0) + 1;
    }
  }
  return counts;
}
function computeStreak(){
  const counts = practiceCountsByDay();
  const cursor = new Date();
  // A day that hasn't happened yet doesn't break the streak — only count
  // back from yesterday if today has no activity yet.
  if(!counts[localDayKey(cursor)]) cursor.setDate(cursor.getDate()-1);
  let streak = 0;
  while(counts[localDayKey(cursor)]){
    streak++;
    cursor.setDate(cursor.getDate()-1);
  }
  return streak;
}
function todaysPracticeCount(){
  return practiceCountsByDay()[localDayKey(new Date())] || 0;
}

/* ---------- sound & haptics (Web Audio API, synthesized — no audio
   files) ----------
   Gated by settings.soundEnabled (default true) — an app for quiet study
   time needs an easy mute, not just an on switch (Settings screen). One
   AudioContext, created lazily on first use: browsers require a user
   gesture before audio can start, and playSfx is only ever called from
   inside a click-handler chain, so that's always satisfied here. */
let audioCtx = null;
const SFX_NOTES = {
  tap:      [{f:520, t:0,   d:.05, g:.05}],
  correct:  [{f:660, t:0,   d:.09, g:.09}, {f:880, t:.07, d:.14, g:.08}],
  complete: [{f:523, t:0,   d:.11, g:.08}, {f:659, t:.09, d:.11, g:.08}, {f:784, t:.18, d:.22, g:.09}],
};
function playSfx(type){
  if(settings.soundEnabled === false) return;
  try{
    if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if(audioCtx.state === 'suspended') audioCtx.resume();
    (SFX_NOTES[type] || SFX_NOTES.tap).forEach(n=>{
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.value = n.f;
      const start = audioCtx.currentTime + n.t;
      gain.gain.setValueAtTime(0, start);
      gain.gain.linearRampToValueAtTime(n.g, start + .01);
      gain.gain.exponentialRampToValueAtTime(.0001, start + n.d);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(start);
      osc.stop(start + n.d + .02);
    });
  }catch(e){ /* Web Audio unsupported/blocked — sound is decorative, fail silently */ }
}
function hapticBuzz(pattern){
  if(settings.soundEnabled === false) return; // one toggle covers sound + haptics
  try{ if(navigator.vibrate) navigator.vibrate(pattern); }catch(e){ /* not supported (e.g. iOS Safari) — fine */ }
}
