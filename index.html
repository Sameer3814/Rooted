// Theming a Topic detail page in its card's own color: derive a brighter
// text-safe tint and low-alpha wash from the one base hex, the same
// light/wash-pair shape the gold/sage/tan tokens already use, so the page can
// override just the "action/urgency" accent role locally (via inline custom
// properties on a wrapper) without touching sage (mastery) or tan (metadata)
// — those stay their normal color everywhere, same verse card component.
function hexToRgb(hex){
  const n = parseInt(hex.slice(1), 16);
  return [(n>>16)&255, (n>>8)&255, n&255];

/* ---------- TIMELINE GAME ----------
   A one-off drag-and-drop chronology puzzle over a character's own
   LifeEvents (`characterTimeline`), not part of the spaced-repetition
   verse practice loop — there's no "due" schedule for it, no ChallengeType
   entry, it just reshuffles fresh every time you open it. Up to 5 events
   are sampled evenly across the character's whole arc (not just the first
   5) so the puzzle reflects their whole life, not only its opening.
   Reordering is done by moving real DOM nodes during a pointer drag
   (see wireTimelineDrag) rather than re-rendering on every pointermove,
   which would blow away the drag gesture mid-swipe. */
function buildTimelineGame(charId){
  const timeline = characterTimeline(charId);
  const n = TIMELINE_DIFFICULTIES[timelineDifficulty] || 5;
  let picked;
  if(timeline.length <= n){
    picked = timeline;
  }else{
    // Split the whole timeline into n roughly-equal segments and pick one
    // RANDOM event from each (not the fixed midpoint) — so hitting reshuffle
    // can swap which moments show up, not just their order, while still
    // spreading across the character's whole life rather than clustering
    // events from just one part of it.
    const segSize = timeline.length / n;
    const idxs = [];
    for(let i=0;i<n;i++){
      const segStart = Math.floor(i*segSize);
      const segEnd = Math.max(segStart+1, Math.floor((i+1)*segSize));
      idxs.push(Math.min(segStart + Math.floor(Math.random()*(segEnd-segStart)), timeline.length-1));
    }
    picked = [...new Set(idxs)].map(i=>timeline[i]);
  }
  const correctIds = picked.map(e=>e.id);
  let order = [...correctIds];
  if(order.length > 1){
    do{
      for(let i=order.length-1;i>0;i--){
        const j = Math.floor(Math.random()*(i+1));
        [order[i],order[j]] = [order[j],order[i]];
      }
    }while(order.every((id,i)=>id===correctIds[i]));
  }
  return { characterId: charId, events: picked, correctIds, order, checked:false, lockedIds: new Set(), allCorrect:false };
}
function renderTimelineGame(){
  const g = timelineGame;
  if(!g) return renderCharacters();
  const c = findChar(g.characterId);
  const byId = {};
  g.events.forEach(e=>{ byId[e.id] = e; });
  return `
    <button class="back-btn" data-action="open-character" data-id="${g.characterId}" style="margin-bottom:14px;"><i class="ti ti-arrow-left"></i></button>
    <div class="topbar"><h1>Put their life in order</h1></div>
    <p style="color:var(--ink-soft);margin-bottom:14px;">Drag ${c ? esc(c.name) : 'these'} moments into the order they actually happened.</p>
    <div style="display:flex;gap:8px;align-items:center;margin-bottom:14px;">
      <div class="segmented" style="flex:1;margin-bottom:0;">
        ${Object.keys(TIMELINE_DIFFICULTIES).map(d=>`<button class="${timelineDifficulty===d?'active':''}" data-action="set-timeline-difficulty" data-id="${d}">${d[0].toUpperCase()+d.slice(1)} · ${TIMELINE_DIFFICULTIES[d]}</button>`).join('')}
      </div>
      <button class="btn" style="flex-shrink:0;" data-action="reshuffle-timeline-game" data-id="${g.characterId}" title="Reshuffle"><i class="ti ti-refresh"></i></button>
    </div>
    <div class="tl-drag-track" id="tl-drag-track">
      ${g.order.map((id,i)=>{
        const e = byId[id];
        const locked = g.lockedIds.has(id);
        const wrong = g.checked && !locked;
        const cls = locked ? 'tl-drag-correct' : wrong ? 'tl-drag-wrong' : '';
        return `<div class="tl-drag-item ${cls}" data-id="${id}"${locked ? '' : ' data-draggable="1"'}>
          ${locked ? '<i class="ti ti-check tl-drag-check"></i>' : '<span class="tl-drag-handle"><i class="ti ti-grip-vertical"></i></span>'}
          <div class="tl-drag-body">
            <div class="tl-title">${esc(e.title)}</div>
            ${(g.checked || locked) ? `<div class="tl-ref">${esc(e.reference)}</div>` : ''}
          </div>
        </div>`;
      }).join('')}
    </div>
    ${g.allCorrect ? `
      <div class="result-banner good" style="margin-top:16px;"><i class="ti ti-confetti"></i> That's the right order — nice work!</div>
      <button class="btn primary block" data-action="open-character" data-id="${g.characterId}">Back to ${c ? esc(c.name) : 'profile'}</button>
    ` : `
      <button class="btn primary block" style="margin-top:16px;" data-action="check-timeline-order"><i class="ti ti-check"></i> Check order</button>
      ${g.checked ? `<button class="btn block" style="margin-top:8px;width:100%;" data-action="reset-timeline-order">Shuffle the rest</button>` : ''}
    `}
  `;
}
function checkTimelineOrder(){
  const g = timelineGame;
  if(!g) return;
  const track = document.getElementById('tl-drag-track');
  if(!track) return;
  const domIds = [...track.querySelectorAll('.tl-drag-item')].map(el=>el.dataset.id);
  // Reconstruct the logical order rather than trusting raw DOM order:
  // already-locked ids are forced back to their one true correct index
  // (g.correctIds.indexOf), and the still-unlocked ids fill whatever
  // slots are left, in the relative order they appear in the DOM. This is
  // what makes a locked card immune to index drift — dragging an unlocked
  // card past it can visually nudge it in the DOM mid-drag, but it always
  // snaps back to its correct slot here rather than silently being
  // graded against whatever index it happened to end up at.
  const unlockedInDomOrder = domIds.filter(id => !g.lockedIds.has(id));
  let cursor = 0;
  const newOrder = g.correctIds.map(cid => g.lockedIds.has(cid) ? cid : unlockedInDomOrder[cursor++]);
  g.order = newOrder;
  const correctCountBefore = g.lockedIds.size;
  newOrder.forEach((id,i)=>{ if(id === g.correctIds[i]) g.lockedIds.add(id); });
  g.checked = true;
  g.allCorrect = g.lockedIds.size === g.correctIds.length;
  if(g.allCorrect){ playSfx('complete'); hapticBuzz([20,40,20]); }
  else if(g.lockedIds.size > correctCountBefore){ playSfx('correct'); hapticBuzz(20); }
  else{ hapticBuzz(20); }
  render();
}
function resetTimelineOrder(){
  const g = timelineGame;
  if(!g) return;
  // Correctly-placed events from the last check stay locked at their true
  // index permanently (g.lockedIds persists across attempts); only the
  // ones still wrong get reshuffled among the remaining slots — a
  // progressive puzzle, not a full restart every attempt.
  const wrongIds = g.order.filter(id => !g.lockedIds.has(id));
  if(wrongIds.length > 1){
    let shuffled;
    do{
      shuffled = [...wrongIds];
      for(let i=shuffled.length-1;i>0;i--){
        const j = Math.floor(Math.random()*(i+1));
        [shuffled[i],shuffled[j]] = [shuffled[j],shuffled[i]];
      }
    }while(shuffled.every((id,i)=>id===wrongIds[i]));
    let cursor = 0;
    g.order = g.order.map(id => g.lockedIds.has(id) ? id : shuffled[cursor++]);
  }
  g.checked = false;
  render();
}
/* Pan (drag) + zoom (wheel on desktop, pinch on touch) for the family
   tree's SVG — plain SVG has no built-in viewport gestures, and this
   app has no existing graph/canvas component to reuse, so this is
   hand-rolled rather than pulling in a library (no precedent for a
   third-party JS dependency anywhere in this vanilla-JS app). Tap vs.
   drag is disambiguated by total pointer movement, same threshold
   approach as wireSwipeBack() elsewhere in this file — a drag that
   crossed the threshold suppresses the trailing click so panning across
   a node never accidentally re-centers the tree on it. */
function wireFamilyTreePanZoom(){
  const viewport = document.getElementById('family-tree-viewport');
  const canvas = document.getElementById('family-tree-canvas');
  if(!viewport || !canvas) return;
  let scale = 1, tx = 0, ty = 0;
  let moved = false;
  const pointers = new Map(); // pointerId -> {x, y}
  let pinchStartDist = 0, pinchStartScale = 1;
  const MIN_SCALE = 0.4, MAX_SCALE = 2.5;

  function apply(){ canvas.style.transform = `translate(${tx}px, ${ty}px) scale(${scale})`; }
  function clampScale(s){ return Math.min(MAX_SCALE, Math.max(MIN_SCALE, s)); }
  function dist(a, b){ return Math.hypot(a.x - b.x, a.y - b.y); }

  viewport.addEventListener('pointerdown', e=>{
    viewport.setPointerCapture(e.pointerId);
    pointers.set(e.pointerId, {x: e.clientX, y: e.clientY});
    moved = false;
    if(pointers.size === 2){
      const [a, b] = [...pointers.values()];
      pinchStartDist = dist(a, b) || 1;
      pinchStartScale = scale;
    }
  });
  viewport.addEventListener('pointermove', e=>{
    if(!pointers.has(e.pointerId)) return;
    const prev = pointers.get(e.pointerId);
    const dx = e.clientX - prev.x, dy = e.clientY - prev.y;
    pointers.set(e.pointerId, {x: e.clientX, y: e.clientY});
    if(Math.abs(dx) > 2 || Math.abs(dy) > 2) moved = true;
    if(pointers.size === 2){
      const [a, b] = [...pointers.values()];
      scale = clampScale(pinchStartScale * (dist(a, b) / pinchStartDist));
    }else if(pointers.size === 1){
      tx += dx; ty += dy;
    }
    apply();
  });
  function endPointer(e){
    pointers.delete(e.pointerId);
    if(moved){
      // Swallow the click that follows a drag so tapping-through-a-node
      // mid-pan doesn't also re-center the tree on it.
      const suppress = ev => { ev.stopPropagation(); ev.preventDefault(); viewport.removeEventListener('click', suppress, true); };
      viewport.addEventListener('click', suppress, true);
    }
  }
  viewport.addEventListener('pointerup', endPointer);
  viewport.addEventListener('pointercancel', endPointer);
  viewport.addEventListener('wheel', e=>{
    e.preventDefault();
    scale = clampScale(scale * (e.deltaY < 0 ? 1.12 : 0.89));
    apply();
  }, {passive: false});
}
function wireTimelineDrag(){
  const track = document.getElementById('tl-drag-track');
  if(!track) return;
  let dragEl = null;
  let startY = 0;
  function onMove(ev){
    if(!dragEl) return;
    const dy = ev.clientY - startY;
    dragEl.style.transform = `translateY(${dy}px)`;
    const pointerY = ev.clientY;
    const siblings = [...track.children].filter(el => el !== dragEl && !el.classList.contains('tl-drag-correct'));
    for(const sib of siblings){
      const r = sib.getBoundingClientRect();
      if(pointerY > r.top && pointerY < r.bottom){
        const dragRect = dragEl.getBoundingClientRect();
        const goingDown = dragRect.top < r.top;
        track.insertBefore(dragEl, goingDown ? sib.nextSibling : sib);
        startY = ev.clientY;
        dragEl.style.transform = 'translateY(0px)';
        break;
      }
    }
  }
  function onUp(){
    document.removeEventListener('pointermove', onMove);
    document.removeEventListener('pointerup', onUp);
    document.removeEventListener('pointercancel', onUp);
    if(!dragEl) return;
    dragEl.style.transform = '';
    dragEl.classList.remove('dragging');
    dragEl = null;
  }
  track.querySelectorAll('.tl-drag-item[data-draggable="1"]').forEach(item=>{
    item.addEventListener('pointerdown', e=>{
      dragEl = item;
      startY = e.clientY;
      item.classList.add('dragging');
      document.addEventListener('pointermove', onMove);
      document.addEventListener('pointerup', onUp);
      document.addEventListener('pointercancel', onUp);
    });
  });
}

/* Node-link family tree, v2 rendering overhaul (2026-09-16) — a hybrid
   render: an absolutely-positioned SVG draws ONLY the curved connector
   paths (pointer-events:none, per spec, so it never blocks panning),
   and the nodes themselves are real HTML cards (avatar <img>, name,
   role) absolutely positioned in the same coordinate space, layered on
   top — real <img>/flexbox/transition is far more natural here than
   approximating them in raw SVG shapes, and it's what the exact CSS in
   the spec (object-fit, transition, box-shadow) actually describes.
   Both the svg and the cards live inside #family-tree-canvas, which is
   what wireFamilyTreePanZoom() transforms (translate+scale) — panning/
   zooming moves lines and cards together as one unit.

   "Selected" (spec's highlight state) is treated as "the current focal
   person" — the root card gets the active/glow treatment, and every
   edge touching it gets the highlighted stroke — rather than adding a
   separate hover-only preview state this app has no other precedent
   for; tapping any card still re-centers the tree on that person
   (family-tree-nav, chaining `from` so the back button walks back
   through however many people were visited, same pattern as Character
   Detail's own back button). The header's search icon jumps straight
   to the picker at any point. */
function renderFamilyTree(id){
  const c = id && findChar(id);
  if(!c) return renderFamilyTreePicker();
  const {nodes, edges} = familyGraph(id, 2);
  const {pos, width, height, NODE_W, NODE_H} = layoutFamilyGraph(nodes, edges);
  const edgeSvg = edges.map(e=>{
    const a = pos.get(e.from), b = pos.get(e.to);
    if(!a || !b) return '';
    const isHighlighted = e.from === id || e.to === id;
    const baseStroke = isHighlighted
      ? 'stroke:#C69255;stroke-width:3;filter:drop-shadow(0 0 6px rgba(198,146,85,.4));'
      : 'stroke:rgba(198,146,85,.45);stroke-width:2.5;';
    const dash = e.kind === 'parent-child' ? '' : 'stroke-dasharray:5,5;';
    if(e.kind === 'parent-child'){
      const d = familyTreeBezier(a, b, NODE_W, NODE_H);
      return `<path d="${d}" fill="none" stroke-linecap="round" style="${baseStroke}${dash}"/>`;
    }
    // Same-row (spouse/sibling) edges connect facing card edges with a
    // plain line — a vertical bottom-to-top Bezier has no meaning
    // between two nodes at the same Y.
    const left = a.x <= b.x ? a : b, right = a.x <= b.x ? b : a;
    const x1 = left.x + NODE_W, y1 = left.y + NODE_H/2;
    const x2 = right.x, y2 = right.y + NODE_H/2;
    return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke-linecap="round" style="${baseStroke}${dash}"/>`;
  }).join('');
  const nodeCards = nodes.map(n=>{
    const p = pos.get(n.char.id);
    const isRoot = n.char.id === id;
    const sub = (n.char.roles && n.char.roles[0]) || '';
    return `
      <div class="tree-node-card${isRoot ? ' active' : ''}" data-action="family-tree-nav" data-id="${n.char.id}" style="left:${p.x}px;top:${p.y}px;width:${NODE_W}px;">
        <div class="tree-avatar">${charAvatarInner(n.char)}</div>
        <div class="tree-node-info">
          <div class="tree-node-name">${esc(n.char.name)}</div>
          ${sub ? `<div class="tree-node-sub">${esc(sub)}</div>` : ''}
        </div>
      </div>`;
  }).join('');
  return `
    <div class="screen-head">
      <button class="back-btn" data-action="family-tree-back"><i class="ti ti-arrow-left"></i></button>
      <h2>${esc(c.name)}'s Family</h2>
      <button class="back-btn" data-action="go-family-tree" style="margin-left:auto;" title="Search for someone else"><i class="ti ti-search"></i></button>
    </div>
    ${edges.length ? `
      <div class="tree-viewport" id="family-tree-viewport">
        <div class="tree-legend">
          <span><i class="tree-legend-line"></i> parent / child</span>
          <span><i class="tree-legend-line tree-legend-dash"></i> spouse</span>
          <span><i class="tree-legend-line tree-legend-dash" style="opacity:.4;"></i> sibling</span>
        </div>
        <div class="tree-canvas" id="family-tree-canvas" style="width:${width}px;height:${height}px;">
          <svg class="tree-edges-svg" width="${width}" height="${height}" viewBox="0 0 ${width} ${height}">${edgeSvg}</svg>
          ${nodeCards}
        </div>
      </div>
      <p class="field-hint" style="margin-top:10px;">Drag to pan, pinch or scroll to zoom, tap anyone to re-center on them.</p>
    ` : `<div class="empty"><i class="ti ti-affiliate"></i><p>No family relationships curated for ${esc(c.name)} yet.</p></div>`}
  `;
}

/* ---------- PRACTICE ----------
   Challenge types are pluggable and data-described (DATA_MODEL.md §3), not a
   hardcoded switch. Each type in CHALLENGE_TYPES implements:
     build(entity, config)  -> state   opaque per-attempt state
     render(state)          -> html    reads state.checked for the graded view
     check(state)           -> { allCorrect, correctCount, total }
                                       reads its own DOM, mutates state
     score(state)           -> 0..1
     interact(state, ds)    optional; handle a tap on an element the type
                            rendered with data-action="practice-interact"
                            (ds = that element's dataset). Mutates state.
                            If it sets state.checked itself (a self-graded
                            type finalizing), the caller does the same
                            session bookkeeping check() would have.
     controls(state)        optional; HTML for the action-button area while
                            !state.checked. Replaces the generic "Check"
                            button — for a type whose finalization isn't a
                            single auto-graded tap (self-graded reveal).
   Adding matching / ordering = another entry here, no changes to
   startPractice / renderPractice / checkPractice.
*/
const CHALLENGE_TYPES = {
  challenge_fill_blank: {
    id: 'challenge_fill_blank',
    name: 'Fill in the blank',
    appliesToEntityTypes: ['verse'],
    config: { blankRatio: 0.3, maxBlanks: 4, minWordLength: 4 },
    enabled: true,
    build(verse, config){
      const words = verse.text.split(' ');
      const eligible = words.map((w,i)=>i)
        .filter(i => words[i].replace(/[^a-zA-Z]/g,'').length >= config.minWordLength);
      const count = Math.max(1, Math.min(config.maxBlanks, Math.round(eligible.length * config.blankRatio)));
      const pool = [...eligible];
      const blanks = [];
      while(blanks.length < count && pool.length){
        blanks.push(pool.splice(Math.floor(Math.random() * pool.length), 1)[0]);
      }
      blanks.sort((a,b)=>a-b);
      return { words, blanks, checked:false, given:[], results:[], allCorrect:false };
    },
    render(state){
      return state.words.map((w,i)=>{
        const bi = state.blanks.indexOf(i);
        if(bi === -1) return esc(w);
        const cls = state.checked ? (state.results[bi] ? 'correct' : 'wrong') : '';
        const size = Math.max(3, w.replace(/[^a-zA-Z]/g,'').length);
        const val = state.checked ? ` value="${esc(state.given[bi] || '')}"` : '';
        return `<span class="blank ${cls}"><input type="text" data-blank="${i}"${val} ${state.checked?'readonly':''} style="width:${size*13}px" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"></span>`;
      }).join(' ');
    },
    check(state){
      const norm = s => s.trim().toLowerCase().replace(/[^a-z0-9']/g,'');
      let allCorrect = true;
      state.blanks.forEach((wi, bi)=>{
        const input = document.querySelector(`[data-blank="${wi}"]`);
        const raw = input ? (input.value || '') : '';
        const ok = norm(raw) === norm(state.words[wi]);
        state.given[bi] = raw;
        state.results[bi] = ok;
        if(!ok) allCorrect = false;
      });
      state.checked = true;
      state.allCorrect = allCorrect;
      return { allCorrect, correctCount: state.results.filter(Boolean).length, total: state.blanks.length };
    },
    score(state){
      if(!state.results.length) return 0;
      return state.results.filter(Boolean).length / state.results.length;
    }
  },

  challenge_scramble: {
    id: 'challenge_scramble',
    name: 'Unscramble',
    appliesToEntityTypes: ['verse'],
    config: { maxWords: 14 },
    enabled: true,
    build(verse, config){
      const words = verse.text.split(' ');
      // For a long verse, scramble only a contiguous window and keep the rest
      // as fixed context so the task stays doable.
      let start = 0, len = words.length;
      if(words.length > config.maxWords){
        len = config.maxWords;
        start = Math.floor(Math.random() * (words.length - len + 1));
      }
      const pool = [];
      for(let i = start; i < start + len; i++) pool.push(i);
      for(let i = pool.length - 1; i > 0; i--){
        const j = Math.floor(Math.random() * (i + 1));
        [pool[i], pool[j]] = [pool[j], pool[i]];
      }
      // avoid handing back an already-sorted "scramble"
      if(len > 1 && pool.every((wi, k) => wi === start + k)) pool.reverse();
      return { words, start, len, pool, picked:[], checked:false, results:[], allCorrect:false };
    },
    interact(state, ds){
      if(ds.pick !== undefined && ds.pick !== ''){
        const p = +ds.pick;
        state.picked.push(state.pool[p]);
        state.pool.splice(p, 1);
      }else if(ds.unpick !== undefined && ds.unpick !== ''){
        const p = +ds.unpick;
        state.pool.push(state.picked[p]);
        state.picked.splice(p, 1);
      }
    },
    render(state){
      const {words, start, len} = state;
      const prefix = words.slice(0, start).join(' ');
      const suffix = words.slice(start + len).join(' ');
      if(state.checked){
        const seq = [];
        for(let i = 0; i < len; i++){
          const wi = state.picked[i];
          const cls = state.results[i] ? 'chip-correct' : 'chip-wrong';
          seq.push(`<span class="chip ${cls}">${esc(wi === undefined ? '—' : words[wi])}</span>`);
        }
        return `${prefix ? `<span class="scramble-fixed">${esc(prefix)} </span>` : ''}${seq.join(' ')}${suffix ? `<span class="scramble-fixed"> ${esc(suffix)}</span>` : ''}`;
      }
      const built = state.picked
        .map((wi, pi) => `<button class="chip picked" data-action="practice-interact" data-unpick="${pi}">${esc(words[wi])}</button>`)
        .join(' ');
      const pool = state.pool
        .map((wi, pi) => `<button class="chip" data-action="practice-interact" data-pick="${pi}">${esc(words[wi])}</button>`)
        .join(' ');
      return `
        ${prefix ? `<div class="scramble-fixed">${esc(prefix)} …</div>` : ''}
        <div class="scramble-build">${built || '<span class="scramble-hint">tap the words below in order</span>'}</div>
        <div class="scramble-pool">${pool || '<span class="scramble-hint">all words placed — tap Check</span>'}</div>
        ${suffix ? `<div class="scramble-fixed">… ${esc(suffix)}</div>` : ''}
      `;
    },
    check(state){
      const {words, start, len} = state;
      const results = [];
      for(let i = 0; i < len; i++){
        const wi = state.picked[i];
        results[i] = wi !== undefined && words[wi] === words[start + i];
      }
      const allCorrect = state.picked.length === len && results.every(Boolean);
      state.results = results;
      state.checked = true;
      state.allCorrect = allCorrect;
      return { allCorrect, correctCount: results.filter(Boolean).length, total: len };
    },
    score(state){
      if(!state.len) return 0;
      return state.results.filter(Boolean).length / state.len;
    }
  },

  challenge_first_letters: {
    id: 'challenge_first_letters',
    name: 'Progressive reveal',
    appliesToEntityTypes: ['verse'],
    config: {},
    enabled: true,
    // Self-graded: closer to how memorization actually works than an
    // auto-graded type. Shown only the first letter of every word, the user
    // recalls the verse from memory, reveals it, and judges their own recall
    // — there's no DOM input to check a string against.
    build(verse){
      return { words: verse.text.split(' '), revealed:false, checked:false, allCorrect:false };
    },
    render(state){
      if(!state.revealed) return state.words.map(hintWord).join(' ');
      return esc(state.words.join(' '));
    },
    interact(state, ds){
      if(ds.reveal !== undefined){
        state.revealed = true;
      }else if(ds.selfgrade !== undefined){
        state.checked = true;
        state.allCorrect = ds.selfgrade === 'correct';
      }
    },
    controls(state){
      if(!state.revealed){
        return `<button class="btn primary block" data-action="practice-interact" data-reveal="1"><i class="ti ti-eye"></i> Reveal</button>`;
      }
      return `<div style="display:flex;gap:8px;">
        <button class="btn block" style="flex:1;" data-action="practice-interact" data-selfgrade="wrong">Missed it</button>
        <button class="btn primary block" style="flex:1;" data-action="practice-interact" data-selfgrade="correct">Got it</button>
      </div>`;
    },
    score(state){ return state.allCorrect ? 1 : 0; }
  },

  challenge_verse_ladder: {
    id: 'challenge_verse_ladder',
    name: 'Verse ladder',
    appliesToEntityTypes: ['verse'],
    config: { stageRatios: [0, 0.25, 0.5, 0.75, 1] },
    enabled: true,
    // Self-graded, like Progressive reveal — but words disappear in
    // graduated steps (0% / 25% / 50% / 75% / 100% hidden) instead of one
    // reveal/hide toggle. A fixed random word order decides which words go
    // first and stays fixed for the whole climb, so stage N's hidden set is
    // always a superset of stage N-1's — nothing that's already hidden ever
    // reappears. At the last rung (fully hidden, first-letters only, via
    // the same hintWord() used by Progressive reveal) the user recalls the
    // verse from memory and self-grades.
    build(verse, config){
      const words = verse.text.split(' ');
      const order = words.map((_,i)=>i);
      for(let i = order.length - 1; i > 0; i--){
        const j = Math.floor(Math.random() * (i + 1));
        [order[i], order[j]] = [order[j], order[i]];
      }
      return { words, order, stage: 0, stageRatios: config.stageRatios, checked:false, allCorrect:false };
    },
    render(state){
      const {words, order, stage, stageRatios} = state;
      const lastStage = stage >= stageRatios.length - 1;
      const hideCount = Math.round(words.length * stageRatios[stage]);
      const hidden = new Set(order.slice(0, hideCount));
      const label = stage === 0 ? 'Full text' : lastStage ? 'Recall time' : `${Math.round(stageRatios[stage]*100)}% hidden`;
      const body = words.map((w,i)=> hidden.has(i) ? hintWord(w) : esc(w)).join(' ');
      return `<div class="field-hint" style="margin-bottom:8px;">${esc(label)}</div>${body}`;
    },
    interact(state, ds){
      if(ds.advance !== undefined){
        state.stage = Math.min(state.stage + 1, state.stageRatios.length - 1);
      }else if(ds.selfgrade !== undefined){
        state.checked = true;
        state.allCorrect = ds.selfgrade === 'correct';
      }
    },
    controls(state){
      if(state.stage < state.stageRatios.length - 1){
        return `<button class="btn primary block" data-action="practice-interact" data-advance="1"><i class="ti ti-arrow-down"></i> Hide more</button>`;
      }
      return `<div style="display:flex;gap:8px;">
        <button class="btn block" style="flex:1;" data-action="practice-interact" data-selfgrade="wrong">Missed it</button>
        <button class="btn primary block" style="flex:1;" data-action="practice-interact" data-selfgrade="correct">Got it</button>
      </div>`;
    },
    score(state){ return state.allCorrect ? 1 : 0; }
  },

  challenge_tap_builder: {
    id: 'challenge_tap_builder',
    name: 'Tap Builder',
    appliesToEntityTypes: ['verse'],
    config: { minBlanks: 4, maxBlanks: 6, minWordLength: 4, distractorCount: 3 },
    enabled: true,
    // Distractors are drawn from data.verses (the user's own already-
    // loaded library) rather than the full corpus in data/verses.json —
    // that corpus is lazily fetched only once Browse has been opened
    // (see loadCorpus()), so relying on it here would make this
    // exercise silently distractor-less (or need its own network fetch)
    // for anyone who opens Practice without ever visiting Discover
    // first. data.verses is always in memory and plenty large enough
    // to find real, differently-worded words from.
    build(verse, config){
      const words = verse.text.split(' ');
      const eligible = words.map((_,i)=>i)
        .filter(i => words[i].replace(/[^a-zA-Z]/g,'').length >= config.minWordLength);
      const blankCount = Math.max(1, Math.min(config.maxBlanks, eligible.length,
        config.minBlanks + Math.floor(Math.random() * (config.maxBlanks - config.minBlanks + 1))));
      const pool = [...eligible];
      const blankIndices = [];
      while(blankIndices.length < blankCount && pool.length){
        blankIndices.push(pool.splice(Math.floor(Math.random() * pool.length), 1)[0]);
      }
      blankIndices.sort((a,b)=>a-b);
      const correctWords = blankIndices.map(i => words[i]);
      const distractors = pickTapBuilderDistractors(config.distractorCount, verse.id, correctWords, config.minWordLength);
      const bank = shuffleInPlace([...correctWords, ...distractors]);
      return {
        words, blankIndices, bank,
        slots: blankIndices.map(()=>null),   // parallel to blankIndices: null, or an index into bank[]
        usedBank: bank.map(()=>false),
        checked: false, results: [], allCorrect: false
      };
    },
    interact(state, ds){
      if(state.checked) return;
      if(ds.tapBank !== undefined){
        const bi = +ds.tapBank;
        if(state.usedBank[bi]) return;
        const si = state.slots.indexOf(null);
        if(si === -1) return; // no empty slot left
        state.slots[si] = bi;
        state.usedBank[bi] = true;
      }else if(ds.tapSlot !== undefined){
        const si = +ds.tapSlot;
        const bi = state.slots[si];
        if(bi === null || bi === undefined) return;
        state.slots[si] = null;
        state.usedBank[bi] = false;
      }
    },
    render(state){
      const {words, blankIndices, slots, bank, usedBank, checked, results, allCorrect} = state;
      const sentence = words.map((w, i)=>{
        const si = blankIndices.indexOf(i);
        if(si === -1) return esc(w);
        const bi = slots[si];
        const filled = bi !== null && bi !== undefined;
        const cls = checked ? (results[si] ? 'tap-slot-correct' : 'tap-slot-wrong') : (filled ? 'tap-slot-filled' : '');
        const action = (!checked && filled) ? ` data-action="practice-interact" data-tap-slot="${si}"` : '';
        return `<span class="tap-slot ${cls}"${action}>${filled ? esc(bank[bi]) : ''}</span>`;
      }).join(' ');
      const tiles = bank.map((w, i)=>
        usedBank[i] ? '' : `<button class="tap-tile" data-action="practice-interact" data-tap-bank="${i}">${esc(w)}</button>`
      ).join('');
      return `
        <div class="target-sentence-box${checked && !allCorrect ? ' tap-shake' : ''}">${sentence}</div>
        <div class="word-bank-grid">${tiles || '<span class="scramble-hint">every tile placed — tap Check Answer</span>'}</div>
      `;
    },
    canCheck(state){ return state.slots.every(s => s !== null); },
    check(state){
      const norm = s => s.trim().toLowerCase().replace(/[^a-z0-9']/g,'');
      const results = state.blankIndices.map((wi, si)=>{
        const bi = state.slots[si];
        return bi !== null && bi !== undefined && norm(state.bank[bi]) === norm(state.words[wi]);
      });
      const allCorrect = results.every(Boolean);
      state.results = results;
      state.checked = true;
      state.allCorrect = allCorrect;
      return { allCorrect, correctCount: results.filter(Boolean).length, total: results.length };
    },
    score(state){
      if(!state.results.length) return 0;
      return state.results.filter(Boolean).length / state.results.length;
    },
    // A correct answer immediately advances to the next verse (still
    // behind the normal "Continue" button too, in case this fires after
    // the user's already tapped it — see checkPractice()) — the one
    // challenge type in this app that auto-advances, since the tap-to-
    // fill interaction already feels fast/game-like in a way typing an
    // answer or self-grading doesn't.
    autoAdvanceMs: 600
  }
};
function shuffleInPlace(arr){
  for(let i = arr.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}
function pickTapBuilderDistractors(count, verseId, excludeWords, minWordLength){
  const exclude = new Set(excludeWords.map(w => w.toLowerCase().replace(/[^a-z0-9']/g,'')));
  const candidates = [];
  for(const v of data.verses){
    if(v.id === verseId) continue;
    for(const w of v.text.split(' ')){
      const clean = w.replace(/[^a-zA-Z']/g,'');
      const norm = clean.toLowerCase();
      if(clean.length >= minWordLength && !exclude.has(norm)) candidates.push(clean);
    }
  }
  shuffleInPlace(candidates);
  const picked = [];
  const seen = new Set(exclude);
  for(const w of candidates){
    const norm = w.toLowerCase();
    if(seen.has(norm)) continue;
    seen.add(norm);
    picked.push(w);
    if(picked.length >= count) break;
  }
  return picked;
}
/* First letter of each word kept, every other letter blanked to an
   underscore; everything else (spacing within the word, punctuation,
   apostrophes) left exactly as-is. Handles "don't" / "Yahweh's" correctly
   because it walks characters rather than assuming letters are contiguous. */
function hintWord(word){
  let seenFirst = false;
  return esc([...word].map(ch=>{
    if(!/[a-zA-Z]/.test(ch)) return ch;
    if(!seenFirst){ seenFirst = true; return ch; }
    return '_';
  }).join(''));
}
function challengeType(id){ return CHALLENGE_TYPES[id] || CHALLENGE_TYPES.challenge_fill_blank; }
function verseChallengeTypes(){ return Object.values(CHALLENGE_TYPES).filter(t => t.enabled && t.appliesToEntityTypes.includes('verse')); }

function startPractice(verseIds, challengeTypeId){
  const ids = (verseIds || []).filter(id => findVerse(id));
  if(!ids.length) return;
  const type = challengeType(challengeTypeId || settings.challengeTypeId);
  session = {
    challengeTypeId: type.id,
    queue: ids.map(id => ({ verseId: id, state: type.build(findVerse(id), type.config) })),
    index: 0,
    results: []
  };
  go('practice');
}
/* Small CSS-only confetti burst — spans with a randomized rotation +
   outward translateY, no <canvas> or per-frame JS. See index's design
   notes: a real canvas particle system needs a requestAnimationFrame
   loop, which is a real battery/perf cost on a low-end phone for a
   decorative flourish; this reads the same and costs nothing at rest. */
function renderSparks(n){
  let out = '';
  for(let i=0;i<n;i++){
    const angle = (Math.random()*360).toFixed(1);
    const dist = (36 + Math.random()*46).toFixed(1);
    const size = (4 + Math.random()*4).toFixed(1);
    const delay = (Math.random()*0.15).toFixed(2);
    const color = Math.random() < 0.75 ? 'var(--gold)' : 'var(--gold-deep)';
    out += `<span class="spark" style="--angle:${angle}deg;--dist:${dist}px;--size:${size}px;--spark-color:${color};animation-delay:${delay}s;"></span>`;
  }
  return out;
}

function renderPractice(){
  if(!session) return renderPracticeLanding();
  if(session.index >= session.queue.length){
    // Deliberately does NOT null `session` here — a background render
    // (cloud sync landing, a timer) between finishing and tapping "Done"
    // used to silently reset this screen to "0/0 correct". session.index
    // staying >= session.queue.length already keeps this branch stable on
    // repeated renders; session is only cleared when the user actually
    // leaves, via the "Done" button (data-action="exit-practice").
    const results = session.results;
    const total = results.length;
    const correct = results.filter(r => r.allCorrect).length;
    const streak = computeStreak();
    return `
      <div class="topbar"><h1>Session complete</h1></div>
      <div class="card complete-card">
        <div class="sparks">${renderSparks(14)}</div>
        <i class="ti ti-confetti complete-icon"></i>
        <h2 style="margin-top:10px;">${correct} / ${total} correct</h2>
        <div class="complete-stats">
          <div class="complete-stat" style="animation-delay:.12s;"><div class="num">${total}</div><div class="lbl">Verses reviewed</div></div>
          <div class="complete-stat" style="animation-delay:.26s;"><div class="num">${streak}</div><div class="lbl">Day streak</div></div>
        </div>
        <p style="color:var(--ink-soft);margin-top:14px;">Next review dates have been updated.</p>
        <button class="btn primary block" style="margin-top:18px;" data-action="exit-practice">Done</button>
      </div>
    `;
  }
  const type = challengeType(session.challengeTypeId);
  const item = session.queue[session.index];
  const v = findVerse(item.verseId);
  const st = item.state;
  const progressPct = Math.round((session.index / session.queue.length) * 100);
  const lastOne = session.index + 1 >= session.queue.length;
  const isTapBuilder = type.id === 'challenge_tap_builder';
  const canCheck = type.canCheck ? type.canCheck(st) : true;
  return `
    <div class="screen-head">
      <button class="back-btn" data-action="exit-practice"><i class="ti ti-x"></i></button>
      <h2>Practice</h2>
      <span style="margin-left:auto;font-size:var(--text-sm);color:var(--ink-faint);">${session.index + 1} of ${session.queue.length}</span>
    </div>
    <div class="progress-track"><div class="progress-fill" style="width:${progressPct}%"></div></div>
    ${st.checked ? `<div class="result-banner ${st.allCorrect?'good':'bad'}"><i class="ti ${st.allCorrect?'ti-check':'ti-refresh'}"></i>${st.allCorrect ? 'Nice, got it!' : 'Close — review this one again soon.'}</div>` : ''}
    ${isTapBuilder ? `
      <div class="ref" style="font-size:12px;color:var(--gold-deep);font-weight:600;margin-bottom:10px;">${esc(v.reference)} <span style="color:var(--ink-faint);font-weight:500;">· ${esc(type.name)}</span></div>
      ${type.render(st)}
    ` : `
      <div class="card">
        <div class="ref" style="font-size:12px;color:var(--gold-deep);font-weight:600;margin-bottom:10px;">${esc(v.reference)} <span style="color:var(--ink-faint);font-weight:500;">· ${esc(type.name)}</span></div>
        <div class="practice-verse">${type.render(st)}</div>
      </div>
    `}
    ${st.checked
      ? `<button class="btn primary block" data-action="next-practice"><i class="ti ti-arrow-right"></i> ${lastOne ? 'Finish' : 'Continue'}</button>`
      : type.controls
      ? type.controls(st)
      : `<button class="btn primary block${isTapBuilder ? ' tap-builder-check' : ''}" data-action="check-practice"${canCheck ? '' : ' disabled'}>${isTapBuilder ? 'Check Answer' : 'Check'}</button>`}
  `;
}

/* ---------- form save handlers ---------- */
function saveVerse(){
  const ref = document.getElementById('f-ref').value.trim();
  const text = document.getElementById('f-text').value.trim();
  const topicsRaw = document.getElementById('f-topics').value.trim();
  const errEl = document.getElementById('form-err');
  if(!ref || !text){ errEl.textContent = 'Enter a reference and verse text.'; return; }
  const topicIds = [];
  if(topicsRaw){
    topicsRaw.split(',').map(s=>s.trim()).filter(Boolean).forEach(name=>{
      let t = data.topics.find(t=>t.name.toLowerCase()===name.toLowerCase());
      if(!t){
        t = {id:'topic_'+name.toLowerCase().replace(/[^a-z0-9]+/g,'_'), name: name.charAt(0).toUpperCase()+name.slice(1), description:'', relatedTopicIds:[], metadata:{}};
        content.topics.push(t);
        data.topics.push(t);
      }
      topicIds.push(t.id);
    });
  }
  const verse = {id:'verse_'+Date.now(), reference:ref, text, translation:'', topicIds, characterIds:[], metadata:{}};
  content.verses.push(verse);
  data.verses.push(verse);
  saveContent();
  go('home');
}
function saveCharacter(){
  const name = document.getElementById('c-name').value.trim();
  const rolesRaw = document.getElementById('c-roles').value.trim();
  const era = document.getElementById('c-era').value.trim();
  const summary = document.getElementById('c-summary').value.trim();
  const errEl = document.getElementById('cform-err');
  if(!name){ errEl.textContent = 'Enter a name.'; return; }
  const roles = rolesRaw ? rolesRaw.split(',').map(s=>s.trim()).filter(Boolean) : [];
  const character = {id:'char_'+Date.now(), name, roles, era, summary, verseIds:[], metadata:{}};
  content.characters.push(character);
  data.characters.push(character);
  saveContent();
  go('home');
}

/* ---------- events ---------- */
let searchTimer = null;
function bindEvents(root){
  (root || document).querySelectorAll('[data-action]').forEach(el=>{
    el.addEventListener('click', onAction);
  });
  // A partial re-render only needs its own subtree wired up; the rest of the
  // page still has its listeners and would otherwise get duplicates.
  if(root) return;

  const vf = document.getElementById('verse-form');
  if(vf) vf.addEventListener('submit', e=>{ e.preventDefault(); saveVerse(); });
  const cf = document.getElementById('char-form');
  if(cf) cf.addEventListener('submit', e=>{ e.preventDefault(); saveCharacter(); });
  const importInput = document.getElementById('import-file-input');
  if(importInput) importInput.addEventListener('change', ()=>{
    const file = importInput.files && importInput.files[0];
    if(file) importFromFile(file);
    importInput.value = ''; // allow re-selecting the same file (e.g. after a failed import)
  });

  // Search updates only the results container, so the input keeps focus and
  // the caret doesn't jump while typing.
  const search = document.getElementById('browse-search');
  if(search) search.addEventListener('input', ()=>{
    browse.q = search.value;
    browse.book = null;
    browse.chapter = null;
    clearTimeout(searchTimer);
    searchTimer = setTimeout(()=>{
      const results = document.getElementById('browse-results');
      if(!results) return;
      results.innerHTML = renderBrowseResults();
      bindEvents(results);
    }, 140);
  });

  const peopleSearch = document.getElementById('people-search');
  if(peopleSearch) peopleSearch.addEventListener('input', ()=>{
    peopleQuery = peopleSearch.value;
    clearTimeout(searchTimer);
    searchTimer = setTimeout(refreshPeopleResults, 140);
  });

  const topicsSearch = document.getElementById('topics-search');
  if(topicsSearch) topicsSearch.addEventListener('input', ()=>{
    topicsQuery = topicsSearch.value;
    clearTimeout(searchTimer);
    searchTimer = setTimeout(refreshTopicsResults, 140);
  });

  const storiesSearch = document.getElementById('stories-search');
  if(storiesSearch) storiesSearch.addEventListener('input', ()=>{
    storiesQuery = storiesSearch.value;
    clearTimeout(searchTimer);
    searchTimer = setTimeout(refreshStoriesResults, 140);
  });

  const familyTreeSearch = document.getElementById('family-tree-search');
  if(familyTreeSearch) familyTreeSearch.addEventListener('input', ()=>{
    familyTreeQuery = familyTreeSearch.value;
    clearTimeout(searchTimer);
    searchTimer = setTimeout(refreshFamilyTreePickerResults, 140);
  });

  wireTimelineDrag();
  wireFamilyTreePanZoom();
}

function onAction(e){
  const el = e.currentTarget;
  const action = el.dataset.action;
  const id = el.dataset.id;
  if(action==='go-home') go('home');
  else if(action==='go-practice') go('practice');
  else if(action==='open-unreached') go('unreachedDetail');
  else if(action==='open-church-history') go('churchHistoryDetail');
  else if(action==='go-browse'){ go('browse'); loadCorpus(); }
  else if(action==='open-topics') go('topics');
  else if(action==='open-characters') go('characters');
  else if(action==='go-add') go('add');
  else if(action==='go-add-verse') go('addVerse');
  else if(action==='go-add-character') go('addCharacter');
  else if(action==='go-settings') go('settings');
  else if(action==='open-verse') go('verseDetail', {id, from: view});
  else if(action==='verse-back'){ const f = view.params.from; if(f && f.screen) go(f.screen, f.params); else go('home'); }
  else if(action==='start-practice-verse') startPractice([id]);
  else if(action==='open-topic') go('topicDetail', {id});
  else if(action==='back-to-topics') go('topics');
  else if(action==='open-character') go('characterDetail', {id, from: view});
  // Carousel prev/next (hero-nav-prev/next): keeps the ORIGINAL from —
  // not view, which is the character page being left — so the back
  // button always returns to wherever the visitor actually entered the
  // carousel from, no matter how many characters they've paged through.
  // Using open-character here instead would chain from one character
  // page to the next and turn the back button into "previous character."
  else if(action==='char-carousel-nav') go('characterDetail', {id, from: view.params.from});
  else if(action==='character-back'){ const f = view.params.from; if(f && f.screen) go(f.screen, f.params); else go('characters'); }
  else if(action==='open-book-people') go('bookPeople', {book: id});
  else if(action==='back-to-browse-book'){ browse.book = id; browse.chapter = null; go('browse'); }
  else if(action==='start-timeline-game'){ timelineGame = buildTimelineGame(id); go('timelineGame'); }
  else if(action==='check-timeline-order') checkTimelineOrder();
  else if(action==='reset-timeline-order') resetTimelineOrder();
  else if(action==='set-timeline-difficulty'){ timelineDifficulty = id; timelineGame = buildTimelineGame(timelineGame.characterId); render(); }
  else if(action==='reshuffle-timeline-game'){ timelineGame = buildTimelineGame(id); render(); }
  else if(action==='open-stories') go('stories');
  else if(action==='open-story') go('storyDetail', {id, from: view});
  else if(action==='story-back'){ const f = view.params.from; if(f && f.screen) go(f.screen, f.params); else go('stories'); }
  else if(action==='open-motif') go('motifDetail', {id, from: view});
  else if(action==='go-motifs') go('motifs');
  else if(action==='go-timeline') go('timeline');
  else if(action==='go-family-tree') go('familyTree');
  else if(action==='open-family-tree') go('familyTree', {id});
  else if(action==='family-tree-nav') go('familyTree', {id, from: {screen: 'familyTree', params: view.params}});
  else if(action==='family-tree-back'){ const f = view.params.from; if(f && f.screen) go(f.screen, f.params); else go('familyTree'); }
  else if(action==='motif-back'){ const f = view.params.from; if(f && f.screen) go(f.screen, f.params); else go('motifs'); }
  else if(action==='start-practice') startPractice(practiceQueue(dueVerses()));
  else if(action==='start-practice-topic') startPractice(practiceQueue(data.verses.filter(v=>v.topicIds.includes(id))));
  else if(action==='show-all-verses'){ homeLimit = Infinity; render(); }
  else if(action==='set-practice-filter'){ practiceFilter = id; homeLimit = 25; render(); }
  else if(action==='exit-practice'){ session=null; go('practice'); }
  else if(action==='check-practice') checkPractice();
  else if(action==='next-practice') advancePractice();
  else if(action==='practice-interact') practiceInteract(el);
  else if(action==='set-challenge'){ settings.challengeTypeId = id; saveSettings(); render(); }
  else if(action==='set-daily-goal'){ settings.dailyGoal = +id; saveSettings(); render(); }
  else if(action==='toggle-sound'){
    settings.soundEnabled = settings.soundEnabled === false ? true : false;
    saveSettings(); render();
    if(settings.soundEnabled) playSfx('tap'); // confirm it's on; silence needs no confirmation
  }
  else if(action==='browse-book'){ browse.book = id; browse.chapter = null; refreshBrowseResults(); }
  else if(action==='browse-chapter'){ browse.chapter = +el.dataset.n; refreshBrowseResults(); }
  else if(action==='browse-root'){ browse.book = null; browse.chapter = null; refreshBrowseResults(); }
  else if(action==='add-from-corpus') addFromCorpus(id);
  else if(action==='retry-corpus'){ corpusStatus = 'idle'; loadCorpus(); }
  else if(action==='sync-now'){ if(account) pullAndMerge(); }
  else if(action==='export-data') downloadExport();
  else if(action==='trigger-import'){ const inp = document.getElementById('import-file-input'); if(inp) inp.click(); }
}
function practiceInteract(el){
  if(!session) return;
  const type = challengeType(session.challengeTypeId);
  const item = session.queue[session.index];
  if(item.state.checked || !type.interact) return;
  type.interact(item.state, el.dataset);
  // A type may finalize grading itself from inside interact() (e.g. a
  // self-graded type's "Got it" / "Missed it" tap, rather than the generic
  // Check button). If it just flipped checked to true, do the same session
  // bookkeeping checkPractice() would have done.
  if(item.state.checked){
    if(item.state.allCorrect){ playSfx('correct'); hapticBuzz(30); }
    session.results.push({
      verseId: item.verseId,
      allCorrect: !!item.state.allCorrect,
      score: type.score(item.state)
    });
    recordPractice(item.verseId, !!item.state.allCorrect, session.challengeTypeId);
  } else {
    playSfx('tap'); // a non-finalizing tap — chip pick/unpick, ladder advance
  }
  render();
}
function checkPractice(){
  if(!session) return;
  const type = challengeType(session.challengeTypeId);
  const item = session.queue[session.index];
  if(item.state.checked) return;
  if(type.canCheck && !type.canCheck(item.state)) return; // e.g. Tap Builder: blanks still empty
  const summary = type.check(item.state);
  if(summary.allCorrect){ playSfx('correct'); hapticBuzz(30); }
  session.results.push({
    verseId: item.verseId,
    allCorrect: summary.allCorrect,
    score: type.score(item.state)
  });
  recordPractice(item.verseId, summary.allCorrect, session.challengeTypeId);
  // Some challenge types (currently just Tap Builder) auto-advance on a
  // correct answer instead of waiting for the user to tap "Continue" —
  // still guarded so it can't double-advance if they tap Continue
  // themselves before the timer fires, or exit practice entirely.
  if(summary.allCorrect && type.autoAdvanceMs){
    setTimeout(()=>{
      if(!session || session.queue[session.index] !== item) return;
      advancePractice();
    }, type.autoAdvanceMs);
  }
  render();
}
function advancePractice(){
  if(!session) return;
  session.index++;
  if(session.index >= session.queue.length){ playSfx('complete'); hapticBuzz([20,40,20]); }
  render();
}

/* ---------- character carousel + swipe-back ----------
   Revised on direct feedback: an earlier version made Character Detail's
   swipe-left mean "next character" instead of "back," which read as
   inconsistent — swiping the same direction meant different things on
   different screens, and there was no visible affordance telling anyone
   a character-to-character swipe existed at all. Replaced with visible
   left/right arrow buttons on the character photo for that navigation
   (discoverable, not a blind gesture), which frees swipe-left to mean
   exactly one thing everywhere, including Character Detail: go back. */
function allCharactersOrdered(){
  const seen = new Set();
  const ordered = [];
  for(const era of lore.eras){
    for(const c of data.characters){
      if(c.eraId === era.id && !seen.has(c.id)){ seen.add(c.id); ordered.push(c); }
    }
  }
  for(const c of data.characters){
    if(!seen.has(c.id)){ seen.add(c.id); ordered.push(c); }
  }
  return ordered;
}
function adjacentCharacter(id, dir){
  const list = allCharactersOrdered();
  const i = list.findIndex(c=>c.id===id);
  if(i===-1) return null;
  return list[i+dir] || null;
}
/* Swipe RIGHT, from anywhere in the app, triggers whatever the currently
   rendered screen's own back control does (corrected from an initial
   leftward version to match the standard mobile edge-swipe-back
   convention). Two back-control shapes exist in this app, checked in
   order:
     1. A `.back-btn[data-action]` element — found generically and given
        a real `.click()`, so this reuses each screen's existing
        back-nav logic (verse-back, character-back, back-to-topics,
        etc.) rather than a second implementation of it.
     2. Browse's book/chapter/verse levels, which use a breadcrumb trail
        (`.crumbs`) instead — the last crumb button is always "go up one
        level" there.
   A screen with neither (Home, any bottom-nav tab root, Browse's own
   root book list) correctly does nothing. Pointer Events (not separate
   touch/mouse listeners) so this covers touch and mouse alike, same as
   wireTimelineDrag() above. Only pointerdown/pointerup are tracked — no
   live drag visual — so a short tap or a mostly-vertical scroll never
   gets misread as a swipe. */
(function wireSwipeBack(){
  const app = document.getElementById('app');
  let start = null;
  app.addEventListener('pointerdown', e=>{
    // The rendered Family Tree screen (not its picker/search screen,
    // which has no viewport) owns horizontal drag for panning the tree
    // itself — a rightward pan there would otherwise also fire the
    // app-wide swipe-back and navigate away mid-gesture, fighting
    // wireFamilyTreePanZoom() for the same gesture.
    if(document.getElementById('family-tree-viewport')) return;
    start = {x: e.clientX, y: e.clientY, t: Date.now()};
  });
  app.addEventListener('pointerup', e=>{
    if(!start) return;
    const dx = e.clientX - start.x, dy = e.clientY - start.y, dt = Date.now() - start.t;
    start = null;
    // A real, mostly-horizontal, reasonably quick RIGHTWARD swipe only
    // (matching the standard iOS/Android edge-swipe-back convention,
    // corrected from an initial leftward version) — not a scroll, not a
    // tap, not a diagonal drag, not a leftward swipe.
    if(dx <= 60 || Math.abs(dx) < Math.abs(dy)*1.5 || dt > 800) return;
    // Home's settings gear reuses the .back-btn class for its shared
    // press-feedback styling even though it's not a "back" action
    // (data-action="go-settings") — excluded here so swipe-back on Home
    // does nothing instead of jumping to Settings.
    const backBtn = document.querySelector('.back-btn[data-action]:not(.home-settings-btn)');
    if(backBtn){ backBtn.click(); return; }
    // Browse's book/chapter/verse levels use a breadcrumb trail
    // (.crumbs) instead of a .back-btn — the last crumb button is
    // always "go up one level" (the book button at verse level, "All
    // books" at chapter-grid level), so it doubles as this screen's
    // back target. Browse's root book list has no crumbs at all and
    // correctly does nothing, same as any other bottom-nav tab root.
    const crumbBtns = document.querySelectorAll('.crumbs button');
    if(crumbBtns.length) crumbBtns[crumbBtns.length-1].click();
  });
  app.addEventListener('pointercancel', ()=>{ start = null; });
})();

/* nav bar */
document.querySelectorAll('.navitem').forEach(b=>{
  b.addEventListener('click', ()=>{
    session = null;
    go(b.dataset.nav);
  });
});

/* one-time migration from the pre-split single blob (rooted-app-data) */
async function migrateLegacy(seedContent){
  const legacy = await loadStored(LEGACY_KEY);
  if(!legacy || !Array.isArray(legacy.verses)) return null;
  const seedIds = t => new Set((seedContent[t]||[]).map(e=>e.id));
  const vIds = seedIds('verses'), tIds = seedIds('topics'), cIds = seedIds('characters');
  const overlay = {
    verses:     legacy.verses.filter(v=>!vIds.has(v.id)).map(stripProgress),
    topics:     (legacy.topics||[]).filter(t=>!tIds.has(t.id)),
    characters: (legacy.characters||[]).filter(c=>!cIds.has(c.id))
  };
  const prog = {};
  for(const v of legacy.verses){
    const p = v.progress;
    if(p && (p.timesReviewed || p.nextReview || p.status && p.status!=='new')){
      prog[v.id] = normalizeProgress(p);
    }
  }
  try{
    await window.storage.set(CONTENT_KEY, JSON.stringify(overlay), false);
    await window.storage.set(PROGRESS_KEY, JSON.stringify(prog), false);
  }catch(e){ console.error('legacy migration save failed', e); }
  return {overlay, prog};
}

/* ---------- boot ---------- */
(async function boot(){
  document.getElementById('app').innerHTML = `<div class="empty" style="padding-top:80px;"><i class="ti ti-leaf"></i><p>Loading...</p></div>`;
  seed = await loadSeed();
  let storedContent = await loadStored(CONTENT_KEY);
  let storedProgress = await loadStored(PROGRESS_KEY);

  if(!storedContent && !storedProgress){
    const migrated = await migrateLegacy(seed);
    if(migrated){ storedContent = migrated.overlay; storedProgress = migrated.prog; }
  }

  content = Object.assign(emptyOverlay(), storedContent || {});
  progress = {};
  for(const [id, p] of Object.entries(storedProgress || {})) progress[id] = normalizeProgress(p);

  const storedSettings = await loadStored(SETTINGS_KEY);
  settings = Object.assign({challengeTypeId:'challenge_fill_blank', dailyGoal:10, soundEnabled:true}, storedSettings || {});
  if(!CHALLENGE_TYPES[settings.challengeTypeId]) settings.challengeTypeId = 'challenge_fill_blank';

  const storedSyncMeta = await loadStored(SYNC_META_KEY);
  syncMeta = Object.assign({updatedAt: null}, storedSyncMeta || {});

  data = mergeContent(seed, content);
  lore = await loadStories();
  connections = await loadConnections();
  motifs = await loadMotifs();
  wordsOfTheDay = await loadWordOfTheDayData();
  churchHistoryData = await loadChurchHistoryData();
  characterPortraits = await loadCharacterPortraits();
  render();

  // Cloud sync is optional and never blocks first paint — the app is fully
  // usable offline the instant the line above runs. This runs after, in the
  // background, and only touches anything if the visitor is signed in.
  account = await loadAccount();
  if(account) await pullAndMerge();
})();

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}
