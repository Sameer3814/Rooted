/* ---------- TIMELINE GAME ----------
   A one-off drag-and-drop chronology puzzle over a character's own
   LifeEvents (`characterTimeline`), not part of the spaced-repetition
   verse practice loop — there's no "due" schedule for it, no ChallengeType
   entry, it just reshuffles fresh every time you open it. Up to 5 events
   are sampled evenly across the character's whole arc (not just the first
   5) so the puzzle reflects their whole life, not only its opening.
   Reordering is done by moving real DOM nodes during a pointer drag
   (see wireTimelineDrag) rather than re-rendering on every pointermove,
   which would blow away the drag gesture mid-swipe. */
function buildTimelineGame(charId){
  const timeline = characterTimeline(charId);
  const n = TIMELINE_DIFFICULTIES[timelineDifficulty] || 5;
  let picked;
  if(timeline.length <= n){
    picked = timeline;
  }else{
    // Split the whole timeline into n roughly-equal segments and pick one
    // RANDOM event from each (not the fixed midpoint) — so hitting reshuffle
    // can swap which moments show up, not just their order, while still
    // spreading across the character's whole life rather than clustering
    // events from just one part of it.
    const segSize = timeline.length / n;
    const idxs = [];
    for(let i=0;i<n;i++){
      const segStart = Math.floor(i*segSize);
      const segEnd = Math.max(segStart+1, Math.floor((i+1)*segSize));
      idxs.push(Math.min(segStart + Math.floor(Math.random()*(segEnd-segStart)), timeline.length-1));
    }
    picked = [...new Set(idxs)].map(i=>timeline[i]);
  }
  const correctIds = picked.map(e=>e.id);
  let order = [...correctIds];
  if(order.length > 1){
    do{
      for(let i=order.length-1;i>0;i--){
        const j = Math.floor(Math.random()*(i+1));
        [order[i],order[j]] = [order[j],order[i]];
      }
    }while(order.every((id,i)=>id===correctIds[i]));
  }
  return { characterId: charId, events: picked, correctIds, order, checked:false, lockedIds: new Set(), allCorrect:false };
}
function renderTimelineGame(){
  const g = timelineGame;
  if(!g) return renderCharacters();
  const c = findChar(g.characterId);
  const byId = {};
  g.events.forEach(e=>{ byId[e.id] = e; });
  return `
    <button class="back-btn" data-action="open-character" data-id="${g.characterId}" style="margin-bottom:14px;"><i class="ti ti-arrow-left"></i></button>
    <div class="topbar"><h1>Put their life in order</h1></div>
    <p style="color:var(--ink-soft);margin-bottom:14px;">Drag ${c ? esc(c.name) : 'these'} moments into the order they actually happened.</p>
    <div style="display:flex;gap:8px;align-items:center;margin-bottom:14px;">
      <div class="segmented" style="flex:1;margin-bottom:0;">
        ${Object.keys(TIMELINE_DIFFICULTIES).map(d=>`<button class="${timelineDifficulty===d?'active':''}" data-action="set-timeline-difficulty" data-id="${d}">${d[0].toUpperCase()+d.slice(1)} · ${TIMELINE_DIFFICULTIES[d]}</button>`).join('')}
      </div>
      <button class="btn" style="flex-shrink:0;" data-action="reshuffle-timeline-game" data-id="${g.characterId}" title="Reshuffle"><i class="ti ti-refresh"></i></button>
    </div>
    <div class="tl-drag-track" id="tl-drag-track">
      ${g.order.map((id,i)=>{
        const e = byId[id];
        const locked = g.lockedIds.has(id);
        const wrong = g.checked && !locked;
        const cls = locked ? 'tl-drag-correct' : wrong ? 'tl-drag-wrong' : '';
        return `<div class="tl-drag-item ${cls}" data-id="${id}"${locked ? '' : ' data-draggable="1"'}>
          ${locked ? '<i class="ti ti-check tl-drag-check"></i>' : '<span class="tl-drag-handle"><i class="ti ti-grip-vertical"></i></span>'}
          <div class="tl-drag-body">
            <div class="tl-title">${esc(e.title)}</div>
            ${(g.checked || locked) ? `<div class="tl-ref">${esc(e.reference)}</div>` : ''}
          </div>
        </div>`;
      }).join('')}
    </div>
    ${g.allCorrect ? `
      <div class="result-banner good" style="margin-top:16px;"><i class="ti ti-confetti"></i> That's the right order — nice work!</div>
      <button class="btn primary block" data-action="open-character" data-id="${g.characterId}">Back to ${c ? esc(c.name) : 'profile'}</button>
    ` : `
      <button class="btn primary block" style="margin-top:16px;" data-action="check-timeline-order"><i class="ti ti-check"></i> Check order</button>
      ${g.checked ? `<button class="btn block" style="margin-top:8px;width:100%;" data-action="reset-timeline-order">Shuffle the rest</button>` : ''}
    `}
  `;
}
function checkTimelineOrder(){
  const g = timelineGame;
  if(!g) return;
  const track = document.getElementById('tl-drag-track');
  if(!track) return;
  const domIds = [...track.querySelectorAll('.tl-drag-item')].map(el=>el.dataset.id);
  // Reconstruct the logical order rather than trusting raw DOM order:
  // already-locked ids are forced back to their one true correct index
  // (g.correctIds.indexOf), and the still-unlocked ids fill whatever
  // slots are left, in the relative order they appear in the DOM. This is
  // what makes a locked card immune to index drift — dragging an unlocked
  // card past it can visually nudge it in the DOM mid-drag, but it always
  // snaps back to its correct slot here rather than silently being
  // graded against whatever index it happened to end up at.
  const unlockedInDomOrder = domIds.filter(id => !g.lockedIds.has(id));
  let cursor = 0;
  const newOrder = g.correctIds.map(cid => g.lockedIds.has(cid) ? cid : unlockedInDomOrder[cursor++]);
  g.order = newOrder;
  const correctCountBefore = g.lockedIds.size;
  newOrder.forEach((id,i)=>{ if(id === g.correctIds[i]) g.lockedIds.add(id); });
  g.checked = true;
  g.allCorrect = g.lockedIds.size === g.correctIds.length;
  if(g.allCorrect){ playSfx('complete'); hapticBuzz([20,40,20]); }
  else if(g.lockedIds.size > correctCountBefore){ playSfx('correct'); hapticBuzz(20); }
  else{ hapticBuzz(20); }
  render();
}
function resetTimelineOrder(){
  const g = timelineGame;
  if(!g) return;
  // Correctly-placed events from the last check stay locked at their true
  // index permanently (g.lockedIds persists across attempts); only the
  // ones still wrong get reshuffled among the remaining slots — a
  // progressive puzzle, not a full restart every attempt.
  const wrongIds = g.order.filter(id => !g.lockedIds.has(id));
  if(wrongIds.length > 1){
    let shuffled;
    do{
      shuffled = [...wrongIds];
      for(let i=shuffled.length-1;i>0;i--){
        const j = Math.floor(Math.random()*(i+1));
        [shuffled[i],shuffled[j]] = [shuffled[j],shuffled[i]];
      }
    }while(shuffled.every((id,i)=>id===wrongIds[i]));
    let cursor = 0;
    g.order = g.order.map(id => g.lockedIds.has(id) ? id : shuffled[cursor++]);
  }
  g.checked = false;
  render();
}
/* Pan (drag) + zoom (wheel on desktop, pinch on touch) for the family
   tree's SVG — plain SVG has no built-in viewport gestures, and this
   app has no existing graph/canvas component to reuse, so this is
   hand-rolled rather than pulling in a library (no precedent for a
   third-party JS dependency anywhere in this vanilla-JS app). Tap vs.
   drag is disambiguated by total pointer movement, same threshold
   approach as wireSwipeBack() elsewhere in this file — a drag that
   crossed the threshold suppresses the trailing click so panning across
   a node never accidentally re-centers the tree on it. */
function wireFamilyTreePanZoom(){
  const viewport = document.getElementById('family-tree-viewport');
  const canvas = document.getElementById('family-tree-canvas');
  if(!viewport || !canvas) return;
  let scale = 1, tx = 0, ty = 0;
  let moved = false;
  const pointers = new Map(); // pointerId -> {x, y}
  let pinchStartDist = 0, pinchStartScale = 1;
  const MIN_SCALE = 0.4, MAX_SCALE = 2.5;

  function apply(){ canvas.style.transform = `translate(${tx}px, ${ty}px) scale(${scale})`; }
  function clampScale(s){ return Math.min(MAX_SCALE, Math.max(MIN_SCALE, s)); }
  function dist(a, b){ return Math.hypot(a.x - b.x, a.y - b.y); }

  viewport.addEventListener('pointerdown', e=>{
    viewport.setPointerCapture(e.pointerId);
    pointers.set(e.pointerId, {x: e.clientX, y: e.clientY});
    moved = false;
    if(pointers.size === 2){
      const [a, b] = [...pointers.values()];
      pinchStartDist = dist(a, b) || 1;
      pinchStartScale = scale;
    }
  });
  viewport.addEventListener('pointermove', e=>{
    if(!pointers.has(e.pointerId)) return;
    const prev = pointers.get(e.pointerId);
    const dx = e.clientX - prev.x, dy = e.clientY - prev.y;
    pointers.set(e.pointerId, {x: e.clientX, y: e.clientY});
    if(Math.abs(dx) > 2 || Math.abs(dy) > 2) moved = true;
    if(pointers.size === 2){
      const [a, b] = [...pointers.values()];
      scale = clampScale(pinchStartScale * (dist(a, b) / pinchStartDist));
    }else if(pointers.size === 1){
      tx += dx; ty += dy;
    }
    apply();
  });
  function endPointer(e){
    pointers.delete(e.pointerId);
    if(moved){
      // Swallow the click that follows a drag so tapping-through-a-node
      // mid-pan doesn't also re-center the tree on it.
      const suppress = ev => { ev.stopPropagation(); ev.preventDefault(); viewport.removeEventListener('click', suppress, true); };
      viewport.addEventListener('click', suppress, true);
    }
  }
  viewport.addEventListener('pointerup', endPointer);
  viewport.addEventListener('pointercancel', endPointer);
  viewport.addEventListener('wheel', e=>{
    e.preventDefault();
    scale = clampScale(scale * (e.deltaY < 0 ? 1.12 : 0.89));
    apply();
  }, {passive: false});
}
/* First-Letter Sprint's live keyboard capture + ticking timer. Called
   after every full render (bindEvents()) — but unlike every other
   challenge type, an individual keystroke here does NOT go through a
   full render() while the sprint is still in progress. Real-device
   testing found that a full render() per keystroke (this app's normal
   model — the whole innerHTML is rebuilt) destroys and recreates the
   hidden <input>, which closes the mobile virtual keyboard after every
   single letter typed. So the `input` listener below instead calls
   type.interact() to mutate state as usual, then patches just
   #sprint-text-box's innerHTML directly (sprintTokensHTML(), the same
   markup render() itself would produce) — the <input> element is never
   touched, so it keeps its focus and the keyboard stays open. A real
   render() only happens once the sprint actually completes (state.checked),
   which is the point where the screen changes to the toast/Continue
   view and the input needs to go away anyway. Same reasoning
   wireTimelineDrag() above gives for moving real DOM nodes during a
   drag instead of re-rendering on every pointermove — extended here to
   "don't destroy focus/keyboard state on every keystroke of a typing
   game" specifically.
   The ticking timer is a second, separate reason a per-keystroke
   render() would be wrong even without the keyboard problem: it needs
   to keep advancing between keystrokes too, so it's always a direct
   textContent update on its own interval, never routed through render(). */
let sprintTimerInterval = null;
function focusSprintInput(){
  const input = document.getElementById('sprint-hidden-input');
  if(input) input.focus();
}
function wireFirstLetterSprint(){
  clearInterval(sprintTimerInterval);
  sprintTimerInterval = null;
  const input = document.getElementById('sprint-hidden-input');
  if(!input || !session) return;
  const item = session.queue[session.index];
  const type = challengeType(item.challengeTypeId);
  input.focus();
  input.addEventListener('blur', ()=>{
    // Keep the hidden input focused so physical-keyboard keystrokes
    // keep landing on it. A programmatic focus() here can't reopen a
    // mobile virtual keyboard that the OS already dismissed (that needs
    // a direct tap — see the "Keyboard not showing? Tap here." hint in
    // render(), wired via the focus-sprint-input action below), but it
    // does no harm to also try, and it's what keeps a physical keyboard
    // working after e.g. a stray tap elsewhere on the page.
    setTimeout(()=>{ const i = document.getElementById('sprint-hidden-input'); if(i) i.focus(); }, 10);
  });
  input.addEventListener('input', ()=>{
    const val = input.value;
    input.value = '';
    const ch = val[val.length - 1];
    if(!ch || !/[a-zA-Z]/.test(ch)) return;
    if(!session || item.state.checked) return;
    type.interact(item.state, {letter: ch});
    if(item.state.checked){
      // Finalize exactly like practiceInteractWith() would — this is
      // the one point where a real render() is correct and necessary,
      // since the screen is changing to the toast/Continue view anyway.
      if(item.state.allCorrect){ playSfx('correct'); hapticBuzz(30); }
      session.results.push({
        verseId: item.verseId,
        allCorrect: !!item.state.allCorrect,
        score: type.score(item.state)
      });
      recordPractice(item.verseId, !!item.state.allCorrect, item.challengeTypeId);
      clearInterval(sprintTimerInterval);
      // Shepherd sessions always wait for an explicit tap on the
      // feedback sheet's own Continue/Got It button — see the note by
      // checkPractice()'s own autoAdvanceMs guard below for why.
      if(!session.shepherd && item.state.allCorrect && type.autoAdvanceMs){
        setTimeout(()=>{
          if(!session || session.queue[session.index] !== item) return;
          advancePractice();
        }, type.autoAdvanceMs);
      }
      render();
    }else{
      playSfx('tap');
      const box = document.getElementById('sprint-text-box');
      if(box) box.innerHTML = sprintTokensHTML(item.state);
    }
  });
  const timerEl = document.getElementById('sprint-timer');
  if(timerEl && item && !item.state.checked){
    sprintTimerInterval = setInterval(()=>{
      const el = document.getElementById('sprint-timer');
      if(!el || !session || session.queue[session.index] !== item || item.state.checked){
        clearInterval(sprintTimerInterval);
        return;
      }
      el.textContent = ((Date.now() - item.state.startTime) / 1000).toFixed(1) + 's';
    }, 100);
  }
}
/* "Hold to Peek" — a pure press-and-hold visual toggle, not a state
   change: holding reveals every vanished word, releasing hides them
   again. Deliberately kept out of the interact()/render() cycle
   entirely (a plain CSS class toggle on the box) rather than a state
   flag + full render() per press/release — there's nothing to score or
   persist about a peek, and going through render() would add a visible
   delay to what should feel instant, the same reasoning
   wireFamilyTreePanZoom() and wireTimelineDrag() give for direct DOM
   manipulation over full re-renders during a live gesture. */
function wireProgressiveVanish(){
  const btn = document.getElementById('vanish-peek-btn');
  const box = document.getElementById('vanish-text-box');
  if(!btn || !box) return;
  const show = e => { e.preventDefault(); box.classList.add('peek-all'); };
  const hide = () => box.classList.remove('peek-all');
  btn.addEventListener('pointerdown', show);
  btn.addEventListener('pointerup', hide);
  btn.addEventListener('pointercancel', hide);
  btn.addEventListener('pointerleave', hide);
}
/* Clause Connect's grip-handle drag reordering — pointer events dragging
   real DOM nodes, the same technique wireTimelineDrag() already uses
   below, not the HTML5 Drag-and-Drop API the original spec named: that
   API has no touch support at all without a polyfill this app doesn't
   carry, which would make dragging simply not work on the phone this
   whole app is built for. Only starts from a pointerdown on the grip
   icon, so it can never swallow a tap on the clause text meant for
   interact()'s own tap-to-swap. Mutates state.order directly from the
   DOM's final child order once the drag ends, then does one real
   render() — no in-between full re-renders during the drag itself, same
   "direct DOM manipulation for a live gesture" reasoning as
   wireFamilyTreePanZoom(). */
function wireClauseConnect(){
  const container = document.getElementById('clause-list-container');
  if(!container || !session) return;
  const item = session.queue[session.index];
  const type = item && challengeType(item.challengeTypeId);
  if(!item || type.id !== 'challenge_clause_connect' || item.state.checked) return;
  let dragEl = null, startY = 0, moved = false;
  function onMove(ev){
    if(!dragEl) return;
    moved = true;
    const dy = ev.clientY - startY;
    dragEl.style.transform = `translateY(${dy}px)`;
    const pointerY = ev.clientY;
    const siblings = [...container.children].filter(el => el !== dragEl);
    for(const sib of siblings){
      const r = sib.getBoundingClientRect();
      if(pointerY > r.top && pointerY < r.bottom){
        const dragRect = dragEl.getBoundingClientRect();
        const goingDown = dragRect.top < r.top;
        container.insertBefore(dragEl, goingDown ? sib.nextSibling : sib);
        startY = ev.clientY;
        dragEl.style.transform = 'translateY(0px)';
        break;
      }
    }
  }
  function onUp(){
    document.removeEventListener('pointermove', onMove);
    document.removeEventListener('pointerup', onUp);
    document.removeEventListener('pointercancel', onUp);
    if(!dragEl) return;
    dragEl.style.transform = '';
    dragEl.classList.remove('clause-dragging');
    if(moved){
      item.state.order = [...container.children].map(el => +el.dataset.clauseIdx);
      item.state.wrong = [];
      item.state.selected = null;
      render();
    }
    dragEl = null;
  }
  container.querySelectorAll('.clause-card').forEach(card=>{
    card.addEventListener('pointerdown', e=>{
      if(!e.target.closest('.clause-grip')) return;
      dragEl = card;
      startY = e.clientY;
      moved = false;
      card.classList.add('clause-dragging');
      document.addEventListener('pointermove', onMove);
      document.addEventListener('pointerup', onUp);
      document.addEventListener('pointercancel', onUp);
    });
  });
}
function wireTimelineDrag(){
  const track = document.getElementById('tl-drag-track');
  if(!track) return;
  let dragEl = null;
  let startY = 0;
  function onMove(ev){
    if(!dragEl) return;
    const dy = ev.clientY - startY;
    dragEl.style.transform = `translateY(${dy}px)`;
    const pointerY = ev.clientY;
    const siblings = [...track.children].filter(el => el !== dragEl && !el.classList.contains('tl-drag-correct'));
    for(const sib of siblings){
      const r = sib.getBoundingClientRect();
      if(pointerY > r.top && pointerY < r.bottom){
        const dragRect = dragEl.getBoundingClientRect();
        const goingDown = dragRect.top < r.top;
        track.insertBefore(dragEl, goingDown ? sib.nextSibling : sib);
        startY = ev.clientY;
        dragEl.style.transform = 'translateY(0px)';
        break;
      }
    }
  }
  function onUp(){
    document.removeEventListener('pointermove', onMove);
    document.removeEventListener('pointerup', onUp);
    document.removeEventListener('pointercancel', onUp);
    if(!dragEl) return;
    dragEl.style.transform = '';
    dragEl.classList.remove('dragging');
    dragEl = null;
  }
  track.querySelectorAll('.tl-drag-item[data-draggable="1"]').forEach(item=>{
    item.addEventListener('pointerdown', e=>{
      dragEl = item;
      startY = e.clientY;
      item.classList.add('dragging');
      document.addEventListener('pointermove', onMove);
      document.addEventListener('pointerup', onUp);
      document.addEventListener('pointercancel', onUp);
    });
  });
}

/* ---------- LEXICON (item 150) ----------

    <p style="color:var(--ink-soft);margin-bottom:16px;line-height:1.5;">${lexiconFull ? `${total.toLocaleString()} Hebrew and Greek words, straight from Strong's Concordance.` : "A hand-picked set of key Hebrew and Greek words, with their Strong's number, definition, and where they show up."}</p>

      <i class="ti ti-search"></i>
      <input type="text" id="lexicon-search" value="${esc(lexiconQuery)}" placeholder="Search by word, transliteration, or meaning..." autocomplete="off" autocorrect="off" spellcheck="false">
    </div>
    <div id="lexicon-results">${renderLexiconResults()}</div>
  `;
}
function renderLexiconResults(){
  const q = lexiconQuery.trim().toLowerCase();
  if(q){
    if(lexiconFullStatus === 'loading' && !lexiconQuery.trim().match(/^[hg]\d+$/i)){
      return `<div class="empty"><i class="ti ti-loader"></i><p>Still loading the full dictionary — searching what's here so far.</p></div>` + renderLexiconSearchHits(q);
    }
    return renderLexiconSearchHits(q);
  }
  if(lexiconFullStatus === 'error' && !lexiconFull) return `<div class="empty"><i class="ti ti-alert-triangle"></i><p>Couldn't load the full dictionary — showing curated highlights only.</p><button class="btn cta" data-action="retry-lexicon">Try again</button></div>` + renderLexiconGrouped();
  if(lexiconFullStatus !== 'ready') return `<div class="empty"><i class="ti ti-loader"></i><p>Loading the full dictionary...</p></div>` + renderLexiconGrouped();
  return renderLexiconGrouped();
}
function renderLexiconSearchHits(q){
  const entries = lexiconEntries().filter(w=>
    w.translit.toLowerCase().includes(q) || w.lemma.includes(lexiconQuery.trim()) ||
    (w.shortDef||'').toLowerCase().includes(q) || (w.definition||'').toLowerCase().includes(q) ||
    w.id.toLowerCase() === q
  );
  if(!entries.length) return `<div class="empty"><i class="ti ti-mood-empty"></i><p>No words match "${esc(lexiconQuery)}".</p></div>`;
  return `<div class="result-count">${entries.length} match${entries.length===1?'':'es'}</div>${entries.slice(0, SEARCH_LIMIT).map(renderLexiconRow).join('')}`;
}
function renderLexiconGrouped(){
  // No query yet, or the full dictionary isn't loaded: just show the 39
  // curated highlights grouped by language, same as before item 150's
  // full-dictionary expansion — browsing all 14,200 entries ungrouped
  // isn't useful, search is how the full set gets found.
  const entries = Object.keys(lexicon).map(lexiconEntry).sort((a,b)=>a.translit.localeCompare(b.translit));
  const hebrew = entries.filter(w=>w.language==='Hebrew');
  const greek = entries.filter(w=>w.language==='Greek');
  return `

    ${hebrew.length ? `<div class="section-label">Hebrew <span style="color:var(--ink-faint);">${hebrew.length}</span></div>${hebrew.map(renderLexiconRow).join('')}` : ''}
    ${greek.length ? `<div class="section-label">Greek <span style="color:var(--ink-faint);">${greek.length}</span></div>${greek.map(renderLexiconRow).join('')}` : ''}

}
function renderLexiconRow(w){

/* ---------- FAMILY TREE ---------- */
/* Whether a character has any CORE family relationship curated at all
   (parent/child/spouse/sibling — see FAMILY_CORE_TYPES) — used to keep
   the picker to people whose family is actually worth opening, instead
   of listing all 267 characters and having most of them dead-end on
   the "no family curated yet" empty state. */
function hasFamilyTree(charId){
  return characterRelationships(charId).some(r => FAMILY_CORE_TYPES.hasOwnProperty(r.type));
}
/* Family lineages (2026-09-21) — connected components of the family
   graph, so the picker shows one card per real lineage instead of one
   card per person who happens to have family curated. Without this, a
   well-connected component like David's (16 people: David, Saul,
   Jonathan, Solomon, Absalom...) rendered as 16 separate, mostly-
   overlapping "X's Family" cards. Purely derived from the same
   Connection data `familyGraph()` already reads — no new curation.
   Each lineage's `anchor` is whichever member appears in the most
   curated Stories (an existing, objective signal of narrative
   centrality already in the data) rather than a hand-picked id, so new
   characters/stories keep this correct without upkeep. A handful of
   well-known lineages get an editorial display name; every other one
   falls back to a derived "{anchor}'s Family" ("The Family of {anchor}"
   when the name itself ends in "s", to dodge an awkward double-s
   possessive like "Jesus's Family"). */
const FAMILY_LINEAGE_LABELS = {
  char_adam: 'The First Family',
  char_noah: 'House of Noah',
  char_jacob: 'Patriarchs of Israel',
  char_moses: 'House of Levi',
  char_david: 'House of David',
};
function familyLineageLabel(anchor){
  if(FAMILY_LINEAGE_LABELS[anchor.id]) return FAMILY_LINEAGE_LABELS[anchor.id];
  return /s$/i.test(anchor.name) ? `The Family of ${anchor.name}` : `${anchor.name}'s Family`;
}
function familyLineages(){
  const byId = new Map(data.characters.map(c=>[c.id, c]));
  const seen = new Set();
  const lineages = [];
  for(const c of data.characters){
    if(seen.has(c.id) || !hasFamilyTree(c.id)) continue;
    const members = [];
    const queue = [c.id];
    seen.add(c.id);
    while(queue.length){
      const id = queue.shift();
      const person = byId.get(id);
      if(person) members.push(person);
      for(const rel of characterRelationships(id)){
        if(!FAMILY_CORE_TYPES.hasOwnProperty(rel.type)) continue;
        if(!seen.has(rel.who.id)){ seen.add(rel.who.id); queue.push(rel.who.id); }
      }
    }
    const anchor = [...members].sort((a,b)=>
      characterStories(b.id).length - characterStories(a.id).length || a.name.localeCompare(b.name)
    )[0];
    lineages.push({ anchor, members, label: familyLineageLabel(anchor) });
  }
  return lineages;
}
/* How `member` relates to their lineage's `anchor`, for the search-
   result badge ("Matches: Cain (Son of Adam)"). Prefers the exact
   curated relationship phrase when member and anchor are directly
   connected; falls back to a generation count (via the same ±1-per-
   parent/child-step delta `familyGraph()` uses) for anyone further out
   in a large lineage, e.g. a grandchild with no direct edge to the
   anchor. */
function relationshipToAnchor(member, anchor){
  if(member.id === anchor.id) return null;
  const direct = characterRelationships(member.id).find(r => r.who.id === anchor.id && FAMILY_CORE_TYPES.hasOwnProperty(r.type));
  if(direct) return direct.type.replace(/ of$/, '').replace(/^./, ch=>ch.toUpperCase()) + ` of ${anchor.name}`;
  const {nodes} = familyGraph(anchor.id, 99);
  const node = nodes.get(member.id);
  if(!node) return `Related to ${anchor.name}`;
  const gen = node.gen;
  // |gen|===1 without a direct edge means the connection runs through an
  // in-law link (e.g. a spouse's sibling's child) rather than real
  // parentage — "descendant"/"ancestor" would overclaim a blood relation
  // that isn't actually curated, so it gets the same generic phrasing as
  // gen===0 rather than a specific but misleading generation count.
  if(Math.abs(gen) <= 1) return `Part of ${anchor.name}'s extended family`;
  if(gen === 2) return `Grandchild of ${anchor.name}`;
  if(gen === -2) return `Grandparent of ${anchor.name}`;
  return gen > 0 ? `${gen}-generation descendant of ${anchor.name}` : `${-gen}-generation ancestor of ${anchor.name}`;
}
function renderFamilyTreePicker(){
  return `
    <div class="topbar"><h1>Family Tree</h1></div>
    <div class="search-wrap">
      <i class="ti ti-search"></i>
      <input type="text" id="family-tree-search" value="${esc(familyTreeQuery)}" placeholder="Search a family by name..." autocomplete="off" autocorrect="off" spellcheck="false">
    </div>
    <div id="family-tree-picker-results">${renderFamilyTreePickerResults()}</div>
  `;
}
function renderFamilyCard(anchor, opts){
  opts = opts || {};
  return `
    <div class="card tap" data-action="open-family-tree" data-id="${opts.openId || anchor.id}">
      <div class="char-row">
        <div class="avatar">${charAvatarInner(anchor)}</div>
        <div>
          <h3>${esc(opts.label || familyLineageLabel(anchor))}</h3>
          <p class="field-hint">${esc((anchor.roles||[])[0]||'')}</p>
          ${opts.badge ? `<span class="tag tag--tan" style="margin-top:6px;display:inline-block;">Matches: ${esc(opts.badge)}</span>` : ''}
        </div>
      </div>
    </div>`;
}
function renderFamilyTreePickerResults(){
  const lineages = familyLineages();
  const q = familyTreeQuery.trim().toLowerCase();
  if(q){
    // Search every person in every lineage, not just each lineage's own
    // anchor — typing "Cain" should surface The First Family even though
    // Adam, not Cain, is that lineage's anchor.
    const hitLineages = [];
    for(const lin of lineages){
      const hit = lin.members.find(m=>m.name.toLowerCase().includes(q));
      if(hit) hitLineages.push({lin, hit});
    }
    if(!hitLineages.length) return `<div class="empty"><i class="ti ti-mood-empty"></i><p>No family matches "${esc(familyTreeQuery)}".</p></div>`;
    return `
      <div class="result-count">${hitLineages.length} match${hitLineages.length===1?'':'es'}</div>
      ${hitLineages.map(({lin, hit})=>{
        const rel = relationshipToAnchor(hit, lin.anchor);
        const badge = rel ? `${hit.name} (${rel})` : null;
        // Open centered on the actual matched person, not the lineage's
        // anchor — searching "Cain" should land the canvas on Cain,
        // auto-highlighted, not back on Adam.
        return renderFamilyCard(lin.anchor, {openId: hit.id, badge});
      }).join('')}
    `;
  }
  return `
    <p style="color:var(--ink-soft);margin-bottom:14px;line-height:1.5;">Explore how a well-known figure connects to their family — parents, spouses, siblings, and children, drawn from every relationship curated in this app. Only people with a curated family are listed here.</p>
    ${lineages
      .sort((a,b)=> (findEra(a.anchor.eraId)?.order||0) - (findEra(b.anchor.eraId)?.order||0))
      .map(lin=>renderFamilyCard(lin.anchor))
      .join('')}
  `;
}
/* Node-link family tree, v2 rendering overhaul (2026-09-16) — a hybrid
   render: an absolutely-positioned SVG draws ONLY the curved connector
   paths (pointer-events:none, per spec, so it never blocks panning),
   and the nodes themselves are real HTML cards (avatar <img>, name,
   role) absolutely positioned in the same coordinate space, layered on
   top — real <img>/flexbox/transition is far more natural here than
   approximating them in raw SVG shapes, and it's what the exact CSS in
   the spec (object-fit, transition, box-shadow) actually describes.
   Both the svg and the cards live inside #family-tree-canvas, which is
   what wireFamilyTreePanZoom() transforms (translate+scale) — panning/
   zooming moves lines and cards together as one unit.

   "Selected" (spec's highlight state) is treated as "the current focal
   person" — the root card gets the active/glow treatment, and every
   edge touching it gets the highlighted stroke — rather than adding a
   separate hover-only preview state this app has no other precedent
   for; tapping any card still re-centers the tree on that person
   (family-tree-nav, chaining `from` so the back button walks back
   through however many people were visited, same pattern as Character
   Detail's own back button). The header's search icon jumps straight
   to the picker at any point. */
function renderFamilyTree(id){
  const c = id && findChar(id);
  if(!c) return renderFamilyTreePicker();
  const {nodes, edges} = familyGraph(id, 2);
  const {pos, width, height, NODE_W, NODE_H} = layoutFamilyGraph(nodes, edges);
  const edgeSvg = edges.map(e=>{
    const a = pos.get(e.from), b = pos.get(e.to);
    if(!a || !b) return '';
    const isHighlighted = e.from === id || e.to === id;
    const baseStroke = isHighlighted
      ? 'stroke:#F5F2ED;stroke-width:3;filter:drop-shadow(0 0 6px rgba(245,242,237,.4));'
      : 'stroke:rgba(245,242,237,.45);stroke-width:2.5;';
    const dash = e.kind === 'parent-child' ? '' : 'stroke-dasharray:5,5;';
    if(e.kind === 'parent-child'){
      const d = familyTreeBezier(a, b, NODE_W, NODE_H);
      return `<path d="${d}" fill="none" stroke-linecap="round" style="${baseStroke}${dash}"/>`;
    }
    // Same-row (spouse/sibling) edges connect facing card edges with a
    // plain line — a vertical bottom-to-top Bezier has no meaning
    // between two nodes at the same Y.
    const left = a.x <= b.x ? a : b, right = a.x <= b.x ? b : a;
    const x1 = left.x + NODE_W, y1 = left.y + NODE_H/2;
    const x2 = right.x, y2 = right.y + NODE_H/2;
    return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke-linecap="round" style="${baseStroke}${dash}"/>`;
  }).join('');
  const nodeCards = nodes.map(n=>{
    const p = pos.get(n.char.id);
    const isRoot = n.char.id === id;
    const sub = (n.char.roles && n.char.roles[0]) || '';
    return `
      <div class="tree-node-card${isRoot ? ' active' : ''}" data-action="family-tree-nav" data-id="${n.char.id}" style="left:${p.x}px;top:${p.y}px;width:${NODE_W}px;">
        <div class="tree-avatar">${charAvatarInner(n.char)}</div>
        <div class="tree-node-info">
          <div class="tree-node-name">${esc(n.char.name)}</div>
          ${sub ? `<div class="tree-node-sub">${esc(sub)}</div>` : ''}
        </div>
      </div>`;
  }).join('');
  return `
    <div class="screen-head">
      <button class="back-btn" data-action="family-tree-back"><i class="ti ti-arrow-left"></i></button>
      <h2>${esc(c.name)}'s Family</h2>
      <button class="back-btn" data-action="go-family-tree" style="margin-left:auto;" title="Search for someone else"><i class="ti ti-search"></i></button>
    </div>
    ${edges.length ? `
      <div class="tree-viewport" id="family-tree-viewport">
        <div class="tree-legend">
          <span><i class="tree-legend-line"></i> parent / child</span>
          <span><i class="tree-legend-line tree-legend-dash"></i> spouse</span>
          <span><i class="tree-legend-line tree-legend-dash" style="opacity:.4;"></i> sibling</span>
        </div>
        <div class="tree-canvas" id="family-tree-canvas" style="width:${width}px;height:${height}px;">
          <svg class="tree-edges-svg" width="${width}" height="${height}" viewBox="0 0 ${width} ${height}">${edgeSvg}</svg>
          ${nodeCards}
        </div>
      </div>
      <p class="field-hint" style="margin-top:10px;">Drag to pan, pinch or scroll to zoom, tap anyone to re-center on them.</p>
    ` : `<div class="empty"><i class="ti ti-affiliate"></i><p>No family relationships curated for ${esc(c.name)} yet.</p></div>`}
  `;
}

      <div id="cform-err" class="err"></div>
      <button type="submit" class="btn primary block" style="margin-top:18px;">Save person</button>
    </form>
  `;
}

/* ---------- PRACTICE ----------
   Challenge types are pluggable and data-described (DATA_MODEL.md §3), not a
   hardcoded switch. Each type in CHALLENGE_TYPES implements:
     build(entity, config)  -> state   opaque per-attempt state
     render(state)          -> html    reads state.checked for the graded view
     check(state)           -> { allCorrect, correctCount, total }
                                       reads its own DOM, mutates state
     score(state)           -> 0..1
     interact(state, ds)    optional; handle a tap on an element the type
                            rendered with data-action="practice-interact"
                            (ds = that element's dataset). Mutates state.
                            If it sets state.checked itself (a self-graded
                            type finalizing), the caller does the same
                            session bookkeeping check() would have.
     controls(state)        optional; HTML for the action-button area while
                            !state.checked. Replaces the generic "Check"
                            button — for a type whose finalization isn't a
                            single auto-graded tap (self-graded reveal).
     canCheck(state)        optional; defaults to true. Lets the generic
                            Check button stay disabled until the type's
                            own notion of "ready" is met (e.g. every
                            blank filled).
     autoAdvanceMs          optional number. On a correct check(), advance
                            to the next verse automatically after this
                            many ms (still guarded — a manual "Continue"
                            tap before the timer fires just no-ops it).
     autoAdvanceMsWrong     optional number. Same as autoAdvanceMs but for
                            an *incorrect* finalize — e.g. Reference
                            Match, which reveals the right answer and
                            then moves on by itself once it's had time to
                            be read, rather than waiting on a manual tap
                            the way every earlier type's wrong path did.
   Adding matching / ordering = another entry here, no changes to
   startPractice / renderPractice / checkPractice.
*/
const CHALLENGE_TYPES = {
  challenge_tap_builder: {
    id: 'challenge_tap_builder',
    name: 'Tap Builder',
    appliesToEntityTypes: ['verse'],
    config: { minBlanks: 4, maxBlanks: 6, minWordLength: 4, distractorCount: 3 },
    enabled: true,
    // Distractors are drawn from data.verses (the user's own already-
    // loaded library) rather than the full corpus in data/verses.json —
    // that corpus is lazily fetched only once Browse has been opened
    // (see loadCorpus()), so relying on it here would make this
    // exercise silently distractor-less (or need its own network fetch)
    // for anyone who opens Practice without ever visiting Discover
    // first. data.verses is always in memory and plenty large enough
    // to find real, differently-worded words from.
    build(verse, config){
      const words = verse.text.split(' ');
      const eligible = words.map((_,i)=>i)
        .filter(i => words[i].replace(/[^a-zA-Z]/g,'').length >= config.minWordLength);
      const blankCount = Math.max(1, Math.min(config.maxBlanks, eligible.length,
        config.minBlanks + Math.floor(Math.random() * (config.maxBlanks - config.minBlanks + 1))));
      const pool = [...eligible];
      const blankIndices = [];
      while(blankIndices.length < blankCount && pool.length){
        blankIndices.push(pool.splice(Math.floor(Math.random() * pool.length), 1)[0]);
      }
      blankIndices.sort((a,b)=>a-b);
      const correctWords = blankIndices.map(i => words[i]);
      const distractors = pickTapBuilderDistractors(config.distractorCount, verse.id, correctWords, config.minWordLength);
      const bank = shuffleInPlace([...correctWords, ...distractors]);
      return {
        words, blankIndices, bank,
        slots: blankIndices.map(()=>null),   // parallel to blankIndices: null, or an index into bank[]
        usedBank: bank.map(()=>false),
        checked: false, results: [], allCorrect: false
      };
    },
    interact(state, ds){
      if(state.checked) return;
      if(ds.tapBank !== undefined){
        const bi = +ds.tapBank;
        if(state.usedBank[bi]) return;
        const si = state.slots.indexOf(null);
        if(si === -1) return; // no empty slot left
        state.slots[si] = bi;
        state.usedBank[bi] = true;
      }else if(ds.tapSlot !== undefined){
        const si = +ds.tapSlot;
        const bi = state.slots[si];
        if(bi === null || bi === undefined) return;
        state.slots[si] = null;
        state.usedBank[bi] = false;
      }
    },
    render(state){
      const {words, blankIndices, slots, bank, usedBank, checked, results, allCorrect} = state;
      const sentence = words.map((w, i)=>{
        const si = blankIndices.indexOf(i);
        if(si === -1) return esc(w);
        const bi = slots[si];
        const filled = bi !== null && bi !== undefined;
        const cls = checked ? (results[si] ? 'tap-slot-correct' : 'tap-slot-wrong') : (filled ? 'tap-slot-filled' : '');
        const action = (!checked && filled) ? ` data-action="practice-interact" data-tap-slot="${si}"` : '';
        return `<span class="tap-slot ${cls}"${action}>${filled ? esc(bank[bi]) : ''}</span>`;
      }).join(' ');
      const tiles = bank.map((w, i)=>
        usedBank[i] ? '' : `<button class="tap-tile" data-action="practice-interact" data-tap-bank="${i}">${esc(w)}</button>`
      ).join('');
      return `
        <div class="target-sentence-box${checked && !allCorrect ? ' tap-shake' : ''}">${sentence}</div>
        <div class="word-bank-grid">${tiles || '<span class="practice-hint">every tile placed — tap Check Answer</span>'}</div>
      `;
    },
    canCheck(state){ return state.slots.every(s => s !== null); },
    check(state){
      const norm = s => s.trim().toLowerCase().replace(/[^a-z0-9']/g,'');
      const results = state.blankIndices.map((wi, si)=>{
        const bi = state.slots[si];
        return bi !== null && bi !== undefined && norm(state.bank[bi]) === norm(state.words[wi]);
      });
      const allCorrect = results.every(Boolean);
      state.results = results;
      state.checked = true;
      state.allCorrect = allCorrect;
      return { allCorrect, correctCount: results.filter(Boolean).length, total: results.length };
    },
    score(state){
      if(!state.results.length) return 0;
      return state.results.filter(Boolean).length / state.results.length;
    },
    // A correct answer immediately advances to the next verse (still
    // behind the normal "Continue" button too, in case this fires after
    // the user's already tapped it — see checkPractice()) — the tap-to-
    // fill interaction already feels fast/game-like in a way typing an
    // answer or self-grading doesn't.
    autoAdvanceMs: 600
  },

  challenge_first_letter_sprint: {
    id: 'challenge_first_letter_sprint',
    name: 'First-Letter Sprint',
    appliesToEntityTypes: ['verse'],
    config: {},
    enabled: true,
    // A speed drill, not a recall check like the other types — every
    // word must be typed correctly to advance at all (no wrong-answer
    // path other than "hasn't typed the right letter yet"), so
    // completing it always counts as a correct practice, the same
    // shape as the old self-graded types' "Got it" always being 1.
    build(verse){
      const words = verse.text.split(' ');
      return {
        words,
        letters: words.map(firstLetter),   // null for a token with no A-Z at all (rare) — auto-skipped
        currentIndex: 0,
        startTime: Date.now(),
        elapsedMs: null,
        flashIndex: null, flashType: null, // transient: which word to visually flash, and which way
        checked: false, allCorrect: false
      };
    },
    // Called with {letter} from wireFirstLetterSprint()'s hidden <input>
    // listener — not through practiceInteract()/practiceInteractWith()
    // like every other type's interact(), since that path always ends
    // in a full render(), which on a real device closes the mobile
    // keyboard after every keystroke (see wireFirstLetterSprint()'s own
    // comment). This function only ever mutates state; the caller
    // decides how to reflect that in the DOM.
    interact(state, ds){
      if(state.checked || ds.letter === undefined) return;
      // Skip over any word with no actual letter in it before testing —
      // nothing to type for a stray token like "--", so it shouldn't
      // block the sprint.
      while(state.currentIndex < state.words.length && state.letters[state.currentIndex] === null){
        state.currentIndex++;
      }
      if(state.currentIndex >= state.words.length) return;
      const typed = ds.letter.toLowerCase();
      if(typed === state.letters[state.currentIndex]){
        state.flashIndex = state.currentIndex;
        state.flashType = 'correct';
        state.currentIndex++;
        while(state.currentIndex < state.words.length && state.letters[state.currentIndex] === null){
          state.currentIndex++;
        }
        if(state.currentIndex >= state.words.length){
          state.elapsedMs = Date.now() - state.startTime;
          state.checked = true;
          state.allCorrect = true;
        }
      }else{
        state.flashIndex = state.currentIndex;
        state.flashType = 'wrong';
      }
    },
    render(state){
      if(state.checked){
        const {words, elapsedMs} = state;
        const seconds = (elapsedMs / 1000).toFixed(1);
        const minutes = elapsedMs / 60000;
        const wpm = Math.max(1, Math.round(words.length / minutes));
        return `
          <div class="sprint-text-box">${esc(words.join(' '))}</div>
          <div class="sprint-toast"><i class="ti ti-bolt"></i> Completed in ${seconds}s! (${wpm} WPM)</div>
        `;
      }
      // The sentence box's own markup lives in sprintTokensHTML() so the
      // fast keystroke path in wireFirstLetterSprint() (which patches
      // just that box's innerHTML, never touching the <input> below it —
      // see that function's own comment for why) renders identically
      // rather than duplicating this logic and risking drift.
      return `
        <div class="sprint-text-box" id="sprint-text-box">${sprintTokensHTML(state)}</div>
        <input type="text" id="sprint-hidden-input" class="sprint-hidden-input" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" inputmode="text" aria-label="Type the first letter of each word">
        <p class="practice-hint" data-action="focus-sprint-input" style="margin-top:10px;cursor:pointer;">Keyboard not showing? Tap here.</p>
      `;
    },
    // No Check button at all — typing IS the interaction. Returning ''
    // here (rather than leaving controls undefined) suppresses the
    // generic Check button specifically while !state.checked; the
    // generic "Continue"/"Finish" button still shows once state.checked
    // flips true, same as every other type (renderPractice() always
    // prefers that over controls()).
    controls(){ return ''; },
    score(state){ return state.allCorrect ? 1 : 0; },
    autoAdvanceMs: 1200
  },

  challenge_progressive_vanish: {
    id: 'challenge_progressive_vanish',
    name: 'Progressive Vanish',
    appliesToEntityTypes: ['verse'],
    config: { totalStages: 5 },
    enabled: true,
    // Self-graded, same shape as First-Letter Sprint's "typing it at all
    // means you got it" — the owner's own spec named the constructor
    // initProgressiveVanish(verse), but this app dispatches every
    // challenge type through CHALLENGE_TYPES[id].build(verse, config)
    // generically (see the interface doc above CHALLENGE_TYPES), same
    // architectural call already made for Tap Builder/First-Letter
    // Sprint's own similarly-named specs — a bespoke top-level init
    // function per type would bypass that pluggability for no benefit.
    build(verse, config){
      const words = verse.text.split(' ').map(text => ({
        text,
        vanished: false,
        isPunctuation: !/[a-zA-Z0-9]/.test(text)
      }));
      // A fixed random order decides which words vanish first and stays
      // fixed for the whole climb (same "stage N's hidden set is always
      // a superset of stage N-1's" guarantee the old verse-ladder type
      // used) — nothing that's already vanished ever reappears just
      // because the stage advanced.
      const order = words.map((w, i) => i).filter(i => !words[i].isPunctuation);
      for(let i = order.length - 1; i > 0; i--){
        const j = Math.floor(Math.random() * (i + 1));
        [order[i], order[j]] = [order[j], order[i]];
      }
      return {
        words, order, totalNonPunct: order.length,
        currentStage: 0, totalStages: config.totalStages,
        peekIndex: null, peekToken: 0,
        checked: false, allCorrect: false
      };
    },
    interact(state, ds){
      if(state.checked) return;
      if(ds.peekWord !== undefined){
        // Reveal exactly one vanished word for 1.5s, then hide it again
        // — a real timed effect, not a CSS-only animation, so it needs
        // an actual timer. peekToken guards against an earlier peek's
        // timeout firing after a newer tap superseded it (e.g. tapping
        // a second blank within the 1.5s window), and against re-
        // rendering into a verse the user has since navigated away
        // from — same "is this timeout still relevant" shape every
        // other guarded setTimeout in this file uses (autoAdvanceMs,
        // family-tree-nav's chained `from`, etc.), just checked by
        // object identity here since interact() only has `state`, not
        // `session`/`item`.
        state.peekIndex = +ds.peekWord;
        const myToken = ++state.peekToken;
        setTimeout(()=>{
          if(state.peekToken !== myToken) return;
          state.peekIndex = null;
          if(session && session.queue[session.index] && session.queue[session.index].state === state) render();
        }, 1500);
      }else if(ds.nextStage !== undefined){
        if(state.currentStage >= state.totalStages) return;
        state.currentStage++;
        const vanishCount = Math.round(state.totalNonPunct * (state.currentStage / state.totalStages));
        const toVanish = new Set(state.order.slice(0, vanishCount));
        state.words.forEach((w, i) => { if(!w.isPunctuation && toVanish.has(i)) w.vanished = true; });
      }else if(ds.complete !== undefined){
        state.checked = true;
        state.allCorrect = true;
      }
    },
    render(state){
      if(state.checked){
        return `<div class="vanish-text-box">${state.words.map(w => esc(w.text)).join(' ')}</div>`;
      }
      const tokens = state.words.map((w, i)=>{
        if(w.isPunctuation) return esc(w.text);
        if(!w.vanished || state.peekIndex === i) return `<span class="vanish-word">${esc(w.text)}</span>`;
        return `<span class="vanish-word vanish-blank" data-action="practice-interact" data-peek-word="${i}">${esc(w.text)}</span>`;
      }).join(' ');
      return `<div class="vanish-text-box" id="vanish-text-box">${tokens}</div>`;
    },
    // Bypasses the generic Check button entirely, same as Tap Builder's
    // canCheck-disabled state and First-Letter Sprint's empty controls()
    // — "Hold to Peek" (wired separately in wireProgressiveVanish(), a
    // raw press-and-hold gesture that has no meaningful click/data-action
    // shape) sits alongside the real primary action, which is either
    // "advance a stage" or, once fully vanished, "finish."
    controls(state){
      const isFinal = state.currentStage >= state.totalStages;
      // "Hold to Peek" only makes sense once something's actually
      // vanished — at stage 0 the full verse is already on screen, so
      // showing a button to reveal it is a dead, confusing control
      // (owner report, 2026-11-10).
      const showPeek = state.currentStage > 0;
      return `
        <div class="vanish-controls">
          ${showPeek ? `<button class="btn vanish-peek-btn" id="vanish-peek-btn" type="button"><i class="ti ti-eye"></i> Hold to Peek</button>` : ''}
          <button class="btn primary block vanish-next-btn" data-action="practice-interact" data-${isFinal ? 'complete' : 'next-stage'}="1">
            ${isFinal ? `<i class="ti ti-sparkles"></i> I Recited It Perfectly!` : `Next Step (Remove 20%) <i class="ti ti-arrow-right"></i>`}
          </button>
        </div>
      `;
    },
    score(state){ return state.allCorrect ? 1 : 0; },
    // "...loads the next due verse" per spec — matches the other two
    // new challenge types' auto-advance, timed a bit longer so the
    // "I Recited It Perfectly!" confirmation is actually readable
    // before moving on.
    autoAdvanceMs: 800
  },

  challenge_clause_connect: {
    id: 'challenge_clause_connect',
    name: 'Clause Connect',
    appliesToEntityTypes: ['verse'],
    config: { minClauses: 3, maxClauses: 5 },
    enabled: true,
    // Reordering, not a single auto-graded tap — a wrong "Check Order"
    // shouldn't finalize the attempt the way Tap Builder's one-shot
    // check() does, since the whole point of clause-by-clause feedback
    // (shake + red highlights) is to let the user fix it and try again.
    // So "Check Order" is wired as an interact() action (via controls(),
    // like Progressive Vanish's stage buttons) rather than the generic
    // check()/checkPractice() path — only a *correct* order flips
    // state.checked, which is what triggers practiceInteractWith()'s
    // normal finalize bookkeeping (recordPractice, autoAdvanceMs, etc.).
    // A real check() is still defined (never called by this type itself)
    // purely so nothing elsewhere that assumes every ChallengeType has
    // one breaks.
    build(verse, config){
      const clauses = splitIntoClauses(verse.text, config);
      let order = clauses.map((_, i) => i);
      shuffleInPlace(order);
      // A "scrambled" order that lands back on the correct sequence by
      // chance (common with only 3 clauses) isn't a real exercise —
      // force one swap so there's always something to fix.
      if(order.length > 1 && order.every((v, i) => v === i)){
        [order[0], order[1]] = [order[1], order[0]];
      }
      return {
        clauses, order, selected: null,
        checked: false, allCorrect: false, wrong: []
      };
    },
    interact(state, ds){
      if(state.checked) return;
      if(ds.tapClause !== undefined){
        const i = +ds.tapClause;
        if(state.selected === null){
          state.selected = i;
        }else if(state.selected === i){
          state.selected = null;
        }else{
          [state.order[state.selected], state.order[i]] = [state.order[i], state.order[state.selected]];
          state.selected = null;
        }
        state.wrong = []; // clear stale red highlights once the user starts fixing it
      }else if(ds.checkOrder !== undefined){
        const wrong = [];
        state.order.forEach((clauseIdx, i) => { if(clauseIdx !== i) wrong.push(i); });
        if(wrong.length === 0){
          state.checked = true;
          state.allCorrect = true;
          state.wrong = [];
        }else{
          state.wrong = wrong;
        }
      }
    },
    render(state){
      const {clauses, order, selected, checked, wrong} = state;
      const showWrong = !checked && wrong.length > 0;
      const cards = order.map((clauseIdx, i)=>{
        const cls = checked ? 'clause-correct'
          : showWrong && wrong.includes(i) ? 'clause-wrong'
          : selected === i ? 'clause-selected' : '';
        // The grip handle drags (wireClauseConnect() — pointer-based, not
        // HTML5 native drag-and-drop, which never fires on a touchscreen
        // at all; same reasoning wireTimelineDrag() already established
        // for reordering on mobile), the clause text itself taps
        // (practice-interact, the normal dispatch every other type uses)
        // — kept on separate elements so a drag-start on the grip can't
        // also fire a tap-to-swap click on release.
        const tapAction = checked ? '' : ` data-action="practice-interact" data-tap-clause="${i}"`;
        return `<div class="clause-card ${cls}" id="clause-card-${i}" data-clause-idx="${clauseIdx}">
          <i class="ti ti-grip-vertical clause-grip"></i>
          <span class="clause-text"${tapAction}>${esc(clauses[clauseIdx])}</span>
        </div>`;
      }).join('');
      return `
        <p class="clause-instruction">${checked ? 'Correct order!' : 'Arrange the clauses in chronological order'}</p>
        <div class="clause-list-container${showWrong ? ' clause-shake' : ''}" id="clause-list-container">${cards}</div>
      `;
    },
    controls(){
      return `<button class="btn primary block clause-check-btn" data-action="practice-interact" data-check-order="1">Check Order</button>`;
    },
    check(state){
      const wrong = [];
      state.order.forEach((clauseIdx, i) => { if(clauseIdx !== i) wrong.push(i); });
      const allCorrect = wrong.length === 0;
      state.wrong = wrong;
      state.checked = allCorrect;
      state.allCorrect = allCorrect;
      return { allCorrect, correctCount: state.order.length - wrong.length, total: state.order.length };
    },
    score(state){ return state.allCorrect ? 1 : 0; },
    autoAdvanceMs: 600
  },

  challenge_reference_match: {
    id: 'challenge_reference_match',
    name: 'Reference Match',
    appliesToEntityTypes: ['verse'],
    config: { distractorCount: 3 },
    enabled: true,
    // Distractors are drawn from data.verses (the user's own already-
    // loaded library), the same offline-first call Tap Builder's own
    // build() already made against a near-identical spec ask — the full
    // corpus in data/verses.json is only lazily fetched once Browse has
    // been opened, so this exercise would silently run distractor-short
    // (or need its own network fetch) for anyone practicing before ever
    // visiting Discover.
    build(verse, config){
      const format = Math.random() < 0.5 ? 'quoteToRef' : 'refToQuote';
      const distractors = pickReferenceMatchDistractors(config.distractorCount, verse);
      const options = shuffleInPlace([
        { id: verse.id, reference: verse.reference, text: verse.text, correct: true },
        ...distractors.map(d => ({ id: d.id, reference: d.reference, text: d.text, correct: false }))
      ]);
      return {
        format, options, selectedIndex: null,
        checked: false, allCorrect: false
      };
    },
    // A single tap both answers and finalizes — there's no separate
    // "submit" step to a multiple-choice pick, so this always ends the
    // attempt itself (like Progressive Vanish's "complete" tap), rather
    // than going through the generic check()/checkPractice() path.
    interact(state, ds){
      if(state.checked || ds.tapOption === undefined) return;
      const i = +ds.tapOption;
      state.selectedIndex = i;
      state.checked = true;
      state.allCorrect = !!state.options[i].correct;
    },
    render(state){
      const {format, options, selectedIndex, checked} = state;
      const targetOption = options.find(o => o.correct);
      const promptHtml = format === 'quoteToRef'
        ? `&ldquo;${esc(targetOption.text)}&rdquo;`
        : esc(targetOption.reference);
      const cards = options.map((opt, i)=>{
        const label = format === 'quoteToRef' ? opt.reference : opt.text;
        let cls = '';
        if(checked){
          if(i === selectedIndex) cls = opt.correct ? 'match-correct' : 'match-wrong';
          else if(opt.correct) cls = 'match-reveal-correct';
        }
        const action = checked ? '' : ` data-action="practice-interact" data-tap-option="${i}"`;
        return `<div class="match-option-card ${cls}"${action}>${esc(label)}</div>`;
      }).join('');
      return `
        <div class="match-prompt-card">${promptHtml}</div>
        <div class="match-options-grid${checked ? ' match-locked' : ''}">${cards}</div>
      `;
    },
    // No generic Check button — tapping an option IS the check, same
    // reasoning First-Letter Sprint's empty controls() gives.
    controls(){ return ''; },
    check(state){
      const summary = { allCorrect: !!state.allCorrect, correctCount: state.allCorrect ? 1 : 0, total: 1 };
      return summary;
    },
    score(state){ return state.allCorrect ? 1 : 0; },
    // Correct answers advance fast (600ms, matching every other type's
    // auto-advance); a wrong one waits noticeably longer (1.5s) so the
    // revealed correct card is actually readable before moving on —
    // see autoAdvanceMsWrong in the interface doc above CHALLENGE_TYPES.
    autoAdvanceMs: 600,
    autoAdvanceMsWrong: 1500
  }
};
/* Picks distractor verses for Reference Match, preferring plausible
   near-misses over random ones: same book first, then same testament,
   then anything else in the user's library — so the four options aren't
   trivially distinguishable by book alone every time. Drawn from
   data.verses (see the build() comment above for why, not the full
   corpus). */
const NT_BOOKS = new Set(['Matthew','Mark','Luke','John','Acts','Romans','1 Corinthians',
  '2 Corinthians','Galatians','Ephesians','Philippians','Colossians','1 Thessalonians',
  '2 Thessalonians','1 Timothy','2 Timothy','Titus','Philemon','Hebrews','James',
  '1 Peter','2 Peter','1 John','2 John','3 John','Jude','Revelation']);
function pickReferenceMatchDistractors(count, targetVerse){
  const pool = data.verses.filter(v => v.id !== targetVerse.id);
  const targetIsNT = NT_BOOKS.has(targetVerse.book);
  const sameBook = shuffleInPlace(pool.filter(v => v.book === targetVerse.book));
  const sameTestament = shuffleInPlace(pool.filter(v => v.book !== targetVerse.book && NT_BOOKS.has(v.book) === targetIsNT));
  const rest = shuffleInPlace(pool.filter(v => v.book !== targetVerse.book && NT_BOOKS.has(v.book) !== targetIsNT));
  const picked = [];
  const seenRef = new Set([targetVerse.reference]);
  for(const v of [...sameBook, ...sameTestament, ...rest]){
    if(seenRef.has(v.reference)) continue;
    seenRef.add(v.reference);
    picked.push(v);
    if(picked.length >= count) break;
  }
  return picked;
}
/* Splits a verse's text into 3-5 clause strings for Clause Connect.

   the matched word itself behind as its own extra array entry every
   time it split). Falls back to fixed-size word chunks for verses too
   short or too plainly-worded to produce 3+ real clauses that way, and
   merges any overflow past maxClauses into the final clause rather than
   truncating real verse text. */
function splitIntoClauses(text, config){
  const minClauses = config.minClauses || 3, maxClauses = config.maxClauses || 5;

  if(parts.length < minClauses){
    const words = text.split(' ').filter(Boolean);

    let i = 0;
    while(i < words.length){
      const take = Math.min(4 + Math.floor(Math.random() * 3), words.length - i);
      parts.push(words.slice(i, i + take).join(' '));
      i += take;
    }
  }
  if(parts.length > maxClauses){
    const head = parts.slice(0, maxClauses - 1);
    const tail = parts.slice(maxClauses - 1).join(' ');

  const exclude = new Set(excludeWords.map(w => w.toLowerCase().replace(/[^a-z0-9']/g,'')));
  const candidates = [];
  for(const v of data.verses){
    if(v.id === verseId) continue;
    for(const w of v.text.split(' ')){
      const clean = w.replace(/[^a-zA-Z']/g,'');

      if(clean.length >= minWordLength && !exclude.has(norm)) candidates.push(clean);

  for(const w of candidates){

/* Small CSS-only confetti burst — spans with a randomized rotation +
   outward translateY, no <canvas> or per-frame JS. See index's design
   notes: a real canvas particle system needs a requestAnimationFrame
   loop, which is a real battery/perf cost on a low-end phone for a
   decorative flourish; this reads the same and costs nothing at rest. */
function renderSparks(n){
  let out = '';
  for(let i=0;i<n;i++){
    const angle = (Math.random()*360).toFixed(1);
    const dist = (36 + Math.random()*46).toFixed(1);
    const size = (4 + Math.random()*4).toFixed(1);
    const delay = (Math.random()*0.15).toFixed(2);
    const color = Math.random() < 0.75 ? 'var(--gold)' : 'var(--gold-deep)';
    out += `<span class="spark" style="--angle:${angle}deg;--dist:${dist}px;--size:${size}px;--spark-color:${color};animation-delay:${delay}s;"></span>`;
  }
  return out;
}
function renderPractice(){

  if(session && session.shepherd && session.index >= session.queue.length) return renderShepherdComplete();

    // staying >= session.queue.length already keeps this branch stable on
    // repeated renders; session is only cleared when the user actually
    // leaves, via the "Done" button (data-action="exit-practice").
    const results = session.results;
    const total = results.length;

  }

  const v = findVerse(item.verseId);

  if(session.shepherd) return renderShepherdSession(item, type, v, st);

      ? `<button class="btn primary block" data-action="next-practice"><i class="ti ti-arrow-right"></i> ${lastOne ? 'Finish' : 'Continue'}</button>`
      : body.footerHtml}

/* Shared between the generic session screen above and Shepherd's Path's
   own session chrome (renderShepherdSession(), item 161) — the actual
   per-ChallengeType exercise markup and its Check/controls button,
   unchanged either way. Keeping this one function is what let Phase 2
   restyle the chrome around the exercise without touching any
   ChallengeType's own build/render/check code. */
function renderChallengeBody(item, type, v, st){
  const isTapBuilder = type.id === 'challenge_tap_builder';
  const isSprint = type.id === 'challenge_first_letter_sprint';
  const isVanish = type.id === 'challenge_progressive_vanish';
  const isClauseConnect = type.id === 'challenge_clause_connect';
  const isReferenceMatch = type.id === 'challenge_reference_match';
  const canCheck = type.canCheck ? type.canCheck(st) : true;
  // Reference Match deliberately never prints the real verse.reference
  // here — one of its two question formats (quote -> pick the matching
  // reference) is literally asking the user to name it, so showing it
  // up top would spoil the answer before they've even seen the options.
  const refLine = isReferenceMatch
    ? `<div class="ref" style="font-size:12px;color:var(--gold-deep);font-weight:600;margin-bottom:10px;">Reference Match</div>`
    : isSprint && !st.checked
    ? `<div class="ref" style="font-size:12px;color:var(--gold-deep);font-weight:600;margin-bottom:10px;">${esc(v.reference)} <span id="sprint-timer" style="color:#F2F2F2;font-weight:600;">0.0s</span></div>`
    : isVanish
    ? `<div class="ref" style="font-size:12px;color:var(--gold-deep);font-weight:600;margin-bottom:10px;">${esc(v.reference)} <span style="color:#F2F2F2;font-weight:600;">Stage ${Math.min(st.currentStage, st.totalStages)} of ${st.totalStages}</span></div>`
    : `<div class="ref" style="font-size:12px;color:var(--gold-deep);font-weight:600;margin-bottom:10px;">${esc(v.reference)} <span style="color:var(--ink-faint);font-weight:500;">· ${esc(type.name)}</span></div>`;
  const bodyHtml = (isTapBuilder || isSprint || isVanish || isClauseConnect || isReferenceMatch)
    ? `${refLine}${type.render(st)}`
    : `<div class="card">${refLine}<div class="practice-verse">${type.render(st)}</div></div>`;
  const footerHtml = type.controls
    ? type.controls(st)
    : `<button class="btn primary block${isTapBuilder ? ' tap-builder-check' : ''}" data-action="check-practice"${canCheck ? '' : ' disabled'}>${isTapBuilder ? 'Check Answer' : 'Check'}</button>`;
  return { isTapBuilder, isSprint, isVanish, isClauseConnect, isReferenceMatch, canCheck, bodyHtml, footerHtml };
}

      </div>
      <div class="sp-session-combo-row">${combo >= 2 ? `<div class="sp-combo-line"><svg width="14" height="14" viewBox="0 0 24 24" fill="#ff9600"><path d="M12 2c1.2 3.6 5.5 6.2 5.5 11.3a5.5 5.5 0 0 1-11 0c0-2.2 1-3.8 2.2-4.9.1 1.6 1 2.7 2.1 2.7-.9-3.2.1-6.3 1.2-9.1z"/></svg>${combo} IN A ROW</div>` : ''}</div>
      <div class="sp-session-body">
        ${session.shepherd.kind === 'lesson' && session.index === 0 ? `<div class="sp-new-tag"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.8l2.8 5.8 6.4.9-4.6 4.5 1.1 6.3L12 17.3l-5.7 3 1.1-6.3L2.8 9.5l6.4-.9z"/></svg>NEW VERSE</div>` : ''}
        <div class="sp-session-heading">${esc(meta.heading)}</div>
        <div class="sp-session-mascot-row">
          <div class="sp-session-mascot">${lambSvg(mood, 72)}</div>
          <div class="sp-session-bubble">
            <div class="sp-bubble-tail"></div>
            ${isRef ? `<div class="sp-bubble-serif">“${esc(verseText(v))}”</div>` : `<div class="sp-bubble-plain">${esc(meta.bubble)}</div>`}
          </div>
        </div>
        ${body.bodyHtml}
      </div>

}
/* The feedback sheet above is deliberately returned as a SIBLING of
   .shepherd-screen, not nested inside it — .shepherd-screen is
   position:fixed with its own z-index (item 165), which makes it a
   real stacking context: no z-index on a descendant, however high, can
   ever out-rank .navbar (z-index:1000) from inside it. Sibling-level,
   the sheet's z-index:1001 compares directly against .navbar's and
   correctly wins — see renderShepherdFeedbackSheet() below. */
function renderShepherdFeedbackSheet(st, combo, lastOne){
  const ok = !!st.allCorrect;
  const praise = ['Amazing!', 'Nice!', 'Wonderful!', 'Great job!', 'You got it!'];
  const title = ok ? praise[session.index % praise.length] : 'Not quite';
  const sub = ok ? (combo >= 3 ? combo + ' in a row. You’re on fire.' : 'Nice work.') : 'Keep going — you’ll get the next one.';
  const icon = ok
    ? `<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>`
    : `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.6" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>`;
  return `
    <div class="sp-feedback-sheet ${ok ? 'sp-good' : 'sp-bad'}">
      <div class="sp-feedback-row"><div class="sp-feedback-icon">${icon}</div><div class="sp-feedback-title">${esc(title)}</div></div>
      <div class="sp-feedback-sub">${esc(sub)}</div>
      <button class="sp-feedback-btn tap" data-action="next-practice">${ok ? (lastOne ? 'FINISH' : 'CONTINUE') : 'GOT IT'}</button>
    </div>`;
}

function saveVerse(){
  const ref = document.getElementById('f-ref').value.trim();
  const text = document.getElementById('f-text').value.trim();
  const topicsRaw = document.getElementById('f-topics').value.trim();
  const errEl = document.getElementById('form-err');
  if(!ref || !text){ errEl.textContent = 'Enter a reference and verse text.'; return; }
  const topicIds = [];
  if(topicsRaw){
    topicsRaw.split(',').map(s=>s.trim()).filter(Boolean).forEach(name=>{
      let t = data.topics.find(t=>t.name.toLowerCase()===name.toLowerCase());
      if(!t){
        t = {id:'topic_'+name.toLowerCase().replace(/[^a-z0-9]+/g,'_'), name: name.charAt(0).toUpperCase()+name.slice(1), description:'', relatedTopicIds:[], metadata:{}};
        content.topics.push(t);
        data.topics.push(t);
      }
      topicIds.push(t.id);
    });
  }
  const verse = {id:'verse_'+Date.now(), reference:ref, text, translation:'', topicIds, characterIds:[], metadata:{}};
  content.verses.push(verse);
  data.verses.push(verse);
  content.libraryVerseIds = [...(content.libraryVerseIds || []), verse.id];
  saveContent();
  go('home');
}
function saveCharacter(){
  const name = document.getElementById('c-name').value.trim();
  const rolesRaw = document.getElementById('c-roles').value.trim();
  const era = document.getElementById('c-era').value.trim();
  const summary = document.getElementById('c-summary').value.trim();
  const errEl = document.getElementById('cform-err');
  if(!name){ errEl.textContent = 'Enter a name.'; return; }
  const roles = rolesRaw ? rolesRaw.split(',').map(s=>s.trim()).filter(Boolean) : [];
  const character = {id:'char_'+Date.now(), name, roles, era, summary, verseIds:[], metadata:{}};
  content.characters.push(character);
  data.characters.push(character);
  saveContent();
  go('home');
}

function bindEvents(root){
  (root || document).querySelectorAll('[data-action]').forEach(el=>{
    el.addEventListener('click', onAction);
  });

  // page still has its listeners and would otherwise get duplicates.
  if(root) return;

  const vf = document.getElementById('verse-form');
