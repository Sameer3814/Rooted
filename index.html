<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rooted — Scripture Memory</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#08090B">
<link rel="apple-touch-icon" href="icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Fraunces:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">
<style>
  :root{
    /* v3 visual system (2026-09-10) — modern dark theme, inspired by (not
       copied from) YouVersion: a near-black ground so accent colors and
       card surfaces pop, replacing the v2 warm cream/storybook look
       entirely (full swap, no light/dark toggle — see DATA_MODEL.md for
       the rationale). Same token names as v2 so every component below
       inherited the new look for free; only the values changed. */
    --paper:#08090B;
    --paper-raised:#18191D;
    --surface-sunken:#212227;
    --ink:#F5F4F1;
    --ink-soft:#9CA0AA;
    --ink-faint:#63676F;
    --line:rgba(255,255,255,.09);
    /* v5 accent — done (2026-09-17), owner's explicit request to move off
       the amber/gold accent entirely ("bold white" instead). The token
       NAMES stay --gold/--gold-deep/etc. rather than being renamed
       app-wide (a rename would touch every one of the ~65 places that
       reference them for zero visual benefit); only the values changed.
       Kept the original two-tier relationship (a base tone + a brighter
       "deep" emphasis tone) rather than collapsing both to identical
       pure white, so places that lean on that contrast (e.g. the goal
       ring's fill vs. a verse reference's text) keep some depth. The
       per-topic color-override mechanism (topicAccentVars(), item 62-64)
       is unaffected — it already reassigns these same custom properties
       to a per-topic hue at render time, regardless of what the default
       happens to be. */
    --gold:#F2F2F2;
    --gold-deep:#FFFFFF;
    --gold-wash:rgba(255,255,255,.14);
    --gold-shadow:rgba(255,255,255,.25);
    /* v6 — black & white only (2026-09-17), owner's explicit direction:
       "get rid of any other color theme in the entire app... stick with
       black and white for every element unless I specifically tell
       you." --sage (was green, "mastered"/progress) and --tan (was a
       blue-gray, plain metadata) collapse to grayscale — same token
       names/roles kept (design philosophy #1 still applies: these are
       still three distinct semantic roles per §29, just no longer
       color-coded ones), so every existing usage (mastery bar, "due"/
       role tags, avatars) picks up the change for free. --danger (red,
       real form/validation errors) and the challenge-types' own
       correct/wrong feedback colors (#10B981/#EF4444, hardcoded
       per-component, not tokens) are a DIFFERENT category — functional
       success/error state, not decorative theme — and were
       deliberately left alone; see DATA_MODEL.md §8, item 123 for the
       full reasoning on what did and didn't change in this pass. */
    --sage:#E8E8E8;
    --sage-deep:#FFFFFF;
    --sage-wash:rgba(232,232,232,.16);
    --tan-deep:#B8B8B8;
    --tan-wash:rgba(184,184,184,.14);
    --danger:#FF5C43;
    --danger-wash:rgba(255,92,67,.16);
    --shadow-card:0 4px 16px rgba(0,0,0,.4);
    --shadow-hero:0 14px 40px rgba(0,0,0,.45);
    --shadow-nav:0 16px 40px rgba(0,0,0,.5);
    --shadow-pop:0 2px 8px rgba(0,0,0,.35);
    --radius-card:20px;
    --radius-ctl:12px;

    /* Type scale (2026-09-14) — a shared set of tokens so "eyebrow"
       labels, titles, body copy, scripture text, headings, and nav/CTA
       text stay consistent across every screen instead of each card
       picking its own one-off size. --text-accent/--text-primary/
       --text-secondary alias the existing --gold-deep/--ink/--ink-soft
       roles rather than introducing new colors — same palette, now also
       reachable by a role name that matches how these tokens get used
       (accent/primary/secondary text) rather than only a color name. */
    --text-xs:12px;
    --text-sm:14px;
    --text-base:16px;
    --text-lg:18px;
    --text-xl:22px;
    --text-2xl:28px;
    --text-primary:var(--ink);
    --text-secondary:var(--ink-soft);
    /* Now a true alias of --gold-deep (it was a separately-hardcoded,
       slightly-different hex before, #D49E35 — a known minor
       inconsistency noted in this same comment historically; cleaned up
       while touching this token for the v5 white-accent pass anyway). */
    --text-accent:var(--gold-deep);
    --font-sans:'Inter',sans-serif;
    --font-display:'Fraunces',serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    padding-bottom:120px !important;
  }
  /* Bolder/bigger icons app-wide (2026-09-17, owner's explicit request,
     "including the back arrow in all pages") — a single low-specificity
     rule on Tabler's own shared `.ti` class, which every icon in this
     app already carries (`class="ti ti-arrow-left"` etc.), rather than
     hunting down each of the dozens of individual icon usages. The
     em-based size bump scales each icon relative to whatever it already
     inherits (so a small badge icon and a big hero icon both grow
     proportionally, not to one fixed px value); text-stroke adds real
     weight, since the Tabler webfont ships only one (outline) weight —
     there's no separate "bold" glyph set to switch to. A handful of
     icons with their own more-specific explicit font-size rule
     (`.navitem i`, `.back-btn` isn't one of these — it has no override
     at all, so it's covered here directly) still win on size per normal
     CSS cascade rules; those few were bumped individually alongside this
     rule instead, listed at each one's own definition. */
  .ti{-webkit-text-stroke:.4px currentColor;}
  i.ti{font-size:1.15em;}
  h1,h2,h3,.headline{font-family:var(--font-sans);font-weight:700;color:var(--text-primary);margin:0;letter-spacing:-.01em;}
  /* Screen headings & greetings (h1: "Browse", "Topics", "Study", plus
     .home-greet's "Good afternoon" below) use the same text-2xl/700 pair. */
  h1{font-size:var(--text-2xl);}
  h2{font-size:20px;}
  /* Card & section titles (story/topic/character titles, book names) */
  h3{font-size:var(--text-lg);font-weight:600;line-height:1.3;}
  p{margin:0;line-height:1.55;}
  button{font-family:'Inter',sans-serif;cursor:pointer;}
  /* touch-action:pan-y tells the browser vertical scrolling is its job
     but a horizontal gesture is ours to interpret — without this, mobile
     browsers can decide a swipe belongs to native scrolling and send a
     pointercancel instead of pointerup, silently swallowing the
     swipe-back gesture wired in wireSwipeBack() below before it ever
     fires. Real bug, not theoretical — caught by direct device testing. */
  .app{max-width:480px;margin:0 auto;padding:20px 18px 8px;touch-action:pan-y;}
  .topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;}
  .topbar .brand{display:flex;align-items:center;gap:8px;}
  .topbar .brand i{font-size:25px;color:var(--gold-deep);}
  .stat-row{display:flex;gap:10px;margin-bottom:20px;}
  .stat-card{flex:1;background:var(--paper-raised);border:1px solid rgba(255,255,255,.06);border-radius:var(--radius-card);box-shadow:var(--shadow-card);padding:14px;}
  .stat-card .num{font-family:'Inter',sans-serif;font-size:24px;font-weight:700;letter-spacing:-.01em;}
  .stat-card .label{font-size:12px;color:var(--ink-soft);margin-top:2px;}
  .section-label{font-size:13px;color:var(--ink-soft);margin:22px 0 10px;display:flex;align-items:center;justify-content:space-between;}
  .card{
    background:var(--paper-raised);
    border:1px solid rgba(255,255,255,.06);
    border-radius:var(--radius-card);
    box-shadow:var(--shadow-card);
    padding:16px;
    margin-bottom:12px;
  }
  .card.tap{cursor:pointer;transition:box-shadow .15s ease;}
  .card.tap:active{box-shadow:0 2px 10px rgba(44,34,30,.08);}
  /* Stories list: top cover-banner cards (2026-09-18, item 140) — now
     that every story has real generated art (item 138), the list can
     finally show it. A separate class from .card, not combined with
     it, since .card's own 16px padding would stop the cover image from
     sitting flush against the card's top edge. */
  .story-list-card{
    background:#1A1A1A;border:1px solid #2A2A2A;border-radius:20px;
    overflow:hidden;margin-bottom:16px;cursor:pointer;
    transition:transform .15s ease,border-color .15s ease;
  }
  .story-list-card:active{transform:scale(.98);}
  .story-card-cover{width:100%;height:160px;object-fit:cover;display:block;border-bottom:1px solid #2A2A2A;background:var(--surface-sunken);}
  .story-card-body{padding:16px 20px;}
  .story-card-body h3{font-size:18px;font-weight:700;color:#F2F2F2;margin-bottom:4px;}
  .story-card-ref{font-size:13px;font-weight:600;color:#F2F2F2;margin-bottom:8px;display:inline-block;}
  .story-card-excerpt{font-size:14px;color:#9C9C9C;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
  /* People: 2-column photo grid (2026-09-21) — replaces the old thin
     `.list-row` (see renderCharacterRow()'s own comment) now that every
     character has a real generated portrait worth showing at more than
     40px. Same dark card palette as .story-list-card above, for visual
     consistency between the two photo-forward list treatments. */
  .people-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px;}
  .people-grid-card{
    background:#1A1A1A;border:1px solid #2A2A2A;border-radius:16px;
    overflow:hidden;cursor:pointer;transition:transform .15s ease;
  }
  .people-grid-card:active{transform:scale(.97);}
  .people-grid-photo{width:100%;aspect-ratio:1/1;object-fit:cover;display:block;background:var(--surface-sunken);}
  .people-grid-photo img{width:100%;height:100%;object-fit:cover;display:block;}
  .people-grid-photo.icon-fallback{display:flex;align-items:center;justify-content:center;color:#9C9C9C;}
  .people-grid-name{padding:10px 12px 0;font-size:15px;font-weight:700;color:#F2F2F2;line-height:1.25;}
  .people-grid-meta{padding:2px 12px 12px;font-size:12px;color:#9C9C9C;}
  .verse-card{position:relative;}
  /* 4-segment mastery indicator, top-right corner of every verse card —
     replaces the old uppercase status tag inside .tag-row so mastery
     reads at a glance without competing with the topic pills for space. */
  .mastery-bar{position:absolute;top:14px;right:16px;display:flex;gap:3px;}
  .mastery-seg{width:10px;height:4px;border-radius:2px;background:var(--surface-sunken);}
  .mastery-seg.filled{background:var(--sage);}
  .verse-card .ref{font-size:12px;color:var(--gold-deep);font-weight:600;letter-spacing:.02em;margin-bottom:6px;padding-right:52px;}
  /* Scripture text (Home, Verse Details, Practice Cards) — text-base by
     default (compact list/chapter-reading cards); Verse Detail's own
     standalone quote bumps this to text-xl via an inline style, since
     that's the one "hero/standalone quote" context this class renders. */
  .verse-card .text{font-family:var(--font-display);font-weight:500;font-size:var(--text-base);line-height:1.45;color:var(--text-primary);}
  .tag-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;}
  /* Unified badge system (rule 3): gold = primary action / urgency, sage =
     progress / mastery, tan = plain metadata. Replaces the old single
     `.tag` (sage-only) + `.tag.plum` (doing two unrelated jobs — see
     DATA_MODEL.md §29 for why that got split rather than recolored). */
  /* Verse status badges (Mastered/Due today/Seedling etc.) get the
     eyebrow type scale — size, weight, letter-spacing, caps — but keep
     each variant's own color below rather than a single accent color,
     since that gold/sage/tan split is meaningful (rule 3 above) and
     collapsing it to one color would erase the distinction. */
  .tag{font-size:var(--text-xs);font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:4px 11px;border-radius:100px;}
  .tag--gold{background:var(--gold-wash);color:var(--gold-deep);}
  .tag--sage{background:var(--sage-wash);color:var(--sage);}
  .tag--tan{background:var(--tan-wash);color:var(--tan-deep);}
  /* Soft, lowercase hashtag-style topic pills on verse cards — a scoped
     variant, NOT a change to `.tag` itself, which stays the uppercase
     eyebrow badge everywhere else (see the comment above, DATA_MODEL.md
     §85). Lower weight/no caps/no letter-spacing reads as a quieter,
     more casual label than the status badges next to it. */
  .tag--pill{font-size:var(--text-xs);font-weight:500;letter-spacing:0;text-transform:none;padding:4px 10px;border-radius:100px;background:var(--surface-sunken);color:var(--ink-soft);}
  .app-icon{display:inline-flex;vertical-align:middle;flex-shrink:0;}
  /* Standardized small inline-SVG icon component (2026-09-18) — a
     second, separate icon system from .app-icon above. That one always
     reads `currentColor` so it can sit inside any already-colored text
     (a badge, a button); these four instead carry their own fixed
     accent color each (bronze or emerald) matching the specific badges
     they replace, per spec (see uiIcon() below). Default 14x14 sizing
     for the "eyebrow/chip" contexts this was written for; uiIcon()'s
     own size param overrides it via inline style for the one context
     (a character's avatar-box fallback icon) that needs it larger. */
  .ui-inline-icon{display:inline-block;vertical-align:middle;width:14px;height:14px;flex-shrink:0;}
  .empty{text-align:center;padding:40px 20px;color:var(--ink-soft);}
  .empty i{font-size:38px;color:var(--ink-faint);margin-bottom:10px;display:block;}
  .empty .cta{margin-top:14px;}

  /* Home v6 — greeting + streak header, a media-heavy Verse of the Day
     hero, and a shared "discovery card" row format reused for Unreached
     of the Day and Story of the Day (DATA_MODEL.md §8, item 82). Real
     photos/illustrations aren't wired up everywhere yet (Unsplash needs
     a key; Story illustrations don't exist at all) — placeholderArt() in
     JS generates a small hue-seeded inline-SVG placeholder so the layout
     can be judged now, swapped for real media later without touching
     any markup. */
  .home-greet-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;gap:10px;}
  /* Screen headings & greetings share the h1 scale (text-2xl/700). */
  .home-greet{font-family:var(--font-sans);font-size:var(--text-2xl);font-weight:700;color:var(--text-primary);letter-spacing:-.01em;}
  .home-greet-sub{font-size:var(--text-sm);font-weight:400;color:var(--text-secondary);line-height:1.4;margin-top:2px;}
  /* Was an orange/red flame gradient — decorative brand color, not a
     functional state, so it converts under the black-and-white pass
     (item 123) same as everything else in this category. */
  .streak-badge{
    display:flex;align-items:center;gap:5px;flex-shrink:0;
    background:var(--gold-deep);
    color:#121212;font-size:13px;font-weight:700;
    padding:7px 12px;border-radius:999px;box-shadow:0 2px 10px rgba(255,255,255,.2);
  }
  .streak-badge i{font-size:16px;}

  /* .votd-hero is this card's actual class name (renamed from .votd-card
     in the v6 redesign) — kept as-is rather than renamed again here,
     since it's referenced from renderVerseOfTheDayCard() in JS too. */
  .votd-hero{
    position:relative;overflow:hidden;padding:26px 20px 20px;margin-bottom:14px;
    background-size:cover;background-position:center 35%;min-height:220px;
    display:flex;flex-direction:column;justify-content:flex-end;
    border:none;border-radius:24px;
  }
  /* Brightened (2026-09-17) — was rgba(20,15,12,.2 -> .85), noticeably
     darkening the photo top-to-bottom. Lighter stops let the actual
     image read clearly while still keeping the bottom third dark enough
     for the (still-white) text over it to stay legible; text-shadow
     below was strengthened slightly to compensate. */
  .votd-hero::before{
    content:'';position:absolute;inset:0;
    background:linear-gradient(180deg, rgba(20,15,12,.05) 0%, rgba(20,15,12,.65) 100%);
  }
  .votd-hero > *{position:relative;z-index:1;}
  .votd-label{display:flex;align-items:center;gap:6px;font-size:var(--text-xs);font-weight:700;color:var(--text-accent);letter-spacing:.05em;text-transform:uppercase;margin-bottom:12px;}
  /* Font switched from the italic Fraunces serif to a clean sans
     (2026-09-17, owner's request) — this was the one remaining place in
     the app still using the display serif at all (see item 85's own
     note that Fraunces was already scoped down to just this card and
     two Practice-verse contexts). */
  .votd-text{font-family:var(--font-sans);font-style:normal;font-size:var(--text-xl);font-weight:600;line-height:1.4;color:#FFFFFF;margin-bottom:10px;text-shadow:0 1px 8px rgba(0,0,0,.5);}
  .votd-ref{font-size:13px;font-weight:600;color:var(--text-accent);margin-bottom:14px;}
  /* "Read chapter" CTA — the spec's .btn-read-chapter, kept as the
     existing .votd-action selector (referenced from JS) rather than
     renamed, styled to the requested frosted-glass look. */
  /* Primary CTA button text (also see .practice-nudge below). */
  .votd-action{
    display:inline-flex;align-items:center;gap:6px;align-self:flex-start;
    background:rgba(255,255,255,.15);backdrop-filter:blur(8px);
    border:1px solid rgba(255,255,255,.2);
    color:#FFF;font-size:var(--text-base);font-weight:600;padding:8px 14px;border-radius:999px;
    margin-top:16px;
  }
  .votd-attribution{font-size:10px;color:rgba(255,255,255,.55);margin-top:10px;}
  .votd-attribution a{color:inherit;text-decoration:underline;}

  /* Discover tab: "Featured Today" (2026-09-18, item 140) — a story
     hero (same "background photo + bottom gradient + overlaid text"
     shape .votd-hero already established, just its own shorter height
     and this request's own literal spec values) and a person row card,
     both above the existing four hub cards. */
  .discover-featured-story{
    position:relative;overflow:hidden;height:180px;border-radius:20px;margin-bottom:12px;
    background-size:cover;background-position:center;
    display:flex;flex-direction:column;justify-content:flex-end;padding:16px 18px;cursor:pointer;
  }
  .discover-featured-story::before{
    content:'';position:absolute;inset:0;
    background:linear-gradient(180deg, rgba(18,18,18,.2) 0%, rgba(18,18,18,.9) 100%);
  }
  .discover-featured-story-eyebrow{position:relative;display:flex;align-items:center;gap:6px;font-size:11px;font-weight:700;color:#F2F2F2;letter-spacing:.05em;text-transform:uppercase;margin-bottom:6px;}
  .discover-featured-story-title{position:relative;font-size:18px;font-weight:700;color:#F2F2F2;margin-bottom:4px;}
  .discover-featured-story-ref{position:relative;font-size:13px;color:#9C9C9C;}
  .discover-featured-person{
    display:flex;align-items:center;gap:14px;
    background:#1A1A1A;border:1px solid #2A2A2A;border-radius:20px;
    padding:14px 16px;margin-bottom:20px;cursor:pointer;
  }
  .discover-featured-person-avatar{width:60px;height:60px;border-radius:50%;border:1.5px solid #F2F2F2;object-fit:cover;flex-shrink:0;background:var(--surface-sunken);display:flex;align-items:center;justify-content:center;color:#9C9C9C;}
  .discover-featured-person-eyebrow{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:700;color:#F2F2F2;letter-spacing:.05em;text-transform:uppercase;margin-bottom:4px;}
  .discover-featured-person-name{font-size:16px;font-weight:700;color:#F2F2F2;margin-bottom:2px;}
  .discover-featured-person-meta{font-size:13px;color:#9C9C9C;}

  /* Shared compact row card — text on the left, rectangular thumbnail on
     the right edge. Used for Unreached of the Day and Story of the Day. */
  .discovery-card{margin-bottom:12px;}
  .discovery-card-inner{display:flex;align-items:center;gap:14px;}
  .discovery-text{flex:1;min-width:0;}
  .discovery-label{display:flex;align-items:center;gap:6px;font-size:var(--text-xs);font-weight:700;letter-spacing:.05em;text-transform:uppercase;margin-bottom:6px;color:var(--text-accent);}
  .discovery-card h3{font-size:var(--text-lg);font-weight:600;line-height:1.3;margin-bottom:3px;}
  .discovery-meta,.discovery-sub{font-size:var(--text-sm);font-weight:400;color:var(--text-secondary);line-height:1.4;margin-bottom:2px;}
  /* Bumped up from 88x68 (2026-09-17, owner's direct request, "make the
     picture a little bigger... that will capture the user's attention")
     — the real generated story illustrations (item 125) made the case
     for it; sized here for both cards sharing this class (Unreached and
     Story of the Day) so the two rows stay visually consistent rather
     than one thumbnail suddenly reading larger than the other. */
  .discovery-thumb-box{
    width:104px;height:80px;flex-shrink:0;border-radius:14px;
    background:var(--surface-sunken);overflow:hidden;
    display:flex;align-items:center;justify-content:center;
  }
  .discovery-thumb{display:block;width:104px;height:80px;border-radius:14px;object-fit:cover;flex-shrink:0;}
  .unreached-full-photo{display:block;width:100%;height:auto;border-radius:var(--radius-card);background:var(--surface-sunken);margin-bottom:16px;}

  /* Word of the Day / This Day in Church History (item 89). Both reuse
     the shared .card surface (var(--paper-raised), var(--radius-card) —
     already 20px — same dark card every other Home card sits on) rather
     than a separate literal color, so Home doesn't end up with two
     slightly different shades of "dark card." Padding bumped to 20px on
     these two specifically, per spec. The eyebrow style is the same
     text-xs/700/uppercase/--text-accent pattern .votd-label/.discovery-
     label already use, shared here as .word-eyebrow. */
  .word-card{padding:20px;}
  .word-eyebrow{display:flex;align-items:center;gap:6px;font-size:var(--text-xs);font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--text-accent);margin-bottom:12px;}
  .word-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:4px;}
  .word-script{font-family:var(--font-display);font-size:24px;font-weight:600;color:var(--text-primary);}
  .word-translit{font-size:var(--text-base);font-weight:500;color:var(--text-secondary);font-style:italic;}
  .word-strongs{font-size:var(--text-xs);font-weight:600;color:var(--text-accent);margin-bottom:8px;}
  .word-meaning{font-size:var(--text-sm);font-weight:600;color:var(--text-primary);margin-bottom:4px;}
  .word-summary{font-size:var(--text-sm);font-weight:400;color:var(--text-secondary);line-height:1.4;}
  .word-card .tag-row{margin-top:12px;}

  /* Biblical Fact of the Day (item 116) — card uses this app's existing
     dark-theme tokens throughout. The badge's emerald (a literal,
     scoped exact-hex exception when it shipped) was itself a decorative
     trust-badge color, not a functional game state, so it converts to
     white under the black-and-white pass (item 123) — unlike the
     visually-identical #10B981 used elsewhere in this file for a
     challenge type's "correct answer" feedback, which stayed green
     (see item 123's own writeup for that distinction). */
  .fact-of-the-day-card{position:relative;padding-bottom:34px;}
  .fact-of-the-day-card h3{margin-bottom:6px;}
  .fact-preview{font-size:var(--text-sm);color:var(--text-secondary);line-height:1.5;}
  /* Reverted to its original emerald (item 116) — explicitly given again
     here as a literal hex in this request's own shield-icon spec
     (stroke="#10B981"), so this is a deliberate, scoped exception to the
     black-and-white pass (item 123), not a silent reopening of it: a
     green icon sitting on a now-white-labeled chip would read as a
     visual mismatch/mistake rather than the coherent "Verified Source"
     signal this badge exists to be. .fact-drawer-sources-label (the
     matching label inside the drawer) was never converted in the first
     place, so it already reads #10B981 — this brings the card-level
     chip back in line with it. */
  .fact-verified-badge{
    position:absolute;right:16px;bottom:14px;
    display:inline-flex;align-items:center;gap:4px;
    color:#10B981;background:rgba(16,185,129,.1);border:1px solid rgba(16,185,129,.2);
    border-radius:100px;padding:2px 8px;font-size:11px;font-weight:600;
  }
  .fact-verified-badge i{font-size:13px;}

  /* This app's first bottom-sheet drawer — see the comment above
     renderFactDrawer() for why a full screen (this app's existing
     detail-page precedent) wasn't used instead this time. */
  .fact-drawer-backdrop{
    position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:20;
    animation:fadeIn .2s ease;
  }
  @keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
  .fact-drawer{
    position:fixed;left:0;right:0;bottom:0;z-index:21;max-width:480px;margin:0 auto;
    background:var(--paper-raised);border:1px solid rgba(255,255,255,.08);border-bottom:none;
    border-radius:20px 20px 0 0;box-shadow:0 -8px 30px rgba(0,0,0,.4);
    padding:10px 20px calc(20px + env(safe-area-inset-bottom));
    max-height:82vh;overflow-y:auto;
    animation:slideUpSheet .25s cubic-bezier(.2,.8,.3,1);
  }
  @keyframes slideUpSheet{from{transform:translateY(100%);}to{transform:translateY(0);}}
  .fact-drawer-handle{width:36px;height:4px;background:var(--line);border-radius:2px;margin:6px auto 14px;}
  .fact-drawer-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
  .fact-drawer-title{margin-bottom:10px;}
  .fact-drawer-text{font-size:16px;color:var(--text-primary);line-height:1.6;margin-bottom:14px;}
  .fact-drawer-ref{
    display:flex;align-items:center;gap:8px;font-size:var(--text-sm);font-weight:600;color:var(--gold-deep);
    margin-bottom:16px;
  }
  .fact-drawer-sources{
    background:var(--surface-sunken);border-radius:var(--radius-ctl);padding:12px 14px;margin-bottom:18px;
  }
  .fact-drawer-sources-label{
    display:flex;align-items:center;gap:6px;font-size:var(--text-xs);font-weight:700;letter-spacing:.03em;
    text-transform:uppercase;color:#10B981;margin-bottom:8px;
  }
  .fact-drawer-source{font-size:var(--text-sm);color:var(--text-secondary);line-height:1.5;margin-bottom:4px;}
  .fact-drawer-source:last-child{margin-bottom:0;}

  .practice-nudge{
    display:flex;align-items:center;justify-content:center;gap:6px;
    text-align:center;font-size:var(--text-base);font-weight:600;color:var(--gold-deep);
    background:var(--paper-raised);border:1px solid rgba(255,255,255,.06);
    border-radius:var(--radius-ctl);padding:13px 0;margin-top:4px;cursor:pointer;
  }
  .practice-nudge i{font-size:17px;}

  /* buttons */
  .btn{
    border:none;
    background:var(--surface-sunken);
    color:var(--ink);
    border-radius:var(--radius-ctl);
    padding:11px 16px;
    font-size:14px;
    font-weight:500;
    display:inline-flex;
    align-items:center;
    gap:6px;
  }
  /* Primary CTA buttons get the larger text-base/600 pair (secondary/
     ghost/utility buttons keep the smaller base .btn size above). */
  /* Dark text on the (now white/off-white) accent background — #241900
     was tuned to pair with the old amber; #121212 (2026-09-21, neutral
     — was #141210, a warm near-black left over from the old bronze
     Practice-exercise palette this shared button never actually needed)
     matches the app's own true black-and-white direction instead. */
  .btn.primary{background:var(--gold);color:#121212;box-shadow:0 6px 16px var(--gold-shadow);font-size:var(--text-base);font-weight:600;}
  .btn.primary:active{background:var(--gold-deep);}
  .btn.ghost{background:transparent;color:var(--ink-soft);}
  .btn.block{width:100%;justify-content:center;padding:13px;}
  .btn.sage{background:var(--sage);color:#fff;}
  .btn:disabled{opacity:.45;}

  /* forms */
  label{font-size:13px;color:var(--ink-soft);display:block;margin:14px 0 6px;}
  label:first-child{margin-top:0;}
  input[type=text],textarea,select{
    width:100%;
    border:1px solid transparent;
    background:var(--surface-sunken);
    border-radius:var(--radius-ctl);
    padding:11px 12px;
    font-size:15px;
    font-family:'Inter',sans-serif;
    color:var(--ink);
  }
  textarea{min-height:80px;resize:vertical;font-family:'Inter',sans-serif;font-size:15px;line-height:1.5;}
  input:focus,textarea:focus,select:focus{outline:2px solid var(--gold);outline-offset:1px;}

  /* nav — floating glassmorphism capsule (2026-09-17, precise re-spec
     of the last two same-day passes). Exact spec values throughout;
     `.floating-nav-container`/`.bottom-nav`/`.nav-item` named in the
     request don't exist in this file — applied to the real `.navbar`/
     `.navitem` markup instead. Centering switched from the previous
     pass's `left/right:16px;margin:0 auto` to this spec's own
     `left:50%;transform:translateX(-50%)` + fixed `width`/`max-width`,
     a fixed `height:68px` replacing the old content-driven height, and
     `saturate(180%)` added alongside the existing blur.
     env(safe-area-inset-bottom) is layered into `bottom` (not `padding`,
     since this spec gives a single fixed `bottom:24px` rather than a
     padding shorthand) so the pill still clears a notched phone's home
     indicator — on a non-notched device that's a no-op addition to
     exactly the spec's own 24px. */
  .navbar{
    position:fixed;bottom:calc(24px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);
    width:calc(100% - 32px);max-width:400px;height:68px;
    background:rgba(26,26,26,.65) !important;
    -webkit-backdrop-filter:blur(24px) saturate(180%) !important;backdrop-filter:blur(24px) saturate(180%) !important;
    border:1px solid rgba(255,255,255,.12);
    border-radius:100px;
    padding:6px 12px;
    display:flex;align-items:center;justify-content:space-around;
    z-index:1000;
    box-shadow:var(--shadow-nav);
  }
  /* The active state highlights the WHOLE tab (icon + label together,
     full pill height) — a real structural change from the previous two
     passes' small icon-only chip (`.dot`), matching this spec's own
     "Active Item" block naming the button itself, not a child element.
     `.dot` is kept in the markup purely as a flex-centering wrapper
     around the icon now; it never carries its own background here. */
  .navbar .navitem{
    flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:4px;height:100%;background:transparent;color:#9C9C9C;border:none;
    border-radius:100px;cursor:pointer;transition:all .2s ease;
  }
  .navbar .navitem .dot{display:flex;align-items:center;justify-content:center;}
  /* Tabler's icon-font glyphs (this app's existing nav-icon system —
     see item 107) don't have literal SVG stroke/fill properties the way
     the spec's own icon markup implies; `color` on the glyph is this
     system's equivalent, sized to match the given 22px. Not swapping
     the whole nav to inline-SVG icons for this — a much bigger change
     than a color-and-size fix, and unasked for. */
  .navbar .navitem i{font-size:22px;color:#9C9C9C;}
  .navbar .navitem span{font-size:11px;font-weight:500;}
  .navbar .navitem.active{background:rgba(255,255,255,.14) !important;color:#FFFFFF !important;}
  .navbar .navitem.active i{color:#FFFFFF !important;}
  .navbar .navitem.active span{color:#FFFFFF !important;font-weight:600;font-size:11px;}

  /* avatar */
  .avatar{
    width:46px;height:46px;border-radius:13px;overflow:hidden;
    display:flex;align-items:center;justify-content:center;
    background:var(--tan-wash);color:var(--tan-deep);font-size:22px;flex-shrink:0;
  }
  /* Real portraits (item 91) — an <img> swapped in for the icon by
     charAvatarInner()/charPortraitUrl() wherever a character has one;
     fills the same box the icon used to, whichever avatar class it is. */
  .avatar img,.list-avatar img{display:block;width:100%;height:100%;object-fit:cover;}
  .char-row{display:flex;align-items:center;gap:12px;}
  .char-row .meta{font-size:var(--text-sm);font-weight:400;color:var(--text-secondary);line-height:1.4;margin-top:2px;}

  /* list rows (rule 4) — borderless, hairline-divided, for book/people
     browsers. Cards stay reserved for hero metrics and featured content
     (verse cards, stat cards) per the same rule. */
  .list-row{display:flex;align-items:center;gap:13px;padding:13px 2px;border-bottom:1px solid var(--line);}
  .list-row:last-child{border-bottom:none;}
  .list-row .list-avatar{width:40px;height:40px;border-radius:12px;overflow:hidden;background:var(--tan-wash);color:var(--tan-deep);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:18px;}
  /* Card & section titles — book/character names in list rows. */
  .list-row .name{font-family:var(--font-sans);font-weight:600;font-size:var(--text-lg);line-height:1.3;color:var(--text-primary);}
  .list-row .meta{font-size:var(--text-sm);font-weight:400;color:var(--text-secondary);line-height:1.4;margin-top:1px;}
  .list-row .chev{margin-left:auto;color:var(--ink-faint);flex-shrink:0;}

  /* topics grid — colorful per-topic cards (v3, YouVersion-inspired) */
  .topic-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:8px;}
  .topic-card{
    position:relative;overflow:hidden;border:none;text-align:left;
    border-radius:var(--radius-card);padding:14px;min-height:104px;
    display:flex;flex-direction:column;justify-content:flex-end;color:#fff;
  }
  .topic-card .topic-card-icon{position:absolute;top:10px;right:10px;font-size:38px;opacity:.35;color:#fff;}
  .topic-card .name{font-family:var(--font-sans);font-weight:600;font-size:var(--text-lg);line-height:1.3;position:relative;}
  /* Topic verse counters are categorized as an eyebrow (size/weight/caps/
     letter-spacing), but keep white-on-opacity rather than --text-accent
     (gold) — these cards sit on arbitrary saturated per-topic backgrounds
     (TOPIC_PALETTE), and gold text wouldn't stay legible on all of them. */
  .topic-card .meta{font-size:var(--text-xs);font-weight:700;letter-spacing:.05em;text-transform:uppercase;opacity:.78;margin-top:2px;position:relative;}

  /* hero header (rule 5) — character/story detail, replacing the old
     screen-head + cramped 56px-avatar card. */
  .hero{background:var(--paper-raised);border:1px solid rgba(255,255,255,.06);border-radius:var(--radius-card);box-shadow:var(--shadow-hero);padding:30px 22px 24px;text-align:center;margin-bottom:22px;}
  .hero-avatar{width:76px;height:76px;border-radius:20px;background:var(--tan-wash);color:var(--tan-deep);display:flex;align-items:center;justify-content:center;margin:0 auto;font-size:30px;}
  /* Full profile portrait (item 91) — replaces .hero-avatar entirely when
     a character has a real generated portrait, rendered above the .hero
     card rather than inside its centered-text padding (same "full-bleed
     image above the info card" shape as .unreached-full-photo). */
  .hero-photo{display:block;width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:var(--radius-card);background:var(--surface-sunken);}
  /* Story Detail hero — rewritten 2026-09-17, third pass on this same
     header (items 128-129 tried a true edge-to-edge bleed via negative
     margins canceling .app's own padding; the owner reported clipping
     and button-overlay problems that didn't resolve even after ruling
     out every caching layer with an incognito load). This version is a
     deliberate simplification per the owner's own exact spec: the
     container just fills its normal column (margin:0, no negative-
     margin edge-bleed trick), a fixed height (320px, not aspect-ratio),
     and dedicated `.carousel-prev`/`.carousel-next` classes instead of
     reusing the character carousel's shared `.hero-nav-btn` — removing
     every moving part the last two passes introduced that could have
     been the actual source of the reported clipping, rather than
     tuning those same mechanisms again. Still rendered for every story
     (`placeholderArt()` fills in for the ~308 without real generated
     art yet, same as before). */
  .story-hero-container{position:relative;width:100%;height:320px;margin:0;padding:0;overflow:hidden;}
  .story-hero-container .story-hero-img{width:100%;height:100%;object-fit:cover;display:block;background:var(--surface-sunken);}
  .story-hero-container::after{
    content:'';position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(180deg, rgba(0,0,0,.3) 0%, rgba(18,18,18,0) 50%, #121212 100%);
  }
  /* Floats the back button over the artwork instead of its own row
     above it — a frosted circular chip, not this app's usual flat
     .back-btn, since it now needs to read against arbitrary photo
     content rather than a flat dark page background. z-index:20, above
     the carousel arrows (10), though the two never actually overlap —
     the back button sits in the top-left corner, the arrows vertically
     centered. */
  .story-hero-back{
    position:absolute;top:16px;left:16px;z-index:20;
    background:rgba(26,26,26,.6);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
    border:1px solid rgba(255,255,255,.15);border-radius:50%;
    width:40px;height:40px;display:flex;align-items:center;justify-content:center;
    color:#FFFFFF;cursor:pointer;
  }
  /* Story-Detail-only prev/next carousel controls — a separate, more
     compact treatment from the character carousel's own .hero-nav-btn
     (36px vs 38px, flatter rgba(0,0,0,.4) vs a bordered chip), not a
     shared class, since this spec gave genuinely different exact
     values rather than asking to reuse the existing one. */
  .carousel-prev,.carousel-next{
    position:absolute;top:50%;transform:translateY(-50%);z-index:10;
    background:rgba(0,0,0,.4);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
    border:none;border-radius:50%;width:36px;height:36px;color:#FFF;
    display:flex;align-items:center;justify-content:center;
  }
  .carousel-prev{left:12px;}
  .carousel-next{right:12px;}
  /* Overlaps the hero's own bottom edge by 30px for a layered look —
     deliberately less overlap than the previous pass's -40px, since
     this container no longer bleeds past .app's side padding the way
     the last version did. */
  .story-title-card{
    position:relative;z-index:15;margin-top:-30px;
    border-top-left-radius:24px;border-top-right-radius:24px;
    background:#1A1A1A;padding:24px 20px;
  }
  /* Visible prev/next controls for the character carousel (replacing an
     earlier blind-swipe-only version on direct feedback) — overlaid on
     the photo itself rather than a separate row, so no new vertical
     space is spent on them. Hidden individually at either end of
     allCharactersOrdered() (adjacentCharacter() returns null there), so
     there's never a dead-end arrow that does nothing when tapped. */
  .hero-photo-wrap{position:relative;margin-bottom:16px;}
  .hero-nav-btn{
    position:absolute;top:50%;transform:translateY(-50%);
    width:38px;height:38px;border-radius:50%;
    background:rgba(0,0,0,.45);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);
    border:1px solid rgba(255,255,255,.25);color:#fff;font-size:18px;
    display:flex;align-items:center;justify-content:center;
  }
  .hero-nav-prev{left:10px;}
  .hero-nav-next{right:10px;}
  .hero h1{font-size:2rem;font-weight:700;margin:12px 0 8px;}
  .hero .tags{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-bottom:10px;}
  .hero .era{font-size:12.5px;color:var(--ink-soft);display:flex;align-items:center;gap:5px;justify-content:center;margin-bottom:14px;}
  .hero p.summary{font-size:13.5px;color:var(--ink-soft);line-height:1.6;text-align:left;}

  /* topic detail hero — colored in the topic's own card color (v3 follow-up) */
  .topic-detail-hero{
    position:relative;overflow:hidden;border-radius:var(--radius-card);
    padding:20px 20px 24px;margin-bottom:18px;color:#fff;
  }
  .topic-detail-hero .back-btn{margin-bottom:34px;box-shadow:none;}
  .topic-detail-hero-icon{position:absolute;top:18px;right:14px;font-size:64px;opacity:.22;color:#fff;}
  .topic-detail-hero h1{position:relative;color:#fff;margin-bottom:8px;}
  .topic-detail-hero p{position:relative;color:rgba(255,255,255,.85);font-size:13.5px;line-height:1.55;margin:0;}

  /* practice */
  .practice-verse{
    font-family:var(--font-display);font-weight:500;font-size:var(--text-base);line-height:1.45;color:var(--text-primary);
  }
  .progress-track{height:5px;background:var(--line);border-radius:4px;overflow:hidden;margin-bottom:22px;}
  .progress-fill{height:100%;background:var(--gold);border-radius:4px;transition:width .3s ease;}
  .result-banner{
    display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:var(--radius-ctl);margin-bottom:16px;font-size:14px;
  }
  .result-banner.good{background:var(--sage-wash);color:var(--sage-deep);}
  .result-banner.bad{background:var(--danger-wash);color:var(--danger);}
  .practice-hint{color:var(--ink-faint);font-size:13px;font-family:'Inter',sans-serif;}

  /* Tap Builder challenge (2026-09-17) — its own dark-obsidian/bronze
     component palette, scoped to these classes only, same reasoning as
     the Family Tree feature's own palette: hex-exact values given for
     one specific component, not a request to relitigate the app's
     shared --gold/--sage/--danger tokens used by every other challenge
     type. */
  .target-sentence-box{
    background:#1A1A1A;border:1px solid #2A2A2A;border-radius:16px;
    padding:20px;font-size:18px;line-height:1.6;color:#F2F2F2;
    font-family:var(--font-display);font-weight:500;
  }
  .target-sentence-box.tap-shake{animation:tapShake .3s ease-in-out;}
  @keyframes tapShake{
    0%,100%{transform:translateX(0);} 20%{transform:translateX(-6px);}
    40%{transform:translateX(6px);} 60%{transform:translateX(-4px);} 80%{transform:translateX(4px);}
  }
  .tap-slot{
    display:inline-flex;align-items:center;justify-content:center;
    min-width:60px;min-height:44px;padding:0 6px;margin:2px 0;
    border-bottom:2px dashed #F2F2F2;font-weight:600;color:#F2F2F2;
    vertical-align:middle;
  }
  .tap-slot.tap-slot-filled{cursor:pointer;border-style:solid;color:#F2F2F2;}
  .tap-slot.tap-slot-correct{border-color:#10B981;background:rgba(16,185,129,.15);color:#10B981;border-radius:8px;}
  .tap-slot.tap-slot-wrong{border-color:#EF4444;background:rgba(239,68,68,.12);color:#EF4444;border-radius:8px;}
  .word-bank-grid{display:flex;flex-wrap:wrap;gap:10px;margin:16px 0 20px;}
  .tap-tile{
    background:#232323;border:1px solid #343434;border-radius:12px;
    padding:10px 16px;min-height:44px;font-size:16px;color:#F2F2F2;
    font-family:'Inter',sans-serif;font-weight:500;cursor:pointer;transition:all .15s ease;
  }
  .tap-tile:active{transform:scale(.95);background:#2A2A2A;}
  .tap-builder-check{background:#F2F2F2 !important;color:#121212 !important;box-shadow:none !important;padding:16px !important;min-height:44px;}

  /* First-Letter Sprint challenge (2026-09-17) — same scoped dark-
     obsidian/bronze palette as Tap Builder, not the shared app tokens. */
  .sprint-text-box{
    background:#1A1A1A;border:1px solid #2A2A2A;border-radius:16px;
    padding:24px;font-size:20px;line-height:1.6;
    font-family:var(--font-display);font-weight:500;
  }
  .sprint-word{display:inline-block;}
  .sprint-word.sprint-done{color:#F2F2F2;}
  .sprint-word.sprint-active{color:#F2F2F2;font-weight:700;border-bottom:2px solid #F2F2F2;}
  .sprint-word.sprint-future{color:#9C9C9C;opacity:.6;}
  .sprint-word.sprint-flash-correct{animation:sprintFlashGood .35s ease;}
  .sprint-word.sprint-flash-wrong{animation:sprintFlashBad .3s ease;}
  @keyframes sprintFlashGood{
    0%{color:#10B981;transform:scale(1.15);}
    100%{color:#F2F2F2;transform:scale(1);}
  }
  @keyframes sprintFlashBad{
    0%,100%{color:#F2F2F2;border-color:#F2F2F2;}
    30%,70%{color:#EF4444;border-color:#EF4444;}
  }
  /* Visually hidden but focusable/typeable — keeps a real text input in
     the DOM for mobile virtual keyboards to attach to (see
     wireFirstLetterSprint()) without it appearing as a text field
     on-screen; opacity/pointer-events rather than display:none, which
     some mobile browsers refuse to focus.
     position:fixed (pinned to the viewport, not the reflowing sentence
     box below it) rather than position:absolute in-flow — a real-device
     report found the page scrolling the verse text out of view on every
     keystroke, because the old absolute-positioned input sat right
     after the sentence box in the DOCUMENT, and each keystroke's
     innerHTML patch (revealing a word) shifted that box's height,
     moving the still-focused input with it — which mobile browsers
     "helpfully" keep scrolled into view, i.e. the page kept re-scrolling
     to chase the input every time it moved. Pinning it to a fixed
     viewport position removes that feedback loop entirely; font-size:16px
     avoids a second, separate cause of the same symptom — iOS Safari
     auto-zooms (and scrolls) the page when focusing any input/textarea
     computed under 16px. */
  .sprint-hidden-input{
    position:fixed;top:0;left:0;opacity:0;width:1px;height:1px;
    font-size:16px;pointer-events:none;border:none;outline:none;
  }
  .sprint-toast{
    display:flex;align-items:center;gap:8px;margin-top:14px;padding:14px 16px;
    background:rgba(242,242,242,.12);border:1px solid #F2F2F2;border-radius:12px;
    color:#F2F2F2;font-weight:600;font-size:15px;
  }

  /* Progressive Vanish challenge (2026-09-17) — same scoped dark-
     obsidian/bronze palette as the other two new challenge types. */
  .vanish-text-box{
    background:#1A1A1A;border:1px solid #2A2A2A;border-radius:16px;
    padding:24px;font-size:20px;line-height:1.7;color:#F2F2F2;
    font-family:var(--font-display);font-weight:500;
  }
  .vanish-word{display:inline-block;}
  .vanish-blank{
    border-bottom:2px dashed #F2F2F2;color:transparent;padding:0 4px;
    min-width:40px;cursor:pointer;
  }
  /* "Hold to Peek" toggles this on the box directly (wireProgressiveVanish()) —
     a pure CSS reveal, no state/render involved, so releasing is instant
     and there's nothing for a background render to race against. */
  .vanish-text-box.peek-all .vanish-blank{border-color:transparent;color:#F2F2F2 !important;}
  .vanish-controls{display:flex;flex-direction:column;gap:10px;}
  .vanish-peek-btn{
    width:100%;justify-content:center;padding:14px 16px;min-height:44px;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation;
  }
  .vanish-next-btn{background:#F2F2F2 !important;color:#121212 !important;box-shadow:none !important;padding:16px !important;min-height:44px;}

  /* Clause Connect challenge (2026-09-17) — same scoped dark-obsidian/
     bronze palette as the other three new challenge types. */
  .clause-instruction{font-size:14px;color:#9C9C9C;margin:0 0 12px;font-family:'Inter',sans-serif;}
  .clause-list-container{margin-bottom:20px;}
  .clause-list-container.clause-shake{animation:tapShake .3s ease-in-out;}
  .clause-card{
    background:#1A1A1A;border:1px solid #2A2A2A;border-radius:14px;
    padding:16px 20px;display:flex;align-items:center;gap:14px;
    margin-bottom:10px;-webkit-user-select:none;user-select:none;
    transition:transform .15s ease,border-color .15s ease;
    min-height:44px;
  }
  .clause-grip{color:#9C9C9C;cursor:grab;touch-action:none;padding:4px;flex-shrink:0;}
  .clause-text{color:#F2F2F2;font-size:15px;line-height:1.5;font-family:var(--font-display);cursor:pointer;}
  .clause-card.clause-dragging{opacity:.85;border-color:#F2F2F2;z-index:2;position:relative;}
  .clause-card.clause-selected{border-color:#F2F2F2;background:rgba(242,242,242,.1);}
  .clause-card.clause-correct{border-color:#10B981;background:rgba(16,185,129,.12);}
  .clause-card.clause-wrong{border-color:#EF4444;background:rgba(239,68,68,.1);}
  .clause-check-btn{background:#F2F2F2 !important;color:#121212 !important;box-shadow:none !important;padding:16px !important;min-height:44px;}

  /* Reference Match challenge (2026-09-17) — same scoped dark-obsidian/
     bronze palette as the other four new challenge types. */
  .match-prompt-card{
    background:#1A1A1A;border:1px solid #2A2A2A;border-radius:16px;
    padding:24px;font-size:18px;line-height:1.6;text-align:center;
    color:#F2F2F2;font-family:var(--font-display);font-weight:500;
  }
  .match-options-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:20px;}
  .match-option-card{
    background:#232323;border:1px solid #343434;border-radius:14px;
    padding:18px 14px;text-align:center;font-size:16px;font-weight:600;
    color:#F2F2F2;cursor:pointer;transition:all .15s ease;
    min-height:44px;display:flex;align-items:center;justify-content:center;
  }
  .match-option-card:active{transform:scale(.96);}
  .match-options-grid.match-locked .match-option-card{cursor:default;pointer-events:none;}
  .match-option-card.match-correct{border-color:#10B981;background:rgba(16,185,129,.15);color:#10B981;}
  .match-option-card.match-wrong{border-color:#EF4444;background:rgba(239,68,68,.15);color:#EF4444;}
  .match-option-card.match-reveal-correct{border-color:#10B981;}

  /* segmented control (practice mode picker) */
  /* overflow-x:auto (rather than a fixed flex:1 grid) since a 5th
     challenge type (Tap Builder) made this too cramped to fit evenly on
     a narrow phone without wrapping "Progressive reveal" mid-word —
     degrades to a horizontally scrollable pill row instead, same
     pattern already used by .practice-filter-tabs. */
  .segmented{display:flex;gap:4px;background:var(--surface-sunken);border-radius:var(--radius-ctl);padding:4px;margin-bottom:12px;overflow-x:auto;}
  .segmented button{
    flex:0 0 auto;white-space:nowrap;border:none;background:transparent;color:var(--ink-soft);
    font-size:13px;font-weight:500;padding:8px 12px;border-radius:9px;
  }
  .segmented button.active{background:var(--gold-wash);color:var(--gold-deep);}

  /* timeline */
  .timeline{position:relative;padding-left:24px;margin-bottom:6px;}
  .timeline::before{content:'';position:absolute;left:5px;top:8px;bottom:8px;width:2px;background:var(--line);border-radius:2px;}
  .tl-item{position:relative;margin-bottom:18px;}
  .tl-item::before{
    content:'';position:absolute;left:-24px;top:4px;width:12px;height:12px;
    border-radius:50%;background:var(--paper);border:2px solid var(--gold);
  }
  .tl-item.tap{cursor:pointer;}
  .tl-item.tap:active .tl-title{color:var(--gold-deep);}
  .tl-title{font-family:'Inter',sans-serif;font-size:15px;font-weight:600;color:var(--ink);line-height:1.35;}
  .tl-ref{font-size:11px;color:var(--gold-deep);font-weight:600;margin-top:2px;letter-spacing:.02em;}
  .tl-age{color:var(--ink-faint);font-weight:400;}
  .tl-desc{font-size:14px;color:var(--ink-soft);line-height:1.5;margin-top:5px;}

  /* family tree (item 110, rendering overhaul v2 2026-09-16) — a
     deliberately distinct warm bronze/dark palette scoped ONLY to this
     feature's own classes (never the shared --gold/--paper-raised
     tokens), per an explicit, hex-exact design spec for this component
     specifically — not a relitigation of the app-wide v3 dark theme
     (see "Visual direction" in CLAUDE.md). */
  .tree-viewport{
    position:relative;overflow:hidden;touch-action:none;
    border-radius:var(--radius-card);border:1px solid rgba(255,255,255,.06);
    height:min(60vh, 480px);
    background-color:#141210;
    background-image:
      radial-gradient(circle at 50% 40%, rgba(198, 146, 85, 0.08) 0%, transparent 65%),
      radial-gradient(rgba(255, 255, 255, 0.07) 1px, transparent 1px);
    background-size:100% 100%, 24px 24px;
  }
  .tree-canvas{position:relative;transform-origin:0 0;}
  .tree-edges-svg{position:absolute;top:0;left:0;pointer-events:none;overflow:visible;}
  .tree-legend{
    position:absolute;top:10px;left:50%;transform:translateX(-50%);z-index:2;
    display:flex;flex-wrap:wrap;justify-content:center;gap:12px;
    background:rgba(28,25,23,.85);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
    border:1px solid #2E2925;border-radius:100px;padding:6px 16px;
    font-size:12px;color:#A39B92;max-width:calc(100% - 24px);
  }
  .tree-legend span{display:inline-flex;align-items:center;gap:6px;white-space:nowrap;}
  .tree-legend-line{display:inline-block;width:14px;height:2px;border-radius:1px;background:#F5F2ED;}
  .tree-legend-dash{opacity:.65;}
  .tree-node-card{
    position:absolute;
    background:#1C1917;border:1px solid #2E2925;border-radius:16px;
    padding:10px 14px;display:flex;align-items:center;gap:12px;
    cursor:pointer;transition:all .2s ease;
  }
  .tree-node-card:active{transform:scale(.97);}
  .tree-node-card.active{
    border-color:#F5F2ED;background:#26221F;box-shadow:0 0 16px rgba(245,242,237,.25);
  }
  .tree-avatar{
    width:40px;height:40px;border-radius:50%;flex-shrink:0;overflow:hidden;
    border:1.5px solid #F5F2ED;background:#2E2925;
    display:flex;align-items:center;justify-content:center;color:#A39B92;font-size:18px;
  }
  .tree-avatar img{width:100%;height:100%;object-fit:cover;}
  .tree-node-info{min-width:0;flex:1;}
  .tree-node-name{
    font-size:15px;font-weight:600;color:#F5F2ED;line-height:1.2;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .tree-node-sub{
    font-size:12px;color:#A39B92;margin-top:2px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }

  /* timeline drag-order game */
  .tl-drag-track{display:flex;flex-direction:column;gap:8px;margin-bottom:4px;}
  .tl-drag-item{
    display:flex;align-items:center;gap:10px;
    background:var(--paper-raised);border:1px solid rgba(255,255,255,.06);
    border-radius:var(--radius-ctl);padding:12px 14px;
    touch-action:none;-webkit-user-select:none;user-select:none;
    transition:box-shadow .15s ease,border-color .2s ease,background .2s ease;
  }
  .tl-drag-item[data-draggable="1"]{cursor:grab;}
  .tl-drag-item.dragging{position:relative;z-index:5;box-shadow:var(--shadow-hero);cursor:grabbing;transition:none;}
  .tl-drag-handle{color:var(--ink-faint);font-size:18px;flex-shrink:0;}
  .tl-drag-body{flex:1;min-width:0;}
  .tl-drag-check{color:var(--gold-deep);font-size:18px;flex-shrink:0;}
  .tl-drag-item.tl-drag-correct{
    border-color:var(--gold);background:var(--gold-wash);
    box-shadow:0 0 0 1px var(--gold),0 0 16px var(--gold-shadow);
  }
  .tl-drag-item.tl-drag-wrong{border-color:var(--danger);}

  /* browse / search */
  .search-wrap{position:relative;margin-bottom:14px;}
  .search-wrap i{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--ink-faint);font-size:18px;}
  .search-wrap input{padding-left:38px;}
  .crumbs{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:13px;color:var(--ink-soft);margin-bottom:12px;}
  .crumbs button{border:none;background:none;color:var(--gold-deep);font-size:13px;font-weight:500;padding:0;}
  .chapter-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(54px,1fr));gap:8px;}
  .chapter-cell{
    background:var(--surface-sunken);border:1px solid transparent;border-radius:var(--radius-ctl);
    padding:12px 4px;font-family:'Inter',sans-serif;font-weight:600;font-size:15px;color:var(--ink);
  }
  .chapter-cell:active{border-color:var(--gold);}
  .result-count{font-size:12px;color:var(--ink-faint);margin-bottom:10px;}
  .card-actions{display:flex;justify-content:flex-end;margin-top:10px;}
  .in-library{font-size:12px;color:var(--sage-deep);display:inline-flex;align-items:center;gap:4px;}
  /* Continuous-flow chapter reader (item 148) — a YouVersion-style read
     instead of one card per verse. font-family/size/line-height match
     .verse-card .text's own reading-copy treatment, just without a card
     boundary per verse. */
  .chapter-reader{
    font-family:var(--font-sans);font-size:17px;line-height:1.85;
    color:var(--text-primary);margin-bottom:100px;padding:4px 2px;
  }
  .reader-vnum{font-size:11px;font-weight:700;color:var(--ink-faint);vertical-align:text-top;margin-right:1px;}
  .reader-verse{cursor:pointer;border-radius:4px;box-decoration-break:clone;-webkit-box-decoration-break:clone;}
  .reader-verse.reader-verse-highlighted{background:rgba(255,255,255,.14);}
  .reader-verse.reader-verse-selected{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:4px;}
  /* Fixed above the bottom nav rather than anchored to the tapped verse
     — a floating tooltip positioned near arbitrary inline text has real
     edge-of-screen/line-wrap failure modes on a phone; a fixed toolbar
     doesn't, and this app already has a fixed-pill nav bar precedent to
     match the look of. */
  .reader-toolbar{
    position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom));
    transform:translateX(-50%);z-index:1001;
    display:flex;gap:4px;background:rgba(26,26,26,.92);
    -webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);
    border:1px solid rgba(255,255,255,.12);border-radius:20px;
    padding:8px;box-shadow:var(--shadow-nav);
  }
  .reader-toolbar button{
    display:flex;flex-direction:column;align-items:center;gap:3px;
    background:none;border:none;color:#F2F2F2;font-size:11px;font-weight:500;
    padding:6px 14px;border-radius:14px;cursor:pointer;font-family:var(--font-sans);
  }
  .reader-toolbar button:active{background:rgba(255,255,255,.1);}
  .reader-toolbar button[disabled]{opacity:.5;}
  .reader-toast{
    position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom));
    transform:translateX(-50%);z-index:1002;
    background:#F2F2F2;color:#121212;font-size:13px;font-weight:600;
    padding:10px 18px;border-radius:100px;box-shadow:var(--shadow-nav);
  }

  /* header w/ back */
  .screen-head{display:flex;align-items:center;gap:10px;margin-bottom:18px;}
  .back-btn{width:36px;height:36px;border-radius:10px;border:1px solid rgba(255,255,255,.06);background:var(--paper-raised);box-shadow:var(--shadow-pop);display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--ink);}
  /* Home header's settings button only — larger, frosted, distinct from
     the plain .back-btn used everywhere else for navigation. */
  .home-settings-btn{
    width:42px;height:42px;border-radius:12px;
    background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.1);
    box-shadow:none;display:flex;align-items:center;justify-content:center;
  }
  .home-settings-btn i{width:22px;height:22px;font-size:22px;line-height:22px;}
  .err{color:var(--danger);font-size:13px;margin-top:6px;}
  .field-hint{font-size:var(--text-sm);font-weight:400;color:var(--text-secondary);line-height:1.4;margin-top:4px;}

  /* ---------- tactile micro-interactions (2026-09-09) ----------
     A springy press-down on every tappable surface — buttons, practice
     chips, nav items, tappable cards/rows, chapter cells. One shared rule
     rather than touching each component's own block. */
  .btn, .navitem, .card.tap, .list-row.tap, .chapter-cell, .back-btn, .topic-card, .hero-nav-btn{
    transition: transform .15s cubic-bezier(.34,1.56,.64,1);
  }
  .btn:active, .navitem:active, .card.tap:active, .list-row.tap:active, .chapter-cell:active, .back-btn:active, .topic-card:active{
    transform: scale(.96);
  }
  /* .hero-nav-btn already carries translateY(-50%) for vertical centering
     (see .hero-nav-btn above) — its own :active rule combines both
     transforms instead of using the shared rule above, which would
     otherwise wipe out the centering and make the button jump on press. */
  .hero-nav-btn:active{transform:translateY(-50%) scale(.9);}

  /* ---------- Practice hero: linear daily-goal progress bar (2026-09-17,
     item 120) — replaced the earlier circular goal ring (owner: "replace
     the circular SVG progress ring with a full-width linear progress bar
     container"). Exact spec values; scoped to its own classes rather than
     the shared --gold/--sage tokens, same reasoning as every other
     hex-exact challenge-type palette this session. ---------- */
  .practice-progress-container{margin-bottom:4px;}
  .practice-progress-row{display:flex;align-items:baseline;justify-content:space-between;}
  .practice-progress-label{font-size:12px;color:#9C9C9C;letter-spacing:.05em;font-weight:600;}
  .practice-progress-count{font-size:14px;color:#F2F2F2;font-weight:600;}
  .practice-progress-track{height:8px;background:#232323;border-radius:100px;overflow:hidden;margin:8px 0 20px;}
  .practice-progress-fill{height:100%;background:linear-gradient(90deg,#F2F2F2,#FFFFFF);border-radius:100px;transition:width .3s ease;}

  /* ---------- Practice hero: 2x3 exercise-mode grid (item 120) — replaced
     the horizontally-scrolling .segmented challenge-type picker. Its own
     scoped palette, same reasoning as the progress bar above. ---------- */
  .mode-tile-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:20px;}
  .mode-tile{
    background:#1A1A1A;border:1px solid #2A2A2A;border-radius:14px;
    padding:12px 14px;text-align:left;cursor:pointer;transition:all .2s ease;
    min-height:44px;
  }
  .mode-tile .app-icon{color:#9C9C9C;width:18px;height:18px;display:block;}
  .mode-tile-title{font-size:14px;font-weight:600;color:#F2F2F2;margin-top:6px;}
  .mode-tile-subtext{font-size:11px;color:#9C9C9C;margin-top:2px;}
  /* Reverted from item 121's bronze active-tile treatment the same day
     ("our theme for the app is black and white") — back to the shared
     --gold-deep/--gold-wash tokens (white) instead of a scoped bronze
     exception, matching the nav's own reversal above. */
  .mode-tile.active-mode-tile{border:1.5px solid var(--gold-deep);background:var(--gold-wash);}
  .mode-tile.active-mode-tile .app-icon{color:var(--gold-deep);}

  /* ---------- Practice screen: hero card, compact stats strip, filter tabs ---------- */
  .practice-hero-card{background:var(--paper-raised);border:1px solid rgba(255,255,255,.06);border-radius:var(--radius-card);box-shadow:var(--shadow-card);padding:20px 16px 16px;margin-bottom:16px;}
  .practice-stats-strip{display:flex;align-items:center;gap:6px;flex-wrap:wrap;background:var(--surface-sunken);border-radius:var(--radius-ctl);padding:10px 14px;margin-bottom:20px;font-size:var(--text-sm);color:var(--ink-soft);}
  .practice-stats-strip .stat-sep{color:var(--ink-faint);}
  .practice-stats-strip strong{color:var(--ink);font-weight:700;}
  .practice-stats-strip .app-icon{margin-right:2px;}
  .practice-filter-tabs{position:sticky;top:0;z-index:2;display:flex;gap:6px;background:var(--paper);padding:2px 0 12px;margin:-2px 0 6px;overflow-x:auto;}
  .practice-filter-tabs button{flex-shrink:0;font-size:var(--text-sm);font-weight:600;color:var(--ink-soft);background:var(--surface-sunken);border:none;border-radius:100px;padding:7px 14px;cursor:pointer;transition:background .15s ease,color .15s ease;}
  .practice-filter-tabs button.active{background:var(--gold-wash);color:var(--gold-deep);}

  /* ---------- session-complete celebration ---------- */
  @keyframes slideUp{from{opacity:0;transform:translateY(24px);}to{opacity:1;transform:translateY(0);}}
  @keyframes bounceIn{0%{opacity:0;transform:scale(.3);}55%{opacity:1;transform:scale(1.15);}100%{transform:scale(1);}}
  @keyframes statIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
  @keyframes spark{
    0%{opacity:1;transform:translate(-50%,-50%) rotate(var(--angle)) translateY(0) scale(1);}
    100%{opacity:0;transform:translate(-50%,-50%) rotate(var(--angle)) translateY(calc(-1 * var(--dist))) scale(.3);}
  }
  .complete-card{position:relative;text-align:center;padding:32px 16px 28px;overflow:hidden;animation:slideUp .35s cubic-bezier(.34,1.56,.64,1) both;}
  .complete-icon{font-size:40px;color:var(--gold-deep);display:inline-block;animation:bounceIn .5s cubic-bezier(.34,1.56,.64,1) both;}
  .sparks{position:absolute;inset:0;pointer-events:none;}
  .spark{position:absolute;top:50%;left:50%;width:var(--size);height:var(--size);background:var(--spark-color,var(--gold));border-radius:50%;animation:spark .7s ease-out both;}
  .complete-stats{display:flex;gap:10px;justify-content:center;margin-top:18px;}
  .complete-stat{background:var(--surface-sunken);border-radius:var(--radius-ctl);padding:14px 20px;min-width:96px;opacity:0;animation:statIn .4s ease-out both;}
  .complete-stat .num{font-family:'Inter',sans-serif;font-size:22px;font-weight:700;letter-spacing:-.01em;}
  .complete-stat .lbl{font-size:11px;color:var(--ink-soft);margin-top:2px;}

  /* Respect a real accessibility signal over the fun — every animation
     above is decorative, none of it gates functionality, so disabling it
     costs nothing. */
  @media (prefers-reduced-motion: reduce){
    .btn, .navitem, .card.tap, .list-row.tap, .chapter-cell, .back-btn, .topic-card,
    .complete-card, .complete-icon, .spark, .complete-stat, .practice-progress-fill{
      animation: none !important;
      transition: none !important;
    }
  }
</style>
</head>
<body>
<div class="app" id="app"></div>

<nav class="navbar">
  <button class="navitem" data-nav="home"><span class="dot"><i class="ti ti-home-2"></i></span><span>Home</span></button>
  <button class="navitem" data-nav="practice"><span class="dot"><i class="ti ti-swords"></i></span><span>Practice</span></button>
  <button class="navitem" data-nav="discover"><span class="dot"><i class="ti ti-compass"></i></span><span>Discover</span></button>
  <button class="navitem" data-nav="study"><span class="dot"><i class="ti ti-sparkles"></i></span><span>Study</span></button>
</nav>

<script>
/* ---------- local-dev storage fallback ----------
   The app persists through window.storage, provided by the Claude runtime.
   When the page is opened from a plain web server / browser that API is
   absent, so fall back to localStorage with the same shape (same origin,
   survives reload, per-browser). Inert inside the Claude runtime. */
if(!window.storage){
  console.info('Rooted: window.storage not found — using localStorage (local dev).');
  window.storage = {
    async get(key){
      try{ const v = localStorage.getItem(key); return v === null ? null : {value:v}; }
      catch(e){ return null; }
    },
    async set(key, value){
      try{ localStorage.setItem(key, value); }
      catch(e){ console.warn('Rooted: localStorage set failed', e); }
    }
  };
}

/* ---------- storage ----------
   Content (verses/topics/characters) and user state (practice progress) are
   stored under separate keys so resetting progress can never destroy content.
   See DATA_MODEL.md §5, §7.
   - rooted-content  : user overlay { verses, topics, characters } merged
                       over the seed by id at load. Seed is source of truth
                       for seed ids; the overlay adds new ids and patches
                       existing ones.
   - rooted-progress : map of verseId -> VerseProgress
   - rooted-sync-meta: { updatedAt } — stamped on every local edit, compared
                       against the cloud copy's updatedAt to decide which
                       side wins on sync (whole-bundle last-write-wins, not
                       per-field — see pullAndMerge() below and
                       DATA_MODEL.md §7.1).
*/
const CONTENT_KEY   = 'rooted-content';
const PROGRESS_KEY  = 'rooted-progress';
const SETTINGS_KEY  = 'rooted-settings';   // per-user preferences (DATA_MODEL.md §7)
const SYNC_META_KEY = 'rooted-sync-meta';  // {updatedAt} for cloud sync (DATA_MODEL.md §7.1)
const LEGACY_KEY    = 'rooted-app-data';   // pre-split single blob; migrated once

let contentTimer = null, progressTimer = null, settingsTimer = null;
let syncMeta = {updatedAt: null};    // local edit clock; compared against the cloud copy
let account = null;                  // {userId, userDetails, identityProvider, userRoles} | null — from /.auth/me
let syncStatus = 'idle';             // 'idle' | 'syncing' | 'synced' | 'error' — for the account bar
let cloudPushTimer = null;
let suppressSyncTouch = false;       // true while pullAndMerge() is writing an *adopted* remote state locally, so that adoption doesn't get mistaken for a fresh local edit and immediately pushed back up
function saveContent(){
  touchSyncMeta();
  clearTimeout(contentTimer);
  contentTimer = setTimeout(async ()=>{
    try{ await window.storage.set(CONTENT_KEY, JSON.stringify(content), false); }
    catch(e){ console.error('content save failed', e); }
  }, 250);
}
function saveProgress(){
  touchSyncMeta();
  clearTimeout(progressTimer);
  progressTimer = setTimeout(async ()=>{
    try{ await window.storage.set(PROGRESS_KEY, JSON.stringify(progress), false); }
    catch(e){ console.error('progress save failed', e); }
  }, 250);
}
function saveSettings(){
  touchSyncMeta();
  clearTimeout(settingsTimer);
  settingsTimer = setTimeout(async ()=>{
    try{ await window.storage.set(SETTINGS_KEY, JSON.stringify(settings), false); }
    catch(e){ console.error('settings save failed', e); }
  }, 250);
}

/* ---------- cloud sync (optional — see DATA_MODEL.md §7.1) ----------
   Local storage (above) is always the fast, offline-capable source of
   truth. Signing in additionally mirrors {content, progress, settings} to
   one Cosmos DB document per user via /api/sync, so the same library and
   progress can be picked up on another device. Whole-bundle last-write-wins:
   whichever side's `updatedAt` is newer replaces the other side entirely —
   simple and safe for "one person, a couple of devices," not a per-field
   merge. See api/src/functions/sync.js for the server half. */
function touchSyncMeta(){
  if(suppressSyncTouch) return;
  syncMeta.updatedAt = new Date().toISOString();
  window.storage.set(SYNC_META_KEY, JSON.stringify(syncMeta), false).catch(()=>{});
  scheduleCloudPush();
}
function scheduleCloudPush(){
  if(!account) return;
  clearTimeout(cloudPushTimer);
  cloudPushTimer = setTimeout(pushToCloud, 1500);
}
async function loadAccount(){
  try{
    const res = await fetch('/.auth/me');
    if(!res.ok) return null;
    const body = await res.json();
    return (body && body.clientPrincipal) || null;
  }catch(e){ return null; }
}
async function pushToCloud(){
  if(!account) return;
  syncStatus = 'syncing';
  refreshAccountBar();
  try{
    const res = await fetch('/api/sync', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({content, progress, settings, updatedAt: syncMeta.updatedAt})
    });
    syncStatus = res.ok ? 'synced' : 'error';
  }catch(e){
    console.error('cloud push failed', e);
    syncStatus = 'error';
  }
  refreshAccountBar();
}
async function pullAndMerge(){
  if(!account) return;
  syncStatus = 'syncing';
  refreshAccountBar();
  try{
    const res = await fetch('/api/sync');
    if(res.ok){
      const remote = await res.json();
      if(remote && remote.updatedAt){
        const remoteTime = Date.parse(remote.updatedAt) || 0;
        const localTime = syncMeta.updatedAt ? (Date.parse(syncMeta.updatedAt) || 0) : 0;
        if(remoteTime > localTime){
          suppressSyncTouch = true;
          content = Object.assign(emptyOverlay(), remote.content || {});
          progress = {};
          for(const [id, p] of Object.entries(remote.progress || {})) progress[id] = normalizeProgress(p);
          settings = Object.assign({challengeTypeId:'challenge_tap_builder', dailyGoal:10, soundEnabled:true, language:'en'}, remote.settings || {});
          if(!CHALLENGE_TYPES[settings.challengeTypeId] && settings.challengeTypeId !== MIX_MATCH_ID) settings.challengeTypeId = 'challenge_tap_builder';
          data = mergeContent(seed, content);
          if(!content.libraryVerseIds) content.libraryVerseIds = data.verses.map(v=>v.id);
          saveContent(); saveProgress(); saveSettings();
          suppressSyncTouch = false;
          syncMeta.updatedAt = remote.updatedAt;
          window.storage.set(SYNC_META_KEY, JSON.stringify(syncMeta), false).catch(()=>{});
        } else if(localTime > remoteTime){
          await pushToCloud();
        }
      } else {
        // Nothing synced yet for this account — this device's copy becomes the first cloud copy.
        await pushToCloud();
      }
      syncStatus = 'synced';
    } else {
      syncStatus = 'error';
    }
  }catch(e){
    console.error('cloud pull failed', e);
    syncStatus = 'error';
  }
  render();
}
function refreshAccountBar(){
  const el = document.getElementById('account-bar');
  if(!el) return;
  el.outerHTML = renderAccountBar();
  bindEvents(document.getElementById('account-bar'));
}

/* ---------- local backup: export / import ----------
   Cloud sync (above) only covers signed-in users. This is the fallback for
   everyone else — and a manual safety net even when signed in, since
   localStorage on a single device is still one browser-clear away from
   gone. Same bundle shape as the cloud sync document, by design, so
   there's exactly one "what does a user's data look like" shape used in
   three places (localStorage keys, Cosmos, and export files). See
   DATA_MODEL.md §7.1 / CLAUDE.md known gaps. */
function exportBundle(){
  return {
    app: 'rooted',
    exportedAt: new Date().toISOString(),
    content, progress, settings
  };
}
function downloadExport(){
  const blob = new Blob([JSON.stringify(exportBundle(), null, 2)], {type: 'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `rooted-backup-${new Date().toISOString().slice(0,10)}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}
function validateImportBundle(obj){
  if(!obj || typeof obj !== 'object') return {ok:false, error:'That file isn\'t a Rooted backup.'};
  const out = {};
  if(obj.content !== undefined){
    if(typeof obj.content !== 'object' || obj.content === null) return {ok:false, error:'Backup file is corrupted (content).'};
    out.content = Object.assign(emptyOverlay(), obj.content);
  }
  if(obj.progress !== undefined){
    if(typeof obj.progress !== 'object' || obj.progress === null) return {ok:false, error:'Backup file is corrupted (progress).'};
    out.progress = obj.progress;
  }
  if(obj.settings !== undefined){
    if(typeof obj.settings !== 'object' || obj.settings === null) return {ok:false, error:'Backup file is corrupted (settings).'};
    out.settings = obj.settings;
  }
  if(!('content' in out) && !('progress' in out) && !('settings' in out)){
    return {ok:false, error:'That file doesn\'t contain any Rooted data.'};
  }
  return {ok:true, bundle:out};
}
async function importFromFile(file){
  let text;
  try{ text = await file.text(); }
  catch(e){ alert('Could not read that file.'); return; }
  let parsed;
  try{ parsed = JSON.parse(text); }
  catch(e){ alert('That file is not valid JSON.'); return; }
  const result = validateImportBundle(parsed);
  if(!result.ok){ alert(result.error); return; }
  if(!confirm('This replaces your current verses, progress, and settings on this device with the backup file. This can\'t be undone. Continue?')) return;

  const {bundle} = result;
  if('content' in bundle){
    content = bundle.content;
    data = mergeContent(seed, content);
    if(!content.libraryVerseIds) content.libraryVerseIds = data.verses.map(v=>v.id);
  }
  if('progress' in bundle){
    progress = {};
    for(const [id, p] of Object.entries(bundle.progress)) progress[id] = normalizeProgress(p);
  }
  if('settings' in bundle){
    settings = Object.assign({challengeTypeId:'challenge_tap_builder', dailyGoal:10, soundEnabled:true, language:'en'}, bundle.settings);
    if(!CHALLENGE_TYPES[settings.challengeTypeId] && settings.challengeTypeId !== MIX_MATCH_ID) settings.challengeTypeId = 'challenge_tap_builder';
  }
  saveContent(); saveProgress(); saveSettings();
  render();
  alert('Import complete.');
}
