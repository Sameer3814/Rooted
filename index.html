/* ---------- eras / stories / life events ---------- */
function findEra(id){ return lore.eras.find(e=>e.id===id); }
function findStory(id){ return lore.stories.find(s=>s.id===id); }
function eraName(id){ const e = findEra(id); return e ? e.name : ''; }
/* Events where this person is the subject — their own timeline. */
function characterTimeline(charId){
  return lore.lifeEvents
    .filter(e=>e.characterId===charId)
    .sort((a,b)=>(a.sequenceInLife||0)-(b.sequenceInLife||0));
}
/* Events they show up in but aren't the subject of. */
function appearsIn(charId){
  return lore.lifeEvents.filter(e=>e.characterId!==charId && (e.participantIds||[]).includes(charId));
}
function characterStories(charId){
  return lore.stories.filter(s=>(s.characterIds||[]).includes(charId));
}
/* Which curated characters belong to this book, in the order they first
   appear (by chapter:verse) — derived from existing curation, no new
   Character.book field, since one character routinely spans several books
   (Moses across Exodus-Deuteronomy, David across Samuel/Kings/Chronicles) —
   a field would force a false single-book choice.
   Two signals, not one: a verse's own characterIds catches most people, but
   15 real, fully-curated characters (Cain, Abel, Lot, Hagar, Rachel, Leah,
   Cornelius, and others) have zero verses individually tagged to them —
   their scene's verse ended up tagged to a co-star instead (Genesis 4:7 is
   in story_cain_and_abel's own verseIds but carries no characterIds at
   all). So also walk every Story's own verseIds for a book match and credit
   everyone in that Story's characterIds, not just whoever the verse itself
   named — otherwise a real character with a real Story silently never
   appears on their own book's list. */
function charactersInBook(bookName){
  const firstAppearance = {};
  const consider = (id, key) => {
    if(firstAppearance[id] === undefined || key < firstAppearance[id]) firstAppearance[id] = key;
  };
  data.verses.forEach(v=>{
    if(v.book !== bookName) return;
    const key = v.chapter*1000 + v.verse;
    (v.characterIds||[]).forEach(id=>consider(id, key));
  });
  lore.stories.forEach(s=>{
    const storyVersesInBook = (s.verseIds||[]).map(findVerse).filter(v=>v && v.book===bookName);
    if(!storyVersesInBook.length) return;
    const key = Math.min(...storyVersesInBook.map(v=>v.chapter*1000+v.verse));
    (s.characterIds||[]).forEach(id=>consider(id, key));
  });
  return Object.keys(firstAppearance)
    .map(findChar).filter(Boolean)
    .sort((a,b)=>firstAppearance[a.id]-firstAppearance[b.id]);
}

/* ---------- connections (DATA_MODEL.md §2) ----------
   Each edge is stored once, directed; the reverse view is derived here from
   `inverse` (a different label) or `symmetric` (the same label both ways) —
   curation never writes the same fact twice. */
function connectionsFor(type, id){
  const out = [];
  for(const c of connections){
    if(c.fromType===type && c.fromId===id){
      out.push({relationship:c.relationship, otherType:c.toType, otherId:c.toId});
    }else if(c.toType===type && c.toId===id){
      const rel = c.symmetric ? c.relationship : (c.inverse || c.relationship);
      out.push({relationship:rel, otherType:c.fromType, otherId:c.fromId});
    }
  }
  return out;
}
function characterRelationships(charId){
  return connectionsFor('character', charId)
    .filter(x=>x.otherType==='character')
    .map(x=>({type:x.relationship, who:findChar(x.otherId)}))
    .filter(x=>x.who);
}

/* ---------- family tree (DATA_MODEL.md item 110) ----------
   Built entirely from the existing Connection entity — no new data, no
   external source (Wikidata/Bible Project were considered and
   deliberately not used; this app's own hand-curated-from-Scripture
   relationships are the source of truth, same reasoning as rejecting
   the NIV PDF). Scoped to the CORE blood/marriage relationship types
   only (parent, child, spouse, sibling) — `characterRelationships()`
   also returns looser ones (uncle of, kinsman of, raised, servant of,
   mistress of, successor of, worked alongside) that don't have a clean
   generation delta relative to the root, and including them would need
   real multi-hop relationship inference this app's data doesn't
   reliably support yet. A generation naturally still picks up aunts/
   uncles/nephews/nieces/grandparents/grandchildren through the plain
   parent-child chain, without needing those looser types tagged at all.
   `maxGen` bounds how many steps up/down from the root are shown, since
   an ungapped BFS over the whole Connection graph would be unusable on
   a phone screen for well-connected figures. */
const FAMILY_CORE_TYPES = {
  'father of': 1, 'mother of': 1, 'adoptive mother of': 1, 'adoptive father of': 1,
  'son of': -1, 'daughter of': -1, 'adopted son of': -1, 'adopted daughter of': -1,
  'husband of': 0, 'wife of': 0,
  'brother of': 0, 'sister of': 0, 'half-brother of': 0, 'half-sister of': 0,
};
function familyGraph(rootId, maxGen){
  maxGen = maxGen || 2;
  const root = findChar(rootId);
  if(!root) return {nodes: [], edges: []};
  const nodes = new Map();           // id -> {char, gen}
  const edgeKeys = new Set();
  const edges = [];                  // {from, to, kind: 'parent-child'|'spouse'|'sibling'}
  nodes.set(rootId, {char: root, gen: 0});
  const queue = [{id: rootId, gen: 0}];
  while(queue.length){
    const {id, gen} = queue.shift();
    for(const rel of characterRelationships(id)){
      const delta = FAMILY_CORE_TYPES[rel.type];
      if(delta === undefined) continue;
      const otherGen = gen + delta;
      if(Math.abs(otherGen) > maxGen) continue;
      const kind = delta === 1 || delta === -1 ? 'parent-child' : (rel.type.includes('brother') || rel.type.includes('sister') ? 'sibling' : 'spouse');
      // Orient parent-child edges consistently (parent -> child) regardless
      // of which side of the pair this BFS step started from, so the
      // layout pass below can rely on edge direction meaning generation.
      const [a, b] = delta === 1 ? [id, rel.who.id] : (delta === -1 ? [rel.who.id, id] : [id, rel.who.id].sort());
      const key = kind + ':' + a + '>' + b;
      if(!edgeKeys.has(key)){
        edgeKeys.add(key);
        edges.push({from: a, to: b, kind});
      }
      if(!nodes.has(rel.who.id)){
        nodes.set(rel.who.id, {char: rel.who, gen: otherGen});
        queue.push({id: rel.who.id, gen: otherGen});
      }
    }
  }
  return {nodes: [...nodes.values()], edges};
}
/* Rigid generational grid layout (v2, 2026-09-16 overhaul) — strict
   Y-tiering by generation (Y = row * ROW_H) with X positions resolved
   so a child sits directly beneath its parent's center whenever that's
   geometrically possible, rather than a plain per-row insertion order.
   Still hand-written rather than pulling in a graph-layout library (no
   precedent for a third-party JS dependency anywhere in this app, and
   these graphs stay small — a few dozen nodes at most given ~84
   character-character connections project-wide).

   Per row, top to bottom:
     1. Nodes with an already-positioned parent (via a parent-child
        edge from the row above) get a desired X = the average X of
        their parent(s) — this is the literal "child directly beneath
        parent" case (an only child lands exactly on its parent's X).
     2. Nodes with no positioned parent above but a spouse already
        placed in the SAME row (a married-in figure with no blood tie
        upward in this graph) get a desired X = spouse's X + X_GAP, so
        couples still end up adjacent even without a shared parent to
        anchor them.
     3. Anything left over (the topmost row's own roots, or a genuinely
        unconnected node) falls back to appending after the row's
        current rightmost node.
     4. All desired X's are then sorted and walked once, pushing any
        node whose desired X collides with its left neighbor out to
        neighbor.x + X_GAP — this keeps the "directly beneath parent"
        placement exact whenever there's room, and only nudges siblings
        apart when multiple children/spouses would otherwise overlap. */
function layoutFamilyGraph(nodes, edges){
  const NODE_W = 150, NODE_H = 64, X_GAP = 170, ROW_H = 140;
  const byGen = new Map();
  for(const n of nodes){
    if(!byGen.has(n.gen)) byGen.set(n.gen, []);
    byGen.get(n.gen).push(n);
  }
  const gens = [...byGen.keys()].sort((a,b)=>a-b);
  const pos = new Map(); // id -> {x, y}
  const parentsOf = id => edges.filter(e => e.kind === 'parent-child' && e.to === id).map(e => e.from);
  const spouseOf = id => edges.filter(e => e.kind === 'spouse' && (e.from === id || e.to === id)).map(e => e.from === id ? e.to : e.from);

  for(const gen of gens){
    const row = byGen.get(gen);
    const desired = row.map(n => {
      const parentXs = parentsOf(n.char.id).map(pid => pos.get(pid)).filter(Boolean).map(p => p.x);
      if(parentXs.length) return {n, x: parentXs.reduce((s,v)=>s+v,0) / parentXs.length};
      const spouseX = spouseOf(n.char.id).map(sid => pos.get(sid)).filter(Boolean).map(p => p.x)[0];
      if(spouseX !== undefined) return {n, x: spouseX + X_GAP};
      return {n, x: null};
    });
    let rightmost = desired.filter(d => d.x !== null).reduce((m,d)=>Math.max(m,d.x), -Infinity);
    for(const d of desired){ if(d.x === null){ d.x = rightmost === -Infinity ? 0 : rightmost + X_GAP; rightmost = d.x; } }
    desired.sort((a,b) => a.x - b.x);
    let prevX = -Infinity;
    for(const d of desired){
      const x = prevX === -Infinity ? d.x : Math.max(d.x, prevX + X_GAP);
      pos.set(d.n.char.id, {x, y: (gen - gens[0]) * ROW_H});
      prevX = x;
    }
  }
  const minX = Math.min(0, ...[...pos.values()].map(p=>p.x));
  if(minX < 0) for(const p of pos.values()) p.x -= minX; // keep everything on-canvas (>= 0)
  const maxX = Math.max(0, ...[...pos.values()].map(p=>p.x)) + NODE_W;
  const maxY = Math.max(0, ...[...pos.values()].map(p=>p.y)) + NODE_H;
  return {pos, width: maxX, height: maxY, NODE_W, NODE_H};
}
/* The Bezier "elbow" connector between a parent's bottom-center and a
   child's top-center — drops straight down from the parent, curves
   through the gap, and arrives straight into the child, per spec. Only
   parent-child edges use this exact shape (it's only meaningful
   vertically); spouse/sibling edges are same-row and stay a plain
   line between facing edges — see renderFamilyTree(). */
function familyTreeBezier(parent, child, NODE_W, NODE_H){
  const sx = parent.x + NODE_W/2, sy = parent.y + NODE_H;
  const ex = child.x + NODE_W/2, ey = child.y;
  const midY = sy + (ey - sy) * 0.5;
  return `M ${sx} ${sy} C ${sx} ${midY}, ${ex} ${midY}, ${ex} ${ey}`;
}

/* ---------- motifs (DATA_MODEL.md §2) ----------
   A Motif carries no links of its own; every instance is a Connection
   (motif -> story|character|verse, "instance of"), so these fall straight
   out of connectionsFor() like everything else here. */
function findMotif(id){ return motifs.find(m=>m.id===id); }
function motifInstances(motifId){
  return connectionsFor('motif', motifId)
    .map(x=>({entityType:x.otherType, entity: findByType(x.otherType, x.otherId)}))
    .filter(x=>x.entity);
}
function motifsFor(type, id){
  return connectionsFor(type, id)
    .filter(x=>x.otherType==='motif')
    .map(x=>findMotif(x.otherId))
    .filter(Boolean);
}
function findByType(type, id){
  if(type==='story') return findStory(id);
  if(type==='character') return findChar(id);
  if(type==='verse') return findVerse(id);
  if(type==='topic') return findTopic(id);
  if(type==='era') return findEra(id);
  return null;
}
/* Story<->story links other than motif co-membership — "parallels",
   "foreshadows", etc. */
function relatedStories(storyId){
  return connectionsFor('story', storyId)
    .filter(x=>x.otherType==='story')
    .map(x=>({type:x.relationship, story:findStory(x.otherId)}))
    .filter(x=>x.story);
}
/* Who this person actually shares a scene with — real co-occurrence, not a
   guess from a broad era label. */
function sharesScenesWith(charId){
  const ids = new Set();
  for(const e of lore.lifeEvents){
    const people = e.participantIds || [];
    if(people.includes(charId)) people.forEach(p=>{ if(p!==charId) ids.add(p); });
  }
  for(const s of lore.stories){
    const people = s.characterIds || [];
    if(people.includes(charId)) people.forEach(p=>{ if(p!==charId) ids.add(p); });
  }
  return [...ids].map(findChar).filter(Boolean);
}

/* ---------- spaced repetition (simple) ---------- */
function recordPractice(verseId, correct, challengeTypeId){
  const p = progress[verseId] || defaultProgress();
  const now = new Date().toISOString();
  p.timesReviewed += 1;
  p.lastScore = correct;
  p.lastPracticedAt = now;
  let nextDays;
  if(!correct){ p.status='learning'; nextDays=1; }
  else if(p.status==='new'){ p.status='learning'; nextDays=3; }
  else if(p.status==='learning'){ p.status='review'; nextDays=7; }
  else if(p.status==='review'){ p.status='mastered'; nextDays=14; }
  else { nextDays=21; }
  const d = new Date(); d.setDate(d.getDate()+nextDays);
  p.nextReview = d.toISOString();
  p.history.push({at:now, challengeTypeId: challengeTypeId || null, score: correct ? 1 : 0});
  progress[verseId] = p;
  saveProgress();
}

function scrollKey(v){ const k = v.params && (v.params.id || v.params.book); return v.screen + (k ? ':' + k : ''); }
// Shared by go('practice') and the two shepherdScreen='path' transitions
// that don't go through go() at all (sp-after-complete, sp-go-path) — so
// returning to the Path screen from anywhere always finds the player's
// actual current stop instead of wherever scrollTop happens to default.
function shepherdScrollToCurrent(){
  const el = document.getElementById('shepherd-current-stop');
  if(el) el.scrollIntoView({block: 'center'});
}
function go(screen, params={}){
  scrollPositions[scrollKey(view)] = window.scrollY;
  // "Add chapters" mode (item 174) only makes sense while actually on
  // Browse — leaving Browse by any route (the explicit cancel button,
  // confirming, a swipe-back, tapping into "People in {book}", a bottom-
  // nav tab) should never leave it silently active in the background for
  // a later, unrelated Browse visit to stumble into.
  if(screen !== 'browse'){ addJourneyMode = false; addJourneySelectedChapters = new Set(); }
  view = {screen, params};
  render();
  // Shepherd's Path (and the session/complete/streak screens with it)
  // is now a fixed, full-viewport scene with its own internal scroll
  // region (item 165) — the page/window itself no longer scrolls at
  // all while on Practice, so the normal window.scrollTo restore below
  // doesn't apply there. Instead, jump the current stop into view

  // to (not on every background render() — those don't call go()).
  if(screen === 'practice' && !session){

  window.scrollTo(0, scrollPositions[scrollKey(view)] || 0);
}

/* ---------- HOME ----------
   v6 (DATA_MODEL.md §8, item 82) — a greeting + streak header, a
   media-heavy Verse of the Day hero, then a stack of compact "discovery"
   cards (Unreached of the Day, Story of the Day), then a single practice
   link. Memorization itself still lives on its own Practice tab (item
   78) — this is the editorial front door, just redesigned per a
   hand-specified layout after the item 81 version didn't land well. */
function greeting(){
  const h = new Date().getHours();
  if(h < 5) return 'Good night';
  if(h < 12) return 'Good morning';
  if(h < 17) return 'Good afternoon';
  if(h < 21) return 'Good evening';
  return 'Good night';
}
/* A small inline-SVG placeholder, hue-seeded from an id so different
   verses/stories/people get a visually distinct (but still on-brand)
   placeholder instead of one repeated image — stands in for real photos/
   illustrations until those exist, with zero external image dependency.
   Same hash shape as topicColor() elsewhere in this file. */
function placeholderArt(seed, hueBase){
  let h = 0;
  for(let i=0;i<seed.length;i++) h = (h*31 + seed.charCodeAt(i)) >>> 0;
  const hue = hueBase != null ? hueBase : h % 360;
  const hue2 = (hue + 28) % 360;
  // Double-quoted SVG attributes deliberately, not single — encodeURIComponent
  // does NOT escape "'", so a single-quoted SVG would leak literal quote
  // characters into the data URI and break any single-quoted JS string it's
  // later embedded in (e.g. an inline onerror handler).
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300">`
    + `<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1">`
    + `<stop offset="0%" stop-color="hsl(${hue},65%,24%)"/>`
    + `<stop offset="100%" stop-color="hsl(${hue2},55%,11%)"/></linearGradient></defs>`
    + `<rect width="400" height="300" fill="url(#g)"/>`
    + `<circle cx="320" cy="55" r="40" fill="hsl(${hue},80%,62%)" opacity=".5"/>`
    + `<path d="M0 235 L85 150 L155 205 L230 115 L320 215 L400 165 L400 300 L0 300 Z" fill="hsl(${hue2},40%,8%)" opacity=".85"/>`
    + `</svg>`;
  return 'data:image/svg+xml,' + encodeURIComponent(svg);
}

/* One verse a day, stable for the whole day and the same for every device
   (no per-user randomness/state) — a simple date-seeded index into the
   user's own library, not the full corpus, so it's always something
   they've actually added or the starter pack shipped. Used as a fallback
   when the YouVersion-backed remote pick (below) isn't available. */
function verseOfTheDay(){
  if(!data.verses.length) return null;
  const d = new Date();
  const dayKey = d.getFullYear()*372 + d.getMonth()*31 + d.getDate();
  return data.verses[dayKey % data.verses.length];
}
/* Verse of the Day, sourced from YouVersion's Platform API when configured
   (item 81) — proxied through api/verse-of-the-day (see that file for the
   full reasoning: server-side app key, unconfirmed CORS). Falls back to
   the local date-seeded pick above when not configured or on any error —
   this is optional editorial content, never worth a broken-looking card. */
let votdRemote = { status: 'idle', data: null };
async function loadVotdRemote(){
  if(votdRemote.status !== 'idle') return;
  votdRemote = { status: 'loading', data: null };
  try{
    const res = await fetch('/api/verse-of-the-day');
    if(res.status === 501){ votdRemote = { status: 'unconfigured', data: null }; return; }
    if(!res.ok) throw new Error('HTTP ' + res.status);
    votdRemote = { status: 'ready', data: await res.json() };
  }catch(e){
    console.error('verse-of-the-day failed', e);
    votdRemote = { status: 'error', data: null };
  }
  if(view.screen === 'home') render();
}
/* Background photo for the Verse of the Day card, sourced separately from
   Unsplash (owner's explicit choice — YouVersion's own API has no images)
   via api/verse-image, date-seeded from a fixed pool of nature keywords
   (not topic-derived — see that file's comment for why). Unsplash's API
   Terms require on-photo attribution to both Unsplash and the
   photographer, linked to their profile — rendered below, not optional. */
let votdImage = { status: 'idle', data: null };
async function loadVotdImage(){
  if(votdImage.status !== 'idle') return;
  votdImage = { status: 'loading', data: null };
  try{
    const res = await fetch('/api/verse-image');
    if(res.status === 501){ votdImage = { status: 'unconfigured', data: null }; return; }
    if(!res.ok) throw new Error('HTTP ' + res.status);
    votdImage = { status: 'ready', data: await res.json() };
  }catch(e){
    console.error('verse-image failed', e);
    votdImage = { status: 'error', data: null };
  }
  if(view.screen === 'home') render();
}
function renderVerseOfTheDayCard(){
  const remote = votdRemote.status === 'ready' ? votdRemote.data : null;
  const local = verseOfTheDay();
  const text = remote ? remote.text : (local ? local.text : null);
  const ref = remote ? remote.reference : (local ? local.reference : null);
  if(!text) return renderEmptyVerses();
  const img = votdImage.status === 'ready' ? votdImage.data : null;
  // Real Unsplash photo once configured; a real landscape placeholder
  // photo (media/home/votd-placeholder.jpg, owner-supplied) until then —
  // same slot either way, so wiring up Unsplash later is a one-line swap.
  const bgUrl = img ? img.imageUrl : 'media/home/votd-placeholder.jpg';
  // Only the local pick maps to a Verse record we can open a detail page
  // for — a YouVersion-sourced verse has no corresponding local id.

async function loadCorpus(){
  if(corpusStatus === 'loading' || corpusStatus === 'ready') return;
  corpusStatus = 'loading';
  render();
  try{
    const res = await fetch('./data/verses.json');
    if(!res.ok) throw new Error('HTTP ' + res.status);
    corpus = await res.json();
    corpusIndex = buildCorpusIndex(corpus);
    corpusStatus = 'ready';
  }catch(e){
    console.error('corpus load failed', e);
    corpusStatus = 'error';
  }
  render();
}
function buildCorpusIndex(verses){
  const books = new Map();
  for(const v of verses){
    if(!books.has(v.book)) books.set(v.book, {book:v.book, count:0, chapterMap:new Map()});
    const b = books.get(v.book);
    b.count++;
    b.chapterMap.set(v.chapter, (b.chapterMap.get(v.chapter) || 0) + 1);
  }
  return [...books.values()].map(b => ({
    book: b.book,
    count: b.count,
    chapters: [...b.chapterMap.entries()].sort((a,c)=>a[0]-c[0]).map(([n,count])=>({n, count}))
  }));
}
function searchCorpus(query){
  const needle = query.trim().toLowerCase();
  const hits = [];
  let total = 0;
  for(const v of corpus){
    if(v.text.toLowerCase().includes(needle) || v.reference.toLowerCase().includes(needle)){
      total++;
      if(hits.length < SEARCH_LIMIT) hits.push(v);
    }
  }
  return {hits, total};
}
/* Chapter-to-chapter and verse-to-verse navigation (item 155) — both
   walk canonical order and roll across a book boundary at either end
   (chapter 1's "previous" is the prior book's last chapter; a book's
   final chapter's "next" is the next book's chapter 1), the same
   "walk the whole Bible in sequence" idea Timeline/the story carousel
   (item 128) already use, just at chapter/verse granularity instead of
   story granularity. Both need `corpusIndex`/`corpus` loaded — true
   whenever Browse's chapter reader is on screen, and Verse Detail now
   triggers loadCorpus() itself for the same reason (see
   renderVerseDetail()). */
function adjacentChapter(book, chapter, dir){
  if(!corpusIndex) return null;
  const bi = corpusIndex.findIndex(b=>b.book===book);
  if(bi===-1) return null;
  const chapters = corpusIndex[bi].chapters.map(c=>c.n);
  const ci = chapters.indexOf(chapter);
  if(ci===-1) return null;
  if(chapters[ci+dir] !== undefined) return {book, chapter: chapters[ci+dir]};
  const nextBook = corpusIndex[bi+dir];
  if(!nextBook) return null;
  const nextChapters = nextBook.chapters.map(c=>c.n);
  return {book: nextBook.book, chapter: dir>0 ? nextChapters[0] : nextChapters[nextChapters.length-1]};

  if(!corpus) return null;

  const i = inChapter.findIndex(x=>x.id===v.id);
  if(i===-1) return null;
  if(inChapter[i+dir]) return inChapter[i+dir];
  const nextCh = adjacentChapter(v.book, v.chapter, dir);

  const target = corpus.filter(x=>x.book===nextCh.book && x.chapter===nextCh.chapter).sort((a,b)=>a.verse-b.verse);

/* Verse Detail's "Hebrew"/"Greek" toggle (item 151, batch 2) — replaces
   the English/Telugu verse text with its own original-language words,
   each tappable through to its Strong's lexicon entry
   (findLexiconEntry(), item 150/151). Loading/error/missing states are
   real, named cases, not silently blank: the interlinear data is a
   separate ~99.4%-covering corpus from data/verses.json (different
   source, different versification tradition here and there — see
   parse_hebrew_interlinear.py's/parse_greek_interlinear.py's own
   comments), so a small number of verses genuinely have no tagged
   original-language data yet. */
function renderInterlinearBody(v){
  if(interlinearStatus === 'error') return `<p class="field-hint" style="margin:8px 0;">Couldn't load the original-language text.</p>`;
  if(interlinearStatus === 'loading' || !interlinearTokensFor(v)){
    if(interlinearStatus !== 'loading' && interlinearStatus !== 'error'){
      return `<p class="field-hint" style="margin:8px 0;">No original-language text tagged for this verse yet.</p>`;
    }
    return `<p class="field-hint" style="margin:8px 0;"><i class="ti ti-loader"></i> Loading the original text...</p>`;
  }
  const tokens = interlinearTokensFor(v);
  const isNT = NT_BOOKS.has(v.book);
  return `
    <div dir="${isNT?'ltr':'rtl'}" style="display:flex;flex-wrap:wrap;gap:2px 4px;margin-top:4px;">
      ${tokens.map(([text, strongsIds])=>{
        const sid = strongsIds[0];
        // The source text/data (item 151) carries no per-word English
        // gloss of its own — the word's own resolved Strong's entry
        // (lexiconEntry(), the merged curated+full dictionary already
        // loaded alongside this) doubles as one, shown stacked directly
        // under the original word so it's clear which English sense
        // lines up with which Hebrew/Greek word, the standard
        // interlinear layout. A word with no resolved Strong's id (a
        // bare grammatical prefix — conjunction/article/etc., see
        // parse_hebrew_interlinear.py's own comment) just gets no gloss
        // line rather than a blank placeholder.
        const entry = sid ? lexiconEntry(sid) : null;
        const gloss = entry && entry.shortDef;
        const wordSpan = sid

// dusty, saturated tones assigned deterministically per topic id (a simple
// hash, not array index, so visual variety doesn't line up with data order),
// plus a hand-picked icon per topic where one made sense. This is presentation
// only, not a data-model change (Design philosophy #2 reserves `metadata` for

/* The original 12-hue colorful palette (items 62-64). Converted to

   here (2026-09-21) — the owner asked for the colored tiles back and
   named Topics specifically as the one deliberate, standing exception
   to that pass ("this is one part of the app we'll keep the colors"),
   not a one-off override. Same hash-based assignment (topicColor()
   below is unchanged) so topics are still visually distinguishable
   from their neighbors by hue, same as before item 123. */
const TOPIC_PALETTE = [
  '#0EA5D6', '#F0158A', '#B88E00', '#E0742C', '#78B01A', '#0FC96B',
  '#9C7A1E', '#B8752F', '#3D53F5', '#F04419', '#12AEDA', '#C92BAE',
];
const TOPIC_ICONS = {
  topic_betrayal:'ti-heart-broken', topic_blessing:'ti-gift', topic_calling:'ti-flag',
  topic_covenant:'ti-link', topic_creation:'ti-sun', topic_faith:'ti-anchor',
  topic_faithfulness:'ti-shield-check', topic_fear:'ti-alert-triangle',
  topic_forgiveness:'ti-heart-handshake', topic_guidance:'ti-compass',
  topic_humility:'ti-feather', topic_identity:'ti-fingerprint', topic_justice:'ti-scale',
  topic_peace:'ti-cloud', topic_presence:'ti-map-pin', topic_provision:'ti-basket',
  topic_refuge:'ti-home', topic_repentance:'ti-arrow-back-up', topic_scripture:'ti-book',
  topic_sorrow:'ti-droplet', topic_strength:'ti-bolt', topic_temptation:'ti-apple',
  topic_thanksgiving:'ti-confetti', topic_trust:'ti-shield', topic_waiting:'ti-hourglass',
  topic_wisdom:'ti-bulb', topic_worship:'ti-music', topic_deliverance:'ti-door-exit',
  topic_loyalty:'ti-users', topic_holiness:'ti-star', topic_love:'ti-heart',

  topic_speech:'ti-message-circle', topic_anxiety:'ti-wind',
};
function topicColor(id){
  let h = 0;
  for(let i=0;i<id.length;i++) h = (h*31 + id.charCodeAt(i)) >>> 0;
  return TOPIC_PALETTE[h % TOPIC_PALETTE.length];
}
function topicIcon(id){ return TOPIC_ICONS[id] || 'ti-sparkles'; }
/* Re-themes a Topic Detail page's --gold/--gold-deep/--gold-wash/
   --gold-shadow to that topic's own hue (item 62-64's original
   per-topic color grid) — restored (2026-09-21) after the black-and-
   white pass (item 123) had made this a no-op and grayscaled
   TOPIC_PALETTE. Topics is now a deliberate, standing exception to
   that pass, not a one-off hex like the badge exceptions elsewhere in
   the file: the owner's own words were "this is one part of the app
   we'll keep the colors." Derives a brighter text-safe tint and
   low-alpha wash from the one base hex via hexToRgb(), the same
   light/wash-pair shape the gold/sage/tan tokens already use, so a
   Topic Detail page can override just the "action/urgency" accent role
   locally without touching sage (mastery) or tan (metadata) — those
   stay their normal color everywhere, same verse card component. */
function hexToRgb(hex){
  const n = parseInt(hex.slice(1), 16);
  return [(n>>16)&255, (n>>8)&255, n&255];
}
function topicAccentVars(id){
  const base = topicColor(id);
  const [r,g,b] = hexToRgb(base);

    const mix = (c)=>Math.round(c + (255-c)*amt);
    return `rgb(${mix(r)},${mix(g)},${mix(b)})`;
  };
  return `--gold:${base};--gold-deep:${lighten(.45)};--gold-wash:rgba(${r},${g},${b},.22);--gold-shadow:rgba(${r},${g},${b},.35);`;

/* ---------- TIMELINE GAME ----------
   A one-off drag-and-drop chronology puzzle over a character's own
   LifeEvents (`characterTimeline`), not part of the spaced-repetition
   verse practice loop — there's no "due" schedule for it, no ChallengeType
   entry, it just reshuffles fresh every time you open it. Up to 5 events
   are sampled evenly across the character's whole arc (not just the first
   5) so the puzzle reflects their whole life, not only its opening.
   Reordering is done by moving real DOM nodes during a pointer drag
   (see wireTimelineDrag) rather than re-rendering on every pointermove,
   which would blow away the drag gesture mid-swipe. */
function buildTimelineGame(charId){
  const timeline = characterTimeline(charId);
  const n = TIMELINE_DIFFICULTIES[timelineDifficulty] || 5;
  let picked;
  if(timeline.length <= n){
    picked = timeline;
  }else{
    // Split the whole timeline into n roughly-equal segments and pick one
    // RANDOM event from each (not the fixed midpoint) — so hitting reshuffle
    // can swap which moments show up, not just their order, while still
    // spreading across the character's whole life rather than clustering
    // events from just one part of it.
    const segSize = timeline.length / n;
    const idxs = [];
    for(let i=0;i<n;i++){
      const segStart = Math.floor(i*segSize);
      const segEnd = Math.max(segStart+1, Math.floor((i+1)*segSize));
      idxs.push(Math.min(segStart + Math.floor(Math.random()*(segEnd-segStart)), timeline.length-1));
    }
    picked = [...new Set(idxs)].map(i=>timeline[i]);
  }
  const correctIds = picked.map(e=>e.id);
  let order = [...correctIds];
  if(order.length > 1){
    do{
      for(let i=order.length-1;i>0;i--){
        const j = Math.floor(Math.random()*(i+1));
        [order[i],order[j]] = [order[j],order[i]];
      }
    }while(order.every((id,i)=>id===correctIds[i]));
  }
  return { characterId: charId, events: picked, correctIds, order, checked:false, lockedIds: new Set(), allCorrect:false };
}
function renderTimelineGame(){
  const g = timelineGame;
  if(!g) return renderCharacters();
  const c = findChar(g.characterId);
  const byId = {};
  g.events.forEach(e=>{ byId[e.id] = e; });
  const isDark = settings.homeTheme === 'dark';
  return `
    <div class="hds-theme" data-theme="${isDark ? 'dark' : 'light'}">
      <div class="hds-content" style="padding-top:0;">
        <button class="back-btn" data-action="open-character" data-id="${g.characterId}" style="margin-bottom:14px;"><i class="ti ti-arrow-left"></i></button>
        <div class="topbar"><h1>Put their life in order</h1></div>
        <p style="margin-bottom:14px;">Drag ${c ? esc(c.name) : 'these'} moments into the order they actually happened.</p>
        <div style="display:flex;gap:8px;align-items:center;margin-bottom:14px;">
          <div class="segmented" style="flex:1;margin-bottom:0;">
            ${Object.keys(TIMELINE_DIFFICULTIES).map(d=>`<button class="${timelineDifficulty===d?'active':''}" data-action="set-timeline-difficulty" data-id="${d}">${d[0].toUpperCase()+d.slice(1)} · ${TIMELINE_DIFFICULTIES[d]}</button>`).join('')}
          </div>
          <button class="btn" style="flex-shrink:0;" data-action="reshuffle-timeline-game" data-id="${g.characterId}" title="Reshuffle"><i class="ti ti-refresh"></i></button>
        </div>
        <div class="tl-drag-track" id="tl-drag-track">
          ${g.order.map((id,i)=>{
            const e = byId[id];
            const locked = g.lockedIds.has(id);
            const wrong = g.checked && !locked;
            const cls = locked ? 'tl-drag-correct' : wrong ? 'tl-drag-wrong' : '';
            return `<div class="tl-drag-item ${cls}" data-id="${id}"${locked ? '' : ' data-draggable="1"'}>
              ${locked ? '<i class="ti ti-check tl-drag-check"></i>' : '<span class="tl-drag-handle"><i class="ti ti-grip-vertical"></i></span>'}
              <div class="tl-drag-body">
                <div class="tl-title">${esc(e.title)}</div>
                ${(g.checked || locked) ? `<div class="tl-ref">${esc(e.reference)}</div>` : ''}
              </div>
            </div>`;
          }).join('')}
        </div>
        ${g.allCorrect ? `
          <div class="result-banner good" style="margin-top:16px;"><i class="ti ti-confetti"></i> That's the right order — nice work!</div>
          <button class="btn primary block" data-action="open-character" data-id="${g.characterId}">Back to ${c ? esc(c.name) : 'profile'}</button>
        ` : `
          <button class="btn primary block" style="margin-top:16px;" data-action="check-timeline-order"><i class="ti ti-check"></i> Check order</button>
          ${g.checked ? `<button class="btn block" style="margin-top:8px;width:100%;" data-action="reset-timeline-order">Shuffle the rest</button>` : ''}
        `}
      </div>
    </div>
  `;
}
function checkTimelineOrder(){
  const g = timelineGame;
  if(!g) return;
  const track = document.getElementById('tl-drag-track');
  if(!track) return;
  const domIds = [...track.querySelectorAll('.tl-drag-item')].map(el=>el.dataset.id);
  // Reconstruct the logical order rather than trusting raw DOM order:
  // already-locked ids are forced back to their one true correct index
  // (g.correctIds.indexOf), and the still-unlocked ids fill whatever
  // slots are left, in the relative order they appear in the DOM. This is
  // what makes a locked card immune to index drift — dragging an unlocked
  // card past it can visually nudge it in the DOM mid-drag, but it always
  // snaps back to its correct slot here rather than silently being
  // graded against whatever index it happened to end up at.
  const unlockedInDomOrder = domIds.filter(id => !g.lockedIds.has(id));
  let cursor = 0;
  const newOrder = g.correctIds.map(cid => g.lockedIds.has(cid) ? cid : unlockedInDomOrder[cursor++]);
  g.order = newOrder;
  const correctCountBefore = g.lockedIds.size;
  newOrder.forEach((id,i)=>{ if(id === g.correctIds[i]) g.lockedIds.add(id); });
  g.checked = true;
  g.allCorrect = g.lockedIds.size === g.correctIds.length;
  if(g.allCorrect){ playSfx('complete'); hapticBuzz([20,40,20]); }
  else if(g.lockedIds.size > correctCountBefore){ playSfx('correct'); hapticBuzz(20); }
  else{ hapticBuzz(20); }
  render();
}
function resetTimelineOrder(){
  const g = timelineGame;
  if(!g) return;
  // Correctly-placed events from the last check stay locked at their true
  // index permanently (g.lockedIds persists across attempts); only the
  // ones still wrong get reshuffled among the remaining slots — a
  // progressive puzzle, not a full restart every attempt.
  const wrongIds = g.order.filter(id => !g.lockedIds.has(id));
  if(wrongIds.length > 1){
    let shuffled;
    do{
      shuffled = [...wrongIds];
      for(let i=shuffled.length-1;i>0;i--){
        const j = Math.floor(Math.random()*(i+1));
        [shuffled[i],shuffled[j]] = [shuffled[j],shuffled[i]];
      }
    }while(shuffled.every((id,i)=>id===wrongIds[i]));
    let cursor = 0;
    g.order = g.order.map(id => g.lockedIds.has(id) ? id : shuffled[cursor++]);
  }
  g.checked = false;
  render();
}
/* Pan (drag) + zoom (wheel on desktop, pinch on touch) for the family
   tree's SVG — plain SVG has no built-in viewport gestures, and this
   app has no existing graph/canvas component to reuse, so this is
   hand-rolled rather than pulling in a library (no precedent for a
   third-party JS dependency anywhere in this vanilla-JS app). Tap vs.
   drag is disambiguated by total pointer movement, same threshold
   approach as wireSwipeBack() elsewhere in this file — a drag that
   crossed the threshold suppresses the trailing click so panning across
   a node never accidentally re-centers the tree on it. */
function wireFamilyTreePanZoom(){
  const viewport = document.getElementById('family-tree-viewport');
  const canvas = document.getElementById('family-tree-canvas');
  if(!viewport || !canvas) return;
  let scale = 1, tx = 0, ty = 0;
  let moved = false;
  const pointers = new Map(); // pointerId -> {x, y}
  let pinchStartDist = 0, pinchStartScale = 1;
  const MIN_SCALE = 0.4, MAX_SCALE = 2.5;

  function apply(){ canvas.style.transform = `translate(${tx}px, ${ty}px) scale(${scale})`; }
  function clampScale(s){ return Math.min(MAX_SCALE, Math.max(MIN_SCALE, s)); }
  function dist(a, b){ return Math.hypot(a.x - b.x, a.y - b.y); }

  viewport.addEventListener('pointerdown', e=>{
    viewport.setPointerCapture(e.pointerId);
    pointers.set(e.pointerId, {x: e.clientX, y: e.clientY});
    moved = false;
    if(pointers.size === 2){
      const [a, b] = [...pointers.values()];
      pinchStartDist = dist(a, b) || 1;
      pinchStartScale = scale;
    }
  });
  viewport.addEventListener('pointermove', e=>{
    if(!pointers.has(e.pointerId)) return;
    const prev = pointers.get(e.pointerId);
    const dx = e.clientX - prev.x, dy = e.clientY - prev.y;
    pointers.set(e.pointerId, {x: e.clientX, y: e.clientY});
    if(Math.abs(dx) > 2 || Math.abs(dy) > 2) moved = true;
    if(pointers.size === 2){
      const [a, b] = [...pointers.values()];
      scale = clampScale(pinchStartScale * (dist(a, b) / pinchStartDist));
    }else if(pointers.size === 1){
      tx += dx; ty += dy;
    }
    apply();
  });
  function endPointer(e){
    pointers.delete(e.pointerId);
    if(moved){
      // Swallow the click that follows a drag so tapping-through-a-node
      // mid-pan doesn't also re-center the tree on it.
      const suppress = ev => { ev.stopPropagation(); ev.preventDefault(); viewport.removeEventListener('click', suppress, true); };
      viewport.addEventListener('click', suppress, true);
    }
  }
  viewport.addEventListener('pointerup', endPointer);
  viewport.addEventListener('pointercancel', endPointer);
  viewport.addEventListener('wheel', e=>{
    e.preventDefault();
    scale = clampScale(scale * (e.deltaY < 0 ? 1.12 : 0.89));
    apply();
  }, {passive: false});
}
/* First-Letter Sprint's live keyboard capture + ticking timer. Called
   after every full render (bindEvents()) — but unlike every other
   challenge type, an individual keystroke here does NOT go through a
   full render() while the sprint is still in progress. Real-device
   testing found that a full render() per keystroke (this app's normal
   model — the whole innerHTML is rebuilt) destroys and recreates the
   hidden <input>, which closes the mobile virtual keyboard after every
   single letter typed. So the `input` listener below instead calls
   type.interact() to mutate state as usual, then patches just
   #sprint-text-box's innerHTML directly (sprintTokensHTML(), the same
   markup render() itself would produce) — the <input> element is never
   touched, so it keeps its focus and the keyboard stays open. A real
   render() only happens once the sprint actually completes (state.checked),
   which is the point where the screen changes to the toast/Continue
   view and the input needs to go away anyway. Same reasoning
   wireTimelineDrag() above gives for moving real DOM nodes during a
   drag instead of re-rendering on every pointermove — extended here to
   "don't destroy focus/keyboard state on every keystroke of a typing
   game" specifically.
   The ticking timer is a second, separate reason a per-keystroke
   render() would be wrong even without the keyboard problem: it needs
   to keep advancing between keystrokes too, so it's always a direct
   textContent update on its own interval, never routed through render(). */
let sprintTimerInterval = null;
function focusSprintInput(){
  const input = document.getElementById('sprint-hidden-input');
  if(input) input.focus();
}
function wireFirstLetterSprint(){
  clearInterval(sprintTimerInterval);
  sprintTimerInterval = null;
  const input = document.getElementById('sprint-hidden-input');
  if(!input || !session) return;
  const item = session.queue[session.index];
  const type = challengeType(item.challengeTypeId);
  input.focus();
  input.addEventListener('blur', ()=>{
    // Keep the hidden input focused so physical-keyboard keystrokes
    // keep landing on it. A programmatic focus() here can't reopen a
    // mobile virtual keyboard that the OS already dismissed (that needs
    // a direct tap — see the "Keyboard not showing? Tap here." hint in
    // render(), wired via the focus-sprint-input action below), but it
    // does no harm to also try, and it's what keeps a physical keyboard
    // working after e.g. a stray tap elsewhere on the page.
    setTimeout(()=>{ const i = document.getElementById('sprint-hidden-input'); if(i) i.focus(); }, 10);
  });
  input.addEventListener('input', ()=>{
    const val = input.value;
    input.value = '';
    const ch = val[val.length - 1];
    if(!ch || !/[a-zA-Z]/.test(ch)) return;
    if(!session || item.state.checked) return;
    type.interact(item.state, {letter: ch});
    if(item.state.checked){
      // Finalize exactly like practiceInteractWith() would — this is
      // the one point where a real render() is correct and necessary,
      // since the screen is changing to the toast/Continue view anyway.
      if(item.state.allCorrect){ playSfx('correct'); hapticBuzz(30); }
      session.results.push({
        verseId: item.verseId,
        allCorrect: !!item.state.allCorrect,
        score: type.score(item.state)
      });
      recordPractice(item.verseId, !!item.state.allCorrect, item.challengeTypeId);
      clearInterval(sprintTimerInterval);
      // Shepherd sessions always wait for an explicit tap on the
      // feedback sheet's own Continue/Got It button — see the note by
      // checkPractice()'s own autoAdvanceMs guard below for why.
      if(!session.shepherd && item.state.allCorrect && type.autoAdvanceMs){
        setTimeout(()=>{
          if(!session || session.queue[session.index] !== item) return;
          advancePractice();
        }, type.autoAdvanceMs);
      }
      render();
    }else{
      playSfx('tap');
      const box = document.getElementById('sprint-text-box');
      if(box) box.innerHTML = sprintTokensHTML(item.state);
    }
  });
  const timerEl = document.getElementById('sprint-timer');
  if(timerEl && item && !item.state.checked){
    sprintTimerInterval = setInterval(()=>{
      const el = document.getElementById('sprint-timer');
      if(!el || !session || session.queue[session.index] !== item || item.state.checked){
        clearInterval(sprintTimerInterval);
        return;
      }
      el.textContent = ((Date.now() - item.state.startTime) / 1000).toFixed(1) + 's';
    }, 100);
  }
}
/* "Hold to Peek" — a pure press-and-hold visual toggle, not a state
   change: holding reveals every vanished word, releasing hides them
   again. Deliberately kept out of the interact()/render() cycle
   entirely (a plain CSS class toggle on the box) rather than a state
   flag + full render() per press/release — there's nothing to score or
   persist about a peek, and going through render() would add a visible
   delay to what should feel instant, the same reasoning
   wireFamilyTreePanZoom() and wireTimelineDrag() give for direct DOM
   manipulation over full re-renders during a live gesture. */
function wireProgressiveVanish(){
  const btn = document.getElementById('vanish-peek-btn');
  const box = document.getElementById('vanish-text-box');
  if(!btn || !box) return;
  const show = e => { e.preventDefault(); box.classList.add('peek-all'); };
  const hide = () => box.classList.remove('peek-all');
  btn.addEventListener('pointerdown', show);
  btn.addEventListener('pointerup', hide);
  btn.addEventListener('pointercancel', hide);
  btn.addEventListener('pointerleave', hide);
}
/* Clause Connect's grip-handle drag reordering — pointer events dragging
   real DOM nodes, the same technique wireTimelineDrag() already uses
   below, not the HTML5 Drag-and-Drop API the original spec named: that
   API has no touch support at all without a polyfill this app doesn't
   carry, which would make dragging simply not work on the phone this
   whole app is built for. Only starts from a pointerdown on the grip
   icon, so it can never swallow a tap on the clause text meant for
   interact()'s own tap-to-swap. Mutates state.order directly from the
   DOM's final child order once the drag ends, then does one real
   render() — no in-between full re-renders during the drag itself, same
   "direct DOM manipulation for a live gesture" reasoning as
   wireFamilyTreePanZoom(). */
function wireClauseConnect(){
  const container = document.getElementById('clause-list-container');
  if(!container || !session) return;
  const item = session.queue[session.index];
  const type = item && challengeType(item.challengeTypeId);
  if(!item || type.id !== 'challenge_clause_connect' || item.state.checked) return;
  let dragEl = null, startY = 0, moved = false;
  function onMove(ev){
    if(!dragEl) return;
    moved = true;
    const dy = ev.clientY - startY;
    dragEl.style.transform = `translateY(${dy}px)`;
    const pointerY = ev.clientY;
    const siblings = [...container.children].filter(el => el !== dragEl);
    for(const sib of siblings){
      const r = sib.getBoundingClientRect();
      if(pointerY > r.top && pointerY < r.bottom){
        const dragRect = dragEl.getBoundingClientRect();
        const goingDown = dragRect.top < r.top;
        container.insertBefore(dragEl, goingDown ? sib.nextSibling : sib);
        startY = ev.clientY;
        dragEl.style.transform = 'translateY(0px)';
        break;
      }
    }
  }
  function onUp(){
    document.removeEventListener('pointermove', onMove);
    document.removeEventListener('pointerup', onUp);
    document.removeEventListener('pointercancel', onUp);
    if(!dragEl) return;
    dragEl.style.transform = '';
    dragEl.classList.remove('clause-dragging');
    if(moved){
      item.state.order = [...container.children].map(el => +el.dataset.clauseIdx);
      item.state.wrong = [];
      item.state.selected = null;
      render();
    }
    dragEl = null;
  }
  container.querySelectorAll('.clause-card').forEach(card=>{
    card.addEventListener('pointerdown', e=>{
      if(!e.target.closest('.clause-grip')) return;
      dragEl = card;
      startY = e.clientY;
      moved = false;
      card.classList.add('clause-dragging');
      document.addEventListener('pointermove', onMove);
      document.addEventListener('pointerup', onUp);
      document.addEventListener('pointercancel', onUp);
    });
  });
}
function wireTimelineDrag(){
  const track = document.getElementById('tl-drag-track');
  if(!track) return;
  let dragEl = null;
  let startY = 0;
  function onMove(ev){
    if(!dragEl) return;
    const dy = ev.clientY - startY;
    dragEl.style.transform = `translateY(${dy}px)`;
    const pointerY = ev.clientY;
    const siblings = [...track.children].filter(el => el !== dragEl && !el.classList.contains('tl-drag-correct'));
    for(const sib of siblings){
      const r = sib.getBoundingClientRect();
      if(pointerY > r.top && pointerY < r.bottom){
        const dragRect = dragEl.getBoundingClientRect();
        const goingDown = dragRect.top < r.top;
        track.insertBefore(dragEl, goingDown ? sib.nextSibling : sib);
        startY = ev.clientY;
        dragEl.style.transform = 'translateY(0px)';
        break;
      }
    }
  }
  function onUp(){
    document.removeEventListener('pointermove', onMove);
    document.removeEventListener('pointerup', onUp);
    document.removeEventListener('pointercancel', onUp);
    if(!dragEl) return;
    dragEl.style.transform = '';
    dragEl.classList.remove('dragging');
    dragEl = null;
  }
  track.querySelectorAll('.tl-drag-item[data-draggable="1"]').forEach(item=>{
    item.addEventListener('pointerdown', e=>{
      dragEl = item;
      startY = e.clientY;
      item.classList.add('dragging');
      document.addEventListener('pointermove', onMove);
      document.addEventListener('pointerup', onUp);
      document.addEventListener('pointercancel', onUp);
    });
  });
}

   the scene). Deliberately separate markup from .hds-sky/.hds-title
   (item 172's plain backdrop, still used as-is by Browse/Topics/
   People/Stories, untouched here) since this header has real content
   of its own rather than acting as a pure CSS backdrop behind
   .hds-content.
   Dark mode (2026-11-13, owner-supplied reference recipe — a real
   change, not the original "skip in dark mode" call noted here until
   now): soft blurred radial-gradient puffs instead of the light mode's
   solid pill+circle shape, since --ht-cloud's own dark value reads as
   close to invisible at full opacity. Reuses .hds-cloud-wrap/hdsDrift
   for positioning/animation either way — only the inner shape and the
   wrapper's own size/blur differ per theme. */
function hdsCloud(top, w, dur, delay){
  const s = w/110;
  if(settings.homeTheme === 'dark'){
    const puff = (l,b,pw,ph,a) => `<div style="position:absolute;left:${Math.round(l*s)}px;bottom:${Math.round(b*s)}px;width:${Math.round(pw*s)}px;height:${Math.round(ph*s)}px;border-radius:50%;background:radial-gradient(ellipse at 50% 35%, rgba(196,204,236,${a}) 0%, rgba(120,128,180,${(a*.55).toFixed(2)}) 45%, rgba(60,66,120,0) 72%);"></div>`;
    return `<div class="hds-cloud-wrap" style="top:${Math.round(top-10*s)}px;width:${Math.round(w*1.5)}px;height:${Math.round(60*s)}px;filter:blur(${Math.max(3,Math.round(5*s))}px);animation-duration:${(dur*1.4).toFixed(1)}s;animation-delay:-${delay}s;">
      ${puff(0,4,90,26,.22)}${puff(30,12,70,34,.28)}${puff(70,6,96,30,.2)}${puff(110,10,50,22,.16)}${puff(48,20,40,22,.32)}
    </div>`;
  }
  return `<div class="hds-cloud-wrap" style="top:${top}px;animation-duration:${dur}s;animation-delay:-${delay}s;">
    <div style="position:relative;width:${w}px;height:${Math.round(40*s)}px;">
      <div class="hds-cloud" style="left:0;bottom:0;width:${w}px;height:${Math.round(22*s)}px;border-radius:999px;"></div>
      <div class="hds-cloud" style="left:${Math.round(18*s)}px;bottom:${Math.round(8*s)}px;width:${Math.round(40*s)}px;height:${Math.round(32*s)}px;"></div>
      <div class="hds-cloud" style="left:${Math.round(48*s)}px;bottom:${Math.round(6*s)}px;width:${Math.round(34*s)}px;height:${Math.round(26*s)}px;"></div>
    </div>
  </div>`;
}
/* A leaf sprig (+ optional 5-petal flower), swaying ±3deg — the exact
   SVG path already used by Study hub's static .hds-deco1/.hds-deco2
   (renderStudy(), below), just with the sway animation on and its own
   positioning passed in by the caller (header plants are absolute;
   Timeline's between-card plants and the Verse Detail sprout nest it
   inside an already-positioned wrapper via `position:relative`). */
function hdsPlant(posCss, size, flower, delaySeed){
  return `<div class="hds-scenic-plant" style="${posCss}width:${size}px;height:${size}px;animation-delay:-${((delaySeed||0)%4)+0.2}s;">
    <svg viewBox="0 0 30 30" width="100%" height="100%">
      <path d="M15 30C14 22 9 17 4 15c5 0 9 4 11 9 0-8 2-14 6-18-2 6-3 13-3 24z" fill="var(--ht-deco1)"></path>
      ${flower ? `<g>${[0,72,144,216,288].map(a=>`<ellipse cx="21" cy="5" rx="2.2" ry="3.4" fill="var(--ht-petal)" transform="rotate(${a} 21 8.5)"></ellipse>`).join('')}<circle cx="21" cy="8.5" r="2" fill="#ffd27a"></circle></g>` : ''}

}
/* The three plants spec'd "along the hill line (left 16 & 44, right
   22)" for every scenic header. */
function hdsHeaderPlants(){
  return [
    hdsPlant('left:16px;bottom:12px;', 28, true, 0),
    hdsPlant('left:44px;bottom:8px;', 20, false, 1.3),

/* opts: {title, intro, height, sunTop, sunRight, sunSize, hill1Bottom,
   hill2Bottom, clouds:[[top,width,durationS,delayS], ...]}. All

   Shepherd.dc.html / Study Pages Shepherd.dc.html, not guessed. */
function hdsScenicHeader(opts){
  const clouds = (opts.clouds||[]).map(c=>hdsCloud(c[0],c[1],c[2],c[3])).join('');

}
/* Cycles a stable 3-color tile palette (teal/terracotta/plum, the same
   trio the Study hub's own nav tiles already use) by a hash of the
   entity's own id — same "hash a stable id into a small fixed palette"
   shape as topicColor() (items 62-64), just a 3-entry palette instead
   of TOPIC_PALETTE's 12, since that's what this spec calls for
   (Patterns cards, Family Tree portrait rings). */
const HDS_TILE_COLORS = [
  ['#2f9a82','#1f7563','var(--ht-tint)','var(--ht-acc)'],
  ['#d2603a','#a8441f','var(--ht-terrat)','var(--ht-terra)'],
  ['#7a5cc4','#5a3fa0','var(--ht-plumt)','var(--ht-plum)'],
];
function hdsCycleIndex(id, n){
  let h = 0;
  for(let i=0;i<id.length;i++) h = (h*31 + id.charCodeAt(i)) >>> 0;
  return h % n;
}

/* ---------- LEXICON (item 150) ----------
   A standalone, searchable Strong's-id-keyed dictionary
   (data/lexicon_seed.json, 39 curated highlights, plus
   data/lexicon_full.json, ~14,200 entries lazily loaded on open, item
   150) — search by lemma/transliteration/gloss/Strong's-id, browse the
   curated highlights when there's no query. Deliberately NOT wired to
   per-word verse text — see loadLexiconFull()'s comment for why a real
   interlinear is a separate, much larger project. Same debounced-search
   shape as People/Topics/Stories (renderXResults()/refreshXResults()
   pair, own #lexicon-results subtree, own lexiconQuery state). */
/* Merges the 39 curated highlights (lexicon, richer fields: occurrences,
   type, exampleVerseId) over the full ~14,200-entry dictionary
   (lexiconFull, lazy) by Strong's id — same seed-plus-overlay shape as
   data/starter-pack.json vs data/verses.json elsewhere in this app.
   Before lexiconFull has loaded, this still returns the 39 curated
   entries (a real, if partial, result) rather than nothing. */
function lexiconEntry(id){
  const base = lexiconFull && lexiconFull[id];
  const curated = lexicon[id];
  if(!base && !curated) return null;
  return Object.assign({}, base || {}, curated || {});
}
function lexiconEntries(){
  const ids = new Set(Object.keys(lexicon));
  if(lexiconFull) Object.keys(lexiconFull).forEach(id=>ids.add(id));
  return [...ids].map(lexiconEntry).sort((a,b)=>a.translit.localeCompare(b.translit));
}
function findLexiconEntry(id){ return lexiconEntry(id); }
/* Scenic-header values (height 250, sun top66/right30/52, hills
   -165/-190, two clouds) are Study Pages Shepherd.dc.html's own
   "Lexicon" frame, item 176. */
function renderLexicon(){
  const total = lexiconFull ? Object.keys(lexiconFull).length : Object.keys(lexicon).length;
  const isDark = settings.homeTheme === 'dark';
  const intro = lexiconFull ? `${total.toLocaleString()} Hebrew and Greek words, straight from Strong's Concordance.` : "A hand-picked set of key Hebrew and Greek words, with their Strong's number, definition, and where they show up.";
  return `
    <div class="hds-theme" data-theme="${isDark ? 'dark' : 'light'}">
      ${hdsScenicHeader({title:t('title_lexicon'), intro, height:250, sunTop:66, sunRight:30, sunSize:52, hill1Bottom:-165, hill2Bottom:-190, clouds:[[60,104,48,30],[150,66,60,12]]})}
      <div class="hds-content" style="padding-top:4px;">
        <div class="search-wrap">
          <i class="ti ti-search"></i>
          <input type="text" id="lexicon-search" value="${esc(lexiconQuery)}" placeholder="Search by word, transliteration, or meaning..." autocomplete="off" autocorrect="off" spellcheck="false">
        </div>
        <div id="lexicon-results">${renderLexiconResults()}</div>
      </div>
    </div>
  `;
}
function renderLexiconResults(){
  const q = lexiconQuery.trim().toLowerCase();
  if(q){
    if(lexiconFullStatus === 'loading' && !lexiconQuery.trim().match(/^[hg]\d+$/i)){
      return `<div class="empty"><i class="ti ti-loader"></i><p>Still loading the full dictionary — searching what's here so far.</p></div>` + renderLexiconSearchHits(q);
    }
    return renderLexiconSearchHits(q);
  }
  if(lexiconFullStatus === 'error' && !lexiconFull) return `<div class="empty"><i class="ti ti-alert-triangle"></i><p>Couldn't load the full dictionary — showing curated highlights only.</p><button class="btn cta" data-action="retry-lexicon">Try again</button></div>` + renderLexiconGrouped();
  if(lexiconFullStatus !== 'ready') return `<div class="empty"><i class="ti ti-loader"></i><p>Loading the full dictionary...</p></div>` + renderLexiconGrouped();
  return renderLexiconGrouped();
}
function renderLexiconSearchHits(q){
  const entries = lexiconEntries().filter(w=>
    w.translit.toLowerCase().includes(q) || w.lemma.includes(lexiconQuery.trim()) ||
    (w.shortDef||'').toLowerCase().includes(q) || (w.definition||'').toLowerCase().includes(q) ||
    w.id.toLowerCase() === q
  );
  if(!entries.length) return `<div class="empty"><i class="ti ti-mood-empty"></i><p>No words match "${esc(lexiconQuery)}".</p></div>`;
  return `<div class="result-count">${entries.length} match${entries.length===1?'':'es'}</div><div class="hds-lex-group-card">${entries.slice(0, SEARCH_LIMIT).map(renderLexiconRow).join('')}</div>`;
}
function renderLexiconGrouped(){
  // No query yet, or the full dictionary isn't loaded: just show the 39
  // curated highlights grouped by language, same as before item 150's
  // full-dictionary expansion — browsing all 14,200 entries ungrouped
  // isn't useful, search is how the full set gets found.
  const entries = Object.keys(lexicon).map(lexiconEntry).sort((a,b)=>a.translit.localeCompare(b.translit));
  const hebrew = entries.filter(w=>w.language==='Hebrew');
  const greek = entries.filter(w=>w.language==='Greek');
  return `
    <div class="hds-lex-highlights-title">Highlights</div>
    ${hebrew.length ? `
      <div class="hds-lex-group-eyebrow"><span>HEBREW</span><span class="hds-lex-count-pill">${hebrew.length}</span></div>
      <div class="hds-lex-group-card">${hebrew.map(renderLexiconRow).join('')}</div>
    ` : ''}
    ${greek.length ? `
      <div class="hds-lex-group-eyebrow"><span>GREEK</span><span class="hds-lex-count-pill">${greek.length}</span></div>
      <div class="hds-lex-group-card">${greek.map(renderLexiconRow).join('')}</div>
    ` : ''}
  `;
}
function renderLexiconRow(w){
  const letter = (w.lemma||w.translit||'?').trim().charAt(0) || '?';
  return `
    <div class="hds-lex-row tap" data-action="open-lexicon" data-id="${w.id}">
      <div class="hds-lex-tile">${esc(letter)}</div>
      <div class="hds-lex-row-body">
        <div class="hds-lex-row-head">
          <span class="hds-lex-row-name">${esc(w.translit)}</span>
          <span class="hds-lex-row-heb" dir="${w.language==='Hebrew'?'rtl':'ltr'}">${esc(w.lemma)}</span>
        </div>
        <div class="hds-lex-row-gloss">${esc(w.shortDef||'')}</div>
      </div>
      <div class="hds-lex-row-badge">${esc(w.id)}</div>
    </div>`;
}
/* "Detail page" pattern (item 176) — a fixed 260px .hds-sky + one
   cloud behind a plain back-btn+title header, then an orange hero card
   (tag pills, the Hebrew/Greek word itself, transliteration +
   pronunciation) and a definition card, per Study Pages Shepherd.dc.html's
   "Lexicon entry" frame. */
function renderLexiconDetail(id){
  const w = findLexiconEntry(id);
  if(!w) return renderLexicon();
  const ev = w.exampleVerseId ? findVerse(w.exampleVerseId) : null;
  // Full-dictionary-only entries (item 150's ~14,200-entry expansion)
  // lack the 39 curated highlights' richer fields — type/occurrences
  // don't exist in Strong's own raw dictionary, and Greek entries
  // carry no pronunciation at all in the source. Each is shown only
  // when actually present rather than rendering an empty/undefined gap.
  const tags = [w.language, w.id, w.type].filter(Boolean);
  const isDark = settings.homeTheme === 'dark';
  return `
    <div class="hds-theme" data-theme="${isDark ? 'dark' : 'light'}">
      <div class="hds-sky" style="height:260px;"></div>
      ${hdsCloud(110,90,52,18)}
      <div class="hds-content" style="padding-top:0;">
        <div class="screen-head">
          <button class="back-btn" data-action="lexicon-back"><i class="ti ti-arrow-left"></i></button>
          <h2>${t('title_lexicon')}</h2>
        </div>
        <div class="hds-lex-hero">
          <div class="hds-lex-hero-circle"></div>
          <div class="hds-lex-hero-tags">${tags.map(tg=>`<span>${esc(tg)}</span>`).join('')}</div>
          <div class="hds-lex-hero-word" dir="${w.language==='Hebrew'?'rtl':'ltr'}">${esc(w.lemma)}</div>
          <div class="hds-lex-hero-translit">
            <span>${esc(w.translit)}</span>
            ${w.pronunciation ? `<span class="hds-lex-hero-pron">(${esc(w.pronunciation)})</span>` : ''}
          </div>
        </div>
        <div class="hds-card hds-lex-def-card">
          ${w.shortDef ? `<div class="hds-lex-def-lead">${esc(w.shortDef)}</div>` : ''}
          ${w.occurrences ? `<div class="hds-lex-occ-row"><div class="hds-lex-occ-num">${w.occurrences}</div><div class="hds-lex-occ-label">occurrence${w.occurrences===1?'':'s'} in Scripture</div></div>` : ''}
          ${w.definition ? `<div class="hds-lex-def-full">${esc(w.definition)}</div>` : ''}
          ${w.origin ? `<div class="hds-lex-def-origin">${esc(w.origin)}</div>` : ''}
        </div>
        ${ev ? `
          <div class="hds-scenic-title" style="font-size:22px;padding:6px 2px 0;">Example</div>
          ${renderVerseCard(ev)}
        ` : ''}
      </div>
    </div>
  `;
}

/* ---------- TIMELINE (whole-Bible) ----------
   Distinct from characterTimeline()/the per-character "Their life"
   section on Character Detail (that one's a single person's own
   LifeEvents) — this is every Era in canonical order, each showing its
   Stories in canonicalOrder. Built entirely from lore.eras/lore.stories,
   already curated — no new data.
   Item 176 rebuilt this screen's own markup around Timeline
   Shepherd.dc.html's vertical-dotted-trail design (numbered nodes
   cycling teal/meadow/terracotta/plum, event cards, plants in the
   gaps between cards) — deliberately brand-new `.hds-tl-*` classes
   rather than reusing `.timeline`/`.tl-item`, so Character Detail's
   "Their life" section (which still uses those, themed generically by
   item 173) is completely unaffected by this page-specific rebuild. */
function renderTimeline(){
  const isDark = settings.homeTheme === 'dark';
  const header = hdsScenicHeader({
    title:'Timeline',
    intro:"Every era of the Bible's story, in order, from Creation to Revelation.",
    height:300, sunTop:70, sunRight:34, sunSize:56, hill1Bottom:-150, hill2Bottom:-175,
    clouds:[[58,110,46,8],[128,74,62,40]],
  });
  if(!lore.eras.length) return `<div class="hds-theme" data-theme="${isDark?'dark':'light'}">${header}<div class="hds-content" style="padding-top:4px;"><div class="empty"><i class="ti ti-timeline"></i><p>No timeline data loaded.</p></div></div></div>`;
  const eras = [...lore.eras].sort((a,b)=>(a.order||0)-(b.order||0));
  // Teal / meadow-green / terracotta / plum, cycling every 4th node,
  // matching NODES in Timeline Shepherd.dc.html exactly.
  const NODES = [['#2f9a82','#1f7563'],['#4f9a5a','#3a7a44'],['#d2603a','#a8441f'],['#7a5cc4','#5a3fa0']];
  const eraIcon = `<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="4" fill="currentColor"></circle><path d="M12 2.5v2.5M12 19v2.5M2.5 12H5M19 12h2.5M5.3 5.3l1.8 1.8M16.9 16.9l1.8 1.8M5.3 18.7l1.8-1.8M16.9 7.1l1.8-1.8"></path></svg>`;
  return `
    <div class="hds-theme" data-theme="${isDark ? 'dark' : 'light'}">
      ${header}
      <div class="hds-content" style="padding-top:4px;">
        ${eras.map(era=>{
          const stories = lore.stories.filter(s=>s.eraId===era.id).sort((a,b)=>(a.canonicalOrder||0)-(b.canonicalOrder||0));
          if(!stories.length) return '';
          return `
            <div class="hds-tl-era-card">
              <div class="hds-tl-era-icon">${eraIcon}</div>
              <div style="flex:1;min-width:0;">
                <div class="hds-tl-era-eyebrow">${esc((era.approxRange||era.name||'').toUpperCase())}</div>
                <div class="hds-tl-era-title">${esc(era.name)}</div>
              </div>
            </div>
            <div class="hds-tl-trail">
              ${stories.map((s,i)=>{
                const col = NODES[i % 4];
                // Plants sit in the gap ABOVE a row (between it and the
                // previous card), same box the mockup's own e.plant uses
                // (40px wide, centered, well above the node at top:12 so
                // it never overlaps it) — skipped on the era's first
                // event, which has no gap above it to sit in.
                const plant = i > 0 ? `<div style="position:absolute;left:-46px;top:-22px;width:40px;height:22px;display:flex;justify-content:center;pointer-events:none;">${hdsPlant('position:relative;', 20, i%2===1, i)}</div>` : '';
                return `
                  <div class="hds-tl-row">
                    ${plant}
                    <div class="hds-tl-node" style="background:${col[0]};box-shadow:0 4px 0 ${col[1]};">${i+1}</div>

                      <div class="hds-tl-event-ref"><i class="ti ti-bookmark"></i>${esc(s.primaryReference)}</div>
                      <div class="hds-tl-event-title">${esc(s.title)}</div>
                      <div class="hds-tl-event-desc">${esc(s.summary)}</div>
                    </div>
                  </div>`;
              }).join('')}
            </div>`;
        }).join('')}

  `;
}

/* ---------- FAMILY TREE ---------- */
/* Whether a character has any CORE family relationship curated at all
   (parent/child/spouse/sibling — see FAMILY_CORE_TYPES) — used to keep
   the picker to people whose family is actually worth opening, instead
   of listing all 267 characters and having most of them dead-end on
   the "no family curated yet" empty state. */
function hasFamilyTree(charId){
  return characterRelationships(charId).some(r => FAMILY_CORE_TYPES.hasOwnProperty(r.type));
}
/* Family lineages (2026-09-21) — connected components of the family
   graph, so the picker shows one card per real lineage instead of one
   card per person who happens to have family curated. Without this, a
   well-connected component like David's (16 people: David, Saul,
   Jonathan, Solomon, Absalom...) rendered as 16 separate, mostly-
   overlapping "X's Family" cards. Purely derived from the same
   Connection data `familyGraph()` already reads — no new curation.
   Each lineage's `anchor` is whichever member appears in the most
   curated Stories (an existing, objective signal of narrative
   centrality already in the data) rather than a hand-picked id, so new
   characters/stories keep this correct without upkeep. A handful of
   well-known lineages get an editorial display name; every other one
   falls back to a derived "{anchor}'s Family" ("The Family of {anchor}"
   when the name itself ends in "s", to dodge an awkward double-s
   possessive like "Jesus's Family"). */
const FAMILY_LINEAGE_LABELS = {
  char_adam: 'The First Family',
  char_noah: 'House of Noah',
  char_jacob: 'Patriarchs of Israel',
  char_moses: 'House of Levi',
  char_david: 'House of David',
};
function familyLineageLabel(anchor){
  if(FAMILY_LINEAGE_LABELS[anchor.id]) return FAMILY_LINEAGE_LABELS[anchor.id];
  return /s$/i.test(anchor.name) ? `The Family of ${anchor.name}` : `${anchor.name}'s Family`;
}
function familyLineages(){
  const byId = new Map(data.characters.map(c=>[c.id, c]));
  const seen = new Set();
  const lineages = [];
  for(const c of data.characters){
    if(seen.has(c.id) || !hasFamilyTree(c.id)) continue;
    const members = [];
    const queue = [c.id];
    seen.add(c.id);
    while(queue.length){
      const id = queue.shift();
      const person = byId.get(id);
      if(person) members.push(person);
      for(const rel of characterRelationships(id)){
        if(!FAMILY_CORE_TYPES.hasOwnProperty(rel.type)) continue;
        if(!seen.has(rel.who.id)){ seen.add(rel.who.id); queue.push(rel.who.id); }
      }
    }
    const anchor = [...members].sort((a,b)=>
      characterStories(b.id).length - characterStories(a.id).length || a.name.localeCompare(b.name)
    )[0];
    lineages.push({ anchor, members, label: familyLineageLabel(anchor) });
  }
  return lineages;
}
/* How `member` relates to their lineage's `anchor`, for the search-
   result badge ("Matches: Cain (Son of Adam)"). Prefers the exact
   curated relationship phrase when member and anchor are directly
   connected; falls back to a generation count (via the same ±1-per-
   parent/child-step delta `familyGraph()` uses) for anyone further out
   in a large lineage, e.g. a grandchild with no direct edge to the
   anchor. */
function relationshipToAnchor(member, anchor){
  if(member.id === anchor.id) return null;
  const direct = characterRelationships(member.id).find(r => r.who.id === anchor.id && FAMILY_CORE_TYPES.hasOwnProperty(r.type));
  if(direct) return direct.type.replace(/ of$/, '').replace(/^./, ch=>ch.toUpperCase()) + ` of ${anchor.name}`;
  const {nodes} = familyGraph(anchor.id, 99);
  const node = nodes.get(member.id);
  if(!node) return `Related to ${anchor.name}`;
  const gen = node.gen;
  // |gen|===1 without a direct edge means the connection runs through an
  // in-law link (e.g. a spouse's sibling's child) rather than real
  // parentage — "descendant"/"ancestor" would overclaim a blood relation
  // that isn't actually curated, so it gets the same generic phrasing as
  // gen===0 rather than a specific but misleading generation count.
  if(Math.abs(gen) <= 1) return `Part of ${anchor.name}'s extended family`;
  if(gen === 2) return `Grandchild of ${anchor.name}`;
  if(gen === -2) return `Grandparent of ${anchor.name}`;
  return gen > 0 ? `${gen}-generation descendant of ${anchor.name}` : `${-gen}-generation ancestor of ${anchor.name}`;
}
/* Scenic-header values (height 200, sun top66/right30/52, hills
   -170/-195, one cloud) are Study Pages Shepherd.dc.html's own "Family
   Tree" frame, item 176 — the title-only header (no intro line inside

function renderFamilyCard(anchor, opts){

  return `

    </div>`;
}
function renderFamilyTreePickerResults(){
  const lineages = familyLineages();

  if(q){
    // Search every person in every lineage, not just each lineage's own
    // anchor — typing "Cain" should surface The First Family even though

    const hitLineages = [];
    for(const lin of lineages){
      const hit = lin.members.find(m=>m.name.toLowerCase().includes(q));
      if(hit) hitLineages.push({lin, hit});

    if(!hitLineages.length) return `<div class="empty"><i class="ti ti-mood-empty"></i><p>No family matches "${esc(familyTreeQuery)}".</p></div>`;

        const rel = relationshipToAnchor(hit, lin.anchor);
        const badge = rel ? `${hit.name} (${rel})` : null;
        // Open centered on the actual matched person, not the lineage's
        // anchor — searching "Cain" should land the canvas on Cain,
        // auto-highlighted, not back on Adam.
        return renderFamilyCard(lin.anchor, {openId: hit.id, badge});
      }).join('')}

  return `

    ${lineages
      .sort((a,b)=> (findEra(a.anchor.eraId)?.order||0) - (findEra(b.anchor.eraId)?.order||0))
      .map(lin=>renderFamilyCard(lin.anchor))
      .join('')}
  `;
}
/* Node-link family tree, v2 rendering overhaul (2026-09-16) — a hybrid
   render: an absolutely-positioned SVG draws ONLY the curved connector
   paths (pointer-events:none, per spec, so it never blocks panning),
   and the nodes themselves are real HTML cards (avatar <img>, name,
   role) absolutely positioned in the same coordinate space, layered on
   top — real <img>/flexbox/transition is far more natural here than
   approximating them in raw SVG shapes, and it's what the exact CSS in
   the spec (object-fit, transition, box-shadow) actually describes.
   Both the svg and the cards live inside #family-tree-canvas, which is
   what wireFamilyTreePanZoom() transforms (translate+scale) — panning/
   zooming moves lines and cards together as one unit.

   "Selected" (spec's highlight state) is treated as "the current focal
   person" — the root card gets the active/glow treatment, and every
   edge touching it gets the highlighted stroke — rather than adding a
   separate hover-only preview state this app has no other precedent
   for; tapping any card still re-centers the tree on that person
   (family-tree-nav, chaining `from` so the back button walks back
   through however many people were visited, same pattern as Character
   Detail's own back button). The header's search icon jumps straight
   to the picker at any point. */
function renderFamilyTree(id){
  const c = id && findChar(id);
  if(!c) return renderFamilyTreePicker();
  const {nodes, edges} = familyGraph(id, 2);
  const {pos, width, height, NODE_W, NODE_H} = layoutFamilyGraph(nodes, edges);
  const edgeSvg = edges.map(e=>{
    const a = pos.get(e.from), b = pos.get(e.to);
    if(!a || !b) return '';
    const isHighlighted = e.from === id || e.to === id;
    const baseStroke = isHighlighted
      ? 'stroke:#F5F2ED;stroke-width:3;filter:drop-shadow(0 0 6px rgba(245,242,237,.4));'
      : 'stroke:rgba(245,242,237,.45);stroke-width:2.5;';
    const dash = e.kind === 'parent-child' ? '' : 'stroke-dasharray:5,5;';
    if(e.kind === 'parent-child'){
      const d = familyTreeBezier(a, b, NODE_W, NODE_H);
      return `<path d="${d}" fill="none" stroke-linecap="round" style="${baseStroke}${dash}"/>`;
    }
    // Same-row (spouse/sibling) edges connect facing card edges with a
    // plain line — a vertical bottom-to-top Bezier has no meaning
    // between two nodes at the same Y.
    const left = a.x <= b.x ? a : b, right = a.x <= b.x ? b : a;
    const x1 = left.x + NODE_W, y1 = left.y + NODE_H/2;
    const x2 = right.x, y2 = right.y + NODE_H/2;
    return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke-linecap="round" style="${baseStroke}${dash}"/>`;
  }).join('');
  const nodeCards = nodes.map(n=>{
    const p = pos.get(n.char.id);
    const isRoot = n.char.id === id;
    const sub = (n.char.roles && n.char.roles[0]) || '';
    return `
      <div class="tree-node-card${isRoot ? ' active' : ''}" data-action="family-tree-nav" data-id="${n.char.id}" style="left:${p.x}px;top:${p.y}px;width:${NODE_W}px;">
        <div class="tree-avatar">${charAvatarInner(n.char)}</div>
        <div class="tree-node-info">
          <div class="tree-node-name">${esc(n.char.name)}</div>
          ${sub ? `<div class="tree-node-sub">${esc(sub)}</div>` : ''}
        </div>
      </div>`;
  }).join('');
  // Only the page chrome (header, hint text, empty state) is wrapped in
  // `.hds-theme` here — per the owner's explicit confirmed decision,
  // `.tree-viewport`/`.tree-canvas`/`.tree-node-card`/`.tree-legend`
  // (the bronze node-graph itself, item 111) are rendered completely
  // untouched, not nested inside `.hds-theme` at all, so none of this
  // pass's CSS can reach them even by accident. The result is a
  // deliberate, visible contrast — a warm bronze tree sitting on a
  // Shepherd-themed page — not a bug.
  const isDark = settings.homeTheme === 'dark';
  return `
    <div class="hds-theme" data-theme="${isDark ? 'dark' : 'light'}">
      <div class="hds-content" style="padding-top:0;">
        <div class="screen-head">
          <button class="back-btn" data-action="family-tree-back"><i class="ti ti-arrow-left"></i></button>
          <h2>${esc(c.name)}'s Family</h2>
          <button class="back-btn" data-action="go-family-tree" style="margin-left:auto;" title="Search for someone else"><i class="ti ti-search"></i></button>
        </div>
        ${edges.length ? '' : `<div class="empty"><i class="ti ti-affiliate"></i><p>No family relationships curated for ${esc(c.name)} yet.</p></div>`}
      </div>
    </div>
    ${edges.length ? `
      <div class="tree-viewport" id="family-tree-viewport">
        <div class="tree-legend">
          <span><i class="tree-legend-line"></i> parent / child</span>
          <span><i class="tree-legend-line tree-legend-dash"></i> spouse</span>
          <span><i class="tree-legend-line tree-legend-dash" style="opacity:.4;"></i> sibling</span>
        </div>
        <div class="tree-canvas" id="family-tree-canvas" style="width:${width}px;height:${height}px;">
          <svg class="tree-edges-svg" width="${width}" height="${height}" viewBox="0 0 ${width} ${height}">${edgeSvg}</svg>
          ${nodeCards}
        </div>
      </div>
      <p class="field-hint" style="margin-top:10px;">Drag to pan, pinch or scroll to zoom, tap anyone to re-center on them.</p>
    ` : ''}
  `;
}
